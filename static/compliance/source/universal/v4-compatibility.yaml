# AdCP 4.0 compatibility checks
#
# Registry of the checks that tell a 3.x agent what AdCP 4.0 removes or
# tightens that the agent still depends on. This file is not a storyboard: it
# has no phases and the runner does not execute it. It names each check and
# says where the suite observes it, so a report can join run output against
# this list and show every check as passed, failing (with the fix), or not
# observable.
#
# Grading on 3.x
# --------------
# The checks are advisory throughout 3.x. A check added for 4.0 readiness
# MUST NOT fail a 3.x conformance run:
#
#   - A validation added only for 4.0 readiness declares `severity: advisory`
#     with `permanent_advisory`. It MUST NOT use `expires_after_version`,
#     which promotes on runner version, not on the spec version an agent is
#     graded against.
#   - A check MAY instead point at a validation that is already required on
#     3.x for its own reasons (for example, release-precision version
#     advertisement is a 3.2 certification requirement). Pointing at it adds
#     no new failure.
#   - A check observed through a runner notice inherits the notice contract:
#     notices never change pass/fail counters.
#
# Every canonical notice code with `effective_version: "4.0"` in
# runner-output-contract.yaml is a check here under the same id, whether the
# registry observes it through that notice or through a validation.
#
# Each check is graded in the storyboard step that already makes the call it
# needs. The suite does not add a separate 4.0 storyboard, because a task
# error in a new step would itself become a 3.x failure.
#
# Deriving the report
# -------------------
# For each check, against one compliance run of one agent:
#
#   observed_by.validation (a storyboard, the steps that may grade the
#   check, and a validation whose `id` equals the check id; when several
#   steps are listed, they are alternative branches and at most one runs)
#     passed          the validation_result with this `id` has passed: true
#                     and was graded (not not_applicable).
#     failing         the validation_result has passed: false. Show `fix`.
#     not observable  the storyboard did not run, the step was skipped, or
#                     the validation graded not_applicable (for example, a
#                     runner older than the check kind, or nothing to inspect).
#
#   observed_by.notice (a canonical notice code in runner-output-contract.yaml)
#     failing         the run emitted a notice with this code. Show `fix`.
#     passed          one of `storyboards` ran to completion and emitted no
#                     notice with this code, AND the runner is known to emit
#                     this code. Canonical notices are SHOULD-emit, so absence
#                     from a runner that never emits the code proves nothing.
#     not observable  none of `storyboards` ran, or the runner is not known
#                     to emit this code.
#
#   Prefer a validation. Use a notice only when no existing step can express
#   the detection rule as a validation.
#
#   observed_by.none
#     not observable  always. `reason` says why a 3.x agent cannot show it.
#
# Adding a check
# --------------
# Every 4.0 issue that removes or tightens something an agent relies on
# declares a stable check id and a one-line detection rule, then adds an entry
# here in the same PR as the validation or notice that observes it. Add a
# check only once the 4.0 change is decided; proposals still under working
# group review stay out until they are accepted.
#
#   id              stable snake_case id, `<subject>_removed_in_4_0` or
#                   `<subject>_required_in_4_0`. Never renamed: dashboards
#                   aggregate by id. Equals the validation `id` or notice
#                   `code` that observes it.
#   issue           tracking issue number on adcontextprotocol/adcp.
#   change          removal | new_requirement
#   applies_to      the agent roles the check speaks to.
#   detection       one line: what the check looks for.
#   fix             what the agent changes before 4.0.
#   observed_by     exactly one of validation, notice, or none (see above).
#   schema_sites    optional: the schema nodes marked `x-removed-in: "4.0.0"`
#                   whose removal this check covers, as
#                   `<path under static/schemas/source>#<JSON Pointer>`.
#
# Schema removals
# ---------------
# Every schema node marked `x-removed-in: "4.0.0"` appears exactly once: in a
# check's `schema_sites`, or in `schema_removals_not_checked` with its 4.0
# tracking issue and the reason no check covers it yet (most often a
# buyer-sent request field, which a seller run cannot observe). Marking a node
# for 4.0 removal therefore forces a decision here and a tracking issue. `tests/schema-deprecation-metadata.test.cjs` requires the
# marker on every deprecated node whose description says it is removed in 4.0.
#
# Each id has an anchor of the same name on the migration guide
# (`migration_guide` below). `scripts/lint-v4-compatibility-registry.cjs`
# checks the ids, the observing validations and notices, and the anchors.

id: v4_compatibility
version: "1.0.0"
title: "AdCP 4.0 compatibility checks"
target_version: "4.0"
migration_guide: "docs/reference/migration/v4-compatibility.mdx"

checks:
  - id: format_ids_removed_in_4_0
    issue: 7629
    change: removal
    applies_to: [sellers]
    detection: "A product returned by get_products declares format_ids without format_options."
    fix: >-
      Author canonical format_options[] on every product. format_ids may stay
      as a projection for older 3.x buyers until 4.0, but 4.0 buyers read
      format_options only.
    observed_by:
      validation:
        storyboard: media_buy_seller
        steps: [get_products_brief, get_products_brief_buyer_selected_timezone]
    schema_sites:
      - "core/product.json#/properties/format_ids"

  - id: major_versions_removed_in_4_0
    issue: 3572
    change: removal
    applies_to: [all_agents]
    detection: "get_adcp_capabilities declares adcp.major_versions without adcp.supported_versions."
    fix: >-
      Advertise every release you speak in adcp.supported_versions
      (release-precision strings such as "3.2"). Keep adcp.major_versions
      through 3.x; 4.0 removes it.
    observed_by:
      validation:
        storyboard: version_negotiation
        steps: [get_capabilities_with_version]
    schema_sites:
      - "protocol/get-adcp-capabilities-response.json#/properties/adcp/properties/major_versions"

  - id: adcp_version_echo_required_in_4_0
    issue: 3572
    change: new_requirement
    applies_to: [all_agents]
    detection: "The response envelope does not echo the served release in adcp_version."
    fix: >-
      Echo the release you served in adcp_version on every response envelope.
      4.0 makes the echo a MUST and removes the adcp_major_version fallback.
    observed_by:
      validation:
        storyboard: version_negotiation
        steps: [get_capabilities_with_version]

  - id: signed_requests_specialism_deprecated
    issue: 3078
    change: removal
    applies_to: [all_agents]
    detection: "get_adcp_capabilities lists the signed-requests specialism."
    fix: >-
      Drop signed-requests from specialisms and advertise
      request_signing.supported: true instead. 4.0 removes the enum value.
    observed_by:
      notice:
        storyboards: [signed_requests]

  - id: request_signing_required_in_4_0
    issue: 2307
    change: new_requirement
    applies_to: [sellers]
    detection: "get_adcp_capabilities does not advertise request_signing.supported: true."
    fix: >-
      Verify RFC 9421 request signatures and advertise
      request_signing.supported: true. 4.0 requires signing on
      spend-committing operations.
    observed_by:
      validation:
        storyboard: media_buy_seller
        steps: [get_capabilities]

  - id: legacy_hmac_fallback_removed_in_4_0
    issue: 4205
    change: removal
    applies_to: [all_agents]
    detection: "get_adcp_capabilities advertises webhook_signing.legacy_hmac_fallback: true."
    fix: >-
      Sign webhooks with RFC 9421 only and stop advertising
      legacy_hmac_fallback. 4.0 removes the HMAC fallback.
    observed_by:
      validation:
        storyboard: capability_discovery
        steps: [get_capabilities]
    schema_sites:
      - "protocol/get-adcp-capabilities-response.json#/properties/webhook_signing/properties/legacy_hmac_fallback"

  - id: purchase_target_audiences_required_in_4_0
    issue: 8125
    change: new_requirement
    applies_to: [sellers]
    detection: "A seller that lists media_buy.audience_evidence_targets in experimental_features does not accept target_audiences on buy_products purchases and list_products offer_filters."
    fix: >-
      Accept the experimental target_audiences sibling of
      audience_evidence_requirements on buy_products purchases and
      list_products offer_filters, and record it in the accepted purchase
      snapshot. 3.3 carries it only on get_products filters and
      create_media_buy packages, because the purchase and offer-filter
      schemas are closed and a minor release does not change a closed schema.
    observed_by:
      none:
        reason: >-
          Buyer-sent field on schemas that are closed in 3.x. A 3.x seller
          run cannot send or observe it.

# Schema nodes marked for 4.0 removal that no check covers yet. `change` names
# the removal, `issue` is its 4.0 tracking issue (required), and `reason` says
# why a 3.x agent is not graded on it.
schema_removals_not_checked:
  - change: "Exact plural format_ids in requests"
    issue: 7629
    reason: >-
      Buyer-sent fields. Sellers keep accepting them through 3.x, and a seller
      run cannot observe whether a buyer still sends them.
    sites:
      - "brand/acquire-rights-request.json#/properties/campaign/properties/format_ids"
      - "core/creative-filters.json#/properties/format_ids"
      - "core/product-filters.json#/properties/format_ids"
      - "creative/list-creative-formats-request.json#/properties/format_ids"
      - "media-buy/list-creative-formats-request.json#/properties/format_ids"
      - "media-buy/package-request.json#/properties/format_ids"
      - "media-buy/package-forecast-input.json#/properties/format_ids"

  - change: "Exact plural format_ids projections outside the product"
    issue: 7629
    reason: >-
      Seller-emitted projections of the product's canonical declaration.
      format_ids_removed_in_4_0 grades the authoring change on the product;
      these projections are not graded separately yet.
    sites:
      - "core/package.json#/properties/format_ids"
      - "core/placement.json#/properties/format_ids"
      - "core/registry-event.json#/$defs/agentProfilePayload/properties/format_ids"
      - "media-buy/acceptance-policy-requirement.json#/oneOf/13/properties/format_ids"
      - "media-buy/get-media-buys-response.json#/properties/media_buys/items/properties/packages/items/properties/format_ids"
      - "trusted-match/available-package.json#/properties/format_ids"

  - change: "Format-level build and pricing surface, replaced by list_transformers and v1_format_ref"
    issue: 8377
    reason: >-
      Creative-agent surface deprecated in 3.1. The response fields are
      observable on list_creative_formats but not graded yet; the request
      fields are buyer-sent.
    sites:
      - "core/format.json#/properties/input_format_ids"
      - "core/format.json#/properties/output_format_ids"
      - "core/format.json#/properties/pricing_options"
      - "core/format.json#/properties/canonical_parameters"
      - "creative/list-creative-formats-request.json#/properties/include_pricing"
      - "creative/list-creative-formats-request.json#/properties/account"
      - "media-buy/list-creative-formats-request.json#/properties/account"

  - change: "Legacy Bearer and HMAC webhook authentication"
    issue: 4205
    reason: >-
      Buyer-sent webhook registration. The seller-side dependency is graded by
      legacy_hmac_fallback_removed_in_4_0.
    sites:
      - "core/agent-notification-config.json#/properties/authentication"
      - "core/notification-config.json#/properties/authentication"
      - "core/push-notification-config.json#/properties/authentication"
      - "core/reporting-webhook.json#/properties/authentication"
      - "enums/auth-scheme.json#"
      - "media-buy/create-media-buy-request.json#/properties/artifact_webhook/properties/authentication"

  - change: "Major-precision version fields outside capabilities"
    issue: 3572
    reason: >-
      Request envelopes are buyer-sent. supported_majors appears only on a
      VERSION_UNSUPPORTED error, which the suite does not provoke yet.
      Trusted Match requests are outside seller runs.
    sites:
      - "core/version-envelope.json#/properties/adcp_major_version"
      - "error-details/version-unsupported.json#/properties/supported_majors"
      - "trusted-match/context-match-request.json#/properties/adcp_major_version"
      - "trusted-match/identity-match-request.json#/properties/adcp_major_version"

  - change: "Flat valid_actions vocabulary, replaced by available_actions"
    issue: 8378
    reason: >-
      Seller-emitted and observable on create, update, and get_media_buys
      responses, but not graded yet.
    sites:
      - "media-buy/create-media-buy-response.json#/oneOf/0/properties/valid_actions"
      - "media-buy/get-media-buys-response.json#/properties/media_buys/items/properties/valid_actions"
      - "media-buy/update-media-buy-response.json#/oneOf/0/properties/valid_actions"

  - change: "Response-wide delivery currency and aggregated_totals"
    issue: 8379
    reason: >-
      Seller-emitted legacy rollups that 4.0 buyers stop reading. Observable on
      get_media_buy_delivery but not graded yet.
    sites:
      - "media-buy/get-media-buy-delivery-response.json#/properties/currency"
      - "media-buy/get-media-buy-delivery-response.json#/properties/aggregated_totals"
      - "media-buy/media-buy-delivery-webhook-result.json#/properties/currency"

  - change: "Inline creatives in create_media_buy and update_media_buy"
    issue: 8380
    reason: >-
      Seller capability declaration (media_buy.features.inline_creative_management).
      Observable on get_adcp_capabilities but not graded yet.
    sites:
      - "core/media-buy-features.json#/properties/inline_creative_management"

  - change: "plan_id on create_media_buy"
    issue: 8381
    reason: "Buyer-sent field, replaced by governance_context on the envelope."
    sites:
      - "media-buy/create-media-buy-request.json#/properties/plan_id"

  - change: "get_signals top-level max_results"
    issue: 8382
    reason: "Buyer-sent field, replaced by pagination.max_results."
    sites:
      - "signals/get-signals-request.json#/properties/max_results"

  - change: "get_creative_delivery pagination.total"
    issue: 8383
    reason: >-
      3.x already requires total_count alongside it, so dropping the alias
      needs no agent change.
    sites:
      - "creative/get-creative-delivery-response.json#/properties/pagination/properties/total"

  - change: "property_list_changed signature marker"
    issue: 8384
    reason: >-
      3.x requires the literal rfc9421 marker and receivers already ignore it,
      so dropping the field needs no agent change.
    sites:
      - "property/property-list-changed-webhook.json#/properties/signature"

  - change: "Single-token tmpx on identity_match responses"
    issue: 8385
    reason: "Trusted Match router output, outside seller runs. Replaced by tmpx_providers."
    sites:
      - "trusted-match/identity-match-response.json#/properties/tmpx"

  - change: "3.1 compatibility projections for older buyers"
    issue: 8386
    reason: >-
      Projections a 3.2 seller emits only for 3.1 peers (a native 3.2 seller
      must not emit purchase_continuation). Not graded.
    sites:
      - "core/media-buy-legacy-terms-ref.json#"
      - "media-buy/request-proposals-response.json#/properties/purchase_continuation"
