# Grading notes (informational — not read by the runner):
#
# Phase `matrix_positive_pairings` is manifest-driven in the ordinary sense:
# each step submits a manifest satisfying a validly-declared CTV product's
# required slots and expects `validated_pass`.
#
# Phase `matrix_defense_in_depth` seeds products whose format_option
# declarations are THEMSELVES invalid against the canonical schema's
# `x-adcp-validation.verifier_constraints` (menu on video_vast, pause on
# native_in_feed, creative_type:linear on an overlay option, a 5-second
# duration on an overlay option, simid_supported on a nonlinear CTV option,
# full_motion on a pause image). A conformant seller never actually
# authors these — the canonical JSON Schema's `allOf` conditionals already
# reject the schema-expressible ones at product-authoring time (see
# static/schemas/source/formats/canonical/*.json and
# tests/canonical-negative-fixtures.test.cjs, owned separately from this
# storyboard). Every check in this phase is evaluated against the SEEDED
# PRODUCT'S OWN declared params, not against anything the buyer's manifest
# contributes — validate_input's `manifest` object has no `ctv_ad_experience`,
# `creative_type`, `duration_ms_range`, `simid_supported`, or `motion_level`
# field of its own (see /docs/creative/ctv-experiences#validating-ctv-
# manifests). These steps test whether the agent's validate_input runtime
# independently re-derives each constraint at request time — defense in
# depth against a malformed product declaration reaching a buyer — rather
# than pure manifest structural validation. Grading them requires the
# semantic validate_input implementation this storyboard was written
# against (a fixed CTV_EXPERIENCE_MATRIX plus per-canonical constraint
# checks against `params`), not a generic JSON Schema compiled at request
# time.
#
# Two steps have NO JSON Schema enforcement at all — they are graded purely on
# the runtime's semantic interpretation of the `x-adcp-validation.verifier_constraints`
# prose rules:
#
# `reject_focus_autoplay_without_video_slot` — native_in_feed.json documents
# `focus_video_pairing` in verifier_constraints prose but has no `allOf`
# conditional checking that `focus_behavior: autoplay_*` requires a `video`
# entry in the format option's effective `slots[]`.
#
# `reject_pause_on_html5` — html5.json carries no CTV `allOf` conditional at
# all; the semantic validator's `ctv_experience_matrix` check is the only layer
# that rejects a `ctv_ad_experience` value on a canonical not listed in the
# matrix (such as `html5`).
#
# Duration floors (`reject_overlay_short_duration`) are also semantic-only:
# the numeric thresholds live in `VIDEO_VAST_DURATION_FLOOR_MS` in the
# reference validator, not in a JSON Schema `allOf` conditional, so a schema-
# only validator would not catch a 5-second overlay product declaration.

id: ctv_experience_validate_input
version: "1.0.0"
title: "CTV experience profile validate_input"
category: schema_validation
summary: "Validates AdCP 3.2 ctv_ad_experience matrix pairings, duration/interactivity constraint profiles, and the menu focus/video pairing via validate_input against seeded CTV products."
track: creative
introduced_in: "3.2"
required_tools:
  - validate_input
  - comply_test_controller

requires:
  - controller

narrative: |
  AdCP 3.2 expresses the IAB CTV Ad Portfolio's six on-glass experiences
  (`menu`, `pause`, `screensaver`, `overlay`, `squeezeback`, `in_scene`) as a
  shared `ctv_ad_experience` value on existing canonical formats rather than
  as new canonical kinds. Each canonical's schema restricts which experience
  values it accepts, and — where applicable — the duration floor, the
  interactivity rule, and the motion-level narrowing.

  This storyboard seeds one product per matrix row via `comply_test_controller`
  and calls `validate_input` with `targets: [{ kind: "product", id: ... }]`
  so the agent under test evaluates the buyer's manifest against that
  product's declared CTV parameters. Six pairings validate; eight seeded
  products carry an experience/canonical or constraint pairing that never
  should have been authored, testing whether the runtime still catches it.
  Two of those eight are purely semantic — no JSON Schema enforcement backs
  them: the focus/video pairing (`reject_focus_autoplay_without_video_slot`)
  and the unlisted-canonical matrix row (`reject_pause_on_html5`, where
  `html5` has no CTV allOf conditional at all).

agent:
  interaction_model: creative
  capabilities:
    - validates_canonical_formats
  examples:
    - "CTV sales agents that accept canonical v2 manifests for menu, pause, screensaver, overlay, squeezeback, and in_scene inventory"
    - "Sales agents that pre-flight product-local CTV format_options"

caller:
  role: buyer_agent
  example: "Compliance test harness"

prerequisites:
  description: |
    The runner seeds fourteen fictional CTV products for the StreamHaus
    publisher via `comply_test_controller`: six with valid experience/canonical
    pairings (one per matrix row) and eight with intentionally invalid
    pairings or constraint values used only for the defense-in-depth phase
    (see the grading notes above).
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

