            description: "html5 is absent from the experience-to-canonical matrix entirely; the semantic validator's ctv_experience_matrix check is the only layer that rejects this pairing — html5.json has no CTV allOf conditional"
          - check: field_value
            path: "results[0].violations[0].rule"
            value: "ctv_experience_matrix"
            description: "Violation cites the semantic ctv_experience_matrix rule (no allOf conditional on html5 — semantic layer only)"
          - check: field_value
            path: "results[0].violations[0].field"
            value: "params.ctv_ad_experience"
            description: "Violation points at the seeded product's own ctv_ad_experience declaration, not the manifest"
