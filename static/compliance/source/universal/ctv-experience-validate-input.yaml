  - id: matrix_defense_in_depth
    title: "Matrix and constraint-profile defense in depth"
    narrative: |
      Every product seeded here declares an experience/canonical or
      constraint pairing that should never have been authored (see the
      top-of-file grading notes). A conformant seller never actually
      publishes these; the steps below test whether the agent's
      validate_input runtime independently re-derives the same rule when
      asked to validate a manifest against such a product, rather than
      trusting that a seeded product target is well-formed. Every check
      here evaluates the seeded product's own declared params — none
      depends on anything the manifest itself contributes.

    steps:
      - id: reject_menu_on_video_vast
        title: "Reject menu declared on a video_vast product"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/docs/creative/ctv-experiences#experience-to-canonical-matrix"
        comply_scenario: ctv_experience_validation
        stateful: true
        sample_request:
          adcp_version: "3.2"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "video_vast"
            format_option_ref:
              scope: "product"
              format_option_id: "ctv_invalid_menu_video_vast_option"
            assets:
              vast_tag:
                asset_type: "vast"
                delivery_type: "url"
                url: "https://vast.acmeoutdoor.example/menu-invalid.xml"
          targets:
            - kind: "product"
              id: "ctv_invalid_menu_video_vast"
        validations:
          - check: field_value
            path: "results[0].result_kind"
            value: "validated_fail"
            description: "video_vast never permits ctv_ad_experience: menu"
          - check: field_value
            path: "results[0].violations[0].rule"
            value: "ctv_experience_matrix"
            description: "Violation cites the video_vast verifier_constraints matrix rule"
          - check: field_value
            path: "results[0].violations[0].field"
            value: "params.ctv_ad_experience"
            description: "Violation points at the seeded product's own ctv_ad_experience declaration, not the manifest"

      - id: reject_pause_on_native_in_feed
        title: "Reject pause declared on a native_in_feed product"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/docs/creative/ctv-experiences#experience-to-canonical-matrix"
        comply_scenario: ctv_experience_validation
        stateful: true
        sample_request:
          adcp_version: "3.2"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "native_in_feed"
            format_option_ref:
              scope: "product"
              format_option_id: "ctv_invalid_pause_native_option"
            assets:
              title:
                asset_type: "text"
                content: "Invalid pause native"
              advertiser_name:
                asset_type: "text"
                content: "Acme Outdoor"
              landing_page_url:
                asset_type: "url"
                url: "https://acmeoutdoor.example/invalid"
          targets:
            - kind: "product"
              id: "ctv_invalid_pause_native"
        validations:
          - check: field_value
            path: "results[0].result_kind"
            value: "validated_fail"
            description: "native_in_feed only permits ctv_ad_experience: menu"
          - check: field_value
            path: "results[0].violations[0].rule"
            value: "ctv_experience_matrix"
            description: "Violation cites the native_in_feed verifier_constraints matrix rule"
          - check: field_value
            path: "results[0].violations[0].field"
            value: "params.ctv_ad_experience"
            description: "Violation points at the seeded product's own ctv_ad_experience declaration, not the manifest"

      - id: reject_overlay_creative_type_linear
        title: "Reject overlay declared with creative_type linear"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/docs/creative/ctv-experiences#constraint-profiles"
        comply_scenario: ctv_experience_validation
        stateful: true
        sample_request:
          adcp_version: "3.2"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "video_vast"
            format_option_ref:
              scope: "product"
              format_option_id: "ctv_invalid_overlay_linear_option"
            assets:
              vast_tag:
                asset_type: "vast"
                delivery_type: "url"
                url: "https://vast.acmeoutdoor.example/overlay-linear-invalid.xml"
                duration_ms: 20000
          targets:
            - kind: "product"
              id: "ctv_invalid_overlay_linear"
        validations:
          - check: field_value
            path: "results[0].result_kind"
            value: "validated_fail"
            description: "Every non-menu CTV experience on video_vast requires creative_type: nonlinear"
          - check: field_value
            path: "results[0].violations[0].rule"
            value: "ctv_experience_matrix"
            description: "Violation cites the video_vast verifier_constraints matrix rule (the nonlinear requirement is bundled with the experience pairing, not a separate rule name)"
          - check: field_value
            path: "results[0].violations[0].field"
            value: "params.creative_type"
            description: "Violation points at the seeded product's own creative_type declaration, not the manifest"

      - id: reject_overlay_short_duration
        title: "Reject overlay declared below the 10-second duration floor"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/docs/creative/ctv-experiences#constraint-profiles"
        comply_scenario: ctv_experience_validation
        stateful: true
        sample_request:
          adcp_version: "3.2"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "video_vast"
            format_option_ref:
              scope: "product"
              format_option_id: "ctv_invalid_overlay_short_duration_option"
            assets:
              vast_tag:
                asset_type: "vast"
                delivery_type: "url"
                url: "https://vast.acmeoutdoor.example/overlay-short-invalid.xml"
          targets:
            - kind: "product"
              id: "ctv_invalid_overlay_short_duration"
        validations:
          - check: field_value
            path: "results[0].result_kind"
            value: "validated_fail"
            description: "overlay requires a 10-second minimum duration; this product declares duration_ms_exact: 5000"
          - check: field_value
            path: "results[0].violations[0].rule"
            value: "ctv_duration_floors"
            description: "Violation cites the video_vast verifier_constraints duration-floor rule"
          - check: field_value
            path: "results[0].violations[0].field"
            value: "params.duration_ms_exact"
            description: "Violation points at the seeded product's own duration_ms_exact declaration, not the manifest"

      - id: reject_in_scene_simid_supported
        title: "Reject SIMID on a nonlinear CTV experience"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/docs/creative/ctv-experiences#constraint-profiles"
        comply_scenario: ctv_experience_validation
        stateful: true
        sample_request:
          adcp_version: "3.2"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "video_vast"
            format_option_ref:
              scope: "product"
              format_option_id: "ctv_invalid_in_scene_simid_option"
            assets:
              vast_tag:
                asset_type: "vast"
                delivery_type: "url"
                url: "https://vast.acmeoutdoor.example/in-scene-invalid.xml"
                duration_ms: 5000
          targets:
            - kind: "product"
              id: "ctv_invalid_in_scene_simid"
        validations:
          - check: field_value
            path: "results[0].result_kind"
            value: "validated_fail"
            description: "Every video_vast CTV experience is nonlinear, where VAST cannot serialize SIMID"
          - check: field_value
            path: "results[0].violations[0].rule"
            value: "ctv_nonlinear_no_simid"
            description: "Violation cites the video_vast verifier constraint that keeps SIMID on Linear creatives"
          - check: field_value
            path: "results[0].violations[0].field"
            value: "params.simid_supported"
            description: "Violation points at the seeded product's own simid_supported declaration, not the manifest"

      - id: reject_pause_full_motion_image
        title: "Reject pause image declared with motion_level full_motion"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/docs/creative/ctv-experiences#motion-level-and-activation-vocabularies"
        comply_scenario: ctv_experience_validation
        stateful: true
        sample_request:
          adcp_version: "3.2"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "image"
            format_option_ref:
              scope: "product"
              format_option_id: "ctv_invalid_pause_full_motion_option"
            assets:
              image_main:
                asset_type: "image"
                url: "https://cdn.acmeoutdoor.example/ctv/pause-invalid.png"
                width: 1920
                height: 1080
          targets:
            - kind: "product"
              id: "ctv_invalid_pause_full_motion"
        validations:
          - check: field_value
            path: "results[0].result_kind"
            value: "validated_fail"
            description: "image narrows motion_level to static or limited_motion unconditionally — the image canonical never accepts full_motion regardless of whether ctv_ad_experience is declared"
          - check: field_value
            path: "results[0].violations[0].rule"
            value: "motion_level_static_canonical"
            description: "Violation cites the image verifier_constraints motion-level rule"
          - check: field_value
            path: "results[0].violations[0].field"
            value: "params.motion_level"
            description: "Violation points at the seeded product's own motion_level declaration, not the manifest"

      - id: reject_focus_autoplay_without_video_slot
        title: "Reject autoplay_muted focus_behavior on a product with no video slot"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/docs/creative/ctv-experiences#menu-profile-on-native_in_feed"
        comply_scenario: ctv_experience_validation
        stateful: true
        sample_request:
          adcp_version: "3.2"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "native_in_feed"
            format_option_ref:
              scope: "product"
              format_option_id: "ctv_invalid_menu_no_video_slot_option"
            assets:
              title:
                asset_type: "text"
                content: "Invalid autoplay tile"
              main_image:
                asset_type: "image"
                url: "https://cdn.acmeoutdoor.example/ctv/menu-invalid.png"
                width: 1920
                height: 1080
              advertiser_name:
                asset_type: "text"
                content: "Acme Outdoor"
              landing_page_url:
                asset_type: "url"
                url: "https://acmeoutdoor.example/invalid"
          targets:
            - kind: "product"
              id: "ctv_invalid_menu_no_video_slot"
        validations:
          - check: field_value
            path: "results[0].result_kind"
            value: "validated_fail"
            description: "focus_behavior: autoplay_muted requires a video asset group in the product's effective slots — not enforced by JSON Schema, semantic-only (see grading notes)"
          - check: field_value
            path: "results[0].violations[0].rule"
            value: "focus_video_pairing"
            description: "Violation cites the native_in_feed verifier_constraints focus/video pairing rule"
          - check: field_value
            path: "results[0].violations[0].field"
            value: "params.focus_behavior"
            description: "Violation points at the seeded product's own focus_behavior declaration, not the manifest"

      - id: reject_pause_on_html5
        title: "Reject pause declared on an html5 product (unlisted canonical)"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/docs/creative/ctv-experiences#experience-to-canonical-matrix"
        comply_scenario: ctv_experience_validation
        stateful: true
        sample_request:
          adcp_version: "3.2"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "html5"
            format_option_ref:
              scope: "product"
              format_option_id: "ctv_invalid_pause_html5_option"
            assets:
              html5_bundle:
                asset_type: "zip"
                url: "https://cdn.acmeoutdoor.example/ctv/pause-invalid.zip"
          targets:
            - kind: "product"
              id: "ctv_invalid_pause_html5"
        validations:
          - check: field_value
            path: "results[0].result_kind"
