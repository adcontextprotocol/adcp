phases:
  - id: matrix_positive_pairings
    title: "Experience-to-canonical matrix — positive pairings"
    narrative: |
      Each step submits a manifest satisfying a validly-declared CTV
      product's required slots. Every pairing here is one row of the
      experience-to-canonical matrix in
      /docs/creative/ctv-experiences#experience-to-canonical-matrix.

    steps:
      - id: validate_menu_tile
        title: "menu + native_in_feed (tile, video-capable)"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/docs/creative/ctv-experiences#experience-to-canonical-matrix"
        comply_scenario: ctv_experience_validation
        stateful: true
        sample_request:
          adcp_version: "3.2"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "native_in_feed"
            format_option_ref:
              scope: "product"
              format_option_id: "ctv_validate_menu_tile_option"
            assets:
              title:
                asset_type: "text"
                content: "Gear for every trail"
              main_image:
                asset_type: "image"
                url: "https://cdn.acmeoutdoor.example/ctv/menu-tile-bg.png"
                width: 1920
                height: 1080
              advertiser_name:
                asset_type: "text"
                content: "Acme Outdoor"
              landing_page_url:
                asset_type: "url"
                url: "https://acmeoutdoor.example/trails"
              video:
                asset_type: "vast"
                delivery_type: "url"
                url: "https://vast.acmeoutdoor.example/menu-hero.xml"
          targets:
            - kind: "product"
              id: "ctv_validate_menu_tile"
        validations:
          - check: response_schema
            description: "Response matches validate-input-response.json schema"
          - check: field_value
            path: "results[0].result_kind"
            value: "validated_pass"
            description: "Video-capable menu tile manifest satisfies the menu/native_in_feed pairing"

      - id: validate_menu_banner
        title: "menu + native_in_feed (headline banner, no video)"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
