  - id: single_state_and_policy_floors
    title: "Single-state reveal shape and hard policy floors"
    narrative: |
      Reveal-class units declare exactly one state with no transitions
      (`single_state_shape`). Dismissibility and anti-strobe are hard
      failures (`dismissibility_floor`, `timer_cycle_floor`) — every other
      LEAN-prohibited combination validates with a non-blocking warning
      instead (`lean_policy_warnings`).
    steps:
      - id: validate_single_state_reveal
        title: "Accept a single-state reveal unit with no transitions"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/creative/canonical-formats#premium-display-in-32"
        comply_scenario: canonical_format_validation
        stateful: true
        sample_request:
          adcp_version: "3.2-beta.0"
          account:
            brand: { domain: "acmeoutdoor.example" }
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "seller_rendered_stateful_display"
            assets:
              video_main: { asset_type: "video", url: "https://cdn.acme.example/topscroll.mp4", width: 1080, height: 1920, duration_ms: 6000 }
              landing_page_url: { asset_type: "url", url: "https://acmeoutdoor.example/launch" }
          targets:
            - { kind: "product", id: "premium_single_state_reveal" }
        validations:
          - check: response_schema
          - { check: field_value, path: "results[0].result_kind", value: "validated_pass" }
            # single_state_shape: a single declared state with no transitions and matching initial_state_id is a valid reveal unit.

      - id: reject_single_state_with_transitions
        title: "Reject a single-state declaration carrying a transitions array"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/creative/canonical-formats#premium-display-in-32"
        comply_scenario: canonical_format_validation
        stateful: true
        sample_request:
          adcp_version: "3.2-beta.0"
          account:
            brand: { domain: "acmeoutdoor.example" }
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "seller_rendered_stateful_display"
            assets:
              imagery: { asset_type: "image", url: "https://cdn.acme.example/only-state.png", width: 640, height: 210 }
              landing_page_url: { asset_type: "url", url: "https://acmeoutdoor.example/launch" }
          targets:
            - { kind: "product", id: "premium_bad_single_state_with_transitions" }
        validations:
          - { check: field_value, path: "results[0].result_kind", value: "validated_fail" }
          - { check: field_value, path: "results[0].violations[0].rule", value: "single_state_shape" }
            # single_state_shape: "when states has one entry, transitions must be absent or empty" — MUST reject.

      - id: reject_timer_strobe_cycle
        title: "Reject a 0ms timer strobe cycle between two states"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/creative/canonical-formats#premium-display-in-32"
        comply_scenario: canonical_format_validation
        stateful: true
        sample_request:
          adcp_version: "3.2-beta.0"
          account:
            brand: { domain: "acmeoutdoor.example" }
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "seller_rendered_stateful_display"
            assets:
              imagery: { asset_type: "image", url: "https://cdn.acme.example/expanded.png", width: 640, height: 210 }
              logo: { asset_type: "image", url: "https://cdn.acme.example/logo.png", width: 200, height: 200 }
              landing_page_url: { asset_type: "url", url: "https://acmeoutdoor.example/launch" }
          targets:
            - { kind: "product", id: "premium_bad_timer_cycle" }
        validations:
          - { check: field_value, path: "results[0].result_kind", value: "validated_fail" }
          - { check: field_value, path: "results[0].violations[0].rule", value: "timer_cycle_floor" }
            # timer_cycle_floor: "timer and in_view_timer transitions participating in a state cycle must declare delay_ms >= 1000" — MUST reject a 0ms cycle.

      - id: reject_undismissable_fullscreen_overlay
        title: "Reject an undismissable fullscreen overlay with no close affordance"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/creative/canonical-formats#premium-display-in-32"
        comply_scenario: canonical_format_validation
        stateful: true
        sample_request:
          adcp_version: "3.2-beta.0"
          account:
            brand: { domain: "acmeoutdoor.example" }
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "seller_rendered_stateful_display"
            assets:
              imagery: { asset_type: "image", url: "https://cdn.acme.example/overlay.png", width: 640, height: 480 }
              landing_page_url: { asset_type: "url", url: "https://acmeoutdoor.example/launch" }
          targets:
            - { kind: "product", id: "premium_bad_undismissable_overlay" }
        validations:
          - { check: field_value, path: "results[0].result_kind", value: "validated_fail" }
          - { check: field_value, path: "results[0].violations[0].rule", value: "dismissibility_floor" }
            # dismissibility_floor: overlay/fullscreen_overlay anchoring requires dismissible:true OR close_affordance:true — MUST reject when both are false.

      - id: warn_non_user_action_overlay_entry
        title: "Pass with a non-blocking warning for non-user-action entry into overlay anchoring"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/creative/canonical-formats#premium-display-in-32"
        comply_scenario: canonical_format_validation
        stateful: true
        sample_request:
          adcp_version: "3.2-beta.0"
          account:
            brand: { domain: "acmeoutdoor.example" }
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "seller_rendered_stateful_display"
            assets:
              imagery: { asset_type: "image", url: "https://cdn.acme.example/base.png", width: 300, height: 250 }
              landing_page_url: { asset_type: "url", url: "https://acmeoutdoor.example/launch" }
          targets:
            - { kind: "product", id: "premium_lean_policy_warning" }
        validations:
          - check: response_schema
          - { check: field_value, path: "results[0].result_kind", value: "validated_pass" }
            # lean_policy_warnings is non-blocking: a timer-triggered (non-user-action) entry into overlay anchoring still validates.
          - { check: field_value, path: "results[0].warnings[0].rule", value: "lean_policy_warnings" }
            # lean_policy_warnings: "non-user-action transitions into overlay/fullscreen_overlay anchoring ... emit policy warnings (non-blocking)" — schema is descriptive, policy stays visible via warnings[].

