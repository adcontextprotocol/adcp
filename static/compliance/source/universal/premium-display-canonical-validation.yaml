          - { check: field_value, path: "results[0].result_kind", value: "validated_pass" }
            # supply_mode_manifest: layered_source mode requires a layered_source asset and forbids state_canvases.

      - id: reject_fluid_breakpoint_targeted_by_rendered_canvases
        title: "Reject a fluid breakpoint targeted by rendered_canvases supply"
