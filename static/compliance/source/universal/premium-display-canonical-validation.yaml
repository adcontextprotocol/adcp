id: premium_display_canonical_validation
version: "2.0.0"
title: "Premium display canonical validation"
category: schema_validation
summary: "Validates AdCP 3.2 seller_rendered_stateful_display supply-mode contracts (components, rendered_canvases, layered_source), single-state reveal shape, policy floors, and coordinated_placements sequence/serving_policy, alongside transition/canvas coverage and shared-slot resolution."
track: creative
introduced_in: "3.2"
required_tools:
  - validate_input
  - comply_test_controller

requires:
  - controller

narrative: |
  AdCP 3.2 reshapes `seller_rendered_stateful_display` around a template-contract
  model: the seller's format declaration (slots, breakpoints, state/transition
  graph) is the shared truth, and `supply_mode` declares which end of the
  contract the buyer feeds. Sellers validate that a manifest matches its
  product's declared supply mode, that single-state reveal units carry no
  transitions, that dismissibility and anti-strobe floors hold, that a
  declaration's slots never widen into executable asset types, that fluid
  breakpoints are never paired with buyer-rendered canvases, and that
  `clickthrough` policy and `coordinated_placements` `sequence` values are
  internally consistent. Every check below cites the `x-adcp-validation.
  verifier_constraints` key it exercises in the corresponding canonical
  schema.

agent:
  interaction_model: creative
  capabilities:
    - validates_canonical_formats

caller:
  role: buyer_agent
  example: "Compliance test harness"

prerequisites:
  description: "The runner seeds premium-display products before exercising product-target validation."
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "premium_seller_rendered_stateful_display"
      name: "Premium seller-rendered stateful display"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "expandable_leaderboard"
          canonical_formats_only: true
          params:
            supply_mode: "rendered_canvases"
            initial_state_id: "expanded"
            states:
              - state_id: "expanded"
                anchoring: "inline"
                close_affordance: true
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 640
                    height: 210
                  - breakpoint_id: "mobile"
                    width: 320
                    height: 210
              - state_id: "collapsed"
                anchoring: "sticky_top"
                close_affordance: true
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 640
                    height: 70
                  - breakpoint_id: "mobile"
                    width: 320
                    height: 70
            transitions:
              - transition_id: "auto_collapse"
                from_state_id: "expanded"
                to_state_id: "collapsed"
                trigger: "timer"
                transition_mode: "animated"
                delay_ms: 5000
                duration_ms: 300
              - transition_id: "user_expand"
                from_state_id: "collapsed"
                to_state_id: "expanded"
                trigger: "user_action"
                input: "expand_control"
                transition_mode: "animated"
                duration_ms: 300
            user_controls:
              dismissible: true
              user_collapsible: true

    - product_id: "premium_components_mode_display"
      name: "Premium components-mode display"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "components_mode_leaderboard"
          canonical_formats_only: true
          params:
            supply_mode: "components"
            initial_state_id: "expanded"
            states:
              - state_id: "expanded"
                anchoring: "inline"
                close_affordance: true
                slot_bindings: ["logo", "headline", "cta", "imagery", "landing_page_url"]
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 640
                    height: 210
              - state_id: "collapsed"
                anchoring: "sticky_top"
                close_affordance: true
                slot_bindings: ["logo", "cta", "landing_page_url"]
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 640
                    height: 70
            transitions:
              - transition_id: "auto_collapse"
                from_state_id: "expanded"
                to_state_id: "collapsed"
                trigger: "in_view_timer"
                transition_mode: "animated"
                delay_ms: 15000
                duration_ms: 300
              - transition_id: "user_expand"
                from_state_id: "collapsed"
                to_state_id: "expanded"
                trigger: "user_action"
                input: "expand_control"
                transition_mode: "animated"
                duration_ms: 300
            user_controls:
              dismissible: true
              user_collapsible: true

    - product_id: "premium_layered_source_display"
      name: "Premium layered-source display"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "layered_source_leaderboard"
          canonical_formats_only: true
          params:
            supply_mode: "layered_source"
            production_window_business_days: 10
            initial_state_id: "expanded"
            states:
              - state_id: "expanded"
                anchoring: "inline"
                close_affordance: true
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 640
                    height: 210
            user_controls:
              dismissible: true
              user_collapsible: false

    - product_id: "premium_single_state_reveal"
      name: "Premium single-state reveal (topscroll)"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "topscroll_reveal"
          canonical_formats_only: true
          params:
            supply_mode: "components"
            reveal: "clip_window"
            initial_state_id: "reveal"
            states:
              - state_id: "reveal"
                anchoring: "underlay"
                close_affordance: false
                slot_bindings: ["video_main", "landing_page_url"]
                breakpoints:
                  - breakpoint_id: "mobile"
                    width_mode: "full_bleed"
                    viewport_height_percent: 80
            user_controls:
              dismissible: true
              user_collapsible: false

    - product_id: "premium_bad_single_state_with_transitions"
      name: "Premium single state carrying a transitions array"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "bad_single_state_transitions"
          canonical_formats_only: true
          params:
            supply_mode: "components"
            initial_state_id: "only_state"
            states:
              - state_id: "only_state"
                anchoring: "inline"
                close_affordance: true
                slot_bindings: ["imagery", "landing_page_url"]
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 640
                    height: 210
            transitions:
              - transition_id: "phantom_transition"
                from_state_id: "only_state"
                to_state_id: "only_state"
                trigger: "user_action"
                input: "tap"
                transition_mode: "instant"
            user_controls:
              dismissible: true
              user_collapsible: false

    - product_id: "premium_bad_timer_cycle"
      name: "Premium timer cycle below the anti-strobe floor"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "bad_timer_cycle"
          canonical_formats_only: true
          params:
            supply_mode: "components"
            initial_state_id: "expanded"
            states:
              - state_id: "expanded"
                anchoring: "inline"
                close_affordance: true
                slot_bindings: ["imagery", "landing_page_url"]
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 640
                    height: 210
              - state_id: "collapsed"
                anchoring: "sticky_top"
                close_affordance: true
                slot_bindings: ["logo", "landing_page_url"]
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 640
                    height: 70
            transitions:
              - transition_id: "strobe_collapse"
                from_state_id: "expanded"
                to_state_id: "collapsed"
                trigger: "timer"
                transition_mode: "instant"
                delay_ms: 0
              - transition_id: "strobe_reopen"
                from_state_id: "collapsed"
                to_state_id: "expanded"
                trigger: "timer"
                transition_mode: "instant"
                delay_ms: 0
            user_controls:
              dismissible: true
              user_collapsible: true

    - product_id: "premium_bad_undismissable_overlay"
      name: "Premium undismissable fullscreen overlay"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "bad_undismissable_overlay"
          canonical_formats_only: true
          params:
            supply_mode: "components"
            initial_state_id: "overlay_state"
            states:
              - state_id: "overlay_state"
                anchoring: "fullscreen_overlay"
                close_affordance: false
                slot_bindings: ["imagery", "landing_page_url"]
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 640
                    height: 480
            user_controls:
              dismissible: false
              user_collapsible: false

    - product_id: "premium_lean_policy_warning"
      name: "Premium non-user-action entry into overlay anchoring"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "lean_policy_warning_unit"
          canonical_formats_only: true
          params:
            supply_mode: "components"
            initial_state_id: "base"
            states:
              - state_id: "base"
                anchoring: "inline"
                close_affordance: true
                slot_bindings: ["imagery", "landing_page_url"]
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 300
                    height: 250
              - state_id: "promo"
                anchoring: "overlay"
                close_affordance: true
                slot_bindings: ["imagery", "landing_page_url"]
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 300
                    height: 250
            transitions:
              - transition_id: "auto_promo"
                from_state_id: "base"
                to_state_id: "promo"
                trigger: "timer"
                transition_mode: "animated"
                delay_ms: 3000
                duration_ms: 300
            user_controls:
              dismissible: true
              user_collapsible: false

    - product_id: "premium_bad_javascript_slot_override"
      name: "Premium slot override widening into javascript"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "bad_javascript_slot"
          canonical_formats_only: true
          params:
            supply_mode: "components"
            initial_state_id: "only_state"
            slots:
              - asset_group_id: "landing_page_url"
                asset_type: "url"
                required: true
              - asset_group_id: "custom_script"
                asset_type: "javascript"
                required: false
            states:
              - state_id: "only_state"
                anchoring: "inline"
                close_affordance: true
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 640
                    height: 210
            user_controls:
              dismissible: true
              user_collapsible: false

    - product_id: "premium_bad_fluid_rendered_canvases"
      name: "Premium fluid breakpoint paired with rendered_canvases"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "bad_fluid_rendered_canvases"
          canonical_formats_only: true
          params:
            supply_mode: "rendered_canvases"
            initial_state_id: "only_state"
            states:
              - state_id: "only_state"
                anchoring: "underlay"
                close_affordance: false
                breakpoints:
                  - breakpoint_id: "mobile"
                    width_mode: "full_bleed"
                    viewport_height_percent: 80
            user_controls:
              dismissible: true
              user_collapsible: false

    - product_id: "premium_clickthrough_none"
      name: "Premium non-clickable unit"
      channels: ["display"]
      delivery_type: "guaranteed"
      format_options:
        - format_kind: "seller_rendered_stateful_display"
          format_option_id: "clickthrough_none_unit"
          canonical_formats_only: true
          params:
            supply_mode: "components"
            clickthrough: "none"
            initial_state_id: "only_state"
            states:
              - state_id: "only_state"
                anchoring: "inline"
                close_affordance: true
                slot_bindings: ["imagery"]
                breakpoints:
                  - breakpoint_id: "desktop"
                    width: 300
                    height: 250
            user_controls:
              dismissible: true
              user_collapsible: false

    - product_id: "premium_coordinated_placements"
      name: "Premium coordinated placements"
      channels: ["display"]
      delivery_type: "guaranteed"
      exclusivity: "exclusive"
      placements:
        - { kind: "seller_inline", placement_id: "masthead", publisher_domain: "streamhaus.example", name: "Masthead", mode: "included" }
        - { kind: "seller_inline", placement_id: "skin", publisher_domain: "streamhaus.example", name: "Skin", mode: "included" }
      format_options:
        - format_kind: "image"
          format_option_id: "masthead_image"
          canonical_formats_only: true
          params:
            width: 970
            height: 250
        - format_kind: "coordinated_placements"
          format_option_id: "coordinated_placements"
          canonical_formats_only: true
          params:
            components:
              - component_id: "masthead"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "masthead" }
                required: true
                format_option_ref:
                  scope: "product"
                  format_option_id: "masthead_image"
              - component_id: "skin"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "skin" }
                required: true
                format_kind: "image"
                params:
                  width: 2560
                  height: 1440
            shared_slots:
              - asset_group_id: "cta"
                asset_type: "text"
                required: true
                consumed_by: ["masthead", "skin"]

    - product_id: "premium_coordinated_placements_bad_ref"
      name: "Premium coordinated placements with unresolved component"
      channels: ["display"]
      delivery_type: "guaranteed"
      placements:
        - { kind: "seller_inline", placement_id: "masthead", publisher_domain: "streamhaus.example", name: "Masthead", mode: "included" }
        - { kind: "seller_inline", placement_id: "rail", publisher_domain: "streamhaus.example", name: "Rail", mode: "included" }
      format_options:
        - format_kind: "coordinated_placements"
          format_option_id: "bad_ref_takeover"
          canonical_formats_only: true
          params:
            components:
              - component_id: "masthead"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "masthead" }
                required: true
                format_option_ref:
                  scope: "product"
                  format_option_id: "missing_format"
              - component_id: "rail"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "rail" }
                required: false
                format_kind: "image"
                params: { width: 300, height: 600 }

    - product_id: "premium_coordinated_placements_bad_consumer"
      name: "Premium coordinated placements with unknown shared consumer"
      channels: ["display"]
      delivery_type: "guaranteed"
      placements:
        - { kind: "seller_inline", placement_id: "skin", publisher_domain: "streamhaus.example", name: "Skin", mode: "included" }
        - { kind: "seller_inline", placement_id: "rail", publisher_domain: "streamhaus.example", name: "Rail", mode: "included" }
      format_options:
        - format_kind: "coordinated_placements"
          format_option_id: "bad_consumer_takeover"
          canonical_formats_only: true
          params:
            components:
              - component_id: "skin"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "skin" }
                required: true
                format_kind: "image"
                params:
                  width: 2560
                  height: 1440
              - component_id: "rail"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "rail" }
                required: false
                format_kind: "image"
                params: { width: 300, height: 600 }
            shared_slots:
              - asset_group_id: "cta"
                asset_type: "text"
                required: false
                consumed_by: ["missing_component"]

    - product_id: "premium_coordinated_placements_bad_shared_type"
      name: "Premium coordinated placements with incompatible shared slot"
      channels: ["display"]
      delivery_type: "guaranteed"
      placements:
        - { kind: "seller_inline", placement_id: "skin", publisher_domain: "streamhaus.example", name: "Skin", mode: "included" }
        - { kind: "seller_inline", placement_id: "rail", publisher_domain: "streamhaus.example", name: "Rail", mode: "included" }
      format_options:
        - format_kind: "coordinated_placements"
          format_option_id: "bad_shared_type_takeover"
          canonical_formats_only: true
          params:
            components:
              - component_id: "skin"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "skin" }
                required: true
                format_kind: "image"
                params: { width: 2560, height: 1440 }
              - component_id: "rail"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "rail" }
                required: false
                format_kind: "image"
                params: { width: 300, height: 600 }
            shared_slots:
              - asset_group_id: "video_main"
                asset_type: "video"
                required: false
                consumed_by: ["skin"]

    - product_id: "premium_coordinated_placements_bad_canvas"
      name: "Premium coordinated placements with overflowing canvas constraint"
      channels: ["display"]
      delivery_type: "guaranteed"
      placements:
        - { kind: "seller_inline", placement_id: "skin", publisher_domain: "streamhaus.example", name: "Skin", mode: "included" }
        - { kind: "seller_inline", placement_id: "rail", publisher_domain: "streamhaus.example", name: "Rail", mode: "included" }
      format_options:
        - format_kind: "coordinated_placements"
          format_option_id: "bad_canvas_takeover"
          canonical_formats_only: true
          params:
            components:
              - component_id: "skin"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "skin" }
                required: true
                format_kind: "image"
                params:
                  sizes: [{ width: 2560, height: 1440 }]
                canvas_constraints:
                  - constraint: "safe_area"
                    region: { unit: "px", x: 2500, y: 0, width: 100, height: 100 }
              - component_id: "rail"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "rail" }
                required: false
                format_kind: "image"
                params: { width: 300, height: 600 }

    - product_id: "premium_coordinated_sequenced_takeover"
      name: "Premium coordinated takeover with sequenced messaging"
      channels: ["display"]
      delivery_type: "guaranteed"
      exclusivity: "exclusive"
      placements:
        - { kind: "seller_inline", placement_id: "seq_skin", publisher_domain: "streamhaus.example", name: "Skin", mode: "included" }
        - { kind: "seller_inline", placement_id: "seq_leaderboard", publisher_domain: "streamhaus.example", name: "Leaderboard", mode: "included" }
        - { kind: "seller_inline", placement_id: "seq_message_a", publisher_domain: "streamhaus.example", name: "Message A", mode: "included" }
        - { kind: "seller_inline", placement_id: "seq_message_b", publisher_domain: "streamhaus.example", name: "Message B", mode: "included" }
      format_options:
        - format_kind: "image"
          format_option_id: "seq_leaderboard_image"
          canonical_formats_only: true
          params:
            width: 970
            height: 250
        - format_kind: "image"
          format_option_id: "seq_message_image"
          canonical_formats_only: true
          params:
            width: 300
            height: 250
        - format_kind: "coordinated_placements"
          format_option_id: "sequenced_takeover"
          canonical_formats_only: true
          params:
            components:
              - component_id: "skin"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "seq_skin" }
                required: true
                serving_policy: "seller_served_only"
                format_kind: "image"
                params: { width: 1280, height: 1440 }
              - component_id: "leaderboard"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "seq_leaderboard" }
                required: true
                serving_policy: "third_party_allowed"
                format_option_ref:
                  scope: "product"
                  format_option_id: "seq_leaderboard_image"
              - component_id: "message_a"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "seq_message_a" }
                required: false
                sequence: 1
                format_option_ref:
                  scope: "product"
                  format_option_id: "seq_message_image"
              - component_id: "message_b"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "seq_message_b" }
                required: false
                sequence: 2
                format_option_ref:
                  scope: "product"
                  format_option_id: "seq_message_image"
            shared_slots:
              - asset_group_id: "cta"
                asset_type: "text"
                required: false
                consumed_by: ["skin", "leaderboard", "message_a", "message_b"]

    - product_id: "premium_coordinated_sequence_gap"
      name: "Premium coordinated takeover with a sequence gap"
      channels: ["display"]
      delivery_type: "guaranteed"
      placements:
        - { kind: "seller_inline", placement_id: "gap_skin", publisher_domain: "streamhaus.example", name: "Skin", mode: "included" }
        - { kind: "seller_inline", placement_id: "gap_leaderboard", publisher_domain: "streamhaus.example", name: "Leaderboard", mode: "included" }
      format_options:
        - format_kind: "coordinated_placements"
          format_option_id: "sequence_gap_takeover"
          canonical_formats_only: true
          params:
            components:
              - component_id: "skin"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "gap_skin" }
                required: true
                sequence: 1
                format_kind: "image"
                params: { width: 1280, height: 1440 }
              - component_id: "leaderboard"
                placement_ref: { publisher_domain: "streamhaus.example", placement_id: "gap_leaderboard" }
                required: false
                sequence: 3
                format_kind: "image"
                params: { width: 970, height: 250 }

phases:
  - id: seller_rendered_stateful_canvas_matrix
    title: "Seller-rendered stateful canvas matrix (rendered_canvases supply mode)"
    steps:
      - id: validate_complete_canvas_matrix
        title: "Accept complete state and breakpoint canvas coverage"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/creative/canonical-formats#premium-display-in-32"
        comply_scenario: canonical_format_validation
        stateful: true
        sample_request:
          adcp_version: "3.2-beta.0"
          account:
            brand: { domain: "acmeoutdoor.example" }
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "seller_rendered_stateful_display"
            assets:
              state_canvases:
                - { asset_type: "image", url: "https://cdn.acme.example/expanded-desktop.png", state_id: "expanded", breakpoint_id: "desktop", width: 640, height: 210 }
                - { asset_type: "image", url: "https://cdn.acme.example/expanded-mobile.png", state_id: "expanded", breakpoint_id: "mobile", width: 320, height: 210 }
                - { asset_type: "image", url: "https://cdn.acme.example/collapsed-desktop.png", state_id: "collapsed", breakpoint_id: "desktop", width: 640, height: 70 }
                - { asset_type: "image", url: "https://cdn.acme.example/collapsed-mobile.png", state_id: "collapsed", breakpoint_id: "mobile", width: 320, height: 70 }
              landing_page_url: { asset_type: "url", url: "https://acmeoutdoor.example/launch" }
          targets:
            - { kind: "product", id: "premium_seller_rendered_stateful_display" }
        validations:
          - check: response_schema
          - { check: field_value, path: "results[0].result_kind", value: "validated_pass" }
            # supply_mode_manifest: rendered_canvases mode requires full canvas coverage — a complete matrix passes.

      - id: reject_incomplete_canvas_matrix
