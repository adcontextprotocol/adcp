            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "seller_rendered_stateful_display"
            assets:
              logo: { asset_type: "image", url: "https://cdn.acme.example/logo.png", width: 200, height: 200 }
              headline: { asset_type: "text", content: "Gear up for the trail" }
              cta: { asset_type: "text", content: "Shop now" }
              imagery: { asset_type: "image", url: "https://cdn.acme.example/hero.png", width: 640, height: 210 }
              landing_page_url: { asset_type: "url", url: "https://acmeoutdoor.example/launch" }
          targets:
            - { kind: "product", id: "premium_components_mode_display" }
        validations:
          - check: response_schema
          - { check: field_value, path: "results[0].result_kind", value: "validated_pass" }
            # supply_mode_manifest: components mode is satisfied by component slots alone.

      - id: reject_components_mode_manifest_with_state_canvases
        title: "Reject a components-mode manifest that also ships state_canvases"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/creative/canonical-formats#premium-display-in-32"
        comply_scenario: canonical_format_validation
        stateful: true
        sample_request:
          adcp_version: "3.2-beta.0"
          account:
            brand: { domain: "acmeoutdoor.example" }
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "seller_rendered_stateful_display"
            assets:
              logo: { asset_type: "image", url: "https://cdn.acme.example/logo.png", width: 200, height: 200 }
              landing_page_url: { asset_type: "url", url: "https://acmeoutdoor.example/launch" }
              state_canvases:
                - { asset_type: "image", url: "https://cdn.acme.example/expanded-desktop.png", state_id: "expanded", breakpoint_id: "desktop", width: 640, height: 210 }
          targets:
            - { kind: "product", id: "premium_components_mode_display" }
