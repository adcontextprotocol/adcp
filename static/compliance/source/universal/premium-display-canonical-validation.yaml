  - id: supply_mode_manifests
    title: "supply_mode-consistent manifests across components, rendered_canvases, and layered_source"
    narrative: |
      `supply_mode` declares which end of the template contract the buyer
      feeds. A manifest MUST match its product's declared mode
      (`supply_mode_manifest`), and a fluid breakpoint MUST NOT be paired
      with `rendered_canvases` supply (`fluid_breakpoint_supply`).
    steps:
      - id: validate_components_mode_manifest
        title: "Accept a components-mode manifest with no state_canvases"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
