    narrative: |
      `sequence` orders components that present one after another instead
      of simultaneously; declared values must start at 1 and be contiguous
      across the declared set (`sequence_values`). `serving_policy` sets
      per-component first-party/third-party serving policy independent of
      `sequence`.
    steps:
      - id: validate_sequenced_takeover
        title: "Accept a takeover with contiguous sequence values and mixed serving_policy"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/creative/canonical-formats#premium-display-in-32"
        comply_scenario: canonical_format_validation
        stateful: true
        sample_request:
          adcp_version: "3.2-beta.0"
          account:
            brand: { domain: "acmeoutdoor.example" }
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "coordinated_placements"
            assets:
              cta: { asset_type: "text", content: "Explore" }
            component_assets:
              skin:
                image_main: { asset_type: "image", url: "https://cdn.acme.example/skin.png", width: 1280, height: 1440 }
              leaderboard:
                image_main: { asset_type: "image", url: "https://cdn.acme.example/leaderboard.png", width: 970, height: 250 }
              message_a:
                image_main: { asset_type: "image", url: "https://cdn.acme.example/message-a.png", width: 300, height: 250 }
              message_b:
                image_main: { asset_type: "image", url: "https://cdn.acme.example/message-b.png", width: 300, height: 250 }
          targets:
            - { kind: "product", id: "premium_coordinated_sequenced_takeover" }
        validations:
          - check: response_schema
          - { check: field_value, path: "results[0].result_kind", value: "validated_pass" }
            # sequence_values: message_a=1, message_b=2 is contiguous starting at 1; serving_policy differs per component without affecting sequence validity.

      - id: reject_sequence_gap
        title: "Reject a coordinated declaration with a gap in sequence values"
        task: validate_input
        schema_ref: "creative/validate-input-request.json"
        response_schema_ref: "creative/validate-input-response.json"
        doc_ref: "/creative/canonical-formats#premium-display-in-32"
        comply_scenario: canonical_format_validation
        stateful: true
        sample_request:
          adcp_version: "3.2-beta.0"
          account:
            brand: { domain: "acmeoutdoor.example" }
            operator: "pinnacle-agency.example"
            sandbox: true
          manifest:
            format_kind: "coordinated_placements"
            assets: {}
            component_assets:
              skin:
                image_main: { asset_type: "image", url: "https://cdn.acme.example/skin.png", width: 1280, height: 1440 }
          targets:
            - { kind: "product", id: "premium_coordinated_sequence_gap" }
        validations:
          - { check: field_value, path: "results[0].result_kind", value: "validated_fail" }
          - { check: field_value, path: "results[0].violations[0].rule", value: "sequence_values" }
            # sequence_values: "sequence values must start at 1 and be contiguous" — 1 then 3 (missing 2) MUST reject.
