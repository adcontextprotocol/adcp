# Grades the acceptance rule for signed commercial terms (media-buy/commercial-terms.json,
# core/canonical-proposal.json terms_digest): terms_digest covers the entire commercial_terms
# JSON value, accepting the terms binds the accepting party to every member, and a seller that
# cannot interpret every member of terms it would record MUST reject the request with
# UNRECOGNIZED_TERMS instead of accepting it, dropping the member, or carrying it uninterpreted.
#
# buy_products purchases[] become accepted_proposal.commercial_terms.purchases[], so the seller
# is the accepting party. The unrecognized member sits in format_option_refs[0], a schema that is
# open (additionalProperties: true), so the request passes schema validation and fails for one
# reason only. The control step sends the same purchase without the member and must succeed.
id: media_buy_seller/unrecognized_terms_rejected
version: "1.0.0"
title: "Seller rejects commercial terms it cannot interpret"
category: media_buy_seller
summary: "Verifies that buy_products rejects a purchase carrying a member the seller cannot interpret with UNRECOGNIZED_TERMS, and accepts the same purchase without it."
track: media_buy
introduced_in: "3.3"

requires:
  - controller

required_tools:
  - list_products
  - buy_products

requires_capability:
  path: media_buy.lifecycle_tools
  contains: buy_products

narrative: |
  A buyer's buy_products purchases become the commercial_terms of the accepted
  proposal the seller records, and terms_digest covers every member of them.
  Accepting signed terms binds the accepting party to every member, so a
  seller that cannot interpret a member must not accept the terms. Dropping the
  member would record terms the buyer did not send; carrying it would bind the
  seller to a term it never read.

  The buyer sends a purchase whose format option reference carries
  delivery_share, a member no AdCP release defines. The format option
  reference schema is open, so the request is schema-valid. The seller rejects
  it with UNRECOGNIZED_TERMS. The same purchase without the member then
  completes, which shows the member is the only reason for the rejection.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
  examples:
    - "Publisher with a versioned product catalog and direct-purchase workflow"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: "The controller seeds one non-guaranteed product with a single product-local format option and a fixed CPM pricing option."
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "unrecognized_terms_display"
      name: "Unrecognized Terms Display"
      description: "Compliance fixture: non-guaranteed display product for the unrecognized-terms rejection."
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_options:
        - format_option_id: "unrecognized_terms_display_300x250"
          format_kind: "image"
          params:
            width: 300
            height: 250
  pricing_options:
    - product_id: "unrecognized_terms_display"
      pricing_option_id: "unrecognized_terms_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 12

phases:
  - id: setup
    title: "Account setup"
    steps:
      - id: sync_accounts
        title: "Establish account"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: |
          Return the account with account_id and status active.

        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
              payment_terms: "net_30"

          idempotency_key: "$generate:uuid_v4#media_buy_seller_unrecognized_terms_setup_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json schema"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a platform-assigned ID"

  - id: discover_offer
    title: "Discover the published offer"
    depends_on: [setup]
    steps:
      - id: list_unrecognized_terms_product
        title: "List the seeded product"
        task: list_products
        schema_ref: "media-buy/list-products-request.json"
        response_schema_ref: "media-buy/list-products-response.json"
        doc_ref: "/media-buy/task-reference/list_products"
        stateful: true
        expected: |
          Return outcome listed with the seeded product, its feed_version, and its
          pricing_version.

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_unrecognized_terms_discover_offer_list"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          criteria:
            product_ids: ["unrecognized_terms_display"]
          fields: ["product_id", "name", "format_options", "pricing_options"]
        context_outputs:
          - name: feed_version
            path: "feed_version"
          - name: pricing_version
            path: "pricing_version"
        validations:
          - check: response_schema
            description: "Response matches list-products-response.json schema"
          - check: field_value
            path: "outcome"
            value: "listed"
            description: "The response contains a product page"
          - check: field_value
            path: "products[0].product_id"
            value: "unrecognized_terms_display"
            description: "The seeded product is discoverable"
          - check: field_present
            path: "feed_version"
            description: "The response carries the feed_version buy_products requires"

  - id: purchase
    title: "Reject terms with an unrecognized member, then accept them without it"
    depends_on: [discover_offer]
    narrative: |
      Both requests are identical except for delivery_share inside
      format_option_refs[0]. Only the first carries it.
    steps:
      - id: reject_unrecognized_member
        title: "Reject a purchase whose format option reference carries an unrecognized member"
        task: buy_products
        schema_ref: "media-buy/buy-products-request.json"
        response_schema_ref: "media-buy/buy-products-response.json"
        doc_ref: "/media-buy/task-reference/buy_products"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        expected: |
          Reject with UNRECOGNIZED_TERMS. The purchase would become commercial_terms
          the seller is bound by, and the seller cannot interpret delivery_share.
          Do not create a MediaBuy, drop the member, or record it uninterpreted.

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_unrecognized_terms_purchase_reject"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          feed_version: "$context.feed_version"
          pricing_version: "$context.pricing_version"
          purchases:
            - product_id: "unrecognized_terms_display"
              pricing_option_id: "unrecognized_terms_cpm"
              format_option_refs:
                - scope: "product"
                  format_option_id: "unrecognized_terms_display_300x250"
                  delivery_share: 0.6
              budget: 1000
          start_time: "asap"
          end_time: "2099-09-30T23:59:59Z"
        validations:
          - check: response_schema
            description: "Rejected response matches buy-products-response.json"
          - check: error_code
            value: "UNRECOGNIZED_TERMS"
            description: "A member the seller cannot interpret blocks acceptance of the terms"

      - id: accept_without_member
        title: "Accept the same purchase without the unrecognized member"
        task: buy_products
        schema_ref: "media-buy/buy-products-request.json"
        response_schema_ref: "media-buy/buy-products-response.json"
        doc_ref: "/media-buy/task-reference/buy_products"
        stateful: true
        expected: |
          Create the MediaBuy and return the accepted proposal snapshot.

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_unrecognized_terms_purchase_accept"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          feed_version: "$context.feed_version"
          pricing_version: "$context.pricing_version"
          purchases:
            - product_id: "unrecognized_terms_display"
              pricing_option_id: "unrecognized_terms_cpm"
              format_option_refs:
                - scope: "product"
                  format_option_id: "unrecognized_terms_display_300x250"
              budget: 1000
          start_time: "asap"
          end_time: "2099-09-30T23:59:59Z"
        validations:
          - check: response_schema
            description: "Response matches buy-products-response.json"
          - check: field_present
            path: "media_buy_id"
            description: "The purchase without the member creates a MediaBuy"
          - check: field_present
            path: "accepted_proposal.terms_digest"
            description: "The seller records the accepted terms and their digest"
