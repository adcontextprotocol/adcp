id: media_buy_seller/seller_optimized_proposal_package_pacing
version: "1.0.1"
title: "Seller-optimized proposal carries subordinate package pacing into the buy"
category: media_buy_seller
summary: "Verifies that a seller advertising seller-optimized budgets, package pacing, and proposals can express subordinate allocation pacing on a seller-optimized proposal and translate it into package pacing on execution and readback."
track: media_buy
requires:
  - controller

introduced_in: "3.2"

# Proposal-derived package pacing needs three independent declarations: the
# core shared-budget contract, the package-pacing sub-capability, and proposal
# support. Sellers lacking any of them grade not_applicable. The core
# shared-budget proposal flow is graded by media_buy_seller/seller_optimized_budget.
requires_all_capabilities:
  - path: media_buy.features.seller_optimized_budget
    equals: true
  - path: media_buy.features.seller_optimized_package_pacing
    equals: true
  - path: media_buy.supports_proposals
    equals: true
  # TEMPORARY(adcp#7852): remove when this scenario is delivery-mode aware (Option B).
  - path: media_buy.supported_delivery_types
    contains: non_guaranteed

required_tools:
  - get_products
  - create_media_buy
  - get_media_buys

invariants:
  - status.monotonic

narrative: |
  A seller-optimized proposal may recommend subordinate pacing for an
  individual allocation beneath aggregate media-buy pacing. Allocation pacing
  is a package-level control, so a seller emits it only when it advertises
  seller_optimized_package_pacing. On execution the allocation pacing becomes
  package pacing on the derived package and must survive readback, while the
  aggregate pacing continues to bound delivery.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - supports_non_guaranteed
    - seller_optimized_budget
  examples:
    - "Social platforms front-loading one ad set inside a campaign budget"
    - "DSPs pacing one line item ahead of an evenly paced insertion order"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The seller supports a common click optimization goal across two
    non-guaranteed products in one currency. The test controller seeds both
    products so the sample request does not rely on undeclared fixture IDs.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "shared_budget_prospecting"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_ids:
        - id: "display_300x250"
    - product_id: "shared_budget_retargeting"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_ids:
        - id: "display_300x250"
  pricing_options:
    - product_id: "shared_budget_prospecting"
      pricing_option_id: "prospecting_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 1.50
    - product_id: "shared_budget_retargeting"
      pricing_option_id: "retargeting_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 2.00

phases:
  - id: setup
    title: "Establish account and discover eligible products"
    steps:
      - id: sync_accounts
        title: "Establish account"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: "Return an active account."
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
          idempotency_key: "$generate:uuid_v4#seller_optimized_proposal_package_pacing_setup_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a seller-assigned identifier"

      - id: get_products_for_shared_budget
        title: "Discover products for shared allocation"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: false
        expected: "Return the seeded products with compatible USD pricing and click optimization."
        sample_request:
          idempotency_key: "$generate:uuid_v4#seller_optimized_proposal_package_pacing_setup_get_products"
          buying_mode: "brief"
          brief: "Allocate a $100,000 performance budget across prospecting and retargeting display packages, optimizing for clicks."
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_present
            path: "products[1]"
            description: "At least two products are available for cross-package allocation"

  - id: execute_seller_optimized_proposal_with_package_pacing
    title: "Execute a committed seller-optimized proposal with subordinate package pacing"
    depends_on: [setup]
    steps:
      - id: get_seller_optimized_proposal
        title: "Request a shared-budget proposal with two-level pacing"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: true
        expected: |
          Return a seller-optimized proposal with aggregate even pacing and a
          subordinate front-loaded pacing term on the second allocation.
        sample_request:
          idempotency_key: "$generate:uuid_v4#seller_optimized_proposal_package_pacing_get_proposal"
          buying_mode: "brief"
          brief: "Propose a $100,000 shared display budget across prospecting and retargeting, optimize allocation for clicks, pace the buy evenly, and front-load retargeting."
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
        context_outputs:
          - name: shared_proposal_id
            path: "proposals[0].proposal_id"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_value
            path: "proposals[0].budget_allocation.mode"
            value: "seller_optimized"
            description: "Proposal delegates cross-package allocation"
          - check: field_value
            path: "proposals[0].pacing"
            value: "even"
            description: "Proposal preserves aggregate pacing"
          - check: field_contains
            path: "proposals[0].allocations[*]"
            value:
              product_id: "shared_budget_retargeting"
              pacing: "front_loaded"
            description: "Proposal expresses subordinate pacing on the intended product"

      - id: finalize_seller_optimized_proposal
        title: "Commit the shared-budget proposal"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: true
        expected: "Return the same seller-optimized proposal as committed firm terms."
        sample_request:
          idempotency_key: "$generate:uuid_v4#seller_optimized_proposal_package_pacing_finalize_proposal"
          buying_mode: "refine"
          refine:
            - scope: "proposal"
              proposal_id: "$context.shared_proposal_id"
              action: "finalize"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_value
            path: "proposals[0].proposal_id"
            value: "$context.shared_proposal_id"
            description: "Finalization returns the proposal the buyer targeted"
          - check: field_value
            path: "proposals[0].proposal_status"
            value: "committed"
            description: "Proposal is ready for execution"
          - check: field_value
            path: "proposals[0].budget_allocation.mode"
            value: "seller_optimized"
            description: "Finalization preserves shared allocation terms"
          - check: field_value
            path: "proposals[0].pacing"
            value: "even"
            description: "Finalization preserves aggregate pacing"
          - check: field_contains
            path: "proposals[0].allocations[*]"
            value:
              product_id: "shared_budget_retargeting"
              pacing: "front_loaded"
            description: "Finalization preserves product-specific subordinate pacing"

      - id: create_from_seller_optimized_proposal
        title: "Execute the shared-budget proposal"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        expected: |
          Create packages from the committed constraints, preserve the shared
          allocation goals and aggregate pacing, and translate allocation
          pacing to package pacing.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          proposal_id: "$context.shared_proposal_id"
          total_budget:
            amount: 100000
            currency: "USD"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#seller_optimized_proposal_package_pacing_execute"
        context_outputs:
          - name: shared_proposal_media_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json"
          - check: field_value
            path: "budget_allocation.mode"
            value: "seller_optimized"
            description: "Execution preserves delegated allocation"
          - check: field_value
            path: "pacing"
            value: "even"
            description: "Execution preserves aggregate pacing"
          - check: field_contains
            path: "packages[*]"
            value:
              product_id: "shared_budget_retargeting"
              pacing: "front_loaded"
            description: "Execution derives package pacing for the intended product"

      - id: read_seller_optimized_proposal_buy
        title: "Read back the proposal-derived shared buy"
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: true
        expected: "Return the proposal-derived allocation and pacing configuration unchanged."
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids:
            - "$context.shared_proposal_media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json"
          - check: field_value
            path: "media_buys[0].budget_allocation.mode"
            value: "seller_optimized"
            description: "Readback preserves shared allocation"
          - check: field_contains
            path: "media_buys[0].packages[*]"
            value:
              product_id: "shared_budget_retargeting"
              pacing: "front_loaded"
            description: "Readback preserves product-matched proposal pacing"
          - check: field_value
            path: "media_buys[0].pacing"
            value: "even"
            description: "Readback preserves aggregate proposal pacing"
