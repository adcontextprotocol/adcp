id: media_buy_seller/gender_targeting
version: 1.0.0
title: Seller executes exact gender predicates with non-binary support and lossless readback
category: media_buy_seller
summary: >-
  Verifies explicitly seeded product-scoped gender capabilities, exact non-binary and mixed
  age/gender execution, unsupported predicate rejection, and whole-demographics replacement and
  clearing.
track: media_buy
requires:
  - controller
requires_capability:
  path: media_buy.execution.targeting.demographics.gender.supported
  equals: true
required_tools:
  - get_products
  - create_media_buy
  - update_media_buy
  - get_media_buys
  - comply_test_controller
invariants:
  - status.monotonic
narrative: >-
  Gender targeting is a canonical category set plus explicit unknown-gender membership. Categories
  within gender compose with OR; age and gender compose with AND, with unknown membership evaluated
  independently per dimension. Requested and applied predicates must equal the accepted package
  targeting, rather than merely asserting equivalent:true. Product capability absence is not
  permission to infer support from a seller-wide rollup. The controller authorizes deterministic
  test products for this scenario; these fixtures do not require every production product or seller
  to support every category or execution mode.
agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - supports_non_guaranteed
    - gender_targeting
  examples:
    - Sellers with exact product-scoped gender controls
caller:
  role: buyer_agent
  example: Pinnacle Agency (buyer)
prerequisites:
  description: >-
    The authorized controller seeds a native gender product with all three portable categories and
    selectable unknown membership, a female/male-only product that always excludes unknown gender,
    and an age-only product with no gender capability. The first product also accepts continuous age
    bounds. Controller fixtures are contract tests; production products may advertise any supported
    category subset and their own execution modes.
  test_kit: test-kits/acme-outdoor.yaml
  controller_seeding: true
fixtures:
  accounts:
    - account_id: acct_acmeoutdoor_example_sandbox_a5152073f45e
      fixture:
        brand:
          domain: acmeoutdoor.example
        operator: pinnacle-agency.example
        operator_unit:
          id: compliance-media_buy_seller_gender_targeting-6bfd65f4
        sandbox: true
        billing: operator
        status: active
  products:
    - product_id: gender_native_display
      delivery_type: non_guaranteed
      channels:
        - display
      format_ids:
        - id: display_300x250
      overlay_support:
        geo_countries: true
        demographics:
          age: true
          gender: true
      demographic_targeting:
        age:
          execution_modes:
            - continuous_bounds
          min_supported_age: 18
          max_supported_age: 65
          supports_unbounded_min: true
          supports_unbounded_max: true
          unknown_handling: selectable
        gender:
          values:
            - female
            - male
            - non_binary
          execution_modes:
            - native
          unknown_handling: selectable
    - product_id: gender_limited_display
      delivery_type: non_guaranteed
      channels:
        - display
      format_ids:
        - id: display_300x250
      overlay_support:
        demographics:
          gender: true
      demographic_targeting:
        gender:
          values:
            - female
            - male
          execution_modes:
            - native
          unknown_handling: always_excluded
    - product_id: gender_age_only_display
      delivery_type: non_guaranteed
      channels:
        - display
      format_ids:
        - id: display_300x250
      overlay_support:
        demographics:
          age: true
      demographic_targeting:
        age:
          execution_modes:
            - continuous_bounds
          min_supported_age: 18
          max_supported_age: 65
          supports_unbounded_min: true
          supports_unbounded_max: true
          unknown_handling: selectable
  pricing_options:
    - product_id: gender_native_display
      pricing_option_id: gender_native_display_cpm
      pricing_model: cpm
      currency: USD
      floor_price: 5
    - product_id: gender_limited_display
      pricing_option_id: gender_limited_display_cpm
      pricing_model: cpm
      currency: USD
      floor_price: 5
    - product_id: gender_age_only_display
      pricing_option_id: gender_age_only_display_cpm
      pricing_model: cpm
      currency: USD
      floor_price: 5
phases:
  - id: discover_product_capabilities
    title: Discover binding product-scoped gender capabilities
    steps:
      - id: get_gender_products
        title: Read product gender subsets and unknown handling
        task: get_products
        schema_ref: media-buy/get-products-request.json
        response_schema_ref: media-buy/get-products-response.json
        doc_ref: /media-buy/task-reference/get_products
        stateful: true
        sample_request:
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_gender_targeting-6bfd65f4
            sandbox: true
          buying_mode: wholesale
          fields:
            - product_id
            - pricing_options
            - demographic_targeting
        expected: >-
          Return the three seeded products with their binding demographic_targeting declarations.
          The age-only product has no gender capability. A coarse seller declaration never supplies
          a missing product capability.
        validations:
          - check: response_schema
            description: Response matches the task response schema
          - check: field_contains
            path: products[*]
            value:
              product_id: gender_native_display
              demographic_targeting:
                gender:
                  values: [female, male, non_binary]
                  execution_modes: [native]
                  unknown_handling: selectable
            description: The seeded native product retains its binding gender capability
          - check: field_contains
            path: products[*]
            value:
              product_id: gender_limited_display
              demographic_targeting:
                gender:
                  values: [female, male]
                  execution_modes: [native]
                  unknown_handling: always_excluded
            description: The limited product retains its executable subset and unknown handling
          - check: field_contains
            path: products[*]
            value:
              product_id: gender_age_only_display
              demographic_targeting:
                age:
                  execution_modes: [continuous_bounds]
            description: The age-only product retains its age execution declaration
