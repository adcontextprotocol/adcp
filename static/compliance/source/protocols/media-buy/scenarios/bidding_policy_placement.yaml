id: media_buy_seller/bidding_policy_placement
version: "1.0.0"
title: "Seller preserves media-buy bidding inheritance and package override scope"
category: media_buy_seller
summary: "Verifies that a seller advertising bidding_policy accepts a media-buy bidding default plus one package override, echoes only authored blocks, and preserves authored scope on get_media_buys. Sellers without the feature grade not_applicable."
track: media_buy

requires_capability:
  path: media_buy.features.bidding_policy
  equals: true

required_tools:
  - get_products
  - create_media_buy
  - get_media_buys

invariants:
  - status.monotonic

narrative: |
  Media-buy bidding is a complete default inherited by packages that omit a
  package block. A package bidding block is a complete override, not a
  field-by-field merge. Readback preserves authored scope: the seller echoes
  media-buy bidding once and MUST NOT materialize that inherited policy on each
  package.

  This scenario uses fixed package budgets so it does not require the separate
  seller_optimized_budget capability. The same placement rules apply under a
  shared budget, where media-buy policy is authoritative for provider-native
  campaign strategy and unsupported package overrides fail before mutation.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - supports_non_guaranteed
    - bidding_policy
  examples:
    - "Campaign-level auction ceiling inherited by ad sets"
    - "Package-specific manual bid override in an independent-budget campaign"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The seller supports two non-guaranteed CPM products in USD and canonical
    bidding policy at both media-buy and package scope.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "bidding_default_display"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_ids:
        - id: "display_300x250"
    - product_id: "bidding_override_display"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_ids:
        - id: "display_300x250"
  pricing_options:
    - product_id: "bidding_default_display"
      pricing_option_id: "default_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 1.50
    - product_id: "bidding_override_display"
      pricing_option_id: "override_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 2.00

phases:
  - id: setup
    title: "Establish account and discover auction products"
    steps:
      - id: sync_accounts
        title: "Establish account"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: "Return an active account."
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
          idempotency_key: "$generate:uuid_v4#bidding_policy_placement_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a seller-assigned identifier"

      - id: get_products_for_bidding
        title: "Discover eligible auction products"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: false
        expected: "Return the seeded USD auction products."
        sample_request:
          buying_mode: "brief"
          brief: "Buy two display packages with one inherited CPM ceiling and one explicit package manual-bid override."
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_present
            path: "products[1]"
            description: "At least two compatible products are available"

  - id: create_bidding_buy
    title: "Create a buy with inherited and explicit policy"
    steps:
      - id: create_media_buy_with_bidding
        title: "Author media-buy default and package override"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        expected: |
          Accept the media-buy max bid and the second package's manual-bid
          override. Echo the media-buy block once, omit bidding from the first
          inheriting package, and echo the second package's authored override.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          bidding:
            max_bid: 7
          packages:
            - product_id: "bidding_default_display"
              pricing_option_id: "default_cpm"
              budget: 60000
            - product_id: "bidding_override_display"
              pricing_option_id: "override_cpm"
              budget: 40000
              bidding:
                bid_amount: 5
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#bidding_policy_placement_create"
        context_outputs:
          - name: media_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json"
          - check: field_present
            path: "media_buy_id"
            description: "Seller creates the media buy"
          - check: field_value
            path: "bidding.max_bid"
            value: 7
            description: "Response preserves media-buy-authored auction ceiling"
          - check: field_absent
            path: "packages[0].bidding"
            description: "Inherited media-buy bidding is not copied into the package"
          - check: field_value
            path: "packages[1].bidding.bid_amount"
            value: 5
            description: "Response preserves the explicit package override"

  - id: read_bidding_buy
    title: "Verify durable authored-scope readback"
    steps:
      - id: get_media_buy_with_bidding
        title: "Read back the media buy"
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: true
        expected: "Return the media-buy default and package override at their authored scopes."
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids:
            - "$context.media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json"
          - check: field_value
            path: "media_buys[0].bidding.max_bid"
            value: 7
            description: "Read preserves the media-buy-authored policy"
          - check: field_absent
            path: "media_buys[0].packages[0].bidding"
            description: "Read preserves inheritance rather than materializing a package copy"
          - check: field_value
            path: "media_buys[0].packages[1].bidding.bid_amount"
            value: 5
            description: "Read preserves the package-authored override"
