id: media_buy_seller/bidding_policy_placement
version: "1.0.0"
title: "Seller preserves bidding scope and rejects ambiguous goal binding"
category: media_buy_seller
summary: "Verifies that a seller advertising media-buy max_bid support accepts an inherited default, echoes it once, and does not materialize package copies. When the seller also advertises media-buy cost caps, it rejects a fixed default spanning incompatible package result units."
track: media_buy

requires_capability:
  path: media_buy.features.bidding_policy.media_buy.modes
  contains: max_bid

required_tools:
  - get_products
  - create_media_buy
  - get_media_buys

invariants:
  - status.monotonic

narrative: |
  Media-buy bidding is a complete default inherited by packages that omit a
  package block. Readback preserves authored scope: the seller echoes media-buy
  bidding once and MUST NOT materialize that inherited policy on each package.

  A capability-gated negative phase also verifies that a fixed media-buy cost
  control is not assigned two meanings: one amount cannot mean cost per click
  for one inheriting package and cost per view for another.

  This scenario uses fixed package budgets so it does not require the separate
  seller_optimized_budget capability. The same placement rules apply under a
  shared budget, where media-buy policy is authoritative for provider-native
  campaign strategy and unsupported package overrides fail before mutation.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - supports_non_guaranteed
    - bidding_policy
  examples:
    - "Campaign-level auction ceiling inherited by ad sets"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The seller supports two non-guaranteed CPM products in USD and canonical
    max_bid policy at media-buy scope.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "bidding_default_display"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_ids:
        - id: "display_300x250"
    - product_id: "bidding_override_display"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_ids:
        - id: "display_300x250"
  pricing_options:
    - product_id: "bidding_default_display"
      pricing_option_id: "default_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 1.50
    - product_id: "bidding_override_display"
      pricing_option_id: "override_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 2.00

phases:
  - id: setup
    title: "Establish account and discover auction products"
    steps:
      - id: sync_accounts
        title: "Establish account"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: "Return an active account."
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
          idempotency_key: "$generate:uuid_v4#bidding_policy_placement_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a seller-assigned identifier"

      - id: get_products_for_bidding
        title: "Discover eligible auction products"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: false
        expected: "Return the seeded USD auction products."
        sample_request:
          buying_mode: "brief"
          brief: "Buy two display packages with one inherited CPM ceiling and one explicit package manual-bid override."
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_present
            path: "products[1]"
            description: "At least two compatible products are available"

  - id: create_bidding_buy
    title: "Create a buy with inherited and explicit policy"
    steps:
      - id: create_media_buy_with_bidding
        title: "Author media-buy default and package override"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        expected: |
          Accept the media-buy max bid. Echo the media-buy block once and omit
          bidding from both inheriting packages.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          bidding:
            max_bid: 7
          packages:
            - product_id: "bidding_default_display"
              pricing_option_id: "default_cpm"
              budget: 60000
            - product_id: "bidding_override_display"
              pricing_option_id: "override_cpm"
              budget: 40000
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#bidding_policy_placement_create"
        context_outputs:
          - name: media_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json"
          - check: field_present
            path: "media_buy_id"
            description: "Seller creates the media buy"
          - check: field_value
            path: "bidding.max_bid"
            value: 7
            description: "Response preserves media-buy-authored auction ceiling"
          - check: field_absent
            path: "packages[0].bidding"
            description: "Inherited media-buy bidding is not copied into the package"
          - check: field_absent
            path: "packages[1].bidding"
            description: "The second inheriting package also omits a copied policy"

  - id: read_bidding_buy
    title: "Verify durable authored-scope readback"
    steps:
      - id: get_media_buy_with_bidding
        title: "Read back the media buy"
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: true
        expected: "Return the media-buy default once and keep inherited package policy implicit."
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids:
            - "$context.media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json"
          - check: field_value
            path: "media_buys[0].bidding.max_bid"
            value: 7
            description: "Read preserves the media-buy-authored policy"
          - check: field_absent
            path: "media_buys[0].packages[0].bidding"
            description: "Read preserves inheritance rather than materializing a package copy"
          - check: field_absent
            path: "media_buys[0].packages[1].bidding"
            description: "Read keeps the second inherited package implicit"

  - id: reject_incompatible_fixed_cost_binding
    title: "Reject one fixed cost control across incompatible goal units"
    requires_capability:
      path: media_buy.features.bidding_policy.media_buy.cost_per_strengths
      contains: cap
    steps:
      - id: create_media_buy_with_ambiguous_fixed_cost_binding
        title: "Reject a shared cost cap that would mean different results"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: false
        expect_error: true
        negative_path: payload_well_formed
        expected: |
          Reject before mutation with BIDDING_PLACEMENT_CONFLICT. In fixed
          allocation the media-buy cost cap would bind to clicks for the first
          package and views for the second, so the single amount has no common
          result unit.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          budget_allocation:
            mode: "fixed"
          bidding:
            cost_per:
              amount: 4
              strength: "cap"
          packages:
            - product_id: "bidding_default_display"
              pricing_option_id: "default_cpm"
              budget: 60000
              optimization_goals:
                - kind: "metric"
                  metric: "clicks"
                  priority: 1
            - product_id: "bidding_override_display"
              pricing_option_id: "override_cpm"
              budget: 40000
              optimization_goals:
                - kind: "metric"
                  metric: "views"
                  priority: 1
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#bidding_policy_placement_incompatible_cost_binding"
        validations:
          - check: error_code
            value: "BIDDING_PLACEMENT_CONFLICT"
            description: "Seller rejects a fixed media-buy cost control whose inheriting package goal units differ"
          - check: field_value
            path: "errors[0].field"
            value: "bidding.cost_per"
            description: "Error identifies the ambiguous media-buy cost control"
