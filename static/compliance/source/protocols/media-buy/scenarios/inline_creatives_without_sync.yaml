  - id: legacy_format_discovery
    title: "Probe a product for a format_ids representation (optional)"
    optional: true
    depends_on: [capability_discovery]
    narrative: |
      A seller may still publish products through legacy format_ids[], including
      formats that have no canonical projection. This phase captures the
      product, its pricing option, and its format_id from one get_products
      response — the same response the legacy path below buys from — so the
      representation that gates the path and the product the path buys cannot
      drift apart across calls.

      The phase is optional because publishing no format_ids[] is conformant.
      When the capture does not resolve, the non-optional legacy path below
      skips on the unresolved context and the canonical path carries the run.

    steps:
      - id: get_products_legacy_format
        title: "Probe the first brief-matched product for format_ids (absence is conformant)"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        comply_scenario: full_sales_flow
        stateful: false
        expected: |
          Return at least one fixed-price product with a pricing option. A seller
          that publishes format_ids[] returns a product whose first entry is a
          concrete format_id — including formats with no canonical projection —
          and the legacy path below buys that same product. A seller that
          publishes no format_ids[] is conformant: this optional capture does not
          resolve and the legacy path skips.
        sample_request:
          buying_mode: "brief"
          brief: "Display inventory on outdoor lifestyle content. Q3 flight with buyer-supplied inline creative."
          filters:
            is_fixed_price: true
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          context:
            correlation_id: "inline_creatives_without_sync--get_products_legacy"
        context_outputs:
          - path: "products[0].product_id"
            key: "legacy_product_id"
          - path: "products[0].pricing_options[0].pricing_option_id"
            key: "legacy_pricing_option_id"
          - path: "products[0].format_ids[0]"
            key: "legacy_format_id"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: field_present
            path: "products[0].format_ids[0]"
            description: "PROBE, NOT A REQUIREMENT — a product publishing format_ids[] carries a concrete format_id on its first entry; this probe matches the capture's granularity. Absence is conformant: it skips the legacy path below rather than failing the storyboard. See phase legacy_format_discovery (optional: true)"
          - check: field_present
            path: "products[0].pricing_options[0].fixed_price"
            description: "The captured pricing option is fixed-price; fixed-price storyboards do not send bid_price"
          - check: field_value
            path: "context.correlation_id"
            value: "inline_creatives_without_sync--get_products_legacy"
            description: "Context correlation_id returned unchanged"

  - id: legacy_format_inline_path
    title: "Inline creative path using format_ids"
    depends_on: [legacy_format_discovery]
    # Same guard as the canonical path above, keyed to this path's own capture.
    skip_if: "!context.legacy_format_id"
    narrative: |
      Submits the inline creative with the format_id captured by
      legacy_format_discovery and verifies create/update acceptance and the
      replacement readback separately from the canonical path.

      This phase is deliberately NOT optional and deliberately NOT a branch_set
      peer, for the same reason as the canonical path above: once the discovery
      above observed a legacy representation, a failure here fails the
      storyboard even when the canonical path passes.

    steps:
      - id: create_buy_with_legacy_inline_creative
