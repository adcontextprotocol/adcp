  - id: verify_format_coverage
    title: "Require a complete inline creative path"
    depends_on: []
    narrative: |
      Both format paths are allowed to skip individually, so the storyboard
      needs one assertion that cannot be satisfied by skipping. The flag is
      raised by the replacement-readback step on each path, which is reached
      only after that path's create and update succeeded, so reaching it attests
      the whole path. The phase declares no dependencies so it still grades when
      an upstream path skipped or failed.

    steps:
      - id: assert_inline_creative_path
        title: "Assert at least one inline creative path reached the replacement readback"
        task: assert_contribution
        validations:
          - check: any_of
            allowed_values: [inline_creative_path_exercised]
            description: "At least one inline creative path reached the replacement readback and saw the replacement creative on creative_approvals"
