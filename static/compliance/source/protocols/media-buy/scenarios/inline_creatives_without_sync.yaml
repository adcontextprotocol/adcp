    depends_on: [capability_discovery]
    skip_if: "!context.canonical_declaration.format_option_id || !context.canonical_declaration.publisher_domain"
    narrative: |
      Covers the seller whose first canonical declaration is publisher-catalog-backed.
      product-format-declaration.json makes such an option addressable only by the
      complete {publisher_domain, format_option_id} pair, and format-option-ref.json's
      product-local branch forbids publisher_domain outright - so a product-scoped ref
      would be unresolvable here and a correct seller would reject it with
      UNSUPPORTED_FEATURE. The ref is built from the captured declaration, which keeps
      that identity pair intact.

      Not optional: once canonical discovery captured a publisher-backed option, inline
      create, update and readback on this representation must work.

    steps:

      - id: create_buy_with_publisher_scoped_inline_creative
