  - id: legacy_format_discovery
    title: "Discover a product option through format_ids"
    optional: true
    narrative: |
      A seller may still publish products through legacy format_ids[]. This phase
      captures the product, its pricing option and its legacy format reference from
      one response. A seller publishing only canonical format_options[] has nothing
      to capture here and is graded on a canonical path instead.

      Unlike canonical discovery this probe deliberately does NOT narrow with
      filters.format_kinds. A non-projectable legacy format has no canonical mapping to
      match against, so a seller honouring that filter could return nothing and lose the
      only path on which it can be graded - which is precisely the population this
      scenario exists to cover. The filter is therefore omitted by design, not by
      oversight.

      Applicability is stated here instead: the buyer submits a 300x250 image creative
      on this path, so rank a product whose format_ids[0] accepts that creative first
      for this brief. A product selected here that cannot take a 300x250 image is
      rejected on create, and this phase is graded.

    steps:

      - id: get_products_legacy_format
        title: "Discover a product with format_ids"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-wire-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        comply_scenario: full_sales_flow
        stateful: false
        expected: |
          Return at least one product with a pricing option and a
          concrete format_id that can be used by the inline CreativeAsset.
        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_inline_creatives_without_sync_legacy_format_inline_path_get_products_legacy_format"
          buying_mode: "brief"
          brief: "Display inventory on outdoor lifestyle content. Q3 flight with buyer-supplied inline creative."
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_inline_creatives_wi-6f62b55a"
            sandbox: true
          context:
            correlation_id: "inline_creatives_without_sync--get_products_legacy"
        context_outputs:
          - path: "products[0].product_id"
            key: "legacy_product_id"
          - path: "products[0].pricing_options[0].pricing_option_id"
            key: "legacy_pricing_option_id"
          - path: "products[0].format_ids[0]"
            key: "legacy_format_id"
          # Gate key: capturing the id leaf separately means a format_ids[0] with no
          # id leaves the gate closed instead of opening it onto an unusable reference.
          - path: "products[0].format_ids[0].id"
            key: "legacy_format_id_value"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: field_present
            path: "products[0].format_ids[0].id"
            description: "EXPECTED AND NON-GATING for a canonical-only seller: format_ids is deprecated in 3.2 and a product carrying format_options[] alone is conformant, so a red here means the legacy path below is standing down and no action is required. It is graded only so an advertised legacy representation cannot skip silently."
          - check: field_present
            path: "products[0].pricing_options[0].pricing_option_id"
            description: "The captured pricing option identifies either fixed pricing or an auction option; the runner supplies the auction bid from discovery"
          - check: field_value
            path: "context.correlation_id"
            value: "inline_creatives_without_sync--get_products_legacy"
            description: "Context correlation_id returned unchanged"

