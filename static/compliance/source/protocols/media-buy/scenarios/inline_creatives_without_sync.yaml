id: media_buy_seller/inline_creatives_without_sync
version: "1.0.0"
title: "Inline media-buy creatives without sync_creatives"
category: media_buy_seller
summary: "Verifies that a seller advertising inline_creative_management accepts package creatives on create_media_buy and update_media_buy without requiring the Creative Protocol or sync_creatives."
track: media_buy
requires:
  - controller

# Gate: scenario runs only when the seller declares inline creative handling on
# the media-buy feature surface. Sellers that do not advertise the flag grade
# not_applicable. The scenario intentionally does not call sync_creatives; that
# keeps inline-only media-buy sellers from being forced into the creative
# library surface.
requires_capability:
  path: media_buy.features.inline_creative_management
  equals: true

required_tools:
  - get_products
  - create_media_buy
  - update_media_buy
  - get_media_buys

narrative: |
  Some sales agents do not expose the Creative Protocol or a reusable creative
  library. They still accept creative bodies inline on media-buy operations. For
  those sellers, the buyer should not call sync_creatives; it should put
  CreativeAsset objects in packages[].creatives on create_media_buy and
  update_media_buy.

  This scenario walks that path end-to-end:

  1. Discover that inline_creative_management is true.
  2. Create a media buy with packages[].creatives populated.
  3. Replace the package's inline creative through update_media_buy.
  4. Read the media buy back and confirm the replacement approval state is visible.

  The scenario exercises each format representation the seller actually publishes.
  There are four execution paths. One canonical discovery decides between the three
  canonical shapes; the legacy path has its own discovery and runs independently:

  - canonical, product-local option: selected via packages[].format_option_refs with
    scope "product"
  - canonical, publisher-catalog option: selected via packages[].format_option_refs
    with scope "publisher", carrying the full {publisher_domain, format_option_id} pair
  - canonical, no stable format_option_id: no selector at all, format_kind alone
  - legacy format_ids[]

  Exactly one canonical path runs for a given seller - the three gates are mutually
  exclusive on the captured declaration - and the legacy path runs independently of all
  three. Each path creates its own media buy so the readback checks prove each
  replacement persisted independently.

  Every canonical gate and every canonical buy come from the SAME get_products response,
  because there is one canonical discovery rather than one per shape. Brief-mode
  discovery carries no ordering or stability guarantee and nothing here depends on one:
  a seller whose results reorder, or whose canonical shape differs between calls, is
  never failed for it.

  Reading the report: both discovery phases - canonical_format_discovery and
  legacy_format_discovery - are optional, and a seller publishing one representation
  WILL see the other's discovery step go red. That is expected and takes no action:
  those steps do not gate the run, and the red is how the probe keeps a path it cannot
  serve from executing. A red step inside one of the four execution phases is the
  opposite: that representation was advertised and the seller must make inline create,
  update and readback work on it. The closing assert_contribution is the only coverage
  gate: it fails when no path completed.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - accepts_inline_creatives
  examples:
    - "Media-buy sellers that attach creatives directly to buys"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  controller_seeding: true
  description: |
    Seller advertises media_buy.features.inline_creative_management: true and
    accepts package-scoped CreativeAsset objects on create_media_buy and
    update_media_buy. The seller does not need to implement sync_creatives.

    Applicability - first product and first declaration. This is a controlled fixture:
    every path captures products[0], its pricing_options[0] and, on the canonical side,
    format_options[0], and buys with a fixed 300x250 image creative. So the seller must
    rank a product whose FIRST declaration accepts that creative, and whose first
    pricing option is fixed-price, first for this brief. filters.format_kinds narrows
    which products are returned; it does not order format_options[], so it cannot
    substitute for that. A canonical-only catalog whose first declaration is, say,
    video still fails - the buy is rejected and the closing contribution check fails.

    Known limitation, not addressed here: selecting a declaration by kind and
    dimensions independently of catalog order would need a selection construct the
    storyboard DSL does not have. Tracked separately rather than widening this fix.
  test_kit: "test-kits/acme-outdoor.yaml"

fixtures:
  accounts:
    - account_id: "acct_acmeoutdoor_example_sandbox_547235310e65"
      fixture:
        brand:
          domain: "acmeoutdoor.example"
        operator: "pinnacle-agency.example"
        operator_unit:
          id: "compliance-media_buy_seller_inline_creatives_wi-6f62b55a"
        billing: "operator"
        status: "active"
        sandbox: true
    - account_id: "acct_acmeoutdoor_example_live_7f31cc7a1428"
      fixture:
        brand:
          domain: "acmeoutdoor.example"
        operator: "pinnacle-agency.example"
        operator_unit:
          id: "compliance-media_buy_seller_inline_creatives_wi-6f62b55a"
        billing: "operator"
        status: "active"
        sandbox: false

# Scope is the one field a format_option_ref needs that no get_products response
# carries, so it is seeded here as a run-start constant and injected per path with
# context_inputs. Storyboard-root context values must be scalars.
context:
  format_option_scope_product: "product"
  format_option_scope_publisher: "publisher"

phases:
  - id: capability_discovery
    title: "Discover inline creative support"
    narrative: |
      The buyer confirms the seller accepts inline package creatives before
      exercising any of the accepted product-format paths.

    steps:
      - id: get_capabilities
        title: "Check inline creative feature"
        task: get_adcp_capabilities
        schema_ref: "protocol/get-adcp-capabilities-request.json"
        response_schema_ref: "protocol/get-adcp-capabilities-response.json"
        doc_ref: "/protocol/get_adcp_capabilities"
        comply_scenario: capability_discovery
        stateful: false
        expected: |
          Return capabilities declaring media_buy support and
          media_buy.features.inline_creative_management: true.
        sample_request:
          context:
            correlation_id: "inline_creatives_without_sync--get_capabilities"
        validations:
          - check: response_schema
            description: "Response matches get-adcp-capabilities-response.json schema"
          - check: field_present
            path: "supported_protocols"
            description: "Agent declares supported protocols"
          - check: field_value
            path: "media_buy.features.inline_creative_management"
            value: true
            description: "Seller advertises inline creative handling on media-buy operations"
          - check: field_value
            path: "context.correlation_id"
            value: "inline_creatives_without_sync--get_capabilities"
            description: "Context correlation_id returned unchanged"

  # ONE canonical discovery, so every canonical shape is decided from a single
  # get_products response: the product, pricing option and format declaration a path
  # buys with are always the ones that opened its gate. Splitting this per shape made
  # the discriminating field (format_option_id, which product-format-declaration.json
  # marks optional) a MANDATORY capture in one probe and a required absence in another,
  # so a seller answering one brief with different canonical shapes across calls had no
  # gate open at all.
  #
  # The whole declaration is captured as one object. Every capture here resolves for any
  # canonical product, so there is no optional capture to fail the step, and the three
  # execution phases below discriminate with skip_if reading into that object.
  #
  # optional, and deliberately WITHOUT branch_set: a seller publishing only legacy
  # format_ids[] has nothing to capture here, and that is conformant - Product requires
  # format_ids, format_options, or both. `optional: true` already keeps an unproductive
  # capture from failing the storyboard. Declaring a branch_set would additionally
  # regrade a peer's failures once any one branch completed, hiding a real
  # per-representation diagnostic; the execution phases below are what must stay graded.
  - id: canonical_format_discovery
    title: "Discover a product option through format_options"
    optional: true
    narrative: |
      A 3.1+ seller may publish products through format_options[]. This phase captures
      the product, its pricing option, its canonical format_kind and the whole first
      format declaration from one response.

      format_option_id is optional on a declaration (product-format-declaration.json
      requires only format_kind and params), and publisher_domain is present only on
      publisher-catalog-backed options. Neither is captured on its own, because a
      capture that does not resolve fails the step and discards every other capture with
      it. Capturing the declaration whole keeps those optional fields intact without
      making either one a precondition.

      Expected non-gating diagnostic: a seller publishing only legacy format_ids[] has
      nothing to capture here, so this step goes red and the legacy path grades it
      instead. No action is required for that red.

    steps:

      - id: get_products_canonical_format
        title: "Discover a product with format_options"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-wire-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        comply_scenario: full_sales_flow
        stateful: false
        expected: |
          Return at least one product with a pricing option and a
          format_options[] declaration that can be used by the inline CreativeAsset.
        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_inline_creatives_without_sync_canonical_format_discovery_get_products_canonical_format"
          buying_mode: "brief"
          brief: "Display inventory on outdoor lifestyle content. Q3 flight with buyer-supplied inline creative."
          filters:
            # Narrows to products that ACCEPT the image kind. This does not order
            # format_options[], so it does not guarantee that format_options[0] is the
            # image declaration - see the first-declaration applicability limit in
            # prerequisites. It only keeps a product that accepts no image at all out
            # of the running.
            format_kinds: ["image"]
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_inline_creatives_wi-6f62b55a"
            sandbox: true
          context:
            correlation_id: "inline_creatives_without_sync--get_products_canonical"
        context_outputs:
          - path: "products[0].product_id"
            key: "canonical_product_id"
          - path: "products[0].pricing_options[0].pricing_option_id"
            key: "canonical_pricing_option_id"
          - path: "products[0].format_options[0].format_kind"
            key: "canonical_format_kind"
          - path: "products[0].format_options[0]"
            key: "canonical_declaration"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: field_present
            path: "products[0].format_options[0].format_kind"
            description: "Product declares a canonical format option for inline creative validation"
          # Mismatch detector, not a selector. This phase is optional, so a non-image
          # first declaration fails here WITHOUT gating the run - and because a failed
          # step publishes no context, the three canonical paths below all stand down
          # rather than buying a 300x250 image against, say, a video declaration. A
          # seller whose only canonical declaration is non-image therefore makes zero
          # creates and fails the closing coverage check, which is the honest result:
          # this fixture cannot grade that catalog. Selecting a matching declaration
          # regardless of catalog order is the separate limitation named in
          # prerequisites; this check does not provide it.
          - check: field_value
            path: "products[0].format_options[0].format_kind"
            value: "image"
            description: "First canonical declaration accepts the fixed 300x250 image creative this scenario buys with; a different kind stands the canonical paths down instead of buying a mismatched creative"
          - check: field_present
            path: "products[0].pricing_options[0].pricing_option_id"
            description: "The captured pricing option identifies either fixed pricing or an auction option; the runner supplies the auction bid from discovery"
          - check: field_value
            path: "context.correlation_id"
            value: "inline_creatives_without_sync--get_products_canonical"
            description: "Context correlation_id returned unchanged"

  - id: canonical_unnamed_option_inline_path
    title: "Inline creative path using an unnamed format option"
    depends_on: [capability_discovery]
    # Also stands down when canonical discovery captured nothing at all: a dotted
    # reference onto an absent key is falsy, so without the existence clause this phase
    # would run for a legacy-only seller and fail on unresolved context.
    skip_if: "!context.canonical_declaration || context.canonical_declaration.format_option_id"
    narrative: |
      Covers the seller whose first canonical declaration carries no stable
      format_option_id - legal, because product-format-declaration.json requires only
      format_kind and params. There is no id to select with, and none is needed:
      format_kind alone routes the creative to that single declaration. The package
      therefore carries no format_option_refs[] at all.

      Not optional: once canonical discovery captured a declaration with no id, inline
      create, update and readback on this representation must work.

    steps:

      - id: create_buy_with_unnamed_option_inline_creative
        title: "Create media buy with unnamed-option inline creative"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-wire-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        comply_scenario: create_media_buy
        stateful: true
        expected: |
          Accept the media buy and attach the inline creative to the package.
          The response should include the package and preserve package context.
        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_inline_creatives_wi-6f62b55a"
            sandbox: true
          idempotency_key: "$generate:uuid_v4#inline_creatives_without_sync_create_unnamed_option"
          start_time: "asap"
          end_time: "2099-09-30T23:59:59Z"
          packages:
            - product_id: "$context.canonical_product_id"
              budget: 7500
              pricing_option_id: "$context.canonical_pricing_option_id"
              context:
                buyer_ref: "inline-creative-unnamed-option-line-001"
              creatives:
                - creative_id: "acme-inline-unnamed-option-display-v1"
                  name: "Acme Outdoor inline unnamed-option display v1"
                  format_kind: "$context.canonical_format_kind"
                  assets:
                    image:
                      asset_type: "image"
                      url: "https://test-assets.adcontextprotocol.org/acme-outdoor/hero-master.jpg"
                      width: 300
                      height: 250
                      mime_type: "image/jpeg"
                    click_url:
                      asset_type: "url"
                      url: "https://acmeoutdoor.example/q3"
          context:
            correlation_id: "inline_creatives_without_sync--create_unnamed_option"
        context_outputs:
          - path: "media_buy_id"
            key: "unnamed_option_media_buy_id"
          - path: "packages[0].package_id"
            key: "unnamed_option_package_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json schema"
          - check: field_present
            path: "media_buy_id"
            description: "Seller assigns a media_buy_id"
          - check: field_present
            path: "packages[0].package_id"
            description: "Seller assigns a package_id"
          - check: field_value
            path: "packages[0].context.buyer_ref"
            value: "inline-creative-unnamed-option-line-001"
            description: "Created package echoes package-level context for correlation"
          - check: field_value
            path: "context.correlation_id"
            value: "inline_creatives_without_sync--create_unnamed_option"
            description: "Context correlation_id returned unchanged"

      - id: update_buy_with_replacement_unnamed_option_inline_creative
        title: "Replace unnamed-option inline creative"
        task: update_media_buy
        schema_ref: "media-buy/update-media-buy-request.json"
        response_schema_ref: "media-buy/update-media-buy-wire-response.json"
        doc_ref: "/media-buy/task-reference/update_media_buy"
        comply_scenario: media_buy_lifecycle
        stateful: true
        expected: |
          Replace the package's inline creative body with the new creative_id and
          return the affected package. The replacement creative is verified on
          the standardized creative_approvals readback surface below.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_inline_creatives_wi-6f62b55a"
            sandbox: true
          media_buy_id: "$context.unnamed_option_media_buy_id"
          packages:
            - package_id: "$context.unnamed_option_package_id"
              creatives:
                - creative_id: "acme-inline-unnamed-option-display-v2"
                  name: "Acme Outdoor inline unnamed-option display v2"
                  format_kind: "$context.canonical_format_kind"
                  assets:
                    image:
                      asset_type: "image"
                      url: "https://test-assets.adcontextprotocol.org/acme-outdoor/hero-alt.jpg"
                      width: 300
                      height: 250
                      mime_type: "image/jpeg"
                    click_url:
                      asset_type: "url"
                      url: "https://acmeoutdoor.example/q3-refresh"
          idempotency_key: "$generate:uuid_v4#inline_creatives_without_sync_update_unnamed_option"
          context:
            correlation_id: "inline_creatives_without_sync--update_unnamed_option"
        validations:
          - check: response_schema
            description: "Response matches update-media-buy-response.json schema"
          - check: field_equals_context
            path: "media_buy_id"
            context_key: "unnamed_option_media_buy_id"
            description: "Update response references the same media buy"
          - check: field_equals_context
            path: "affected_packages[0].package_id"
            context_key: "unnamed_option_package_id"
            description: "Update response includes the affected package"
          - check: field_contains
            path: "affected_packages[*]"
            value:
              package_id: "$context.unnamed_option_package_id"
              product_id: "$context.canonical_product_id"
              pricing_option_id: "$context.canonical_pricing_option_id"
              budget: 7500
              context:
                buyer_ref: "inline-creative-unnamed-option-line-001"
            description: "Affected package includes complete post-update package state for the unnamed-option inline creative line"
          - check: field_value
            path: "context.correlation_id"
            value: "inline_creatives_without_sync--update_unnamed_option"
            description: "Context correlation_id returned unchanged"

      - id: get_unnamed_option_media_buy_after_inline_replacement
        title: "Read unnamed-option media buy after inline replacement"
        contributes_to: inline_creative_path_exercised
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        comply_scenario: media_buy_lifecycle
        stateful: true
        expected: |
          Return the unnamed-option-path media buy with package approval state for
          the replacement inline creative. The full CreativeAsset body is not
          required on this read surface.

        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_inline_creatives_wi-6f62b55a"
            sandbox: true
          media_buy_ids:
            - "$context.unnamed_option_media_buy_id"
          context:
            correlation_id: "inline_creatives_without_sync--get_unnamed_option_media_buy"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json schema"
          - check: field_equals_context
            path: "media_buys[0].media_buy_id"
            context_key: "unnamed_option_media_buy_id"
            description: "Read response returns the created unnamed-option media buy"
          - check: field_equals_context
            path: "media_buys[0].packages[0].package_id"
            context_key: "unnamed_option_package_id"
            description: "Read response returns the created unnamed-option package"
          - check: field_value
            path: "media_buys[0].packages[0].creative_approvals[0].creative_id"
            value: "acme-inline-unnamed-option-display-v2"
            description: "Read response reflects the unnamed-option replacement inline creative on the package approval-state surface"
          - check: field_value
            path: "context.correlation_id"
            value: "inline_creatives_without_sync--get_unnamed_option_media_buy"
            description: "Context correlation_id returned unchanged"

  - id: canonical_product_scoped_inline_path
    title: "Inline creative path using a product-local format option ref"
    depends_on: [capability_discovery]
    skip_if: "!context.canonical_declaration.format_option_id || context.canonical_declaration.publisher_domain"
    narrative: |
      Covers the seller whose first canonical declaration carries a stable
      format_option_id and no publisher_domain - a product-local option. The package
      selects it with format_option_refs[], built from the captured declaration so the
      id is exactly the one discovery observed.

      Not optional: once canonical discovery captured a product-local option, inline
      create, update and readback on this representation must work.

    steps:

      - id: create_buy_with_product_scoped_inline_creative
        title: "Create media buy with product-scoped inline creative"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-wire-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        comply_scenario: create_media_buy
        stateful: true
        expected: |
          Accept the media buy and attach the inline creative to the package.
          The response should include the package and preserve package context.
        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_inline_creatives_wi-6f62b55a"
            sandbox: true
          idempotency_key: "$generate:uuid_v4#inline_creatives_without_sync_create_product_scoped"
          start_time: "asap"
          end_time: "2099-09-30T23:59:59Z"
          packages:
            - product_id: "$context.canonical_product_id"
              budget: 7500
              pricing_option_id: "$context.canonical_pricing_option_id"
              format_option_refs:
                # The whole captured declaration becomes the ref. format-option-ref.json
                # declares additionalProperties: true on both branches, so carrying the
                # declaration's own fields is intended tolerance, not abuse; it keeps the
                # {publisher_domain, format_option_id} identity pair coherent rather than
                # rebuilding it from separately captured leaves. `scope` is the one field
                # no response supplies. Whole-object substitution replaces this node
                # outright, so there is no way to author a sibling `scope` beside it
                # without an object-spread or projection construct the storyboard DSL
                # does not have - hence the scope-only context_inputs below. That is a
                # deliberate construction, not a runner defect. Dynamically verified against published
                # @adcp/sdk 15.8.1 and 15.9.2: context_inputs structuredClones the request
                # before writing, so the captured declaration is never mutated.
                - "$context.canonical_declaration"
              context:
                buyer_ref: "inline-creative-product-scoped-line-001"
              creatives:
                - creative_id: "acme-inline-product-scoped-display-v1"
                  name: "Acme Outdoor inline product-scoped display v1"
                  format_kind: "$context.canonical_format_kind"
                  assets:
                    image:
                      asset_type: "image"
                      url: "https://test-assets.adcontextprotocol.org/acme-outdoor/hero-master.jpg"
                      width: 300
                      height: 250
                      mime_type: "image/jpeg"
                    click_url:
                      asset_type: "url"
                      url: "https://acmeoutdoor.example/q3"
          context:
            correlation_id: "inline_creatives_without_sync--create_product_scoped"
        context_inputs:
          - key: "format_option_scope_product"
            inject_at: "packages[0].format_option_refs[0].scope"
        context_outputs:
          - path: "media_buy_id"
            key: "product_scoped_media_buy_id"
          - path: "packages[0].package_id"
            key: "product_scoped_package_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json schema"
          - check: field_present
            path: "media_buy_id"
            description: "Seller assigns a media_buy_id"
          - check: field_present
            path: "packages[0].package_id"
            description: "Seller assigns a package_id"
          - check: field_value
            path: "packages[0].context.buyer_ref"
            value: "inline-creative-product-scoped-line-001"
            description: "Created package echoes package-level context for correlation"
          - check: field_value
            path: "context.correlation_id"
            value: "inline_creatives_without_sync--create_product_scoped"
            description: "Context correlation_id returned unchanged"

      - id: update_buy_with_replacement_product_scoped_inline_creative
        title: "Replace product-scoped inline creative"
        task: update_media_buy
        schema_ref: "media-buy/update-media-buy-request.json"
        response_schema_ref: "media-buy/update-media-buy-wire-response.json"
        doc_ref: "/media-buy/task-reference/update_media_buy"
        comply_scenario: media_buy_lifecycle
        stateful: true
        expected: |
          Replace the package's inline creative body with the new creative_id and
          return the affected package. The replacement creative is verified on
          the standardized creative_approvals readback surface below.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_inline_creatives_wi-6f62b55a"
            sandbox: true
          media_buy_id: "$context.product_scoped_media_buy_id"
          packages:
            - package_id: "$context.product_scoped_package_id"
              creatives:
