      every path is not. This assertion is the scenario's only coverage gate: it fails
      when no path completed create, update and readback, so a run in which every path
      stood down cannot be graded as passing.

    steps:
      - id: assert_inline_creative_path
        title: "Require a completed inline creative path"
        task: assert_contribution
        stateful: false
        expected: |
          At least one of canonical_product_scoped_inline_path,
          canonical_publisher_scoped_inline_path,
          canonical_unnamed_option_inline_path or legacy_format_inline_path
          contributed inline_creative_path_exercised.
        validations:
          - id: inline_creative_path_coverage
            check: any_of
            allowed_values: [inline_creative_path_exercised]
            description: "No format path completed create, update, and readback. If a path above failed, that failure is the cause - fix it there; this check is only the summary. If every path stood down instead, neither discovery gate closed on a usable product: the canonical paths need products[0] of the canonical get_products response to carry a pricing option and a format_options[0] declaration, and the legacy path needs products[0] of its own response to carry a pricing option and format_ids[0].id. A product that declares formats can still close every gate by returning no pricing option first."
