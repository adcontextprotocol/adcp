id: media_buy_seller/governance_denied_recovery
version: "1.1.0"
title: "Seller accepts corrected buy after governance denial"
category: media_buy_seller
summary: "Verifies that a buyer can recover from GOVERNANCE_DENIED by shrinking the buy to fit the amended plan, obtaining a fresh intent approval, and retrying."
track: media_buy
requires:
  - multi_agent
default_agent: sales
required_tools:
  - sync_plans
  - sync_accounts
  - sync_governance
  - get_products
  - check_governance
  - create_media_buy

# Capability gate: the denial comes from the seller's own online execution
# check, so this runs only for sellers claiming signed-context enforcement with
# an online execution check for create_media_buy (the 3.2 certification gate).
# Other sellers grade not_applicable.
requires_capability:
  path: adcp.governance_enforcement.tasks
  contains:
    task: create_media_buy
    modes:
      - signed_context
      - online_execution_check

narrative: |
  GOVERNANCE_DENIED is a correctable error, not a dead end. The buyer must be able to
  read the denial findings, adjust the media buy, and retry. This scenario exercises the
  full loop. The buyer obtains an approved intent for a $25K buy under a $100K plan, the
  plan owner then cuts the plan to $10K, and the seller's own execution check denies the
  $25K buy. The buyer shrinks the buy to $8K, obtains a fresh intent approval for the
  corrected request, and the seller accepts it.

  Every create_media_buy carries an approved intent token. A request without
  `governance_context` is rejected with `PERMISSION_DENIED` before any governance
  consultation, so it cannot exercise denial or recovery.

  The seller must propagate the governance findings unchanged so the buyer can identify
  exactly which constraint was violated (budget authority, brand policy, etc.) and
  correct it.

  This scenario requires a runner that can route calls to at least two logical
  agents: `sales` for the seller under test and `governance` for plan setup,
  intent checks, and plan amendment. Single-agent runners should only include
  this storyboard when the endpoint under test deliberately combines seller and
  governance behavior in one tenant; otherwise it belongs in the
  governance-aware-seller multi-agent suite.

  By default, the governance agent is the training agent at test-agent.adcontextprotocol.org.
  Override by supplying a different `governance_agent_url` in the run's initial context,
  and override `seller_agent_url` with the exact sales-agent endpoint the runner uses.

context:
  governance_agent_url: "https://test-agent.adcontextprotocol.org"
  seller_agent_url: "https://seller.example.com"

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - governance_aware
  examples:
    - "Any media buy seller with governance support"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    A multi-agent runner with `sales` and `governance` agents. The governance
    agent supports plan synchronization and amendment, intent checks, and
    execution checks. The sales agent supports governance registration and
    media-buy creation with an online execution check. Override
    `seller_agent_url` in the initial context with the exact sales-agent
    endpoint used by the runner.
  test_kit: "test-kits/acme-outdoor.yaml"

phases:
  - id: governance_plan_setup
    title: "Set up the governance plan"
    narrative: |
      Create a governance plan with a $100K budget. The initial $25K buy fits this plan,
      so its intent check will be approved.

    steps:
      - id: sync_plans
        title: "Create governance plan"
        agent: governance
        task: sync_plans
        schema_ref: "governance/sync-plans-request.json"
        response_schema_ref: "governance/sync-plans-response.json"
        doc_ref: "/governance/campaign/tasks/sync_plans"
        stateful: true
        expected: |
          The governance agent acknowledges the plan.
        sample_request:
          idempotency_key: "$generate:uuid_v4#governance_denied_recovery_sync_plans"
          plans:
            - plan_id: "comply-gov-recovery-plan"
              brand:
                domain: "acmeoutdoor.example"
              objectives: "Denial and recovery validation — budget later reduced by the plan owner"
              budget:
                total: 100000
                currency: "USD"
                reallocation_threshold: 100000
              flight:
                start: "2020-01-01T00:00:00Z"
                end: "2099-06-30T23:59:59Z"
              countries: ["US"]
        context_outputs:
          - name: plan_id
            path: "plans[0].plan_id"
        validations:
          - check: response_schema
            description: "Response matches sync-plans-response.json schema"

  - id: seller_setup
    title: "Account and governance registration on seller"
    steps:
      - id: sync_accounts
        title: "Establish account with seller"
        agent: sales
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: |
          Return the account with account_id active.
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
              payment_terms: "net_30"
          idempotency_key: "$generate:uuid_v4#media_buy_seller_governance_denied_recovery_seller_setup_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json schema"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a platform-assigned ID"

      - id: sync_governance
        title: "Register governance agent with seller"
        agent: sales
        task: sync_governance
        schema_ref: "account/sync-governance-request.json"
        response_schema_ref: "account/sync-governance-response.json"
        doc_ref: "/accounts/tasks/sync_governance"
        stateful: true
        expected: |
          Acknowledge the governance agent registration.
        sample_request:
          accounts:
            - account:
                brand:
                  domain: "acmeoutdoor.example"
                operator: "pinnacle-agency.example"
              governance_agents:
                - url: "$context.governance_agent_url"
                  authentication:
                    schemes: ["Bearer"]
                    credentials: "gov-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          idempotency_key: "$generate:uuid_v4#media_buy_seller_governance_denied_recovery_seller_setup_sync_governance"
        validations:
          - check: response_schema
            description: "Response matches sync-governance-response.json schema"

  - id: buy_denied
    title: "Approved intent, amended plan, denied execution"
    narrative: |
      The buyer authorizes a $25K request at intent time. The plan owner then cuts
      the plan budget to $10K, so the seller's execution check is denied.
    steps:
      - id: get_products_brief
        title: "Discover products"
        agent: sales
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        comply_scenario: full_sales_flow
        stateful: false
        expected: |
          Return products matching the brief.
        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_governance_denied_recovery_buy_denied_get_products_brief"
          buying_mode: "brief"
          brief: "Display inventory on outdoor lifestyle content. Q2 flight."
          filters:
            is_fixed_price: true
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
        context_outputs:
          - path: "products[0].product_id"
            key: "product_id"
          - path: "products[0].pricing_options[0].pricing_option_id"
            key: "pricing_option_id"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: field_present
            path: "products"
            description: "Response contains products"
          - check: field_present
            path: "products[0].pricing_options[0].fixed_price"
            description: "The captured pricing option is fixed-price; fixed-price storyboards do not send bid_price"

      - id: check_governance_intent
        title: "Authorize the $25K buy"
        agent: governance
        task: check_governance
        schema_ref: "governance/check-governance-request.json"
        response_schema_ref: "governance/check-governance-response.json"
        doc_ref: "/governance/campaign/tasks/check_governance"
        stateful: true
        expected: |
          The $25K request fits the $100K plan, so the intent check approves it.
        sample_request:
          plan_id: "$context.plan_id"
          caller: "https://pinnacle-agency.example"
          target_agent: "$context.seller_agent_url"
          tool: "create_media_buy"
          purchase_type: "media_buy"
          proposed_commitment:
            amount: 25000
            currency: "USD"
          payload:
            brand:
              domain: "acmeoutdoor.example"
            account:
              brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
            total_budget:
              amount: 25000
              currency: "USD"
            start_time: "asap"
            end_time: "2099-06-30T23:59:59Z"
            packages:
              - product_id: "$context.product_id"
                budget: 25000
                pricing_option_id: "$context.pricing_option_id"
            idempotency_key: "$generate:uuid_v4#governance_denied_recovery_create_media_buy_denied"
        context_outputs:
          - name: governance_context
            path: "governance_context"
        validations:
          - check: response_schema
            description: "Approved response matches check-governance-response.json"
          - check: field_value
            path: "verdict"
            value: "approved"
            description: "The intent check approves the exact request"
          - check: field_present
            path: "governance_context"
            description: "Approval supplies the authorization context sent to the seller"

      - id: sync_plans_amend_budget
        title: "Plan owner reduces the plan budget"
        agent: governance
        task: sync_plans
        schema_ref: "governance/sync-plans-request.json"
        response_schema_ref: "governance/sync-plans-response.json"
        doc_ref: "/governance/campaign/tasks/sync_plans"
        stateful: true
        expected: |
          The governance agent applies the amendment immediately. Later checks
          are evaluated against the $10K plan.
        sample_request:
          idempotency_key: "$generate:uuid_v4#governance_denied_recovery_sync_plans_amend"
          # Same authored plan_id as the setup step (not $context.plan_id) so a
          # runner that rewrites plan ids, e.g. with a per-run suffix, rewrites
          # both steps identically.
          plans:
            - plan_id: "comply-gov-recovery-plan"
              brand:
                domain: "acmeoutdoor.example"
              objectives: "Denial and recovery validation — budget later reduced by the plan owner"
              budget:
                total: 10000
                currency: "USD"
                reallocation_threshold: 10000
              flight:
                start: "2020-01-01T00:00:00Z"
                end: "2099-06-30T23:59:59Z"
              countries: ["US"]
        validations:
          - check: response_schema
            description: "Response matches sync-plans-response.json schema"

      - id: create_media_buy_denied
        title: "Attempt $25K buy — execution check denies"
        agent: sales
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        comply_scenario: create_media_buy
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        expected: |
          The intent token is valid, but the seller's execution check is denied
          because $25K exceeds the amended $10K plan. The seller does not commit
          the buy and returns GOVERNANCE_DENIED with the governance findings
          explaining which constraint was exceeded.

        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          total_budget:
            amount: 25000
            currency: "USD"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          packages:
            - product_id: "$context.product_id"
              budget: 25000
              pricing_option_id: "$context.pricing_option_id"
          idempotency_key: "$generate:uuid_v4#governance_denied_recovery_create_media_buy_denied"
          governance_context: "$context.governance_context"
          context:
            correlation_id: "governance_denied_recovery--create_media_buy_denied"
        validations:
          - check: error_code
            value: "GOVERNANCE_DENIED"
            description: "Error code is GOVERNANCE_DENIED"
          - check: field_value
            path: "context.correlation_id"
            value: "governance_denied_recovery--create_media_buy_denied"
            description: "Response echoes context.correlation_id verbatim on error responses (echo contract applies to both success and failure)"

  - id: buy_retried
    title: "Corrected buy within the amended plan — governance approves"
    narrative: |
      The buyer reads the denial findings, shrinks the buy to $8K (within the amended
      $10K plan), obtains a fresh intent approval for the corrected request, and
      retries with a fresh idempotency_key. The seller's execution check now passes.

    steps:
      - id: check_governance_intent_retry
        title: "Authorize the corrected $8K buy"
        agent: governance
        task: check_governance
        schema_ref: "governance/check-governance-request.json"
        response_schema_ref: "governance/check-governance-response.json"
        doc_ref: "/governance/campaign/tasks/check_governance"
        stateful: true
        expected: |
          The $8K request fits the amended $10K plan, so the intent check approves it.
        sample_request:
          plan_id: "$context.plan_id"
          caller: "https://pinnacle-agency.example"
          target_agent: "$context.seller_agent_url"
          tool: "create_media_buy"
          purchase_type: "media_buy"
          proposed_commitment:
            amount: 8000
            currency: "USD"
          payload:
            brand:
              domain: "acmeoutdoor.example"
            account:
              brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
            total_budget:
              amount: 8000
              currency: "USD"
            start_time: "asap"
            end_time: "2099-06-30T23:59:59Z"
            packages:
              - product_id: "$context.product_id"
                budget: 8000
                pricing_option_id: "$context.pricing_option_id"
            idempotency_key: "$generate:uuid_v4#governance_denied_recovery_create_media_buy_retry"
        context_outputs:
          - name: retry_governance_context
            path: "governance_context"
        validations:
          - check: response_schema
            description: "Approved response matches check-governance-response.json"
          - check: field_value
            path: "verdict"
            value: "approved"
            description: "The intent check approves the exact request"
          - check: field_present
            path: "governance_context"
            description: "Approval supplies the authorization context sent to the seller"

      - id: create_media_buy_retry
        title: "Retry with $8K — approved"
        agent: sales
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        comply_scenario: create_media_buy
        stateful: true
        expected: |
          The buy succeeds. The seller's execution check approves because $8K fits the
          amended $10K plan. The seller returns a media_buy_id.

        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          total_budget:
            amount: 8000
            currency: "USD"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          packages:
            - product_id: "$context.product_id"
              budget: 8000
              pricing_option_id: "$context.pricing_option_id"
          idempotency_key: "$generate:uuid_v4#governance_denied_recovery_create_media_buy_retry"
          governance_context: "$context.retry_governance_context"
        context_outputs:
          - name: media_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json schema"
          - check: field_present
            path: "media_buy_id"
            description: "Seller returns a media_buy_id after governance approves"
