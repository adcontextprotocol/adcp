id: media_buy_seller/outcome_target
version: "1.1.1"
title: "Seller solves for budget from a structured outcome target"
category: media_buy_seller
summary: "Verifies criteria.outcome_target reverse forecasting: a metric or event goal plus desired volume answered with total_budget_guidance and a forecast whose points carry the goal's key in metrics, and a cost_per target answered in commercial_terms.bidding.cost_per with the buyer's strength and currency, or rejected when the products are not priced in that currency."
track: media_buy
required_tools:
  - request_proposals

requires_capability:
  path: media_buy.outcome_target
  equals: true

narrative: |
  Forward planning fixes dates and budget and asks for a forecast. Reverse
  forecasting inverts the question: "I need 10,000 clicks — what does my budget
  need to be?" Sellers declaring `media_buy.outcome_target` parse the compact
  goal in `criteria.outcome_target` — a delivery metric in the same
  forecastable-metric vocabulary forecast points report, or a conversion event
  in the event-type vocabulary — and solve for budget.

  The answer contract this scenario grades: every returned proposal carries
  `total_budget_guidance` (currency plus at least a recommended figure) and a
  forecast whose points carry the goal's metric or event key in `metrics`,
  with `forecast_range_unit` `clicks` structuring a clicks-goal curve and
  `conversions` structuring an event-goal curve. Because the metric and event
  goal vocabularies equal the forecast-metrics vocabulary, every permitted
  goal has a defined answer — there is no goal a conformant seller can accept
  and then answer with nothing. A vendor_metric goal is answered in
  vendor_metric_values[] instead; see
  media_buy_seller/outcome_target_vendor_metric.

  A buyer can also state the cost it will pay per result in
  `outcome_target.cost_per`, with a budget range, a volume, or both. The seller
  answers in `commercial_terms.bidding.cost_per` with the cost it can actually
  plan to: the amount is never below the ask, the strength stays the buyer's,
  and the answer is denominated in `cost_per.currency`. The answering phases
  run for sellers advertising fixed media-buy cost caps in
  `features.bidding_policy`; the currency rejection runs for every seller
  declaring `media_buy.outcome_target`. Sellers never convert
  currency, so a cost target in a currency the requested products are not
  priced in is rejected with `INVALID_REQUEST` naming
  `criteria.outcome_target.cost_per`.

  An outcome_target is a planning input, not a delivery guarantee: obligations
  arise only at proposal finalization, and the guidance band is indicative in
  exactly the way draft pricing is.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - accepts_briefs
    - generates_proposals
  examples:
    - "Full-service publisher with a planning engine"
    - "Retail media network quoting budgets against conversion goals"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The caller needs a brand identity and operator credentials. The runner
    seeds a fixed-price USD product, so the volume phases have a
    deterministic rate card and the currency rejection has a USD-only
    product, and an auction-priced USD product (floor 1.50), so a seller
    that applies cost caps only to auction-priced options can plan the cost
    phases.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "outcome_target_video"
      name: "Outcome Target Planning Video"
      description: "Compliance fixture: fixed-price video inventory for reverse-forecast planning."
      delivery_type: "non_guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "outcome_target_video_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
    - product_id: "outcome_target_auction_video"
      name: "Outcome Target Auction Video"
      description: "Compliance fixture: auction-priced video inventory for cost-target planning."
      delivery_type: "non_guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "outcome_target_auction_video_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
  pricing_options:
    - product_id: "outcome_target_video"
      pricing_option_id: "outcome_target_fixed"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 40.0
    - product_id: "outcome_target_auction_video"
      pricing_option_id: "outcome_target_auction_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 1.50

phases:
  - id: setup
    title: "Account setup"
    steps:
      - id: sync_accounts
        title: "Establish account"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: |
          Return the account with account_id and status active.

        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
              payment_terms: "net_30"

          idempotency_key: "$generate:uuid_v4#media_buy_seller_outcome_target_setup_sync_accounts"
          context:
            correlation_id: "outcome_target--sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json schema"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a platform-assigned ID"
          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "outcome_target--sync_accounts"
            description: "Context correlation_id returned unchanged"

  - id: metric_goal
    title: "Solve for budget from a clicks goal"
    depends_on: [setup]
    narrative: |
      The buyer states the outcome — 10,000 clicks — and the seller answers
      with budget guidance and a clicks-structured forecast whose points carry
      the goal's metric key.
    steps:
      - id: request_clicks_goal
        title: "Request proposals for a 10,000-click target"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        expected: |
          Return outcome proposed with at least one proposal carrying:
          - total_budget_guidance with currency and a recommended figure
          - forecast with forecast_range_unit "clicks" whose points carry
            metrics.clicks

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_outcome_target_metric_goal_request_clicks_goal"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brief: "Drive qualified traffic to the Trail Pro 3000 launch page using the seeded video placement."
          criteria:
            product_ids: ["outcome_target_video"]
            outcome_target:
              goal:
                kind: "metric"
                metric: "clicks"
              volume: 10000
          context:
            correlation_id: "outcome_target--request_clicks_goal"
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json schema"
          - check: field_value
            path: "outcome"
            value: "proposed"
            description: "The seller returns at least one proposal"
          - check: field_present
            path: "proposals[0].total_budget_guidance.recommended"
            description: "The seller solved for budget: a recommended figure answers the outcome target"
          - check: field_present
            path: "proposals[0].total_budget_guidance.currency"
            description: "Budget guidance declares its currency"
          - check: field_value
            path: "proposals[0].forecast.forecast_range_unit"
            value: "clicks"
            description: "A clicks goal is answered with a clicks-structured outcome curve"
          - check: field_present
            path: "proposals[0].forecast.points[0].metrics.clicks.mid"
            description: "Forecast points carry the goal's metric key — the vocabulary contract that makes every goal answerable"
          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "outcome_target--request_clicks_goal"
            description: "Context correlation_id returned unchanged"

  - id: event_goal
    title: "Solve for budget from a conversion-event goal"
    depends_on: [setup]
    narrative: |
      The buyer states a conversion outcome — 500 purchases — and the seller
      answers with budget guidance and a conversions-structured forecast whose
      points carry the event-type key.
    steps:
      - id: request_purchase_goal
        title: "Request proposals for a 500-purchase target"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        expected: |
          Return outcome proposed with at least one proposal carrying:
          - total_budget_guidance with currency and a recommended figure
          - forecast with forecast_range_unit "conversions" whose points carry
            metrics.purchase

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_outcome_target_event_goal_request_purchase_goal"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brief: "Drive Trail Pro 3000 purchases from the seeded video placement."
          criteria:
            product_ids: ["outcome_target_video"]
            outcome_target:
              goal:
                kind: "event"
                event_type: "purchase"
              volume: 500
          context:
            correlation_id: "outcome_target--request_purchase_goal"
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json schema"
          - check: field_value
            path: "outcome"
            value: "proposed"
            description: "The seller returns at least one proposal"
          - check: field_present
            path: "proposals[0].total_budget_guidance.recommended"
            description: "The seller solved for budget against the event goal"
          - check: field_value
            path: "proposals[0].forecast.forecast_range_unit"
            value: "conversions"
            description: "An event goal is answered with a conversions-structured outcome curve"
          - check: field_present
            path: "proposals[0].forecast.points[0].metrics.purchase.mid"
            description: "Forecast points carry the goal's event-type key"
          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "outcome_target--request_purchase_goal"
            description: "Context correlation_id returned unchanged"

  - id: cost_target_with_budget
    title: "Plan a clicks cost cap within a buyer budget"
    depends_on: [setup]
    requires_capability:
      path: media_buy.features.bidding_policy.media_buy.fixed.cost_per_strengths
      contains: cap
    narrative: |
      Runs for sellers advertising fixed media-buy cost caps in
      features.bidding_policy. The buyer states a cost, not a volume: clicks
      at 3 USD or less within a 5,000 USD budget. The seller plans the clicks
      it can deliver within the budget and states the cost it can actually
      plan to in commercial_terms.bidding.cost_per. The amount is seller-specific but
      never below the ask; the strength MUST stay the buyer's cap, and the
      answer is denominated in the requested currency.
    steps:
      - id: request_clicks_cost_cap
        title: "Request proposals for clicks at a 3 USD cap on a 5,000 USD budget"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        expected: |
          Return outcome proposed with at least one proposal carrying:
          - commercial_terms.bidding.cost_per with strength "cap" and the
            amount the seller can plan to (MAY be higher than 3)
          - purchases priced in USD (and total_budget, when present, in USD)
          - forecast in USD whose points carry metrics.clicks

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_outcome_target_cost_target_with_budget_request_clicks_cost_cap"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brief: "Drive qualified traffic to the Trail Pro 3000 launch page using the seeded video placement."
          criteria:
            product_ids: ["outcome_target_auction_video"]
            offer_filters:
              budget_range:
                max: 5000
                currency: "USD"
            outcome_target:
              goal:
                kind: "metric"
                metric: "clicks"
              cost_per:
                amount: 3
                currency: "USD"
                strength: "cap"
          context:
            correlation_id: "outcome_target--request_clicks_cost_cap"
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json schema"
          - check: field_value
            path: "outcome"
            value: "proposed"
            description: "The seller returns at least one proposal"
          - check: field_greater_than
            path: "proposals[0].commercial_terms.bidding.cost_per.amount"
            value: 2.99
            description: "The answered cost is never below the 3 USD ask (strict greater-than against 2.99 with a 0.01 epsilon, the cent precision of the amount)"
          - check: field_absent
            path: "proposals[0].commercial_terms.purchases[0].bidding"
            description: "The answer carries no purchase-level bidding, so the media-buy cost_per binds to the purchase's primary goal"
          - check: field_value
            path: "proposals[0].commercial_terms.bidding.cost_per.strength"
            value: "cap"
            description: "The answer keeps the buyer's strength; a higher cost comes back as a higher cap, never as a target"
          - check: field_value
            path: "proposals[0].commercial_terms.purchases[0].pricing.currency"
            value: "USD"
            description: "The purchase pricing currency, which bidding amounts are denominated in, equals cost_per.currency"
          - check: field_value_or_absent
            path: "proposals[0].commercial_terms.total_budget.currency"
            value: "USD"
            description: "total_budget, when present, is in the requested currency"
          - check: field_value_or_absent
            path: "proposals[0].total_budget_guidance.currency"
            value: "USD"
            description: "Budget guidance, when present, is in the requested currency"
          - check: field_value
            path: "proposals[0].forecast.currency"
            value: "USD"
            description: "The forecast is in the requested currency"
          - check: field_present
            path: "proposals[0].forecast.points[0].metrics.clicks.mid"
            description: "Forecast points carry the clicks volume planned at the stated cost"
          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "outcome_target--request_clicks_cost_cap"
            description: "Context correlation_id returned unchanged"

  - id: cost_target_with_volume
    title: "Plan a clicks volume at a cost cap without a budget range"
    depends_on: [setup]
    requires_capability:
      path: media_buy.features.bidding_policy.media_buy.fixed.cost_per_strengths
      contains: cap
    narrative: |
      The buyer states both a volume and a cost, with no budget range: 1,000
      clicks at 3 USD or less. The seller plans toward the volume at the cost.
      Runs for sellers advertising fixed media-buy cost caps. With no budget
      range to anchor the currency, cost_per.currency alone decides it: the
      answer MUST come back in USD.
    steps:
      - id: request_clicks_volume_at_cost_cap
        title: "Request proposals for 1,000 clicks at a 3 USD cap"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        expected: |
          Return outcome proposed with at least one proposal carrying:
          - commercial_terms.bidding.cost_per with strength "cap"
          - purchases priced in USD, the currency of cost_per (and
            total_budget, when present, in USD)
          - forecast in USD whose points carry metrics.clicks

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_outcome_target_cost_target_with_volume_request_clicks_volume_at_cost_cap"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brief: "Drive 1,000 qualified visits to the Trail Pro 3000 launch page using the seeded video placement."
          criteria:
            product_ids: ["outcome_target_auction_video"]
            outcome_target:
              goal:
                kind: "metric"
                metric: "clicks"
              volume: 1000
              cost_per:
                amount: 3
                currency: "USD"
                strength: "cap"
          context:
            correlation_id: "outcome_target--request_clicks_volume_at_cost_cap"
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json schema"
          - check: field_value
            path: "outcome"
            value: "proposed"
            description: "The seller returns at least one proposal"
          - check: field_greater_than
            path: "proposals[0].commercial_terms.bidding.cost_per.amount"
            value: 2.99
            description: "The answered cost is never below the 3 USD ask (strict greater-than against 2.99 with a 0.01 epsilon, the cent precision of the amount)"
          - check: field_absent
            path: "proposals[0].commercial_terms.purchases[0].bidding"
            description: "The answer carries no purchase-level bidding, so the media-buy cost_per binds to the purchase's primary goal"
          - check: field_value
            path: "proposals[0].commercial_terms.bidding.cost_per.strength"
            value: "cap"
            description: "The answer keeps the buyer's strength"
          - check: field_value
            path: "proposals[0].commercial_terms.purchases[0].pricing.currency"
            value: "USD"
            description: "The purchase pricing currency, which bidding amounts are denominated in, equals cost_per.currency"
          - check: field_value_or_absent
            path: "proposals[0].commercial_terms.total_budget.currency"
            value: "USD"
            description: "Without a budget range, total_budget, when present, is still in cost_per.currency"
          - check: field_value_or_absent
            path: "proposals[0].total_budget_guidance.currency"
            value: "USD"
            description: "Budget guidance, when present, is in the requested currency"
          - check: field_value
            path: "proposals[0].forecast.currency"
            value: "USD"
            description: "The forecast is in the requested currency"
          - check: field_present
            path: "proposals[0].forecast.points[0].metrics.clicks.mid"
            description: "Forecast points carry the clicks volume planned at the stated cost"
          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "outcome_target--request_clicks_volume_at_cost_cap"
            description: "Context correlation_id returned unchanged"

  - id: cost_target_currency_rejection
    title: "Reject a cost target in a currency the products are not priced in"
    depends_on: [setup]
    narrative: |
      The seeded fixed-price product is priced only in USD, and sellers MUST
      NOT convert currency. The request carries no budget range, so the EUR
      cost target against the USD-only product is its only defect. The
      target cannot be answered in its own currency, so every seller
      declaring media_buy.outcome_target rejects it with INVALID_REQUEST
      naming criteria.outcome_target.cost_per rather than returning a USD
      plan. This phase is not gated on bidding capability: a seller that
      cannot plan cost targets at all rejects with the same error.
    steps:
      - id: request_clicks_cost_cap_in_unpriced_currency
        title: "Reject clicks at a 3 EUR cap against a USD-only product"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: false
        expect_error: true
        negative_path: payload_well_formed
        expected: |
          Reject with INVALID_REQUEST naming criteria.outcome_target.cost_per.
          The only requested product is priced in USD, and the seller cannot
          convert the EUR cost target.

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_outcome_target_cost_target_currency_rejection_request"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brief: "Drive qualified traffic to the Trail Pro 3000 launch page using the seeded video placement."
          criteria:
            product_ids: ["outcome_target_video"]
            outcome_target:
              goal:
                kind: "metric"
                metric: "clicks"
              cost_per:
                amount: 3
                currency: "EUR"
                strength: "cap"
          context:
            correlation_id: "outcome_target--request_clicks_cost_cap_in_unpriced_currency"
        validations:
          - check: error_code
            value: "INVALID_REQUEST"
            description: "The seller rejects a cost target it cannot plan in its own currency"
          - check: field_value
            path: "adcp_error.field"
            value: "criteria.outcome_target.cost_per"
            description: "The error names the cost target"
