# Grades the over-limit refinement bullet of the encoding-equivalence list that
# accompanies the field-specific obligations table:
# specs/legacy-compact-lifecycle-compatibility.md#encoding-equivalences-and-narrowed-values
#   "A legacy refinement batch exceeding compact limits, or containing
#   repeated entries, MUST retain its order and transaction semantics. Do not
#   truncate, deduplicate stateful operations, or split an atomic batch into
#   separate compact commits. Use the retained operation or reject before
#   mutation."
# The compact limit is `maxItems: 25` on refine_proposals `refinements`. The
# batch here has 26 distinct entries and no repeats, so the only property
# under test is the size of the batch. Issue #7403.
id: media_buy_seller/legacy_get_products_refine_batch
version: "1.0.0"
title: "Retained get_products applies a refine batch larger than the compact limit"
category: media_buy_seller
summary: "Checks that a 26-entry refine batch on retained get_products is applied whole, not truncated or split at the compact 25-entry limit, or is rejected before mutation."
track: media_buy
requires:
  - controller

requires_capability:
  path: media_buy.buying_modes
  contains: refine

introduced_in: "3.2"
required_tools: [get_products, comply_test_controller]

narrative: |
  Released 3.1 get_products puts no item limit on refine[]. The compact
  refine_proposals task accepts at most 25 refinements. A facade that sends a
  legacy batch through the compact task has to keep the whole batch: it must
  not truncate it at 25 entries or split it into separate commits.

  The controller seeds 26 products. The buyer refines with 26 product-scoped
  include entries, one per product, in product order. Include means "return
  this product", so a conformant answer contains every one of them. The
  first and last entries are checked. A seller that keeps only the first 25
  entries loses the last product. A seller that keeps only the last 25, or
  answers from one half of a split batch, loses one end of the batch.

  A seller that cannot apply the batch whole rejects refine before any side
  effect, identifying it at its original path.

agent:
  interaction_model: media_buy_seller
  capabilities: [sells_media]
caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"
prerequisites:
  description: "Seed 26 non-guaranteed products with USD pricing."
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

