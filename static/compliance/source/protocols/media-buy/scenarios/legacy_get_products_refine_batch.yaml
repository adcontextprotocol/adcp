phases:
  - id: refine_batch_applied
    title: "Apply the whole refine batch"
    optional: true
    branch_set:
      id: legacy_refine_batch_handled
      semantics: any_of
    steps:
      - id: legacy_refine_batch_applied
        title: "Return the products named by the first and last entries"
        task: get_products
        schema_ref: media-buy/get-products-request.json
        response_schema_ref: media-buy/get-products-response.json
        doc_ref: /media-buy/task-reference/get_products
        stateful: false
        contributes_to: legacy_refine_batch_handled
        expected: |
          Apply all 26 include entries as one refinement and return every
          named product on one page.
        sample_request: &refine_batch_request
          buying_mode: refine
          pagination: {max_results: 100}
          account:
            brand: {domain: acmeoutdoor.example}
            operator: pinnacle-agency.example
            operator_unit:
              id: "compliance-media_buy_seller_legacy_get_products-4aa2aaf0"
            sandbox: true
          refine:
            - {scope: product, product_id: refine_batch_01, action: include}
            - {scope: product, product_id: refine_batch_02, action: include}
            - {scope: product, product_id: refine_batch_03, action: include}
            - {scope: product, product_id: refine_batch_04, action: include}
            - {scope: product, product_id: refine_batch_05, action: include}
            - {scope: product, product_id: refine_batch_06, action: include}
            - {scope: product, product_id: refine_batch_07, action: include}
            - {scope: product, product_id: refine_batch_08, action: include}
            - {scope: product, product_id: refine_batch_09, action: include}
            - {scope: product, product_id: refine_batch_10, action: include}
            - {scope: product, product_id: refine_batch_11, action: include}
            - {scope: product, product_id: refine_batch_12, action: include}
            - {scope: product, product_id: refine_batch_13, action: include}
            - {scope: product, product_id: refine_batch_14, action: include}
            - {scope: product, product_id: refine_batch_15, action: include}
            - {scope: product, product_id: refine_batch_16, action: include}
            - {scope: product, product_id: refine_batch_17, action: include}
            - {scope: product, product_id: refine_batch_18, action: include}
            - {scope: product, product_id: refine_batch_19, action: include}
            - {scope: product, product_id: refine_batch_20, action: include}
            - {scope: product, product_id: refine_batch_21, action: include}
            - {scope: product, product_id: refine_batch_22, action: include}
            - {scope: product, product_id: refine_batch_23, action: include}
            - {scope: product, product_id: refine_batch_24, action: include}
            - {scope: product, product_id: refine_batch_25, action: include}
            - {scope: product, product_id: refine_batch_26, action: include}
        validations:
          - check: response_schema
            description: "Response validates against the invoked tool's contract"
          - check: field_contains
            path: "products[*].product_id"
            value: refine_batch_01
            description: "The first entry of the batch was applied"
          - check: field_contains
            path: "products[*].product_id"
            value: refine_batch_26
            description: "The entry past the compact 25-entry limit was applied, not truncated"

  - id: refine_batch_rejected
    title: "Reject a batch the seller cannot apply whole"
    optional: true
    branch_set:
      id: legacy_refine_batch_handled
      semantics: any_of
    steps:
      - id: legacy_refine_batch_rejected
        title: "Identify refine as unsupported before mutation"
        task: get_products
        schema_ref: media-buy/get-products-request.json
        response_schema_ref: media-buy/get-products-response.json
        doc_ref: /media-buy/task-reference/get_products
        expect_error: true
        negative_path: payload_well_formed
        stateful: false
        contributes_to: legacy_refine_batch_handled
        expected: |
          Reject before any side effect with a published error code, and
          identify refine at its original path.
        sample_request: *refine_batch_request
        validations:
          - check: field_absent
            path: products
            description: "The request is rejected rather than answered"
          - check: error_code
            description: "The seller rejects with an error code (the spec gives UNSUPPORTED_FEATURE as an example, not a requirement)"
          - check: field_pattern
            path: adcp_error.field
            pattern: "^refine(\\[\\d+\\])?$"
            description: "The error identifies the unsupported legacy input at its original path"

  - id: refine_batch_assertion
    title: "Require one conformant outcome"
    steps:
      - id: assert_legacy_refine_batch_handled
        title: "Require the whole batch or rejection"
        task: assert_contribution
        stateful: false
        expected: |
          The seller either applied all 26 entries or rejected refine before
          mutation.
        validations:
          - check: any_of
            allowed_values: ["legacy_refine_batch_handled"]
            description: "The seller did not truncate or split the legacy refine batch"
