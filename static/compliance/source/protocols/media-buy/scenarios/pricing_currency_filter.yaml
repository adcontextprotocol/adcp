id: media_buy_seller/pricing_currency_filter
version: "1.0.1"
title: "Seller filters products by accepted pricing currencies"
category: media_buy_seller
summary: "Verifies that get_products filters.pricing_currencies returns only products buyable in the requested media pricing currency and prunes returned product pricing_options."
track: media_buy
requires:
  - controller

requires_capability:
  path: media_buy.buying_modes
  contains: wholesale

required_tools:
  - get_products
  - comply_test_controller

narrative: |
  Some buyers can only transact in a specific currency. The buyer uses
  filters.pricing_currencies to ask the seller to return products with media
  pricing in an accepted currency. The seller must match against product-level
  pricing_options, prune returned product pricing_options to the requested
  currencies, and exclude products whose mandatory product-scoped signal charges
  cannot be satisfied in the requested currencies.

  Currency conversion is allowed: the test discovers an effective currency from
  the seller's account-scoped catalog instead of requiring the fixture's original
  USD rate-card entry or any particular product ordering. It requests that
  currency and checks every returned product-level pricing option, allowing
  multiple matching options and multiple matching products.

  Optional signal or vendor add-ons are not part of this filter's product media
  pricing match. Buyers remain responsible for avoiding optional add-on prices
  they cannot transact in. A seller that converts mandatory charges into the
  requested currency can return that product; a seller that cannot must exclude
  it. A fixed fixture ID alone does not determine currency eligibility.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
  examples:
    - "Publishers with USD and EUR rate cards"
    - "Retail media networks that expose account-specific product currencies"
    - "CTV sellers with regional currency rate cards"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    Seller advertises get_products wholesale discovery and can seed auction
    CPM products. The seeded catalog includes mixed-currency media pricing,
    an optional EUR signal add-on, and a mandatory EUR signal charge. The seller
    may expose those prices in its account's effective transaction currency.
    The unfiltered catalog and filtered result must each contain a selectable
    price, so an always-empty seller cannot pass the filter test.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  accounts:
    - account_id: "acct_acmeoutdoor_example_sandbox_90c99cadcb40"
      fixture:
        brand:
          domain: "acmeoutdoor.example"
        operator: "pinnacle-agency.example"
        operator_unit:
          id: "compliance-media_buy_seller_pricing_currency_fi-e1a4500b"
        billing: "operator"
        status: "active"
        sandbox: true
  products:
    - product_id: "mixed_currency_display"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_options:
        - format_option_id: "display_300x250"
          format_kind: "image"
          params:
            width: 300
            height: 250
      signal_targeting_allowed: true
      signal_targeting_rules:
        resolution_model: "direct_targeting"
        selection_mode: "optional"
      signal_targeting_options:
        - signal_ref:
            scope: "product"
            signal_id: "premium_outdoor_affinity"
          name: "Premium outdoor affinity"
          value_type: "binary"
          default_selected: false
          pricing_options:
            - pricing_option_id: "premium_outdoor_affinity_eur_cpm"
              model: "cpm"
              cpm: 1.00
              currency: "EUR"
    - product_id: "mandatory_eur_signal_display"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_options:
        - format_option_id: "display_300x250"
          format_kind: "image"
          params:
            width: 300
            height: 250
      signal_targeting_allowed: true
      signal_targeting_rules:
        resolution_model: "direct_targeting"
        selection_mode: "fixed"
      signal_targeting_options:
        - signal_ref:
            scope: "product"
            signal_id: "fixed_sports_affinity"
          name: "Fixed sports affinity"
          value_type: "binary"
          default_selected: true
          pricing_options:
            - pricing_option_id: "fixed_sports_affinity_eur_cpm"
              model: "cpm"
              cpm: 1.50
              currency: "EUR"
  pricing_options:
    - product_id: "mixed_currency_display"
      pricing_option_id: "mixed_display_usd_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 12.00
    - product_id: "mixed_currency_display"
      pricing_option_id: "mixed_display_eur_cpm"
      pricing_model: "cpm"
      currency: "EUR"
      floor_price: 11.00
    - product_id: "mandatory_eur_signal_display"
      pricing_option_id: "mandatory_eur_base_usd_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 10.00

phases:
  - id: discover_effective_currency
    title: "Discover an effective media pricing currency"
    steps:
      - id: get_products_currency_baseline
        title: "Read account-scoped product pricing"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: true
        expected: |
          Return at least one selectable product pricing option in the account's
          effective currency. Product IDs, rate-card IDs, ordering, and currency
          conversion are seller-defined.
        sample_request:
          idempotency_key: "$generate:uuid_v4#pricing_currency_filter_baseline"
          buying_mode: "wholesale"
          fields: &pricing_fields
            - product_id
            - name
            - pricing_options
            - signal_targeting_allowed
            - signal_targeting_options
            - signal_targeting_rules
          account: &pricing_account
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_pricing_currency_fi-e1a4500b"
            sandbox: true
          context:
            correlation_id: "pricing_currency_filter--baseline"
        context_outputs:
          - path: "products[0].pricing_options[0].currency"
            key: "pricing_filter_currency"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: field_present
            path: "products[0].pricing_options[0].currency"
            description: "The catalog exposes at least one media price to filter"
          - check: field_value
            path: "context.correlation_id"
            value: "pricing_currency_filter--baseline"
            description: "Context correlation_id returned unchanged"

  - id: establish_currency_scope
    title: "Establish the buyer's accepted pricing currency"
    steps:
      - id: get_products_currency_scope
        title: "Request the discovered transaction currency"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: true
        expected: |
          Apply the requested pricing currency and echo the buyer's context.
          The echoed singleton array supplies the prior-step comparand used to
          inspect every media price on the following filtered read.
        sample_request:
          idempotency_key: "$generate:uuid_v4#pricing_currency_filter_scope"
          buying_mode: "wholesale"
          filters:
            pricing_currencies: ["$context.pricing_filter_currency"]
          fields: *pricing_fields
          account: *pricing_account
          context:
            correlation_id: "pricing_currency_filter--scope"
            accepted_pricing_currencies: ["$context.pricing_filter_currency"]
        context_outputs:
          - path: "context.accepted_pricing_currencies"
            key: "pricing_filter_currencies"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: field_value
            path: "context.accepted_pricing_currencies"
            value: ["$context.pricing_filter_currency"]
            description: "Seller echoes the exact singleton currency scope without widening it"
          - check: field_value
            path: "context.correlation_id"
            value: "pricing_currency_filter--scope"
            description: "Context correlation_id returned unchanged"

  - id: discover_usd_products
    title: "Validate every returned media pricing currency"
    steps:
      - id: get_products_usd_pricing
        title: "Return only accepted product pricing"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: true
        expected: |
          Return products buyable in the requested effective currency, with every
          product-level pricing option in that currency. Empty results are valid:
          a baseline media price does not prove its mandatory charges are also
          satisfiable in that currency, so no positive-price coverage is claimed. Products may be reordered,
          rate-card IDs may change, and multiple matching options may remain.
          Optional signal prices may advertise other currencies. Mandatory charges
          must be satisfiable in the requested currency, including via conversion.
        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_pricing_currency_filter_discover_usd_products_get_products_usd_pricing"
          buying_mode: "wholesale"
          filters:
            pricing_currencies: "$context.pricing_filter_currencies"
          fields: *pricing_fields
          account: *pricing_account
          context:
            correlation_id: "pricing_currency_filter--get_products_usd_pricing"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: all_fields_present
            path: "products[*].pricing_options[0].currency"
            description: "Every returned product has a selectable media price"
          - check: all_fields_in_context_array
            path: "products[*].pricing_options[*].currency"
            context_key: "pricing_filter_currencies"
            description: "Every media pricing option on every returned product uses the requested currency"
          - check: field_value
            path: "context.correlation_id"
            value: "pricing_currency_filter--get_products_usd_pricing"
            description: "Context correlation_id returned unchanged"
