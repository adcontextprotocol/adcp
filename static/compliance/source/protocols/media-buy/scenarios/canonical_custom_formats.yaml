id: media_buy_seller/canonical_custom_formats
version: 1.0.0
title: Seller preserves custom canonical formats
category: media_buy_seller
summary: Verifies a seeded custom canonical formats declaration only after native catalog discovery
  establishes that optional format family.
track: products
introduced_in: "3.1"
requires:
  - controller
requires_all_capabilities:
  - path: media_buy.buying_modes
    contains: wholesale
  - path: compliance_testing.scenarios
    contains: seed_product
required_tools:
  - get_products
  - comply_test_controller
narrative: This optional custom canonical formats slice discovers a matching native declaration
  before seeding its deterministic fixture. A valid no-match is a fixture_unsatisfied coverage gap.
  It does not suppress the independent image and named-format compatibility scenario or require any
  reporting vendor metrics. Discovery and accepted fixture failures remain conformance failures.
agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - exposes_canonical_formats
  examples:
    - A seller publishing the digest-pinned custom declaration under test
caller:
  role: buyer_agent
  example: Compliance test harness
prerequisites:
  description: Wholesale discovery must expose a native custom declaration with the exact
    format_shape, format_schema URI and digest used by this fixture. The controller seeds that
    contract only after this evidence is established; a different custom schema produces a visible
    fixture_unsatisfied coverage gap.
  test_kit: test-kits/acme-outdoor.yaml
  controller_seeding: true
context:
  account:
    brand:
      domain: acmeoutdoor.example
    operator: pinnacle-agency.example
    operator_unit:
      id: compliance-media_buy_seller_canonical_custom_fo-d3c9551b
    sandbox: true
fixtures:
  accounts:
    - account_id: acct_canonical_custom_formats_sandbox
      fixture:
        brand:
          domain: acmeoutdoor.example
        operator: pinnacle-agency.example
        operator_unit:
          id: compliance-media_buy_seller_canonical_custom_fo-d3c9551b
        billing: operator
        status: active
        sandbox: true
  products:
    - product_id: native_custom_format_support
fixture_resolution:
  products:
    - handle: native_custom_format_support
      allow_reuse: true
      strategies:
        - discover
      match:
        - path: /delivery_type
          operator: equals
          value: non_guaranteed
        - path: /channels
          operator: contains_all
          value:
            - display
        - path: /format_options
          operator: any_match
          where:
            - path: /format_kind
              operator: equals
              value: custom
            - path: /format_shape
              operator: equals
              value: multi_placement_takeover
            - path: /format_schema/uri
              operator: equals
              value: https://creative.adcontextprotocol.org/translated/acme-outdoor/schemas/custom_takeover_v1
            - path: /format_schema/digest
              operator: equals
              value: sha256:a3f5b7c9d8e2f1a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a2
phases:
  - id: seed_supported_canonical_fixtures
    title: Prepare the supported custom canonical formats fixture
    steps:
      - id: seed_canonical_formats_custom_takeover
        title: Seed canonical_formats_custom_takeover
        task: comply_test_controller
        requires_tool: comply_test_controller
        stateful: true
        sample_request:
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_canonical_custom_fo-d3c9551b
            sandbox: true
          scenario: seed_product
          params:
            product_id: canonical_formats_custom_takeover
            fixture:
              name: Canonical Formats Custom Takeover
              description: Seeded wholesale product for custom v2-only format_schema declaration validation.
              publisher_properties:
                - publisher_domain: outdoormagazine.example
                  selection_type: all
              channels:
                - display
              delivery_type: non_guaranteed
              format_options:
                - format_kind: custom
                  format_option_id: canonical_formats_custom_takeover
                  display_name: Canonical Formats Custom Takeover
                  canonical_formats_only: true
                  experimental: true
                  format_shape: multi_placement_takeover
                  format_schema:
                    uri: https://creative.adcontextprotocol.org/translated/acme-outdoor/schemas/custom_takeover_v1
                    digest: sha256:a3f5b7c9d8e2f1a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a2
                  params:
                    placements:
                      - slot_id: homepage_billboard
                        width: 970
                        height: 250
                        required: true
                      - slot_id: article_mrec
                        width: 300
                        height: 250
                        required: true
                    asset_source: buyer_uploaded
                    buyer_asset_acceptance: accepted
                    composition_model: deterministic
              pricing_options:
                - pricing_option_id: canonical_formats_custom_takeover_cpm
                  pricing_model: cpm
                  currency: USD
                  floor_price: 35
              reporting_capabilities:
                available_reporting_frequencies:
                  - daily
                expected_delay_minutes: 60
                timezone: UTC
                supports_webhooks: false
                available_metrics:
                  - impressions
                  - clicks
                  - spend
                date_range_support: date_range
        validations:
          - check: field_value
            path: success
            value: true
            description: The controller accepts the supported compatibility fixture
  - id: canonical_product_discovery
    title: Read the custom canonical formats declaration
    steps:
      - id: get_seeded_custom_v2_only_product
        title: Read custom v2-only declarations
        narrative: |
          Request the seeded product that publishes a custom canonical
          declaration with `canonical_formats_only: true`, `format_shape`, and
          a digest-pinned `format_schema` reference.
        task: get_products
        schema_ref: media-buy/get-products-request.json
        response_schema_ref: media-buy/get-products-response.json
        doc_ref: /media-buy/task-reference/get_products
        comply_scenario: schema_compliance
        stateful: true
        expected: |
          Return the seeded canonical_formats_custom_takeover product with a
          custom v2-only declaration and digest-pinned format_schema reference.
        sample_request:
          idempotency_key: $generate:uuid_v4#media_buy_seller_canonical_custom_formats_canonical_product_discovery_get_seeded_custom_v2_only_product
          buying_mode: wholesale
          filters:
            channels:
              - display
            delivery_type: non_guaranteed
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_canonical_custom_fo-d3c9551b
            sandbox: true
          context:
            correlation_id: canonical_custom_formats--get_seeded_custom_v2_only_product
        validations:
          - check: response_schema
            description: Response matches get-products-response.json schema
          - check: field_contains
            path: products[*]
            value:
              product_id: canonical_formats_custom_takeover
              format_options:
                - format_kind: custom
                  canonical_formats_only: true
                  experimental: true
                  format_shape: multi_placement_takeover
                  format_schema:
                    uri: https://creative.adcontextprotocol.org/translated/acme-outdoor/schemas/custom_takeover_v1
                    digest: sha256:a3f5b7c9d8e2f1a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f0a2
            description: The seeded product retains its format contract regardless of catalog or format ordering
