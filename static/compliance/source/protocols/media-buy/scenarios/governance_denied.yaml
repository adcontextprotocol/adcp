id: media_buy_seller/governance_denied
version: "1.1.0"
title: "Seller rejects buy when governance denies"
category: media_buy_seller
summary: "Verifies that the seller's own execution check blocks an intent-approved buy the governance plan no longer permits, and that the seller propagates GOVERNANCE_DENIED."
track: media_buy
requires:
  - multi_agent
default_agent: sales
required_tools:
  - sync_plans
  - sync_accounts
  - sync_governance
  - get_products
  - check_governance
  - create_media_buy

# Capability gate: run only for sellers claiming signed-context enforcement
# with an online execution check for create_media_buy. The denial comes from
# the seller's own execution check, so sellers without one grade
# not_applicable.
requires_capability:
  path: adcp.governance_enforcement.tasks
  contains:
    task: create_media_buy
    modes:
      - signed_context
      - online_execution_check

narrative: |
  This multi-agent test proves the seller's independent execution check. The
  buyer obtains an approved intent for a $25K buy under a $100K plan, so the
  buyer-side check has passed. Before the buyer contacts the seller, the plan
  owner amends the plan to a $10K budget. Plan amendments apply immediately,
  and every later check is evaluated against the amended plan.

  The seller receives a valid, in-date intent token and must still run its own
  execution check before committing. The governance agent evaluates that check
  against the amended plan and denies it: $25K no longer fits the plan's
  budget authority. Execution checks are binary, so the seller must not commit
  the buy. It returns `GOVERNANCE_DENIED` with the governance findings.

  A request without `governance_context` is a different case: a seller rejects
  it with `PERMISSION_DENIED` without consulting governance. This scenario
  therefore always sends an approved intent token, so the only reason to
  reject is the seller's own execution check.

  This scenario requires a runner that can route calls to at least two logical
  agents: `sales` for the seller under test and `governance` for the governance
  plan setup, intent check, and plan amendment. Single-agent runners should
  only include this storyboard when the endpoint under test deliberately
  combines seller and governance behavior in one tenant; otherwise it belongs
  in the governance-aware-seller multi-agent suite.

  By default, the governance agent is the training agent at test-agent.adcontextprotocol.org.
  Override by supplying a different `governance_agent_url` in the run's initial context,
  and override `seller_agent_url` with the exact sales-agent endpoint the runner uses.

# Buyer brand and intent caller (adcp#7758). test-agent.adcontextprotocol.org
# publishes a real /.well-known/brand.json that lists the sandbox governance
# agent, so a seller can complete the brand.json issuer cross-check for a
# governance_context. Hosted grading authenticates to that governance agent as
# the fixed hosted-grader buyer agent below; sellers map the credential they
# give hosted grading to that buyer agent so it matches the token caller.
context:
  governance_agent_url: "https://test-agent.adcontextprotocol.org"
  seller_agent_url: "https://seller.example.com"

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - governance_aware
  examples:
    - "Any media buy seller with governance support"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    A multi-agent runner with `sales` and `governance` agents. The governance
    agent supports plan synchronization and amendment, intent checks, and
    execution checks. The sales agent supports governance registration and
    media-buy creation with an online execution check. Override
    `seller_agent_url` in the initial context with the exact sales-agent
    endpoint used by the runner.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "outdoor_display_q2"
      delivery_type: "guaranteed"
      channels: ["display"]
      format_options:
        - format_option_id: "display_300x250"
          format_kind: "image"
          params:
            width: 300
            height: 250
    - product_id: "outdoor_video_q2"
      delivery_type: "guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "video_15s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 15000
  pricing_options:
    - product_id: "outdoor_display_q2"
      pricing_option_id: "cpm_standard"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 8.0
    - product_id: "outdoor_video_q2"
      pricing_option_id: "cpm_standard"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 12.0

phases:
  - id: governance_plan_setup
    title: "Set up the governance plan"
    narrative: |
      Create a governance plan with a $100K budget. The $25K buy fits this plan,
      so the buyer's intent check will be approved.

    steps:
      - id: sync_plans
        title: "Create governance plan"
        agent: governance
        task: sync_plans
        schema_ref: "governance/sync-plans-request.json"
        response_schema_ref: "governance/sync-plans-response.json"
        doc_ref: "/governance/campaign/tasks/sync_plans"
        stateful: true
        expected: |
          The governance agent acknowledges the plan with a plan_id.
        sample_request:
          idempotency_key: "$generate:uuid_v4#governance_denied_sync_plans"
          plans:
            - plan_id: "comply-gov-denied-plan"
              brand:
                domain: "test-agent.adcontextprotocol.org"
              objectives: "Q2 outdoor lifestyle campaign — budget later reduced by the plan owner"
              budget:
                total: 100000
                currency: "USD"
                reallocation_threshold: 100000
              flight:
                start: "2020-01-01T00:00:00Z"
                end: "2099-06-30T23:59:59Z"
              countries: ["US"]
        context_outputs:
          - name: plan_id
            path: "plans[0].plan_id"
        validations:
          - check: response_schema
            description: "Response matches sync-plans-response.json schema"

  - id: seller_setup
    title: "Account and governance registration on seller"
    steps:
      - id: sync_accounts
        title: "Establish account with seller"
        agent: sales
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: |
          Return the account with account_id and status active.
        sample_request:
          accounts:
            - brand:
                domain: "test-agent.adcontextprotocol.org"
              operator: "pinnacle-agency.example"
              billing: "operator"
              payment_terms: "net_30"
          idempotency_key: "$generate:uuid_v4#media_buy_seller_governance_denied_seller_setup_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json schema"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a platform-assigned ID"

      - id: sync_governance
        title: "Register governance agent with seller"
        agent: sales
        task: sync_governance
        schema_ref: "account/sync-governance-request.json"
        response_schema_ref: "account/sync-governance-response.json"
        doc_ref: "/accounts/tasks/sync_governance"
        stateful: true
        expected: |
          Acknowledge the governance agent registration.
        sample_request:
          accounts:
            - account:
                brand:
                  domain: "test-agent.adcontextprotocol.org"
                operator: "pinnacle-agency.example"
              governance_agents:
                - url: "$context.governance_agent_url"
                  authentication:
                    schemes: ["Bearer"]
                    credentials: "gov-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          idempotency_key: "$generate:uuid_v4#media_buy_seller_governance_denied_seller_setup_sync_governance"
        validations:
          - check: response_schema
            description: "Response matches sync-governance-response.json schema"

  - id: buy_denied
    title: "Approved intent, amended plan, denied execution"
    narrative: |
      The buyer authorizes the exact $25K request at intent time. The plan owner
      then cuts the plan budget to $10K. The seller's execution check evaluates
      the amended plan, so the governance agent denies it and the seller must
      reject the buy.
    steps:
      - id: get_products_brief
        title: "Discover products"
        agent: sales
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        comply_scenario: full_sales_flow
        stateful: false
        expected: |
          Return products matching the brief.
        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_governance_denied_buy_denied_get_products_brief"
          buying_mode: "brief"
          brief: "Premium video and display on outdoor lifestyle. Q2 flight, $25K budget. Adults 25-54, US."
          account:
            brand:
              domain: "test-agent.adcontextprotocol.org"
            operator: "pinnacle-agency.example"
        context_outputs:
          - name: product_1_id
            path: "products[0].product_id"
          - name: pricing_option_1_id
            path: "products[0].pricing_options[0].pricing_option_id"
          - name: product_2_id
            path: "products[1].product_id"
          - name: pricing_option_2_id
            path: "products[1].pricing_options[0].pricing_option_id"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: field_present
            path: "products"
            description: "Response contains products"

      - id: check_governance_intent
        title: "Authorize the exact proposed buy"
        agent: governance
        task: check_governance
        schema_ref: "governance/check-governance-request.json"
        response_schema_ref: "governance/check-governance-response.json"
        doc_ref: "/governance/campaign/tasks/check_governance"
        stateful: true
        expected: |
          The $25K request fits the $100K plan, so the intent check approves it
          and returns the authorization context the buyer sends to the seller.
        sample_request:
          plan_id: "$context.plan_id"
          caller: "https://test-agent.adcontextprotocol.org/hosted-grader"
          target_agent: "$context.seller_agent_url"
          tool: "create_media_buy"
          purchase_type: "media_buy"
          proposed_commitment:
            amount: 25000
            currency: "USD"
          payload:
            brand:
              domain: "test-agent.adcontextprotocol.org"
            account:
              brand:
                domain: "test-agent.adcontextprotocol.org"
              operator: "pinnacle-agency.example"
            total_budget:
              amount: 25000
              currency: "USD"
            start_time: "asap"
            end_time: "2099-06-30T23:59:59Z"
            packages:
              - product_id: "$context.product_1_id"
                budget: 15000
                pricing_option_id: "$context.pricing_option_1_id"
              - product_id: "$context.product_2_id"
                budget: 10000
                pricing_option_id: "$context.pricing_option_2_id"
            idempotency_key: "$generate:uuid_v4#governance_denied_create_media_buy"
        context_outputs:
          - name: governance_context
            path: "governance_context"
        validations:
          - check: response_schema
            description: "Approved response matches check-governance-response.json"
          - check: field_value
            path: "verdict"
            value: "approved"
            description: "The buyer-side intent check approves the request under the original plan"
          - check: field_present
            path: "governance_context"
            description: "Approval supplies the authorization context sent to the seller"

      - id: sync_plans_amend_budget
        title: "Plan owner reduces the plan budget"
        agent: governance
        task: sync_plans
        schema_ref: "governance/sync-plans-request.json"
        response_schema_ref: "governance/sync-plans-response.json"
        doc_ref: "/governance/campaign/tasks/sync_plans"
        stateful: true
        expected: |
          The governance agent applies the amendment immediately. Later checks
          are evaluated against the $10K plan.
        sample_request:
          idempotency_key: "$generate:uuid_v4#governance_denied_sync_plans_amend"
          # Same authored plan_id as the setup step (not $context.plan_id) so a
          # runner that rewrites plan ids, e.g. with a per-run suffix, rewrites
          # both steps identically.
          plans:
            - plan_id: "comply-gov-denied-plan"
              brand:
                domain: "test-agent.adcontextprotocol.org"
              objectives: "Q2 outdoor lifestyle campaign — budget later reduced by the plan owner"
              budget:
                total: 10000
                currency: "USD"
                reallocation_threshold: 10000
              flight:
                start: "2020-01-01T00:00:00Z"
                end: "2099-06-30T23:59:59Z"
              countries: ["US"]
        validations:
          - check: response_schema
            description: "Response matches sync-plans-response.json schema"

      - id: create_media_buy_denied
        title: "Create buy (execution check denies — should fail)"
        agent: sales
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        comply_scenario: create_media_buy
        stateful: true
        expect_error: true
        negative_path: payload_well_formed
        expected: |
          The intent token is valid, but the seller's execution check is denied:
          the $25K buy exceeds the amended $10K plan. The seller does not commit
          the buy and propagates the denial with findings.

          Wire placement (Case-2 of the GOVERNANCE_DENIED rule). `create_media_buy`
          has no structured rejection arm (its `oneOf` covers Success / Error /
          Submitted only), so the seller populates `errors[].code: GOVERNANCE_DENIED`
          in the payload AND `adcp_error.code: GOVERNANCE_DENIED` on the envelope per
          the two-layer model, AND flips transport-level failure markers (HTTP 4xx /
          MCP `isError: true` / A2A `failed`). Case-1 applies instead to operations
          that define a rejection arm, such as `acquire_rights` →
          `AcquireRightsRejected` (the arm is the canonical denial shape; no error
          code on the wire; transport markers stay green).
        sample_request:
          brand:
            domain: "test-agent.adcontextprotocol.org"
          account:
            brand:
              domain: "test-agent.adcontextprotocol.org"
            operator: "pinnacle-agency.example"
          total_budget:
            amount: 25000
            currency: "USD"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          packages:
            - product_id: "$context.product_1_id"
              budget: 15000
              pricing_option_id: "$context.pricing_option_1_id"
            - product_id: "$context.product_2_id"
              budget: 10000
              pricing_option_id: "$context.pricing_option_2_id"
          idempotency_key: "$generate:uuid_v4#governance_denied_create_media_buy"
          governance_context: "$context.governance_context"
        validations:
          - check: error_code
            value: "GOVERNANCE_DENIED"
            description: "Error code indicates governance denial — Case-2 wire placement: create_media_buy has no rejection arm, so GOVERNANCE_DENIED surfaces via errors[].code or adcp_error.code (per the two-layer model in error-handling.mdx)"
