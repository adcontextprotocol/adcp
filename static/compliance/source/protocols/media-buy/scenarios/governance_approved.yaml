id: media_buy_seller/governance_approved
version: "1.0.0"
title: "Seller commits a buy only after governance approval"
category: media_buy_seller
summary: "Verifies signed intent authorization, durable media-buy commit, and auditable governance outcome."
track: media_buy
requires:
  - multi_agent
default_agent: sales
required_tools:
  - sync_plans
  - sync_accounts
  - sync_governance
  - get_products
  - check_governance
  - create_media_buy
  - get_media_buys
  - report_plan_outcome

requires_capability:
  path: adcp.governance_enforcement.tasks
  contains:
    task: create_media_buy
    modes:
      - signed_context

narrative: |
  This multi-agent test sets up a permissive governance plan, registers the
  governance agent with the seller, and checks the buyer's exact proposed
  `create_media_buy` request at intent time. Only an approved intent supplies
  the `governance_context` sent to the seller.

  During `create_media_buy`, the seller verifies the signed authorization before
  committing. The scenario proves the commit through `get_media_buys` and
  reports the completed outcome. It never treats a seller-to-buyer
  `governance_context` echo as evidence of authorization.

context:
  governance_agent_url: "https://test-agent.adcontextprotocol.org"
  seller_agent_url: "https://seller.example.com"

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - governance_aware
  examples:
    - "Any media buy seller with governance support"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    A multi-agent runner with `sales` and `governance` agents. The governance
    agent supports plan synchronization, intent checks, and outcome reporting.
    The sales agent supports governance
    registration, media-buy creation, and media-buy readback.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "outdoor_display_q2"
      delivery_type: "guaranteed"
      channels: ["display"]
      format_options:
        - format_option_id: "display_300x250"
          format_kind: "image"
          params:
            width: 300
            height: 250
    - product_id: "outdoor_video_q2"
      delivery_type: "guaranteed"
      channels: ["video"]
      format_options:
        - format_option_id: "video_15s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 15000
  pricing_options:
    - product_id: "outdoor_display_q2"
      pricing_option_id: "cpm_standard"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 8.0
    - product_id: "outdoor_video_q2"
      pricing_option_id: "cpm_standard"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 12.0

phases:
  - id: governance_plan_setup
    title: "Set up permissive governance plan"
    narrative: |
      Create a governance plan on the governance agent with a high budget ($100K).
      The subsequent $25K buy will fall within these limits and should be approved.

    steps:
      - id: sync_plans
        title: "Create permissive governance plan"
        agent: governance
        task: sync_plans
        schema_ref: "governance/sync-plans-request.json"
        response_schema_ref: "governance/sync-plans-response.json"
        doc_ref: "/governance/campaign/tasks/sync_plans"
        stateful: true
        expected: |
          The governance agent acknowledges the plan with a plan_id.
        sample_request:
          idempotency_key: "$generate:uuid_v4#governance_approved_sync_plans"
          plans:
            - plan_id: "comply-gov-approved-plan"
              brand:
                domain: "acmeoutdoor.example"
              objectives: "Q2 outdoor lifestyle campaign — display and video"
              budget:
                total: 100000
                currency: "USD"
                reallocation_threshold: 100000
              flight:
                start: "2020-01-01T00:00:00Z"
                end: "2099-06-30T23:59:59Z"
              countries: ["US", "CA"]
        context_outputs:
          - name: plan_id
            path: "plans[0].plan_id"
        validations:
          - check: response_schema
            description: "Response matches sync-plans-response.json schema"

  - id: seller_setup
    title: "Account and governance registration on seller"
    steps:
      - id: sync_accounts
        title: "Establish account with seller"
        agent: sales
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: |
          Return the account with account_id and status active.
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
              payment_terms: "net_30"
          idempotency_key: "$generate:uuid_v4#media_buy_seller_governance_approved_seller_setup_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json schema"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a platform-assigned ID"

      - id: sync_governance
        title: "Register governance agent with seller"
        agent: sales
        task: sync_governance
        schema_ref: "account/sync-governance-request.json"
        response_schema_ref: "account/sync-governance-response.json"
        doc_ref: "/accounts/tasks/sync_governance"
        stateful: true
        expected: |
          Acknowledge the governance agent registration.
        sample_request:
          accounts:
            - account:
                brand:
                  domain: "acmeoutdoor.example"
                operator: "pinnacle-agency.example"
              governance_agents:
                - url: "$context.governance_agent_url"
                  authentication:
                    schemes: ["Bearer"]
                    credentials: "gov-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          idempotency_key: "$generate:uuid_v4#media_buy_seller_governance_approved_seller_setup_sync_governance"
        validations:
          - check: response_schema
            description: "Response matches sync-governance-response.json schema"

  - id: buy_approved
    title: "Create buy within governance limits"
    steps:
      - id: get_products_brief
        title: "Discover products"
        agent: sales
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        comply_scenario: full_sales_flow
        stateful: false
        expected: |
          Return products matching the brief.
        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_governance_approved_buy_approved_get_products_brief"
          buying_mode: "brief"
          brief: "Display and video inventory on outdoor lifestyle content. Q2 flight, $25K budget. Adults 25-54, US."
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
        context_outputs:
          - name: product_1_id
            path: "products[0].product_id"
          - name: pricing_option_1_id
            path: "products[0].pricing_options[0].pricing_option_id"
          - name: product_2_id
            path: "products[1].product_id"
          - name: pricing_option_2_id
            path: "products[1].pricing_options[0].pricing_option_id"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: field_present
            path: "products"
            description: "Response contains products"

      - id: check_governance_intent
        title: "Authorize the exact proposed buy"
        agent: governance
        task: check_governance
        schema_ref: "governance/check-governance-request.json"
        response_schema_ref: "governance/check-governance-response.json"
        doc_ref: "/governance/campaign/tasks/check_governance"
        stateful: true
        expected: |
          The permissive plan approves the exact downstream request and returns
          the bounded authorization context used by the seller.
        sample_request:
          plan_id: "$context.plan_id"
          caller: "https://pinnacle-agency.example"
          target_agent: "$context.seller_agent_url"
          tool: "create_media_buy"
          purchase_type: "media_buy"
          proposed_commitment:
            amount: 25000
            currency: "USD"
          payload:
            brand:
              domain: "acmeoutdoor.example"
            account:
              brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
            total_budget:
              amount: 25000
              currency: "USD"
            start_time: "asap"
            end_time: "2099-06-30T23:59:59Z"
            packages:
              - product_id: "$context.product_1_id"
                budget: 15000
                pricing_option_id: "$context.pricing_option_1_id"
              - product_id: "$context.product_2_id"
                budget: 10000
                pricing_option_id: "$context.pricing_option_2_id"
            idempotency_key: "$generate:uuid_v4#governance_approved_create_media_buy"
        context_outputs:
          - name: approved_check_id
            path: "check_id"
          - name: governance_context
            path: "governance_context"
        validations:
          - check: response_schema
            description: "Approved response matches check-governance-response.json"
          - check: field_value
            path: "verdict"
            value: "approved"
            description: "The exact proposed request is approved"
          - check: field_value
            path: "check_type"
            value: "intent"
            description: "The buyer obtains intent authorization before execution"
          - check: field_present
            path: "governance_context"
            description: "Approval supplies the seller authorization context"
          - check: field_present
            path: "expires_at"
            description: "Authorization has a bounded lifetime"

      - id: create_media_buy_tampered
        title: "Reject a payload widened after authorization"
        agent: sales
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        expected: "Reject the schema-valid request because its budget no longer matches the signed payload binding."
        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          total_budget:
            amount: 25001
            currency: "USD"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          packages:
            - product_id: "$context.product_1_id"
              budget: 15001
              pricing_option_id: "$context.pricing_option_1_id"
            - product_id: "$context.product_2_id"
              budget: 10000
              pricing_option_id: "$context.pricing_option_2_id"
          idempotency_key: "$generate:uuid_v4#governance_approved_create_media_buy_tampered"
          governance_context: "$context.governance_context"
        validations:
          - check: error_code
            value: "PERMISSION_DENIED"
            description: "The signed payload and monetary ceiling cannot authorize a widened request"

      - id: create_media_buy
        title: "Commit the governance-approved buy"
        agent: sales
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        comply_scenario: create_media_buy
        stateful: true
        expected: |
          The seller verifies the approved signed intent before committing. The
          response need not echo the authorization context.
        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          total_budget:
            amount: 25000
            currency: "USD"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          packages:
            - product_id: "$context.product_1_id"
              budget: 15000
              pricing_option_id: "$context.pricing_option_1_id"
            - product_id: "$context.product_2_id"
              budget: 10000
              pricing_option_id: "$context.pricing_option_2_id"
          idempotency_key: "$generate:uuid_v4#governance_approved_create_media_buy"
          governance_context: "$context.governance_context"
        context_outputs:
          - name: media_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json schema"
          - check: field_present
            path: "media_buy_id"
            description: "Seller identifies the buy committed after signed authorization"

  - id: committed_state_and_evidence
    title: "Prove the authorized commit"
    narrative: |
      The buyer reads authoritative seller state to prove the signed intent was
      accepted and the authorized buy was durably committed.
    steps:
      - id: get_media_buys_readback
        title: "Read back the committed media buy"
        agent: sales
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: false
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids:
            - "$context.media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json schema"
          - check: field_equals_context
            path: "media_buys[0].media_buy_id"
            context_key: "media_buy_id"
            description: "Readback returns the buy created after approval"
          - check: field_value
            path: "media_buys[0].total_budget"
            value: 25000
            description: "Readback proves the authorized budget was committed"
          - check: field_value
            path: "media_buys[0].currency"
            value: "USD"
            description: "Readback preserves the authorized currency"

  - id: outcome_reporting
    title: "Close the governance accountability loop"
    steps:
      - id: report_plan_outcome
        title: "Report the completed governed action"
        agent: governance
        task: report_plan_outcome
        schema_ref: "governance/report-plan-outcome-request.json"
        response_schema_ref: "governance/report-plan-outcome-response.json"
        doc_ref: "/governance/campaign/tasks/report_plan_outcome"
        stateful: true
        sample_request:
          plan_id: "$context.plan_id"
          check_id: "$context.approved_check_id"
          governance_context: "$context.governance_context"
          purchase_type: "media_buy"
          outcome: "completed"
          seller_response:
            seller_reference: "$context.media_buy_id"
            committed_budget: 25000
            packages:
              - budget: 15000
              - budget: 10000
          idempotency_key: "$generate:uuid_v4#governance_approved_report_outcome"
        validations:
          - check: response_schema
            description: "Response matches report-plan-outcome-response.json schema"
          - check: field_present
            path: "outcome_id"
            description: "Governance stores an auditable outcome record"
          - check: field_value
            path: "outcome_state"
            value: "accepted"
            description: "The completed governed action is accepted"
