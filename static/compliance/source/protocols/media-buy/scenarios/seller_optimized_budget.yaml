              pricing_option_id: "prospecting_cpm"
              budget: 65000
              min_spend_target: 70000
            - product_id: "shared_budget_retargeting"
              pricing_option_id: "retargeting_cpm"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#seller_optimized_budget_reject_package_budgets_explicitly_disabled"
        validations:
