id: media_buy_seller/seller_optimized_budget
version: "1.1.1"
title: "Seller accepts and persists a seller-optimized budget across packages"
category: media_buy_seller
summary: "Verifies that a seller advertising seller_optimized_budget accepts and persists the core shared-budget contract (shared total, cross-package goals, media-buy pacing, allocation echo). Package caps, minimum-spend targets, and package pacing are graded only when their own sub-capability is advertised, and must be rejected with UNSUPPORTED_FEATURE before any over-subscription validation when it is not."
track: media_buy

requires_all_capabilities:
  - path: media_buy.features.seller_optimized_budget
    equals: true
  # TEMPORARY(adcp#7852): remove when this scenario is delivery-mode aware (Option B).
  - path: media_buy.supported_delivery_types
    contains: non_guaranteed

required_tools:
  - get_products
  - create_media_buy
  - get_media_buys

invariants:
  - status.monotonic

narrative: |
  A seller-optimized buy has one hard media-buy total and multiple eligible
  packages. The seller allocates the shared total continuously against
  budget_allocation.optimization_goals and paces the buy at media-buy level.

  The core phases use only that contract: omitted or even media-buy pacing
  (a core seller MAY reject asap or front_loaded with UNSUPPORTED_FEATURE, so
  those values are not graded) and no package budgets, minimum-spend targets,
  or package pacing. Those package controls are separate
  sub-capabilities (seller_optimized_package_budgets,
  seller_optimized_min_spend_targets, seller_optimized_package_pacing). Each
  has a positive phase gated on its own declaration and two negative phases,
  one for an explicit false and one for an omitted declaration (exactly one
  runs for a seller), that require UNSUPPORTED_FEATURE rather than a silent
  drop. The negative requests are deliberately over-subscribed: an undeclared
  control is rejected with UNSUPPORTED_FEATURE before any over-subscription
  validation, and INVALID_REQUEST over-subscription checks apply only to
  declared controls. The aggregate minimum-spend check is therefore gated on
  seller_optimized_min_spend_targets; a minimum above its own package cap is
  graded by media_buy_seller/seller_optimized_min_spend_target_exceeds_package_cap,
  which needs both package budgets and minimum-spend targets.

  The scenario verifies the configuration boundary rather than an internal
  optimizer algorithm: acceptance, aggregate budget and pacing echo, package
  constraint echo, and durable readback. Continuous internal allocation is
  delivery behavior and does not mutate package caps or the buy revision.
  An optional phase for sellers advertising media-buy cost caps verifies that
  the outcome-cost control binds to the allocation goal, not independently to
  unrelated package-local goals. Proposal-derived package pacing is graded by
  media_buy_seller/seller_optimized_proposal_package_pacing, which needs both
  proposal support and the package-pacing sub-capability.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - supports_non_guaranteed
    - seller_optimized_budget
  examples:
    - "Social platforms allocating a campaign budget across ad sets"
    - "Retail-media platforms allocating a shared budget across tactics"
    - "DSPs optimizing one insertion-order budget across line items"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The seller supports a common click optimization goal across two
    non-guaranteed products in one currency. The test controller seeds both
    products so the sample request does not rely on undeclared fixture IDs.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "shared_budget_prospecting"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_ids:
        - id: "display_300x250"
    - product_id: "shared_budget_retargeting"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_ids:
        - id: "display_300x250"
  pricing_options:
    - product_id: "shared_budget_prospecting"
      pricing_option_id: "prospecting_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 1.50
    - product_id: "shared_budget_retargeting"
      pricing_option_id: "retargeting_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 2.00
    - product_id: "shared_budget_retargeting"
      pricing_option_id: "retargeting_cpm_eur"
      pricing_model: "cpm"
      currency: "EUR"
      floor_price: 2.00

phases:
  - id: setup
    title: "Establish account and discover eligible products"
    steps:
      - id: sync_accounts
        title: "Establish account"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: "Return an active account."
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
          idempotency_key: "$generate:uuid_v4#seller_optimized_budget_setup_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a seller-assigned identifier"

      - id: get_products_for_shared_budget
        title: "Discover products for shared allocation"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: false
        expected: "Return the seeded products with compatible USD pricing and click optimization."
        sample_request:
          idempotency_key: "$generate:uuid_v4#seller_optimized_budget_setup_get_products_for_shared_budget"
          buying_mode: "brief"
          brief: "Allocate a $100,000 performance budget across prospecting and retargeting display packages, optimizing for clicks."
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_present
            path: "products[1]"
            description: "At least two products are available for cross-package allocation"

  - id: create_shared_budget_buy
    title: "Create a seller-optimized buy with only core controls"
    steps:
      - id: create_media_buy_with_shared_budget
        title: "Delegate allocation across two uncapped packages"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        expected: |
          Accept the shared $100,000 total across two packages that carry no
          package budgets, minimum-spend targets, or package pacing. Echo
          seller_optimized allocation and even aggregate pacing without
          replacing them with seller-generated fixed allocations.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          budget_allocation:
            mode: "seller_optimized"
            optimization_goals:
              - kind: "metric"
                metric: "clicks"
                priority: 1
          pacing: "even"
          packages:
            - product_id: "shared_budget_prospecting"
              pricing_option_id: "prospecting_cpm"
            - product_id: "shared_budget_retargeting"
              pricing_option_id: "retargeting_cpm"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#seller_optimized_budget_create_shared_budget_buy"
        context_outputs:
          - name: media_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json"
          - check: field_present
            path: "media_buy_id"
            description: "Seller creates the media buy"
          - check: field_value
            path: "total_budget"
            value: 100000
            description: "Response echoes the hard aggregate budget"
          - check: field_value
            path: "budget_allocation.mode"
            value: "seller_optimized"
            description: "Response preserves delegated allocation mode"
          - check: field_value
            path: "pacing"
            value: "even"
            description: "Response preserves aggregate pacing"

  - id: read_shared_budget_buy
    title: "Verify durable allocation configuration"
    steps:
      - id: get_media_buy_with_shared_budget
        title: "Read back the media buy"
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: true
        expected: "Return the accepted shared total, allocation mode, and aggregate pacing unchanged."
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids:
            - "$context.media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json"
          - check: field_value
            path: "media_buys[0].media_buy_id"
            value: "$context.media_buy_id"
            description: "Read returns the created buy"
          - check: field_value
            path: "media_buys[0].total_budget"
            value: 100000
            description: "Read preserves the aggregate budget"
          - check: field_value
            path: "media_buys[0].budget_allocation.mode"
            value: "seller_optimized"
            description: "Read preserves seller-optimized allocation"
          - check: field_value
            path: "media_buys[0].pacing"
            value: "even"
            description: "Read preserves aggregate pacing"

  - id: reject_mixed_currency_shared_buy
    title: "Reject a pricing option outside the media-buy currency"
    steps:
      - id: create_mixed_currency_shared_buy
        title: "Reject a mixed-currency shared allocation"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: false
        expect_error: true
        negative_path: payload_well_formed
        expected: |
          Reject before mutation because the second package's EUR pricing
          option does not match the media buy's USD denomination.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          budget_allocation:
            mode: "seller_optimized"
            optimization_goals:
              - kind: "metric"
                metric: "clicks"
                priority: 1
          packages:
            - product_id: "shared_budget_prospecting"
              pricing_option_id: "prospecting_cpm"
            - product_id: "shared_budget_retargeting"
              pricing_option_id: "retargeting_cpm_eur"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#seller_optimized_budget_currency_mismatch"
        validations:
          - check: error_code
            value: "TERMS_REJECTED"
            description: "Seller enforces the single media-buy currency before mutation"

  - id: reject_aggregate_minimum_exceeds_total
    title: "Reject package minimums that collectively exceed the total budget"
    depends_on: [setup]
    requires_capability:
      path: media_buy.features.seller_optimized_min_spend_targets
      equals: true
    steps:
      - id: create_oversubscribed_aggregate_minimum
        title: "Reject sum(min_spend_target) greater than total_budget"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: false
        expect_error: true
        negative_path: payload_well_formed
        expected: |
          Reject before mutation because the package minimum-spend targets
          (60000 + 50000 = 110000) collectively exceed total_budget (100000).
          Graded only for sellers that declare minimum-spend targets; an
          undeclared control is rejected with UNSUPPORTED_FEATURE instead.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          budget_allocation:
            mode: "seller_optimized"
            optimization_goals:
              - kind: "metric"
                metric: "clicks"
                priority: 1
          packages:
            - product_id: "shared_budget_prospecting"
              pricing_option_id: "prospecting_cpm"
              min_spend_target: 60000
            - product_id: "shared_budget_retargeting"
              pricing_option_id: "retargeting_cpm"
              min_spend_target: 50000
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#seller_optimized_budget_aggregate_min_exceeds_total"
        validations:
          - check: error_code
            value: "INVALID_REQUEST"
            description: "Seller rejects over-subscribed aggregate minimum-spend targets before mutation"

  - id: bind_media_buy_cost_to_allocation_goal
    title: "Bind a shared cost control to the allocation goal"
    requires_capability:
      path: media_buy.features.bidding_policy.media_buy.seller_optimized.cost_per_strengths
      contains: cap
    steps:
      - id: create_shared_budget_buy_with_cost_cap
        title: "Create a shared buy with a cross-package click cost cap"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        expected: |
          Accept the cost cap as a control on the primary allocation goal
          (clicks), independent of any package-local optimization goals.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          budget_allocation:
            mode: "seller_optimized"
            optimization_goals:
              - kind: "metric"
                metric: "clicks"
                priority: 1
          bidding:
            cost_per:
              amount: 4
              strength: "cap"
          packages:
            - product_id: "shared_budget_prospecting"
              pricing_option_id: "prospecting_cpm"
            - product_id: "shared_budget_retargeting"
              pricing_option_id: "retargeting_cpm"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#seller_optimized_budget_cost_cap"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json"
          - check: field_present
            path: "media_buy_id"
            description: "Seller accepts the allocation-goal cost cap"
          - check: field_value
            path: "bidding.cost_per.amount"
            value: 4
            description: "Response preserves the media-buy-authored allocation cost cap"

  - id: preserve_shared_package_automatic
    title: "Preserve package automatic bidding under shared allocation"
    depends_on: [setup]
    requires_capability:
      path: media_buy.features.bidding_policy.package.seller_optimized.modes
      contains: automatic
    steps:
      - id: create_shared_buy_with_package_automatic
        title: "Author package automatic bidding in a shared buy"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        expected: "Preserve the explicit automatic policy only on the retargeting package."
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          budget_allocation:
            mode: "seller_optimized"
            optimization_goals:
              - kind: "metric"
                metric: "clicks"
          packages:
            - product_id: "shared_budget_prospecting"
              pricing_option_id: "prospecting_cpm"
            - product_id: "shared_budget_retargeting"
              pricing_option_id: "retargeting_cpm"
              bidding:
                automatic: true
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#seller_optimized_budget_package_automatic"
        context_outputs:
          - name: shared_automatic_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json"
          - check: field_contains
            path: "packages[*]"
            value:
              product_id: "shared_budget_retargeting"
              bidding:
                automatic: true
            description: "Response preserves the explicit package automatic policy"

      - id: read_shared_buy_with_package_automatic
        title: "Read back shared package automatic bidding"
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: true
        expected: "Return the explicit automatic block on the same package."
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids:
            - "$context.shared_automatic_buy_id"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json"
          - check: field_contains
            path: "media_buys[0].packages[*]"
            value:
              product_id: "shared_budget_retargeting"
              bidding:
                automatic: true
            description: "Readback preserves the package-authored automatic policy"

  - id: package_budgets
    title: "Honor package budget caps"
    depends_on: [setup]
    requires_capability:
      path: media_buy.features.seller_optimized_package_budgets
      equals: true
    steps:
      - id: create_shared_buy_with_package_budgets
        title: "Cap both packages above the combined total"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        expected: |
          Accept hard package caps (70000 and 60000) whose sum exceeds the
          shared total. The caps are ceilings, not reserved allocations, and
          are echoed unchanged.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          budget_allocation:
            mode: "seller_optimized"
            optimization_goals:
              - kind: "metric"
                metric: "clicks"
                priority: 1
          pacing: "even"
          packages:
            - product_id: "shared_budget_prospecting"
              pricing_option_id: "prospecting_cpm"
              budget: 70000
            - product_id: "shared_budget_retargeting"
              pricing_option_id: "retargeting_cpm"
              budget: 60000
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#seller_optimized_budget_package_budgets"
        context_outputs:
          - name: package_budgets_media_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json"
          - check: field_value
            path: "budget_allocation.mode"
            value: "seller_optimized"
            description: "Response preserves delegated allocation mode"
          - check: field_contains
            path: "packages[*]"
            value:
              product_id: "shared_budget_prospecting"
              budget: 70000
            description: "Response preserves the prospecting package cap"

      - id: read_shared_buy_with_package_budgets
        title: "Read back package budget caps"
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: true
        expected: "Return the accepted package budget caps unchanged."
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids:
            - "$context.package_budgets_media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json"
          - check: field_contains
            path: "media_buys[0].packages[*]"
            value:
              product_id: "shared_budget_prospecting"
              budget: 70000
            description: "Readback preserves the prospecting package cap"

  - id: min_spend_targets
    title: "Honor a package minimum-spend target"
    depends_on: [setup]
    requires_capability:
      path: media_buy.features.seller_optimized_min_spend_targets
      equals: true
    steps:
      - id: create_shared_buy_with_min_spend_targets
        title: "Set a soft minimum on the prospecting package"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        expected: |
          Accept a soft minimum-spend target (20000) on an uncapped
          prospecting package and echo it unchanged.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          budget_allocation:
            mode: "seller_optimized"
            optimization_goals:
              - kind: "metric"
                metric: "clicks"
                priority: 1
          pacing: "even"
          packages:
            - product_id: "shared_budget_prospecting"
              pricing_option_id: "prospecting_cpm"
              min_spend_target: 20000
            - product_id: "shared_budget_retargeting"
              pricing_option_id: "retargeting_cpm"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#seller_optimized_budget_min_spend_targets"
        context_outputs:
          - name: min_spend_targets_media_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json"
          - check: field_value
            path: "budget_allocation.mode"
            value: "seller_optimized"
            description: "Response preserves delegated allocation mode"
          - check: field_contains
            path: "packages[*]"
            value:
              product_id: "shared_budget_prospecting"
              min_spend_target: 20000
            description: "Response preserves the soft package minimum-spend target"

      - id: read_shared_buy_with_min_spend_targets
        title: "Read back package minimum-spend targets"
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: true
        expected: "Return the accepted package minimum-spend targets unchanged."
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids:
            - "$context.min_spend_targets_media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json"
          - check: field_contains
            path: "media_buys[0].packages[*]"
            value:
              product_id: "shared_budget_prospecting"
              min_spend_target: 20000
            description: "Readback preserves the package minimum-spend target"

  - id: package_pacing
    title: "Honor subordinate package pacing"
    depends_on: [setup]
    requires_capability:
