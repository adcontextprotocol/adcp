id: media_buy_seller/governance_conditions
version: "1.0.0"
title: "Buyer resolves governance conditions before seller execution"
category: media_buy_seller
summary: "Verifies that conditions are a non-authorizing intent counterproposal and that only a later approval permits the seller to commit a media buy."
track: media_buy
requires:
  - multi_agent
default_agent: sales
required_tools:
  - sync_plans
  - sync_accounts
  - sync_governance
  - get_products
  - check_governance
  - create_media_buy
  - get_media_buys
  - report_plan_outcome

requires_capability:
  path: media_buy.governance_aware
  equals: true

narrative: |
  This multi-agent test sets up a governance plan whose CTV reporting policy
  produces an intent counterproposal. The first check returns `conditions` and
  a non-authorizing `consultation_context`. It must not return
  `governance_context`, and no media-buy mutation may occur at that point.

  The buyer applies the machine-actionable condition to the complete proposed
  `create_media_buy` request and repeats the intent check with the consultation
  handle. Only an `approved` verdict returns the `governance_context` that the
  buyer may send to the seller.

  During `create_media_buy`, the seller presents that authorization and its
  planned delivery to the registered governance agent. Execution checks are
  binary: only `approved` permits commit; `denied` blocks commit, and a
  `conditions` response is invalid at execution time. The scenario proves the
  commit through `get_media_buys` and closes the buyer-side accountability loop
  with `report_plan_outcome`; it does not require the seller to echo governance
  conditions or authorization context in its response.

context:
  governance_agent_url: "https://test-agent.adcontextprotocol.org"
  seller_agent_url: "https://seller.example.com"

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - governance_aware
  examples:
    - "Any media buy seller with governance support"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    A multi-agent runner with `sales` and `governance` agents. The governance
    agent supports plan synchronization, intent negotiation, execution checks,
    and outcome reporting. The sales agent supports governance registration,
    media-buy creation, and media-buy readback. Override `seller_agent_url` in
    the initial context with the exact sales-agent endpoint used by the runner.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "outdoor_ctv_q2"
      delivery_type: "guaranteed"
      channels: ["ctv"]
      format_options:
        - format_option_id: "video_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
  pricing_options:
    - product_id: "outdoor_ctv_q2"
      pricing_option_id: "cpm_guaranteed"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 45.0

phases:
  - id: governance_plan_setup
    title: "Set up a conditional governance plan"
    narrative: |
      Register a plan with enough budget for the buy and a machine-actionable
      must-policy that the buyer must acknowledge before approval.
    steps:
      - id: sync_plans
        title: "Create the conditional governance plan"
        agent: governance
        task: sync_plans
        schema_ref: "governance/sync-plans-request.json"
        response_schema_ref: "governance/sync-plans-response.json"
        doc_ref: "/governance/campaign/tasks/sync_plans"
        stateful: true
        expected: |
          The governance agent activates the plan and returns its plan_id.
        sample_request:
          idempotency_key: "$generate:uuid_v4#governance_conditions_sync_plans"
          plans:
            - plan_id: "comply-gov-conditions-plan"
              brand:
                domain: "acmeoutdoor.example"
              objectives: "Q2 CTV campaign with weekly reporting"
              budget:
                total: 100000
                currency: "USD"
                reallocation_threshold: 100000
              flight:
                start: "2020-01-01T00:00:00Z"
                end: "2099-06-30T23:59:59Z"
              countries: ["US"]
              custom_policies:
                - policy_id: "ctv_weekly_reporting"
                  enforcement: "must"
                  policy: "Acknowledge weekly delivery reporting for CTV buys."
        context_outputs:
          - name: plan_id
            path: "plans[0].plan_id"
        validations:
          - check: response_schema
            description: "Response matches sync-plans-response.json schema"
          - check: field_value
            path: "plans[0].status"
            value: "active"
            description: "Conditional governance plan is active"

  - id: seller_setup
    title: "Register buyer and governance agent with the seller"
    steps:
      - id: sync_accounts
        title: "Establish the seller account"
        agent: sales
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: |
          Return an active account for Acme Outdoor and Pinnacle Agency.
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
              payment_terms: "net_30"
          idempotency_key: "$generate:uuid_v4#governance_conditions_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json schema"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a platform-assigned ID"

      - id: sync_governance
        title: "Register the governance agent"
        agent: sales
        task: sync_governance
        schema_ref: "account/sync-governance-request.json"
        response_schema_ref: "account/sync-governance-response.json"
        doc_ref: "/accounts/tasks/sync_governance"
        stateful: true
        expected: |
          The seller stores the governance endpoint used before committing spend.
        sample_request:
          accounts:
            - account:
                brand:
                  domain: "acmeoutdoor.example"
                operator: "pinnacle-agency.example"
              governance_agents:
                - url: "$context.governance_agent_url"
                  authentication:
                    schemes: ["Bearer"]
                    credentials: "gov-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          idempotency_key: "$generate:uuid_v4#governance_conditions_sync_governance"
        validations:
          - check: response_schema
            description: "Response matches sync-governance-response.json schema"

  - id: product_discovery
    title: "Discover the CTV product"
    steps:
      - id: get_products_brief
        title: "Discover CTV inventory"
        agent: sales
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        comply_scenario: full_sales_flow
        stateful: false
        expected: |
          Return the seeded CTV product and its USD pricing option.
        sample_request:
          buying_mode: "brief"
          brief: "CTV inventory on outdoor lifestyle content. $25K budget, adults 25-54, US."
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
        context_outputs:
          - name: product_id
            path: "products[0].product_id"
          - name: pricing_option_id
            path: "products[0].pricing_options[0].pricing_option_id"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: field_present
            path: "products[0].product_id"
            description: "A CTV product is available for the proposed buy"

  - id: intent_negotiation
    title: "Resolve conditions before authorization"
    narrative: |
      The buyer submits the exact downstream request for an intent check. The
      first verdict is a counterproposal, not permission to mutate. The buyer
      applies the condition and re-checks the adjusted request before contacting
      the seller.
    steps:
      - id: check_governance_conditions
        title: "Receive the non-authorizing intent conditions"
        agent: governance
        task: check_governance
        schema_ref: "governance/check-governance-request.json"
        response_schema_ref: "governance/check-governance-response.json"
        doc_ref: "/governance/campaign/tasks/check_governance"
        stateful: true
        expected: |
          Return `verdict: conditions`, `check_type: intent`, at least one
          machine-actionable condition, and `consultation_context`. The response
          must omit both `governance_context` and `expires_at`; no seller
          mutation is authorized.
        sample_request:
          plan_id: "$context.plan_id"
          caller: "https://pinnacle-agency.example"
          target_agent: "$context.seller_agent_url"
          tool: "create_media_buy"
          purchase_type: "media_buy"
          proposed_commitment:
            amount: 25000
            currency: "USD"
          payload:
            brand:
              domain: "acmeoutdoor.example"
            account:
              brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
            total_budget:
              amount: 25000
              currency: "USD"
            start_time: "asap"
            end_time: "2099-06-30T23:59:59Z"
            packages:
              - product_id: "$context.product_id"
                budget: 25000
                pricing_option_id: "$context.pricing_option_id"
            idempotency_key: "$generate:uuid_v4#governance_conditions_create_media_buy"
        context_outputs:
          - name: consultation_context
            path: "consultation_context"
        validations:
          - check: response_schema
            description: "Conditions response matches the modern governance schema"
          - check: field_value
            path: "verdict"
            value: "conditions"
            description: "The first intent verdict is conditions"
          - check: field_value
            path: "check_type"
            value: "intent"
            description: "Conditions are restricted to intent checks"
          - check: field_present
            path: "conditions[0].field"
            description: "The response includes a machine-actionable request field"
          - check: field_value
            path: "conditions[0].field"
            value: "payload.ext.governance_policy_acknowledgements"
            description: "The condition addresses the complete proposed request"
          - check: field_present
            path: "conditions[0].required_value"
            description: "The response states the value required for approval"
          - check: field_present
            path: "consultation_context"
            description: "The response carries a non-authorizing consultation handle"
          - check: field_absent
            path: "governance_context"
            description: "Conditions never carry execution authorization"
          - check: field_absent
            path: "expires_at"
            description: "A non-authorizing conditions verdict has no authorization expiry"

      - id: check_governance_adjusted
        title: "Re-check the adjusted intent"
        agent: governance
        task: check_governance
        schema_ref: "governance/check-governance-request.json"
        response_schema_ref: "governance/check-governance-response.json"
        doc_ref: "/governance/campaign/tasks/check_governance"
        stateful: true
        expected: |
          The adjusted request is approved. This new verdict, not the preceding
          conditions response, returns the authorization context and expiry.
        sample_request:
          plan_id: "$context.plan_id"
          caller: "https://pinnacle-agency.example"
          target_agent: "$context.seller_agent_url"
          tool: "create_media_buy"
          purchase_type: "media_buy"
          consultation_context: "$context.consultation_context"
          proposed_commitment:
            amount: 25000
            currency: "USD"
          payload:
            brand:
              domain: "acmeoutdoor.example"
            account:
              brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
            total_budget:
              amount: 25000
              currency: "USD"
            start_time: "asap"
            end_time: "2099-06-30T23:59:59Z"
            packages:
              - product_id: "$context.product_id"
                budget: 25000
                pricing_option_id: "$context.pricing_option_id"
            idempotency_key: "$generate:uuid_v4#governance_conditions_create_media_buy"
            ext:
              governance_policy_acknowledgements:
                - "ctv_weekly_reporting"
        context_outputs:
          - name: approved_check_id
            path: "check_id"
          - name: governance_context
            path: "governance_context"
        validations:
          - check: response_schema
            description: "Approved response matches the modern governance schema"
          - check: field_value
            path: "verdict"
            value: "approved"
            description: "The adjusted intent receives explicit approval"
          - check: field_value
            path: "check_type"
            value: "intent"
            description: "The approval authorizes the downstream intent"
          - check: field_present
            path: "governance_context"
            description: "Only the approved verdict supplies authorization"
          - check: field_present
            path: "expires_at"
            description: "The authorization has a bounded lifetime"
          - check: field_absent
            path: "consultation_context"
            description: "Approval replaces the consultation handle with authorization"

  - id: governed_execution
    title: "Commit only after a binary execution approval"
    narrative: |
      The buyer now sends the exact adjusted request to the seller with the
      approval token. Before commit, the seller checks the planned delivery
      against the registered governance agent. That execution response must be
      `approved` or `denied`; `conditions` is invalid and cannot authorize a
      media buy. A successful create response therefore establishes that the
      seller received execution approval before committing.
    steps:
      - id: create_media_buy_after_approval
        title: "Create the governed CTV buy"
        agent: sales
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        comply_scenario: create_media_buy
        stateful: true
        expected: |
          The seller verifies the authorization and obtains a binary
          `approved` execution verdict before committing. A `denied` verdict
          blocks the mutation; a `conditions` execution verdict is invalid and
          must never be treated as approval. The create response need not echo
          governance conditions or governance_context.
        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          total_budget:
            amount: 25000
            currency: "USD"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          packages:
            - product_id: "$context.product_id"
              budget: 25000
              pricing_option_id: "$context.pricing_option_id"
          idempotency_key: "$generate:uuid_v4#governance_conditions_create_media_buy"
          ext:
            governance_policy_acknowledgements:
              - "ctv_weekly_reporting"
          governance_context: "$context.governance_context"
        context_outputs:
          - name: media_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json schema"
          - check: field_present
            path: "media_buy_id"
            description: "Seller returns an identifier only after execution approval"

  - id: committed_state_and_outcome
    title: "Prove committed state and report the outcome"
    narrative: |
      Read the seller's authoritative state instead of relying on a
      non-normative response echo, then report the completed action against the
      exact approved check and authorization context.
    steps:
      - id: get_media_buys_readback
        title: "Read back the committed media buy"
        agent: sales
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: false
        expected: |
          The seller returns the media buy created after governance approval,
          including its committed total budget and package state.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids:
            - "$context.media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json schema"
          - check: field_equals_context
            path: "media_buys[0].media_buy_id"
            context_key: "media_buy_id"
            description: "Readback returns the media buy created after approval"
          - check: field_value
            path: "media_buys[0].total_budget"
            value: 25000
            description: "Readback proves the adjusted request was committed"
          - check: field_value
            path: "media_buys[0].currency"
            value: "USD"
            description: "Readback preserves the authorized commitment currency"

      - id: report_plan_outcome
        title: "Report the completed governed action"
        agent: governance
        task: report_plan_outcome
        schema_ref: "governance/report-plan-outcome-request.json"
        response_schema_ref: "governance/report-plan-outcome-response.json"
        doc_ref: "/governance/campaign/tasks/report_plan_outcome"
        stateful: true
        expected: |
          The governance agent accepts a completed outcome tied to the approved
          check, the authorization context, and the seller's media_buy_id.
        sample_request:
          plan_id: "$context.plan_id"
          check_id: "$context.approved_check_id"
          governance_context: "$context.governance_context"
          purchase_type: "media_buy"
          outcome: "completed"
          seller_response:
            seller_reference: "$context.media_buy_id"
            committed_budget: 25000
            packages:
              - budget: 25000
          idempotency_key: "$generate:uuid_v4#governance_conditions_report_outcome"
        validations:
          - check: response_schema
            description: "Response matches report-plan-outcome-response.json schema"
          - check: field_present
            path: "outcome_id"
            description: "Governance stores an auditable outcome record"
          - check: field_value
            path: "outcome_state"
            value: "accepted"
            description: "The completed governed action is accepted"
