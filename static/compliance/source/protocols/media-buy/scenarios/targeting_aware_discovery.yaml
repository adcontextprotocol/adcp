id: media_buy_seller/targeting_aware_discovery
version: "1.0.0"
title: "Seller resolves targeting during discovery and persists inventory selection"
category: media_buy_seller
summary: "Verifies targeting-scoped discovery forecasts, future overlay support, sparse configured-product modifications, opaque product acceptance, and placement selection across create/update/readback."
track: media_buy

required_tools:
  - get_products
  - create_media_buy
  - update_media_buy
  - get_media_buys
  - comply_test_controller

invariants:
  - status.monotonic

narrative: |
  Buyers provide concrete targeting during get_products so returned products,
  pricing, and forecasts already describe the inventory they can buy. Exact
  acceptance of a structured overlay produces no targeting echo. Explicit hard
  targeting in a brief remains binding; sellers should confirm any structured
  predicate inferred from prose once through response-level
  targeting_resolution.brief_targeting.
  A seller may offer a different executable predicate only as a sparse
  modification on a distinct, expiring configured product; purchasing that
  product accepts the change.

  required_overlay_support is capability discovery, not a breakout request.
  It filters to products that permit later package-level selection. Placement,
  property, and collection selection are inventory targeting. Creative
  placement_refs remain routing instructions within the purchased set.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - targeting_aware_discovery
    - placement_targeting
  examples:
    - "National video products targetable by DMA and social surface"
    - "Local inventory products whose inherent scope satisfies geo targeting"
    - "Products backed by seller-defined demographic intervals"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The controller seeds a non-guaranteed video product with US inventory,
    Nielsen DMA support, two targetable publisher-scoped placements, list
    targeting support, and enumerated age intervals. The seller can return
    request-scoped configured products derived from this catalog product.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "targeting_aware_video_catalog"
      delivery_type: "non_guaranteed"
      channels: ["olv"]
      format_ids:
        - id: "video_30s"
      placements:
        - kind: "publisher_ref"
          publisher_domain: "pinnacle-media.example"
          placement_id: "feed"
          mode: "targetable"
        - kind: "publisher_ref"
          publisher_domain: "pinnacle-media.example"
          placement_id: "short_video"
          mode: "targetable"
      property_targeting_allowed: true
      collection_targeting_allowed: true
      overlay_support:
        geo_metros:
          systems: ["nielsen_dma"]
        placement_selection:
          max_values_per_package: 2
        property_list: true
        collection_list: true
        demographics:
          age: true
      demographic_targeting:
        age:
          execution_modes: ["enumerated_intervals"]
          unknown_handling: "always_excluded"
          intervals:
            - interval_id: "age_18_24"
              age: { min: 18, max: 24, include_unknown: false }
            - interval_id: "age_25_34"
              age: { min: 25, max: 34, include_unknown: false }
            - interval_id: "age_35_44"
              age: { min: 35, max: 44, include_unknown: false }
  pricing_options:
    - product_id: "targeting_aware_video_catalog"
      pricing_option_id: "targeting_aware_video_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 12.0

phases:
  - id: brief_targeting_confirmation
    title: "Confirm hard targeting inferred from a brief"
    steps:
      - id: get_brief_targeted_product
        title: "State hard US and age requirements only in prose"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: true
        sample_request:
          buying_mode: "brief"
          brief: "Premium outdoor video. Hard requirements: deliver only in the US and only to people ages 18 through 44."
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          filters:
            channels: ["olv"]
            pricing_currencies: ["USD"]
          fields:
            - product_id
            - pricing_options
            - forecast
            - targeting_resolution
            - is_custom
            - expires_at
          context:
            correlation_id: "targeting_aware_discovery--brief_confirmation"
        expected: |
          Treat the explicit geography and age statements as hard requirements,
          even though the buyer should normally have sent them in
          targeting_overlay. Return only products whose forecast and pricing
          reflect those constraints. As a best practice, confirm the structured
          interpretation in targeting_resolution.brief_targeting.
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_present
            path: "targeting_resolution.brief_targeting"
            description: "Seller confirms hard targeting inferred from prose (advisory — SHOULD)"
            severity: advisory
            permanent_advisory:
              reason: "Brief targeting confirmation is a SHOULD: omission is schema-valid, but buyers cannot mechanically verify how hard prose requirements were interpreted."
          - check: field_value
            path: "products[0].is_custom"
            value: true
            description: "Hard brief targeting produces a request-specific configured product"
          - check: field_present
            path: "products[0].expires_at"
            description: "Brief-targeted configured product is time-bound"
          - check: field_value
            path: "targeting_resolution.brief_targeting.geo_countries[0]"
            value: "US"
            description: "Brief confirmation preserves the hard US-only requirement (advisory — SHOULD)"
            severity: advisory
            permanent_advisory:
              reason: "The confirmation itself is a SHOULD; when emitted, it should preserve the explicit hard geography."
          - check: field_value
            path: "targeting_resolution.brief_targeting.demographics.age.min"
            value: 18
            description: "Brief confirmation preserves the requested minimum age (advisory — SHOULD)"
            severity: advisory
            permanent_advisory:
              reason: "The confirmation itself is a SHOULD; when emitted, it should preserve the explicit hard age predicate."
          - check: field_value
            path: "targeting_resolution.brief_targeting.demographics.age.max"
            value: 44
            description: "Brief confirmation preserves the requested maximum age (advisory — SHOULD)"
            severity: advisory
            permanent_advisory:
              reason: "The confirmation itself is a SHOULD; when emitted, it should preserve the explicit hard age predicate."

  - id: exact_targeting_discovery
    title: "Discover an exact configured product without targeting echo"
    steps:
      - id: get_exact_targeted_product
        title: "Provide real US and placement targeting plus future DMA support"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: true
        sample_request:
          buying_mode: "brief"
          brief: "Premium video for outdoor enthusiasts"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          filters:
            channels: ["olv"]
            pricing_currencies: ["USD"]
          targeting_overlay:
            geo_countries: ["US"]
            placement_selection:
              mode: "selected"
              placement_refs:
                - publisher_domain: "pinnacle-media.example"
                  placement_id: "feed"
          required_overlay_support:
            geo_metros:
              systems: ["nielsen_dma"]
            placement_selection: true
            property_list: true
            collection_list: true
          fields:
            - product_id
            - pricing_options
            - forecast
            - overlay_support
            - targeting_resolution
            - is_custom
            - expires_at
          context:
            correlation_id: "targeting_aware_discovery--exact"
        expected: |
          Return one configured product whose price and availability forecast
          are scoped to US feed inventory. Exact acceptance omits
          targeting_resolution. overlay_support confirms later DMA, placement,
          property-list, and collection-list selection without returning one
          product per possible value.
        context_outputs:
          - key: "exact_product_id"
            path: "products[0].product_id"
          - key: "exact_pricing_option_id"
            path: "products[0].pricing_options[0].pricing_option_id"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_absent
            path: "products[0].targeting_resolution"
            description: "Exact targeting acceptance has no echo"
          - check: field_value
            path: "products[0].is_custom"
            value: true
            description: "Exact request-bound targeting is a configured custom product"
          - check: field_present
            path: "products[0].expires_at"
            description: "Exact configured product is time-bound even without a resolution echo"
          - check: field_present
            path: "products[0].forecast"
            description: "Forecast is present for the effective targeting"
          - check: field_present
            path: "products[0].overlay_support.geo_metros"
            description: "Product supports later Nielsen DMA targeting as requested"
          - check: field_value
            path: "products[0].overlay_support.property_list"
            value: true
            description: "Product supports later property-list selection"

      - id: get_unsupported_future_targeting
        title: "Exclude products that lack a required future dimension"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: true
        sample_request:
          buying_mode: "brief"
          brief: "Premium video for outdoor enthusiasts"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          filters:
            channels: ["olv"]
          required_overlay_support:
            geo_proximity:
              travel_time: true
          context:
            correlation_id: "targeting_aware_discovery--unsupported_support"
        expected: |
          Return no products because the seeded product does not declare
          selectable travel-time proximity targeting. Missing required support
          is an exclusion, never a false-positive product match.
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_value
            path: "products"
            value: []
            description: "Unsupported future targeting excludes every product"

  - id: modified_targeting_discovery
    title: "Accept a seller-supported demographic alternative through product selection"
    steps:
      - id: get_modified_age_product
        title: "Request an age range the product cannot execute exactly"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: true
        sample_request:
          buying_mode: "brief"
          brief: "Premium video for adults"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          targeting_overlay:
            demographics:
              age: { min: 21, max: 35, include_unknown: false }
          fields:
            - product_id
            - pricing_options
            - forecast
            - targeting_resolution
            - expires_at
          context:
            correlation_id: "targeting_aware_discovery--modified_age"
        expected: |
          Return a distinct configured product proposing ages 25–34. The sparse
          resolution contains only /demographics/age, expires_at bounds the
          offer, and the forecast reflects ages 25–34 rather than the catalog
          product or original inexact request.
        context_outputs:
          - key: "modified_product_id"
            path: "products[0].product_id"
          - key: "modified_pricing_option_id"
            path: "products[0].pricing_options[0].pricing_option_id"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_value
            path: "products[0].targeting_resolution.modifications[0].operation"
            value: "replace"
            description: "Seller returns a sparse replacement"
          - check: field_value
            path: "products[0].targeting_resolution.modifications[0].path"
            value: "/demographics/age"
            description: "Modification points to the age predicate"
          - check: field_value
            path: "products[0].targeting_resolution.modifications[0].applied"
            value: { min: 25, max: 34, include_unknown: false }
            description: "Configured age predicate is 25–34 with unknown ages excluded"
          - check: field_present
            path: "products[0].expires_at"
            description: "Modified configured product is time-bound"
      - id: create_from_modified_product
        title: "Purchase the configured product without repeating discovery targeting"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          idempotency_key: "$generate:uuid_v4#targeting_aware_discovery_modified_create"
          start_time: "asap"
          end_time: "2099-09-30T23:59:59Z"
          packages:
            - product_id: "$context.modified_product_id"
              pricing_option_id: "$context.modified_pricing_option_id"
              bid_price: 14.0
              budget: 5000
        expected: |
          Selecting the configured product accepts ages 25–34. The response
          package echoes complete effective targeting and never stores
          equivalent false.
        context_outputs:
          - key: "modified_media_buy_id"
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json"
          - check: field_value
            path: "packages[0].targeting_overlay.demographics.age.min"
            value: 25
            description: "Accepted effective lower bound is echoed"
          - check: field_value
            path: "packages[0].targeting_overlay.demographics.age.max"
            value: 34
            description: "Accepted effective upper bound is echoed"
          - check: field_value
            path: "packages[0].targeting_resolution.demographics.equivalent"
            value: true
            description: "Booked predicate remains exact"

  - id: placement_lifecycle
    title: "Persist purchased placement targeting through create and update"
    steps:
      - id: create_feed_package
        title: "Create from exact discovery result"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          idempotency_key: "$generate:uuid_v4#targeting_aware_discovery_placement_create"
          start_time: "asap"
          end_time: "2099-09-30T23:59:59Z"
          packages:
            - product_id: "$context.exact_product_id"
              pricing_option_id: "$context.exact_pricing_option_id"
              bid_price: 14.0
              budget: 5000
        expected: |
          The configured product retains the US and feed targeting accepted at
          discovery even though the buyer does not repeat it.
        context_outputs:
          - key: "placement_media_buy_id"
            path: "media_buy_id"
          - key: "placement_package_id"
            path: "packages[0].package_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json"
          - check: field_value
            path: "packages[0].targeting_overlay.placement_selection.mode"
            value: "selected"
            description: "Purchased placement selection is echoed"
          - check: field_value
            path: "packages[0].targeting_overlay.placement_selection.placement_refs[0].placement_id"
            value: "feed"
            description: "Feed is the purchased placement"

      - id: update_to_short_video
        title: "Replace purchased placement targeting"
        task: update_media_buy
        schema_ref: "media-buy/update-media-buy-request.json"
        response_schema_ref: "media-buy/update-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/update_media_buy"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          media_buy_id: "$context.placement_media_buy_id"
          idempotency_key: "$generate:uuid_v4#targeting_aware_discovery_placement_update"
          packages:
            - package_id: "$context.placement_package_id"
              targeting_overlay:
                geo_countries: ["US"]
                placement_selection:
                  mode: "selected"
                  placement_refs:
                    - publisher_domain: "pinnacle-media.example"
                      placement_id: "short_video"
        expected: |
          Apply the full overlay replacement atomically under update_targeting.
          The response echoes short_video as the committed purchased set. The
          seller rejects rather than partially applying an invalid selection.
        validations:
          - check: response_schema
            description: "Response matches update-media-buy-response.json"
          - check: field_contains
            path: "affected_packages[*]"
            value:
              package_id: "$context.placement_package_id"
              targeting_overlay:
                geo_countries: ["US"]
                placement_selection:
                  mode: "selected"
                  placement_refs:
                    - publisher_domain: "pinnacle-media.example"
                      placement_id: "short_video"
            description: "Update response returns complete post-update placement targeting state"

      - id: read_updated_placement
        title: "Verify purchased placement state"
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          media_buy_ids: ["$context.placement_media_buy_id"]
        expected: |
          Return complete effective targeting with short_video selected. The
          stored package does not expose a separate effective-placement source
          of truth.
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json"
          - check: field_value
            path: "media_buys[0].packages[0].targeting_overlay.placement_selection.mode"
            value: "selected"
            description: "Readback uses committed selected mode"
          - check: field_value
            path: "media_buys[0].packages[0].targeting_overlay.placement_selection.placement_refs[0].placement_id"
            value: "short_video"
            description: "Readback preserves purchased placement identity"
