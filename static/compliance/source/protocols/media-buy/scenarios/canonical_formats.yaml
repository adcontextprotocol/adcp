  - id: canonical_product_discovery
    title: Canonical product discovery
    narrative: |
      The buyer reads the wholesale product feed and checks each seeded
      product by identity and format contract within the same response object.
      Catalog order, unrelated products, and reporting vendor support do not
      affect the canonical or named-format compatibility assertions.
    steps:
      - id: get_seeded_canonical_product
        title: Read products with canonical format declarations
        narrative: |
          Request the wholesale product feed so seeded catalog entries are
          returned without brief-mode ranking or curation. The response schema
          validates the full product shape, while a same-product membership
          check verifies the canonical declaration and its v1 projection link.
        task: get_products
        schema_ref: media-buy/get-products-request.json
        response_schema_ref: media-buy/get-products-wire-response.json
        doc_ref: /media-buy/task-reference/get_products
        comply_scenario: schema_compliance
        stateful: true
        expected: |
          Return products including the seeded canonical_formats_mrec_display
          product with:
          - format_ids[] containing the display_300x250_image v1 fallback from https://creative.adcontextprotocol.org/
          - format_options[] containing an image declaration
          - v1_format_ref[] linking the image declaration back to that fallback
          - params.width = 300 and params.height = 250
        sample_request:
          buying_mode: wholesale
          filters:
            channels:
              - display
            delivery_type: non_guaranteed
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_canonical_formats-a323283f
            sandbox: true
          context:
            correlation_id: canonical_formats--get_seeded_canonical_product
        validations:
          - check: response_schema
            description: Response matches get-products-response.json schema
          - check: field_present
            path: context
            description: Response echoes back the context object
          - check: field_value
            path: context.correlation_id
            value: canonical_formats--get_seeded_canonical_product
            description: Context correlation_id returned unchanged
          - check: field_contains
            path: products[*]
            value:
              product_id: canonical_formats_mrec_display
              format_ids:
                - agent_url: https://creative.adcontextprotocol.org/
                  id: display_300x250_image
              format_options:
                - format_kind: image
                  format_option_id: canonical_formats_image_mrec
                  v1_format_ref:
                    - agent_url: https://creative.adcontextprotocol.org/
                      id: display_300x250_image
                  params:
                    width: 300
                    height: 250
            description: The seeded product retains its format contract regardless of catalog or format ordering
        collect_product_pages: true
      - id: get_seeded_v1_only_product
        title: Read v1-only format declarations
        narrative: |
          Request the seeded product that intentionally publishes only
          `format_ids[]` on the producer side. This remains a valid 3.x
          product shape during the canonical-format migration window; this
          producer storyboard MUST NOT require the seller to synthesize
          `format_options[]` for that product.
        task: get_products
        schema_ref: media-buy/get-products-request.json
        response_schema_ref: media-buy/get-products-wire-response.json
        doc_ref: /media-buy/task-reference/get_products
        comply_scenario: schema_compliance
        stateful: true
        expected: |
          Return the seeded canonical_formats_ids_only_display product with a
          v1 fallback format_id. No producer-side `format_options[]` projection
          is required for v1-only products.
        sample_request:
          buying_mode: wholesale
          filters:
            channels:
              - display
            delivery_type: non_guaranteed
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_canonical_formats-a323283f
            sandbox: true
          context:
            correlation_id: canonical_formats--get_seeded_v1_only_product
        validations:
          - check: response_schema
            description: Response matches get-products-response.json schema
          - check: field_contains
            path: products[*]
            value:
              product_id: canonical_formats_ids_only_display
              format_ids:
                - agent_url: https://creative.adcontextprotocol.org/
                  id: display_728x90_image
            description: The seeded product retains its format contract regardless of catalog or format ordering
        collect_product_pages: true
      - id: get_seeded_v2_only_product
        title: Read v2-only format declarations
        narrative: |
          Request the seeded product that intentionally publishes only
          `format_options[]`. Producers can expose canonical product-bound
          declarations without also carrying v1 named-format fallbacks.
        task: get_products
        schema_ref: media-buy/get-products-request.json
        response_schema_ref: media-buy/get-products-wire-response.json
        doc_ref: /media-buy/task-reference/get_products
        comply_scenario: schema_compliance
        stateful: true
        expected: |
          Return the seeded canonical_formats_options_only_display product with
          an image canonical declaration and no format_ids fallback.
        sample_request:
          buying_mode: wholesale
          filters:
            channels:
              - display
            delivery_type: non_guaranteed
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_canonical_formats-a323283f
            sandbox: true
          context:
            correlation_id: canonical_formats--get_seeded_v2_only_product
        validations:
          - check: response_schema
            description: Response matches get-products-response.json schema
          - check: field_contains
            path: products[*]
            value:
              product_id: canonical_formats_options_only_display
              format_options:
                - format_kind: image
                  format_option_id: canonical_formats_image_leaderboard
                  params:
                    width: 728
                    height: 90
            description: The seeded product retains its format contract regardless of catalog or format ordering
        collect_product_pages: true
      - id: provision_test_kit_account
        title: Provision the account for the test-kit credential
        narrative: |
          The next step authenticates with the test kit's API key, a different
          buyer principal from the one controller seeding ran under. A natural
          key resolves on discovery only after that caller provisions it
          (accounts overview: Account references before provisioning), so the
          test-kit caller syncs the same account first.
        task: sync_accounts
        schema_ref: account/sync-accounts-request.json
        response_schema_ref: account/sync-accounts-response.json
        doc_ref: /accounts/tasks/sync_accounts
        auth:
          type: api_key
          from_test_kit: true
        stateful: true
        expected: |
          Provision the natural key for the test-kit caller.
        sample_request:
          accounts:
            - brand:
                domain: acmeoutdoor.example
              operator: pinnacle-agency.example
              operator_unit:
                id: compliance-media_buy_seller_canonical_formats-a323283f
              billing: operator
              payment_terms: net_30
              sandbox: true
          idempotency_key: $generate:uuid_v4#media_buy_seller_canonical_formats_provision_test_kit_account
          context:
            correlation_id: canonical_formats--provision_test_kit_account
        validations:
          - check: response_schema
            description: Response matches sync-accounts-response.json schema
          - check: field_present
            path: accounts[0].account_id
            description: The seller provisions the account for the test-kit caller
      - id: get_seeded_divergent_product
        title: Flag divergent dual-emission
        narrative: |
          Request the seeded product whose `format_ids[]` and
          `format_options[].v1_format_ref[]` intentionally disagree. Producers
          that self-detect this drift surface a non-fatal advisory on
          `errors[]` so consumers do not silently lose inventory.
        task: get_products
        schema_ref: media-buy/get-products-request.json
        response_schema_ref: media-buy/get-products-wire-response.json
        doc_ref: /media-buy/task-reference/get_products
        comply_scenario: schema_compliance
        auth:
          type: api_key
          from_test_kit: true
        stateful: true
        expected: |
          Return the seeded canonical_formats_divergent_display product and
          flag the divergent declarations with a non-fatal
          FORMAT_DECLARATION_DIVERGENT advisory in `errors[]`.
        sample_request:
          buying_mode: wholesale
          filters:
            channels:
              - display
            delivery_type: non_guaranteed
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_canonical_formats-a323283f
            sandbox: true
          context:
            correlation_id: canonical_formats--get_seeded_divergent_product
        validations:
          - check: response_schema
            description: Divergent dual-emission remains a populated get_products success response
          - check: field_contains
            path: products[*]
            value:
              product_id: canonical_formats_divergent_display
            description: The seeded product retains its format contract regardless of catalog or format ordering
          - check: field_contains
            path: errors[*]
            value:
              code: FORMAT_DECLARATION_DIVERGENT
              source: producer
            description: Divergent declarations emit the producer advisory regardless of advisory ordering
        collect_product_pages: true
  - id: canonical_create_satisfaction
    title: Canonical create-time format satisfaction
    narrative: |
      The buyer rereads the fixed-size seeded product so the runner's product
      context points at `canonical_formats_mrec_display`, then exercises every
      PackageRequest selector migration path. Both canonical-only routes and
      legacy-only requests are accepted. Equivalent canonical-plus-legacy dual
      emission is accepted for older 3.x peers, while conflicting resolvable
      routes are rejected with CONFLICTING_SELECTORS and an unprojectable route
      is rejected first with UNSUPPORTED_FEATURE. A bare canonical image and a
      width-only image selector are rejected because they under-specify the
      product's fixed 300x250 constraint; the width-only case is also
      schema-invalid because fixed-size image dimensions are atomic.
    steps:
      - id: get_canonical_product_for_create_satisfaction
        title: Read the fixed-size canonical product before create
        task: get_products
        schema_ref: media-buy/get-products-request.json
        response_schema_ref: media-buy/get-products-wire-response.json
        doc_ref: /media-buy/task-reference/get_products
        comply_scenario: schema_compliance
        stateful: true
        expected: |
          Return the seeded canonical_formats_mrec_display product so create-time
          validations can compare package format selectors against the product's
          canonical format_options[] declaration.
        sample_request:
          buying_mode: wholesale
          filters:
            channels:
              - display
            delivery_type: non_guaranteed
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_canonical_formats-a323283f
            sandbox: true
          context:
            correlation_id: canonical_formats--get_canonical_product_for_create_satisfaction
        validations:
          - check: response_schema
            description: Response matches get-products-response.json schema
          - check: field_contains
            path: products[*]
            value:
              product_id: canonical_formats_mrec_display
              format_options:
                - params:
                    width: 300
                    height: 250
            description: The seeded product retains its format contract regardless of catalog or format ordering
        collect_product_pages: true
      - id: create_media_buy_with_canonical_format_option
        title: Accept canonical-only format option selector
        task: create_media_buy
        schema_ref: media-buy/create-media-buy-request.json
        response_schema_ref: media-buy/create-media-buy-wire-response.json
        doc_ref: /media-buy/task-reference/create_media_buy
        stateful: true
        expected: |
          Accept the buy. The package uses only the product-local canonical
          format_option_ref published by the fixed 300x250 product.
        sample_request:
          brand:
            domain: acmeoutdoor.example
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_canonical_formats-a323283f
            sandbox: true
          start_time: "2099-06-01T00:00:00Z"
          end_time: "2099-06-30T23:59:59Z"
          packages:
            - product_id: canonical_formats_mrec_display
              budget: 1000
              pricing_option_id: canonical_formats_mrec_cpm
              format_option_refs:
                - scope: product
                  format_option_id: canonical_formats_image_mrec
              context:
                buyer_ref: canonical_formats_option_ref_positive
          context:
            correlation_id: canonical_formats--create_media_buy_with_canonical_format_option
          idempotency_key: $generate:uuid_v4#canonical_formats_create_media_buy_with_canonical_format_option
        validations:
          - check: response_schema
            description: Response matches create-media-buy-response.json schema
          - check: field_present
            path: media_buy_id
            description: Accepted canonical-only create allocates a media_buy_id
          - check: canonical_format_satisfaction
            value: true
            description: Product-local format_option_ref satisfies the fixed canonical image declaration
      - id: create_media_buy_with_direct_canonical_selector
        title: Accept direct canonical format selector
        task: create_media_buy
        schema_ref: media-buy/create-media-buy-request.json
        response_schema_ref: media-buy/create-media-buy-wire-response.json
        doc_ref: /media-buy/task-reference/create_media_buy
        stateful: true
        expected: |
          Accept the buy. The package uses only a direct canonical image
          selector with the complete dimensions required by the product.
        sample_request:
          brand:
            domain: acmeoutdoor.example
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_canonical_formats-a323283f
            sandbox: true
          start_time: "2099-06-01T00:00:00Z"
          end_time: "2099-06-30T23:59:59Z"
          packages:
            - product_id: canonical_formats_mrec_display
              budget: 1000
              pricing_option_id: canonical_formats_mrec_cpm
              format_kind: image
              params:
                width: 300
                height: 250
                max_file_size_kb: 200
                image_formats:
                  - jpg
                  - png
              context:
                buyer_ref: canonical_formats_direct_selector_positive
          context:
            correlation_id: canonical_formats--create_media_buy_with_direct_canonical_selector
          idempotency_key: $generate:uuid_v4#canonical_formats_create_media_buy_with_direct_canonical_selector
        validations:
          - check: response_schema
            description: Response matches create-media-buy-response.json schema
          - check: field_present
            path: media_buy_id
            description: Accepted direct-canonical create allocates a media_buy_id
          - check: canonical_format_satisfaction
            value: true
            description: Complete direct image selector satisfies the fixed canonical declaration
      - id: create_media_buy_with_legacy_mrec_format
        title: Accept legacy fixed MREC selector after canonical normalization
