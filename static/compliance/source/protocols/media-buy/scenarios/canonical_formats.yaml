id: media_buy_seller/canonical_formats
version: 1.1.1
title: Canonical formats and deprecated named-format compatibility
category: media_buy_seller
summary: Validates canonical product formats and the optional, explicitly deprecated named-format compatibility projection.
track: products
requires:
  - controller
  - collect_product_pages_runner
introduced_in: "3.1"
required_tools:
  - get_products
  - create_media_buy
  - comply_test_controller
narrative: |
  AdCP 3.2 requires canonical product-bound format declarations on
  `products[].format_options[]`. Legacy `format_ids[]` is deprecated and is
  exercised here only as an optional compatibility projection. Producers that
  voluntarily dual-emit both shapes MUST describe the same underlying creative
  requirement in each path.

  This is an opt-in compatibility track, not the primary 3.2 authoring path.
  Normal 3.2 products carry `format_options`; the runner deliberately seeds
  deprecated named-format-only and dual-emitted fixtures to verify agents that
  advertise compatibility with those older shapes.

  The scenario first discovers native canonical image and named-format support.
  Only then does it seed deterministic display products. Format checks bind
  each contract to its product ID without requiring vendor metrics. The
  buyer requests the wholesale product feed and verifies that the seeded
  products cover the migration shapes from the canonical-formats conformance
  track: agreeing compatibility projection, deprecated named-format-only
  emission, canonical-only emission, and divergent compatibility projection
  advisories.

  After discovery, the buyer creates media buys against the seeded fixed-size
  product to validate create-time format satisfaction: a legacy fixed MREC
  selector satisfies the canonical declaration after normalization, while a
  bare canonical image selector without dimensions does not satisfy a fixed
  300x250 product.

  Custom and experimental declarations are covered by independent optional scenarios so their absence cannot suppress image and named-format compatibility coverage.
agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - exposes_canonical_formats
  examples:
    - Any media-buy seller that voluntarily supports deprecated named-format compatibility alongside canonical declarations
caller:
  role: buyer_agent
  example: Compliance test harness
prerequisites:
  description: This optional compatibility slice requires wholesale catalog evidence of canonical image declarations and a named-format projection. A valid no-match produces a fixture_unsatisfied coverage gap before feature seeding. Custom and experimental format families have independent scenarios and do not gate this base slice. This optional compatibility slice does not relax canonical requirements in AdCP 3.2 and later. The controller must advertise seed_product and accept supported deterministic fixtures.
  test_kit: test-kits/acme-outdoor.yaml
  controller_seeding: true
fixtures:
  accounts:
    - account_id: acct_acmeoutdoor_example_sandbox_5cf62d0533d9
      fixture:
        brand:
          domain: acmeoutdoor.example
        operator: pinnacle-agency.example
        operator_unit:
          id: compliance-media_buy_seller_canonical_formats-a323283f
        billing: operator
        status: active
        sandbox: true
  products:
    - product_id: native_canonical_compatibility_support
phases:
  - id: seed_supported_canonical_fixtures
    title: Prepare supported canonical compatibility fixtures
    narrative: Native catalog discovery established both canonical image declarations and named-format compatibility before these deterministic fixtures are seeded. Custom and experimental declarations are exercised in independent scenarios. A valid no-match is a fixture_unsatisfied coverage gap; failed discovery and failed accepted seed operations remain failures.
    steps:
      - id: seed_canonical_formats_mrec_display
        title: Seed canonical_formats_mrec_display
        task: comply_test_controller
        requires_tool: comply_test_controller
        stateful: true
        sample_request:
          account:
            brand:
              domain: acmeoutdoor.example
            operator: pinnacle-agency.example
            operator_unit:
              id: compliance-media_buy_seller_canonical_formats-a323283f
            sandbox: true
          scenario: seed_product
          params:
            product_id: canonical_formats_mrec_display
            fixture:
              name: Canonical Formats MREC Display
              description: Seeded wholesale product for canonical image dual-emission validation.
              publisher_properties:
                - publisher_domain: outdoormagazine.example
                  selection_type: all
              channels:
                - display
              delivery_type: non_guaranteed
              format_ids:
                - agent_url: https://creative.adcontextprotocol.org/
                  id: display_300x250_image
              format_options:
                - format_kind: image
                  format_option_id: canonical_formats_image_mrec
                  display_name: Canonical Formats Image MREC
                  v1_format_ref:
                    - agent_url: https://creative.adcontextprotocol.org/
                      id: display_300x250_image
                  params:
                    width: 300
                    height: 250
                    max_file_size_kb: 200
                    image_formats:
                      - jpg
                      - png
                    ssl_required: true
                    asset_source: buyer_uploaded
                    buyer_asset_acceptance: accepted
                    composition_model: deterministic
                    slots:
                      - asset_group_id: image_main
                        asset_type: image
                        required: true
              pricing_options:
                - pricing_option_id: canonical_formats_mrec_cpm
                  pricing_model: cpm
                  currency: USD
                  floor_price: 12
              reporting_capabilities:
                available_reporting_frequencies:
                  - daily
                expected_delay_minutes: 60
                timezone: UTC
                supports_webhooks: false
                available_metrics:
                  - impressions
                  - clicks
                  - spend
                date_range_support: date_range
        validations:
          - check: field_value
            path: success
            value: true
            description: The controller accepts the supported compatibility fixture
