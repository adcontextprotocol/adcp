requires_all_capabilities:
  - path: media_buy.buying_modes
    contains: wholesale
  - path: compliance_testing.scenarios
    contains: seed_product
fixture_resolution:
  products:
    - handle: native_canonical_compatibility_support
      allow_reuse: true
      strategies:
        - discover
      match:
        - path: /delivery_type
          operator: equals
          value: non_guaranteed
        - path: /channels
          operator: contains_all
          value:
            - display
        - path: /pricing_options
          operator: any_match
          where:
            - path: /pricing_model
              operator: equals
              value: cpm
        - path: /format_options
          operator: any_match
          where:
            - path: /format_kind
              operator: equals
              value: image
        - path: /format_ids
          operator: any_match
          where:
            - path: /agent_url
              operator: present
            - path: /id
              operator: present
context:
  account:
    brand:
      domain: acmeoutdoor.example
    operator: pinnacle-agency.example
    operator_unit:
      id: compliance-media_buy_seller_canonical_formats-a323283f
    sandbox: true
