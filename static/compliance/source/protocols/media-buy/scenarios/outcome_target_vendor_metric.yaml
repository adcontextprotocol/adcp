id: media_buy_seller/outcome_target_vendor_metric
version: "1.0.0"
introduced_in: "3.3"
title: "Seller plans a vendor-measured outcome target"
category: media_buy_seller
summary: "Verifies criteria.outcome_target with a vendor_metric goal: the seller answers a volume with a forecast whose points carry the goal's (vendor, metric_id) in vendor_metric_values[] and metrics.spend, binds the goal and its reporting commitment on every purchase, and answers a cost target through commercial_terms.bidding.cost_per."
track: media_buy
requires:
  - controller

required_tools:
  - request_proposals

requires_all_capabilities:
  - path: media_buy.outcome_target
    equals: true
  - path: media_buy.vendor_metric_optimization
    present: true

narrative: |
  A buyer whose objective is measured by a third party, such as store visits
  from a foot-traffic vendor, states it as criteria.outcome_target.goal with
  kind "vendor_metric", the same (vendor, metric_id) key optimization goals
  and delivery's vendor_metric_values[] use. The seller plans only pairs a
  product declares in vendor_metric_optimization.supported_metrics[].

  The answer contract this scenario grades: every returned proposal carries
  total_budget_guidance and a forecast whose points carry the goal's
  (vendor, metric_id) in vendor_metric_values[] (the flight total at the
  point's budget, in the vendor's unit) and metrics.spend, never a metrics key
  for the vendor metric. The proposal binds the goal as every purchase's
  primary optimization goal and lists the vendor reporting commitment, because
  optimizing toward a vendor metric without committing to report it is
  unverifiable. A cost target on the goal is answered in
  commercial_terms.bidding.cost_per exactly as for any other goal. The cost
  phase runs for sellers advertising fixed media-buy cost caps in
  features.bidding_policy.

  A planning-time vendor goal asserts no buyer-vendor relationship: the
  seller's declared pair is the only planning-time eligibility test, and the
  last phase grades the rejection of an undeclared pair.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - accepts_briefs
    - generates_proposals
  examples:
    - "Retail media network planning store visits against a foot-traffic vendor"
    - "Publisher quoting vendor-measured outcomes"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The caller needs a brand identity and operator credentials. The runner
    seeds an auction-priced USD product declaring a cumulative store-visit
    metric from a fictional vendor, with cost_per support, so the volume and
    cost phases have a product that declares the pair.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "outcome_target_store_visits"
      name: "Outcome Target Store Visits Display"
      description: "Compliance fixture: display inventory planned against a vendor-measured store-visit outcome."
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_options:
        - format_option_id: "outcome_target_store_visits_300x250"
          format_kind: "image"
          params:
            width: 300
            height: 250
      reporting_capabilities:
        available_metrics:
          - impressions
          - clicks
          - spend
        vendor_metrics:
          - vendor:
              domain: "footfallvendor.example"
            metric_id: "store_visits_14d_exposed"
            vendor_relationship: "third_party"
      vendor_metric_optimization:
        supported_metrics:
          - vendor:
              domain: "footfallvendor.example"
            metric_id: "store_visits_14d_exposed"
            supported_targets:
              - cost_per
    - product_id: "outcome_target_video"
      name: "Outcome Target Planning Video"
      description: "Compliance fixture: video inventory that declares no vendor-metric optimization."
      delivery_type: "non_guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "outcome_target_video_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
  pricing_options:
    - product_id: "outcome_target_video"
      pricing_option_id: "outcome_target_fixed"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 40.0
    - product_id: "outcome_target_store_visits"
      pricing_option_id: "outcome_target_store_visits_auction_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 1.50

phases:
  - id: setup
    title: "Account setup"
    steps:
      - id: sync_accounts
        title: "Establish account"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: |
          Return the account with account_id and status active.

        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
              payment_terms: "net_30"

          idempotency_key: "$generate:uuid_v4#media_buy_seller_outcome_target_vendor_metric_setup_sync_accounts"
          context:
            correlation_id: "outcome_target_vendor_metric--sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json schema"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a platform-assigned ID"
          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "outcome_target_vendor_metric--sync_accounts"
            description: "Context correlation_id returned unchanged"

  - id: vendor_metric_goal
    title: "Solve for budget from a store-visit goal"
    depends_on: [setup]
    narrative: |
      The buyer states the outcome, 5,000 store visits measured by the
      vendor, and the seller answers with budget guidance and a forecast whose
      points carry the vendor metric in vendor_metric_values[].
    steps:
      - id: request_store_visits_goal
        title: "Request proposals for a 5,000 store-visit target"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        expected: |
          Return outcome proposed with at least one proposal carrying:
          - total_budget_guidance with currency and a recommended figure
          - forecast whose points carry vendor_metric_values[] with the goal's
            vendor and metric_id, a value, and a unit, plus metrics.spend, and
            no metrics key for the vendor metric
          - a vendor reporting commitment for the pair

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_outcome_target_vendor_metric_goal_request_store_visits_goal"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brief: "Drive store visits for the Trail Pro 3000 launch using the seeded display placement."
          criteria:
            product_ids: ["outcome_target_store_visits"]
            outcome_target:
              goal:
                kind: "vendor_metric"
                vendor:
                  domain: "footfallvendor.example"
                metric_id: "store_visits_14d_exposed"
              volume: 5000
          context:
            correlation_id: "outcome_target_vendor_metric--request_store_visits_goal"
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json schema"
          - check: field_value
            path: "outcome"
            value: "proposed"
            description: "The seller returns at least one proposal"
          - check: field_present
            path: "proposals[0].total_budget_guidance.recommended"
            description: "The seller solved for budget: a recommended figure answers the vendor goal"
          - check: field_contains
            path: "proposals[0].forecast.points[0].vendor_metric_values[*]"
            value:
              vendor:
                domain: "footfallvendor.example"
              metric_id: "store_visits_14d_exposed"
            description: "Forecast points carry the goal's (vendor, metric_id) in vendor_metric_values[], the key delivery will report"
          - check: field_present
            path: "proposals[0].forecast.points[0].vendor_metric_values[0].unit"
            description: "The answering entry states the vendor's unit, so the buyer can verify the total"
          - check: field_present
            path: "proposals[0].forecast.points[0].metrics.spend.mid"
            description: "Every point carries metrics.spend, so metrics is never empty"
          - check: field_absent
            path: "proposals[0].forecast.points[0].metrics.store_visits_14d_exposed"
            description: "The vendor metric is not a metrics key: metrics keys are forecastable-metric and event-type values"
          - check: field_contains
            path: "proposals[0].commercial_terms.reporting_commitments[*].metrics[*]"
            value:
              scope: "vendor"
              metric_id: "store_visits_14d_exposed"
            description: "The proposal commits to reporting the vendor metric, because optimization without committed reporting is unverifiable"
          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "outcome_target_vendor_metric--request_store_visits_goal"
            description: "Context correlation_id returned unchanged"

  - id: vendor_metric_cost_target
    title: "Plan a store-visit cost cap within a buyer budget"
    depends_on: [setup]
    requires_capability:
      path: media_buy.features.bidding_policy.media_buy.fixed.cost_per_strengths
      contains: cap
    narrative: |
      Runs for sellers advertising fixed media-buy cost caps in
      features.bidding_policy. The buyer states a cost per store visit, 4 USD
      or less within a 5,000 USD budget. The seller plans the visits it can
      deliver and states the cost it can plan to in
      commercial_terms.bidding.cost_per: never below the ask, the buyer's cap
      strength, in the requested currency. The bidding policy binds to the
      vendor goal by vendor and metric_id.
    steps:
      - id: request_store_visits_cost_cap
        title: "Request proposals for store visits at a 4 USD cap on a 5,000 USD budget"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        expected: |
          Return outcome proposed with at least one proposal carrying:
          - commercial_terms.bidding.cost_per with strength "cap" and an
            amount no lower than 4
          - no purchase-level bidding, and the vendor goal as the purchase's
            optimization goal
          - a forecast in USD whose points carry the vendor metric in
            vendor_metric_values[]

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_outcome_target_vendor_metric_cost_target_request_store_visits_cost_cap"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brief: "Drive store visits for the Trail Pro 3000 launch using the seeded display placement."
          criteria:
            product_ids: ["outcome_target_store_visits"]
            offer_filters:
              budget_range:
                max: 5000
                currency: "USD"
            outcome_target:
              goal:
                kind: "vendor_metric"
                vendor:
                  domain: "footfallvendor.example"
                metric_id: "store_visits_14d_exposed"
              cost_per:
                amount: 4
                currency: "USD"
                strength: "cap"
          context:
            correlation_id: "outcome_target_vendor_metric--request_store_visits_cost_cap"
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json schema"
          - check: field_value
            path: "outcome"
            value: "proposed"
            description: "The seller returns at least one proposal"
          - check: field_greater_than
            path: "proposals[0].commercial_terms.bidding.cost_per.amount"
            value: 3.99
            description: "The answered cost is never below the 4 USD ask (strict greater-than against 3.99 with a 0.01 epsilon, the cent precision of the amount)"
          - check: field_value
            path: "proposals[0].commercial_terms.bidding.cost_per.strength"
            value: "cap"
            description: "The answer keeps the buyer's strength"
          - check: field_absent
            path: "proposals[0].commercial_terms.purchases[0].bidding"
            description: "The answer carries no purchase-level bidding, so the media-buy cost_per binds to the purchase's primary goal"
          - check: field_contains
            path: "proposals[0].commercial_terms.purchases[*].optimization_goals[*]"
            value:
              kind: "vendor_metric"
              metric_id: "store_visits_14d_exposed"
            description: "The cost policy binds to the vendor goal by vendor and metric_id"
          - check: field_value
            path: "proposals[0].commercial_terms.purchases[0].pricing.currency"
            value: "USD"
            description: "The purchase pricing currency, which bidding amounts are denominated in, equals cost_per.currency"
          - check: field_value
            path: "proposals[0].forecast.currency"
            value: "USD"
            description: "The forecast is in the requested currency"
          - check: field_contains
            path: "proposals[0].forecast.points[0].vendor_metric_values[*]"
            value:
              vendor:
                domain: "footfallvendor.example"
              metric_id: "store_visits_14d_exposed"
            description: "Forecast points carry the vendor metric planned at the stated cost"
          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "outcome_target_vendor_metric--request_store_visits_cost_cap"
            description: "Context correlation_id returned unchanged"

  - id: vendor_metric_goal_rejection
    title: "Reject a vendor-metric goal no product declares"
    depends_on: [setup]
    narrative: |
      The seeded video product declares no vendor_metric_optimization, so no
      product declares the (vendor, metric_id) pair. A seller plans only
      declared pairs and never substitutes another vendor or metric, so it
      rejects the goal with INVALID_REQUEST naming
      criteria.outcome_target.goal.
    steps:
      - id: request_undeclared_vendor_goal
        title: "Reject store visits from a vendor no product declares"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: false
        expect_error: true
        negative_path: payload_well_formed
        expected: |
          Reject with INVALID_REQUEST naming criteria.outcome_target.goal. No
          product declares the pair, and the seller cannot substitute another.

        sample_request:
          idempotency_key: "$generate:uuid_v4#media_buy_seller_outcome_target_vendor_metric_goal_rejection_request"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brief: "Drive store visits for the Trail Pro 3000 launch using the seeded video placement."
          criteria:
            product_ids: ["outcome_target_video"]
            outcome_target:
              goal:
                kind: "vendor_metric"
                vendor:
                  domain: "undeclaredvendor.example"
                metric_id: "store_visits_undeclared"
              volume: 5000
          context:
            correlation_id: "outcome_target--request_undeclared_vendor_goal"
        validations:
          - check: error_code
            value: "INVALID_REQUEST"
            description: "The seller rejects a vendor goal no product declares"
          - check: field_value
            path: "adcp_error.field"
            value: "criteria.outcome_target.goal"
            description: "The error names the goal"
