id: media_buy_seller/seller_optimized_min_spend_target_exceeds_package_cap
version: "1.0.1"
title: "Seller rejects a minimum-spend target above its own package cap"
category: media_buy_seller
summary: "Verifies that a seller advertising seller-optimized budgets, package budget caps, and minimum-spend targets rejects a package min_spend_target above that package's budget with INVALID_REQUEST before mutation."
track: media_buy
introduced_in: "3.2"

# The cap-versus-minimum check is over-subscription validation across two
# package controls. It applies only when the seller declares both; a seller
# missing either rejects the undeclared control with UNSUPPORTED_FEATURE first
# (graded by media_buy_seller/seller_optimized_budget). Sellers lacking any of
# the three declarations grade not_applicable.
requires_all_capabilities:
  - path: media_buy.features.seller_optimized_budget
    equals: true
  - path: media_buy.features.seller_optimized_package_budgets
    equals: true
  - path: media_buy.features.seller_optimized_min_spend_targets
    equals: true
  # TEMPORARY(adcp#7852): remove when this scenario is delivery-mode aware (Option B).
  - path: media_buy.supported_delivery_types
    contains: non_guaranteed

required_tools:
  - get_products
  - create_media_buy

narrative: |
  A package min_spend_target is a soft preference and a package budget is a
  hard ceiling, so a minimum above its own cap is infeasible. Over-subscription
  validation applies only to declared package controls; a seller that declares
  both caps and minimum-spend targets rejects the contradiction with
  INVALID_REQUEST before any provider mutation.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - supports_non_guaranteed
    - seller_optimized_budget
  examples:
    - "Social platforms enforcing ad set spend limits inside a campaign budget"
    - "DSPs validating line-item minimums against line-item caps"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The seller supports a common click optimization goal across two
    non-guaranteed products in one currency. The test controller seeds both
    products so the sample request does not rely on undeclared fixture IDs.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "shared_budget_prospecting"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_ids:
        - id: "display_300x250"
    - product_id: "shared_budget_retargeting"
      delivery_type: "non_guaranteed"
      channels: ["display"]
      format_ids:
        - id: "display_300x250"
  pricing_options:
    - product_id: "shared_budget_prospecting"
      pricing_option_id: "prospecting_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 1.50
    - product_id: "shared_budget_retargeting"
      pricing_option_id: "retargeting_cpm"
      pricing_model: "cpm"
      currency: "USD"
      floor_price: 2.00

phases:
  - id: setup
    title: "Establish account and discover eligible products"
    steps:
      - id: sync_accounts
        title: "Establish account"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: "Return an active account."
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
          idempotency_key: "$generate:uuid_v4#seller_optimized_min_spend_target_exceeds_package_cap_setup_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a seller-assigned identifier"

      - id: get_products_for_shared_budget
        title: "Discover products for shared allocation"
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        stateful: false
        expected: "Return the seeded products with compatible USD pricing and click optimization."
        sample_request:
          idempotency_key: "$generate:uuid_v4#seller_optimized_min_spend_target_exceeds_package_cap_setup_get_products"
          buying_mode: "brief"
          brief: "Allocate a $100,000 performance budget across prospecting and retargeting display packages, optimizing for clicks."
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json"
          - check: field_present
            path: "products[1]"
            description: "At least two products are available for cross-package allocation"

  - id: reject_package_minimum_exceeds_budget
    title: "Reject a package minimum-spend target that exceeds its own budget"
    depends_on: [setup]
    steps:
      - id: create_oversubscribed_package_minimum
        title: "Reject min_spend_target greater than the package budget"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: false
        expect_error: true
        negative_path: payload_well_formed
        expected: |
          Reject before mutation because the prospecting package carries a
          min_spend_target (80000) that exceeds its own budget (70000).
          Both controls are declared, so the over-subscription check applies
          and yields INVALID_REQUEST rather than UNSUPPORTED_FEATURE.
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          brand:
            domain: "acmeoutdoor.example"
          total_budget:
            amount: 100000
            currency: "USD"
          budget_allocation:
            mode: "seller_optimized"
            optimization_goals:
              - kind: "metric"
                metric: "clicks"
                priority: 1
          packages:
            - product_id: "shared_budget_prospecting"
              pricing_option_id: "prospecting_cpm"
              budget: 70000
              min_spend_target: 80000
            - product_id: "shared_budget_retargeting"
              pricing_option_id: "retargeting_cpm"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          idempotency_key: "$generate:uuid_v4#seller_optimized_min_spend_target_exceeds_package_cap_create"
        validations:
          - check: error_code
            value: "INVALID_REQUEST"
            description: "Seller rejects a min_spend_target that exceeds the package budget before mutation"
