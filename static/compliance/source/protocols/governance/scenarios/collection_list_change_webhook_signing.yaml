id: governance/collection_list_change_webhook_signing
version: "1.0.0"
introduced_in: "3.2"
title: "Collection-list change webhook signing"
category: governance
summary: "Collection-list change notifications use the RFC 9421 webhook profile and match the published payload contract."
track: governance
required_tools:
  - create_collection_list
  - update_collection_list

narrative: |
  The runner creates a collection list, updates it with an RFC 9421 receiver
  URL, validates the resulting payload and idempotency key, and verifies its
  HTTP signature with the shared webhook verifier.

  The payload schema retains the deprecated body-level signature as optional
  for receiver compatibility. Reference-agent integration coverage separately
  verifies that new senders omit it. Negative receiver behavior is exercised
  by the executable webhook-signing vectors: negative/002-expired-signature.json
  requires stale-window rejection and negative/009-content-digest-mismatch.json
  requires tamper rejection.

agent:
  interaction_model: governance_agent
  capabilities:
    - collection_lists
    - emits_webhooks

caller:
  role: compliance_runner
  example: "AdCP Verified runner with webhook receiver capability"

prerequisites:
  description: |
    The runner needs the Acme Outdoor identity fixture and the
    webhook_receiver_runner contract. Steps requiring the receiver grade
    not_applicable when that contract is unavailable.
  test_kit: "test-kits/acme-outdoor.yaml"

phases:
  - id: collection_list_change
    title: "Sign a collection-list change"
    steps:
      - id: create_collection_list_for_webhook
        title: "Create the collection list"
        task: create_collection_list
        schema_ref: "collection/create-collection-list-request.json"
        response_schema_ref: "collection/create-collection-list-response.json"
        doc_ref: "/governance/collection/tasks/collection_lists"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          name: "Acme Outdoor webhook collections"
          base_collections:
            - selection_type: "distribution_ids"
              identifiers:
                - type: "imdb_id"
                  value: "tt9999901"
          idempotency_key: "$generate:uuid_v4#governance_list_webhook_create_collection"
          context:
            correlation_id: "governance_list_webhook--create_collection"
        context_outputs:
          - path: "list.list_id"
            key: "webhook_collection_list_id"
        validations:
          - check: response_schema
            description: "Created collection list matches its response schema"

      - id: update_collection_list_for_webhook
        title: "Update the collection list and register the receiver"
        task: update_collection_list
        schema_ref: "collection/update-collection-list-request.json"
        response_schema_ref: "collection/update-collection-list-response.json"
        doc_ref: "/governance/collection/tasks/collection_lists"
        requires_contract: webhook_receiver_runner
        stateful: true
        sample_request:
          list_id: "$context.webhook_collection_list_id"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          webhook_url: "{{runner.webhook_url:update_collection_list_for_webhook}}"
          base_collections:
            - selection_type: "distribution_ids"
              identifiers:
                - type: "imdb_id"
                  value: "tt9999901"
                - type: "imdb_id"
                  value: "tt9999902"
          idempotency_key: "$generate:uuid_v4#governance_list_webhook_update_collection"
          context:
            correlation_id: "governance_list_webhook--update_collection"
        validations:
          - check: response_schema
            description: "Updated collection list matches its response schema"

      - id: expect_collection_list_payload
        title: "Validate the collection-list change payload"
        task: expect_webhook
        triggered_by: update_collection_list_for_webhook
        filter:
          body:
            event: "collection_list_changed"
            list_id: "$context.webhook_collection_list_id"
        timeout_seconds: 30
        expect_idempotency_key: true
        webhook_payload_schema_ref: "collection/collection-list-changed-webhook.json"
        requires_contract: webhook_receiver_runner
        stateful: true
        expected: |
          The collection_list_changed payload matches its published schema and
          carries a present, pattern-valid idempotency_key.

      - id: expect_collection_list_signature
        title: "Verify the collection-list change signature"
        task: expect_webhook_signature_valid
        triggered_by: update_collection_list_for_webhook
        filter:
          body:
            event: "collection_list_changed"
            list_id: "$context.webhook_collection_list_id"
        timeout_seconds: 30
        require_tag: "adcp/webhook-signing/v1"
        requires_contract: webhook_receiver_runner
        stateful: true
        expected: |
          The collection_list_changed delivery verifies under the RFC 9421
          webhook profile.
