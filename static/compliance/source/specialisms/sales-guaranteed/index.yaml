id: sales_guaranteed
version: "1.0.3"
title: "Guaranteed media buy with human IO approval"
protocol: media-buy
category: sales_guaranteed
summary: "Seller agent that requires human-in-the-loop IO signing before guaranteed media buys go live."
track: media_buy
requires:
  - controller

required_tools:
  - get_products
  - create_media_buy
  - get_task_status
  - comply_test_controller
requires_scenarios:
  - media_buy_seller/refine_products
  - media_buy_seller/delivery_reporting
  - media_buy_seller/measurement_terms_rejected
  - media_buy_seller/measurement_terms_accepted
  - media_buy_seller/pending_creatives_to_start
  - media_buy_seller/inventory_list_targeting
  - media_buy_seller/inventory_list_no_match
  - media_buy_seller/invalid_transitions
  - media_buy_seller/proposal_finalize
  - media_buy_seller/proposal_finalize_asap_timing
  - media_buy_seller/availability_windows
  - media_buy_seller/proposal_not_found_errors
  - governance_aware_seller/governance_multi_agent_rejected

# Cross-step assertion (adcp#2664). status.monotonic rejects resource
# status transitions observed across steps that aren't on the spec
# lifecycle graph — e.g. active → pending_creatives on a media_buy.
invariants:
  - status.monotonic

narrative: |
  You run a sell-side platform that requires human approval before guaranteed media buys go
  live. When a buyer creates a guaranteed buy, your platform returns an A2A task in the
  submitted state with a task_id — no media_buy_id is issued yet because IO signing may fail.
  A human reviewer on your side reviews the deal terms and signs the IO through your own
  internal workflow.

  This is deliberately the seller's ungoverned IO baseline. Registering a buyer governance
  agent changes the account contract: every later commitment needs an approved
  `governance_context`, so registration followed by this context-free create would correctly
  be rejected. The required governance-registration scenario separately proves valid
  single-agent registration and rejects multiple agents; the governance-aware-seller
  specialism owns the complete registration, approval, and governed-create loop.

  This storyboard exercises the polling path: the sandbox controller completes
  the submitted task in place of a human IO reviewer, then the buyer invokes
  get_task_status with the task_id. A buyer may separately configure a
  push_notification_config webhook, but that optional channel is not registered
  in this 3.x flow. Only on task completion does your platform issue a
  media_buy_id and the final CreateMediaBuy result; the buyer then calls
  get_media_buys to confirm the buy is awaiting creatives and then syncs them.

  This storyboard isolates the guaranteed approval path — the async handshake between agent
  automation and human decision-making that makes guaranteed buys work in practice. IO review
  is modelled entirely at the A2A task layer; there is no interim "pending_approval" media buy
  status (that value only exists on Account.status, not MediaBuy.status).
  The sandbox controller must support force_create_media_buy_arm and
  force_task_completion so this test does not depend on a human signing an IO
  during the runner's timeout window.

  If the production sandbox does not expose the controller, the forced approval
  phases report a controller coverage gap (requirement_unmet naming controller, or missing_test_controller for an ungated step). Their skipped assertions
  do not prove the guaranteed approval lifecycle for a Verified (Sandbox) run.

  Proposal-driven workflows are part of guaranteed selling: most guaranteed deals start with
  an RFP/brief, generate a proposal with curated bundles and rationale, refine, finalize to
  committed status with firm pricing and an inventory hold, and then the buyer executes via
  create_media_buy. The `media_buy_seller/proposal_finalize` scenario covers that flow and is
  capability-gated on `media_buy.supports_proposals` — a conformance declaration, not the
  buyer's per-proposal executable-state signal. Sellers that declare `false` (or omit the
  field, since the schema default is false) skip it with skip_result.reason: not_applicable;
  sellers that explicitly declare `true` are graded against it. Buyers decide whether a
  returned proposal can be created from its `proposal_status`: `draft` requires finalize,
  `committed` can be executed before `expires_at`.

  The requires_io_approval capability is scoped to creates that reference products with
  delivery_type: guaranteed. The current 3.x media_buy_seller baseline uses
  non-guaranteed fixtures in its core flow and several inherited scenarios.
  Some inherited workflows require an immediately issued media_buy_id for follow-on
  checks; others assert immediate preflight rejection or are capability-gated.
  A guaranteed-only seller can satisfy this IO storyboard yet still lack a complete
  media-buy grade. A versioned, delivery-mode-aware baseline must preserve synchronous
  checks for non-guaranteed buys and add task completion/readback for guaranteed buys.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - supports_guaranteed
    - requires_io_approval
  examples:
    - "Premium publisher with IO requirements"
    - "Retail media network with sales approval"
    - "CTV platform with guaranteed deals"

caller:
  role: buyer_agent
  example: "Scope3 (DSP)"

prerequisites:
  description: |
    The caller needs a sandbox brand and operator identity. Account provisioning
    is graded by the account scenarios; this storyboard keeps one account reference
    throughout the guaranteed approval task. The test kit provides sample campaign
    parameters for that flow.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  accounts:
    - account_id: "acct_acmeoutdoor_example_sandbox_2512b4c133fb"
      fixture:
        brand:
          domain: "acmeoutdoor.example"
        operator: "pinnacle-agency.example"
        operator_unit:
          id: "compliance-sales_guaranteed-e941b849"
        billing: "operator"
        status: "active"
        sandbox: true
  products:
    # This storyboard needs only guaranteed inventory. The protocol baseline
    # owns its separate non-guaranteed fixtures and applicability policy.
    - product_id: "sports_preroll_q2_guaranteed"
      delivery_type: "guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "video_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
    - product_id: "outdoor_ctv_q2_guaranteed"
      delivery_type: "guaranteed"
      channels: ["ctv"]
      format_options:
        - format_option_id: "video_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
  pricing_options:
    - product_id: "sports_preroll_q2_guaranteed"
      pricing_option_id: "cpm_guaranteed_fixed"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 35.0
    - product_id: "outdoor_ctv_q2_guaranteed"
      pricing_option_id: "cpm_guaranteed_fixed"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 45.0

phases:
  - id: capability_discovery
    title: "Capability discovery"
    narrative: |
      The buyer calls get_adcp_capabilities to confirm the agent supports media buying before sending briefs or creating buys.

    steps:
      - id: get_capabilities
        title: "Check agent capabilities"
        narrative: |
          Verify that the agent declares the expected protocol support before
          proceeding with domain-specific operations.
        task: get_adcp_capabilities
        schema_ref: "protocol/get-adcp-capabilities-request.json"
        response_schema_ref: "protocol/get-adcp-capabilities-response.json"
        doc_ref: "/protocol/get_adcp_capabilities"
        comply_scenario: capability_discovery
        stateful: false
        expected: |
          Return capabilities declaring media_buy in supported_protocols, confirming the agent sells media.
        sample_request:
          context:
            correlation_id: "sales_guaranteed--get_capabilities"
        validations:
          - check: response_schema
            description: "Response matches get-adcp-capabilities-response.json schema"
          - check: field_present
            path: "supported_protocols"
            description: "Agent declares supported protocols"
          - check: field_contains
            path: "supported_protocols[*]"
            value: "media_buy"
            description: "Agent declares media_buy protocol support"
          - check: field_contains
            path: "specialisms[*]"
            value: "sales-guaranteed"
            description: "Agent declares sales-guaranteed specialism"

          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "sales_guaranteed--get_capabilities"
            description: "Context correlation_id returned unchanged"
  - id: product_discovery
    title: "Discover guaranteed products"
    narrative: |
      The buyer sends a brief to discover your guaranteed inventory. The emphasis
      here is on products with delivery_type: guaranteed — fixed-price, reserved
      inventory that requires an IO commitment. Your platform returns products with
      pricing, delivery forecasts, and SLA commitments.

    steps:
      - id: get_products_brief
        title: "Send a brief targeting guaranteed inventory"
        narrative: |
          The buyer describes what they want, emphasizing guaranteed delivery. Your
          platform returns products with delivery_type: guaranteed, including SLA
          commitments, minimum spend requirements, and IO terms.
        task: get_products
        schema_ref: "media-buy/get-products-request.json"
        response_schema_ref: "media-buy/get-products-response.json"
        doc_ref: "/media-buy/task-reference/get_products"
        comply_scenario: full_sales_flow
        stateful: false
        expected: |
          Return guaranteed products matching the brief. Each product should include:
          - product_id: unique identifier
          - name and description
          - delivery_type: guaranteed
          - pricing_models: fixed CPM or flat-rate pricing
          - forecast: committed impressions with SLA guarantees
          - creative format_options: required canonical creative declarations
          - minimum_spend or commitment terms if applicable

        sample_request:
          idempotency_key: "$generate:uuid_v4#sales_guaranteed_product_discovery_get_products_brief"
          buying_mode: "brief"
          brief: "Guaranteed premium video on sports and outdoor lifestyle publishers. Q2 flight, $50K budget. Adults 25-54, US only. Need completion rate SLA."
          filters:
            delivery_type: "guaranteed"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-sales_guaranteed-e941b849"
            sandbox: true

          context:
            correlation_id: "sales_guaranteed--get_products_brief"
        context_outputs:
          - name: product_1_id
            path: "products[0].product_id"
          - name: pricing_option_1_id
            path: "products[0].pricing_options[0].pricing_option_id"
        validations:
          - check: response_schema
            description: "Response matches get-products-response.json schema"
          - check: field_present
            path: "products"
            description: "Response contains a products array"
          - check: field_present
            path: "products[0].product_id"
            description: "Each product has a product_id"
          - check: field_value
            path: "products[0].delivery_type"
            value: "guaranteed"
            description: "Each product declares delivery_type: guaranteed"

          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "sales_guaranteed--get_products_brief"
            description: "Context correlation_id returned unchanged"
          - check: field_present
            path: "products[0].format_options"
            description: "Products include canonical format_options for creative requirements"
          - check: field_present
            path: "products[0].format_options[0].format_kind"
            description: "Canonical format options include a format_kind discriminator"
          - check: field_present
            path: "products[0].format_options[0].format_option_id"
            description: "Canonical format options include a stable ID accepted by sync_creatives"
  - id: create_buy_submitted
    title: "Create guaranteed buy (task submitted for approval)"
    narrative: |
      The buyer creates a guaranteed media buy. Because your platform requires human
      IO signing, the completed A2A invocation carries an AdCP Submitted response. The
      buyer gets back an AdCP task_id. The sandbox controller completes that
      task, then the buyer reads its terminal result through get_task_status.
      This 3.x path does not require a task webhook.

    steps:
      - id: force_submitted_buy
        title: "Force the next guaranteed create into a submitted task"
        task: comply_test_controller
        requires_tool: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-sales_guaranteed-e941b849"
            sandbox: true
          scenario: "force_create_media_buy_arm"
          params:
            arm: "submitted"
            task_id: "task_sales_guaranteed_signed_io"
            message: "Awaiting IO signature"
          context:
            correlation_id: "sales_guaranteed--force_submitted_buy"
        context_outputs:
          - name: forced_guaranteed_task_id
            path: "forced.task_id"
        validations:
          - check: response_schema
            description: "Response matches comply-test-controller-response.json schema"
          - check: field_value
            path: "success"
            value: true
            description: "Controller accepted the submitted-arm directive"

      - id: create_media_buy
        title: "Create a guaranteed media buy"
        narrative: |
          The buyer commits to guaranteed products with budgets and flight dates. Your
          platform accepts the request but does not create the media buy yet. Instead,
          the A2A task completes with an AdCP status of submitted in its artifact
          DataPart — no media_buy_id is issued because IO signing may fail. The buyer
          receives an AdCP task_id to watch.

          The buyer omits push_notification_config and captures the returned
          task_id for a later get_task_status call. Sellers that offer callbacks are tested
          separately by webhook-emission conformance.
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        comply_scenario: create_media_buy
        stateful: true
        expected: |
          Return a completed A2A task envelope whose artifact DataPart contains:
          - status: submitted (AdCP application-level status)
          - task_id: the AdCP handle the buyer passes to get_task_status
          - message (optional): human-readable explanation (e.g., "Awaiting IO signature from sales team; typical turnaround 2–4 hours")

          Do NOT return media_buy_id or packages yet — those land on the task's final artifact
          returned by a later get_task_status call, after the sandbox controller
          forces task completion.
          Do NOT duplicate task_id as A2A taskId or
          artifact metadata. Do NOT use a "pending_approval" media buy status; that value is not
          in MediaBuy.status — IO review is modelled at the AdCP task layer only.

        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-sales_guaranteed-e941b849"
            sandbox: true
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          packages:
            - product_id: "$context.product_1_id"
              budget: 50000
              pricing_option_id: "$context.pricing_option_1_id"
          idempotency_key: "$generate:uuid_v4#sales_guaranteed_create_buy_submitted_create_media_buy"
          context:
            correlation_id: "sales_guaranteed--create_media_buy"
        context_outputs:
          - name: guaranteed_task_id
            path: "task_id"
        validations:
          - check: response_schema
            description: "Response matches create-media-buy-response.json schema"
          - check: field_value
            path: "status"
            value: "submitted"
            description: "Guaranteed IO approval creates a submitted task"
          - check: field_value
            path: "task_id"
            value: "$context.forced_guaranteed_task_id"
            description: "Create returns the controller-issued task ID"
          - check: field_absent
            path: "media_buy_id"
            description: "The media buy is not issued before IO approval"

          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "sales_guaranteed--create_media_buy"
            description: "Context correlation_id returned unchanged"
      - id: get_submitted_task
        title: "Read the submitted task before IO approval"
        task: get_task_status
        schema_ref: "protocol/get-task-status-request.json"
        response_schema_ref: "protocol/get-task-status-response.json"
        doc_ref: "/protocol/get_task_status"
        stateful: true
        sample_request:
          task_id: "$context.guaranteed_task_id"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-sales_guaranteed-e941b849"
            sandbox: true
          context:
            correlation_id: "sales_guaranteed--get_submitted_task"
        validations:
          - check: response_schema
            description: "Response matches get-task-status-response.json schema"
          - check: field_value
            path: "task_id"
            value: "$context.guaranteed_task_id"
            description: "Polling finds the task created for this guaranteed buy"
          - check: field_value
            path: "status"
            value: "submitted"
            description: "Task is still awaiting IO approval"
  - id: complete_io
    title: "Complete IO review and read the task result"
    narrative: |
      Sandbox tests cannot wait for a human to sign an IO. The controller
      completes the exact submitted task with a valid media-buy result, and
      the buyer reads that result through get_task_status. No task webhook
      registration or callback is involved in this polling path.

    steps:
      - id: force_task_completion
        title: "Simulate signed IO for the submitted task"
        task: comply_test_controller
        requires_tool: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-sales_guaranteed-e941b849"
            sandbox: true
          scenario: "force_task_completion"
          params:
            task_id: "$context.guaranteed_task_id"
            result:
              media_buy_id: "mb_sales_guaranteed_signed_io"
              media_buy_status: "pending_creatives"
              confirmed_at: "2026-10-01T12:00:00Z"
              revision: 1
              currency: "USD"
              packages:
                - package_id: "pkg_sales_guaranteed_video"
                  product_id: "$context.product_1_id"
                  budget: 50000
                  pricing_option_id: "$context.pricing_option_1_id"
              context:
                correlation_id: "sales_guaranteed--create_media_buy"
          context:
            correlation_id: "sales_guaranteed--force_task_completion"
        validations:
          - check: response_schema
            description: "Response matches comply-test-controller-response.json schema"
          - check: field_value
            path: "success"
            value: true
            description: "Controller completed the submitted task"
          - check: field_value
            path: "current_state"
            value: "completed"
            description: "Task is complete before the buyer polls"

      - id: get_completed_task
        title: "Read the completed media-buy result"
        task: get_task_status
        schema_ref: "protocol/get-task-status-request.json"
        response_schema_ref: "protocol/get-task-status-response.json"
        doc_ref: "/protocol/get_task_status"
        stateful: true
        sample_request:
          task_id: "$context.guaranteed_task_id"
          include_result: true
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-sales_guaranteed-e941b849"
            sandbox: true
          context:
            correlation_id: "sales_guaranteed--get_completed_task"
        context_outputs:
          - name: media_buy_id
            path: "result.media_buy_id"
        validations:
          - check: response_schema
            description: "Response matches get-task-status-response.json schema"
          - check: field_value
            path: "task_id"
            value: "$context.guaranteed_task_id"
            description: "Polling reads the task created for this guaranteed buy"
          - check: field_value
            path: "status"
            value: "completed"
            description: "IO approval completed the task"
          - check: field_value
            path: "result.media_buy_id"
            value: "mb_sales_guaranteed_signed_io"
            description: "Terminal result issues the media buy ID"

  - id: confirm_approved
    title: "Confirm the approved buy after IO signing"
    narrative: |
      The human on your side reviews and signs the IO through your internal workflow.
      Your platform then completes the AdCP task and emits the final CreateMediaBuy
      result — including the newly-issued media_buy_id — through get_task_status.
      The buyer now calls
      get_media_buys with that media_buy_id and sees it pending creatives. IO
      approval has committed the buy, while creative review still gates delivery. There is no
      intermediate "pending_approval" media buy status in this flow; the buy does not
      exist as a queryable MediaBuy until the task completes.

    steps:
      - id: get_media_buys_approved
        title: "Check approved media buy status"
        narrative: |
          After the task completes and your platform issues a media_buy_id, the buyer
          calls get_media_buys to confirm the controller's pending-creatives result was
          materialized under the same media_buy_id.
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        comply_scenario: media_buy_lifecycle
        stateful: true
        expected: |
          Return the approved media buy awaiting creatives:
          - media_buy_id: matches the buy created earlier
          - status: pending_creatives (IO has been signed, creatives are outstanding)
          - confirmed_at: timestamp when the IO was signed
          - packages: line items with reserved inventory
          - valid_actions: appropriate for a buy awaiting creatives

        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-sales_guaranteed-e941b849"
            sandbox: true
          media_buy_ids:
            - "$context.media_buy_id"

          context:
            correlation_id: "sales_guaranteed--get_media_buys_approved"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json schema"
          - check: field_value
            path: "media_buys[0].media_buy_id"
            value: "$context.media_buy_id"
            description: "Readback returns the media buy issued by task completion"
          - check: field_value
            path: "media_buys[0].status"
            value: "pending_creatives"
            description: "Approved buy awaits creative readiness"
          - check: field_present
            path: "media_buys[0].confirmed_at"
            description: "Approved buy includes a confirmed_at timestamp"

          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
            value: "sales_guaranteed--get_media_buys_approved"
            description: "Context correlation_id returned unchanged"
  - id: creative_sync
    title: "Creative sync"
    requires_capability:
      path: creative.has_creative_library
      equals: true
    narrative: |
      With the IO signed and the buy awaiting creatives, the buyer syncs creative assets
      to your platform. Each package has creative format requirements that the buyer
      discovered during product discovery.

    steps:
      - id: sync_creatives
        title: "Push creative assets"
        narrative: |
          The buyer uploads creative assets for the confirmed packages. Your platform
          validates each creative against the format specs and returns per-creative status.
        task: sync_creatives
        schema_ref: "creative/sync-creatives-request.json"
        response_schema_ref: "creative/sync-creatives-response.json"
        doc_ref: "/creative/task-reference/sync_creatives"
        comply_scenario: creative_sync
        stateful: true
        expected: |
          Accept and validate creatives:
          - Per-creative action: created or updated
          - Per-creative status: accepted, pending_review, or rejected
          - Validation errors for rejected creatives

        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-sales_guaranteed-e941b849"
            sandbox: true
          creatives:
            - creative_id: "video_30s_trail_pro"
              name: "Trail Pro 3000 - 30s CTV Spot"
              format_kind: "video_hosted"
              assets:
                video:
                  asset_type: "video"
                  url: "https://cdn.pinnacle-agency.example/trail-pro-30s.mp4"
                  width: 1920
                  height: 1080
                  duration_ms: 30000
                  mime_type: "video/mp4"

          idempotency_key: "$generate:uuid_v4#sales_guaranteed_creative_sync_sync_creatives"
          context:
            correlation_id: "sales_guaranteed--sync_creatives"
        validations:
          - check: response_schema
            description: "Response matches sync-creatives-response.json schema"
          - check: field_present
            path: "creatives[0].action"
            description: "Each creative has an action (created/updated)"

          - check: field_present
            path: "context"
            description: "Response echoes back the context object"
          - check: field_value
            path: "context.correlation_id"
