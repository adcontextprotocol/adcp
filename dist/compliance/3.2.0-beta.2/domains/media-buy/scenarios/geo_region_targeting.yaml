                geo_regions: ["FR-ZZ"]
          idempotency_key: "$generate:uuid_v4#geo_region_targeting_unknown"
          context:
            correlation_id: "geo_region_targeting--create_unknown_region_code"
        expected: |
          Reject FR-ZZ with INVALID_REQUEST. The code is well-formed but is not
          an active canonical ISO subdivision and must not be widened or dropped.
        validations:
          - check: response_schema
            description: "Error response matches create-media-buy-response.json"
          - check: error_code
            value: "INVALID_REQUEST"
            description: "Unknown canonical identifier is an invalid request"
          - check: field_value
            path: "errors[0].field"
            value: "packages[0].targeting_overlay.geo_regions[0]"
            description: "Error points to the unknown identifier"

      - id: create_unsupported_region_exclusion
        title: "Submit an exclusion outside independent exclusion support"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        expect_error: true
        negative_path: payload_well_formed
        stateful: false
        sample_request:
          <<: *region_error_request
          packages:
