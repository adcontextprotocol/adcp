            description: "Error response matches create-media-buy-response.json"
          - check: error_code
            value: "PRODUCT_UNAVAILABLE"
            description: "Valid supported target with zero inventory is unavailable"
          - check: field_value
            path: "errors[0].field"
            value: "packages[0].targeting_overlay.geo_regions"
            description: "Error points to the inventory-eliminating region overlay"
