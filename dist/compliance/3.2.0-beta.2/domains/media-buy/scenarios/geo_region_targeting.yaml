        validations:
          - check: response_schema
            description: "Error response matches create-media-buy-response.json"
          - check: error_code
            value: "INVALID_REQUEST"
            description: "Same-value region overlap is rejected"
          - check: field_value
            path: "errors[0].field"
            value: "packages[0].targeting_overlay.geo_regions_exclude[0]"
            description: "Error points to the conflicting exclusion"

      - id: create_zero_inventory_region
        title: "Submit a valid region with zero executable inventory"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
