                geo_regions: ["CA-QC"]
          idempotency_key: "$generate:uuid_v4#geo_region_targeting_unsupported"
          context:
            correlation_id: "geo_region_targeting--create_unsupported_region_country"
        expected: |
          Reject CA-QC with UNSUPPORTED_FEATURE because the configured Product
          grants French, not Canadian, region selection.
        validations:
          - check: response_schema
            description: "Error response matches create-media-buy-response.json"
          - check: error_code
            value: "UNSUPPORTED_FEATURE"
            description: "Country outside Product support is unsupported"
          - check: field_value
            path: "errors[0].field"
            value: "packages[0].targeting_overlay.geo_regions[0]"
            description: "Error points to the unsupported value"

      - id: create_unknown_region_code
        title: "Submit a syntactically valid but unknown subdivision"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        expect_error: true
        negative_path: payload_well_formed
        stateful: false
        sample_request:
          <<: *region_error_request
          packages:
