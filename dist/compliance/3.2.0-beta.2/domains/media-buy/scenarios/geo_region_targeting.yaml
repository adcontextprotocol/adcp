                geo_regions: ["FR-49"]
                geo_regions_exclude: ["FR-49"]
          idempotency_key: "$generate:uuid_v4#geo_region_targeting_overlap"
          context:
            correlation_id: "geo_region_targeting--create_overlapping_region_targeting"
        expected: |
          Reject with INVALID_REQUEST. The same canonical subdivision identity
