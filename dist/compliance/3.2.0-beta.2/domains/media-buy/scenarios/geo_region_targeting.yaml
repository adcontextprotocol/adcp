          idempotency_key: "$generate:uuid_v4#geo_region_targeting_unsupported_exclusion"
          context:
            correlation_id: "geo_region_targeting--create_unsupported_region_exclusion"
        expected: |
          Reject FR-ARA with UNSUPPORTED_FEATURE even though exhaustive French
          inclusion support contains it. Inclusion never implies exclusion.
        validations:
          - check: response_schema
            description: "Error response matches create-media-buy-response.json"
          - check: error_code
            value: "UNSUPPORTED_FEATURE"
            description: "Independent exclusion support is enforced"
          - check: field_value
            path: "errors[0].field"
            value: "packages[0].targeting_overlay.geo_regions_exclude[0]"
            description: "Error points to the unsupported exclusion"

      - id: create_overlapping_region_targeting
        title: "Submit the same subdivision for inclusion and exclusion"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        expect_error: true
