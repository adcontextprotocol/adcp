            description: "Dry run did not increment revision"
          - check: field_value
            path: "accounts[0].operator"
            value: "pinnacle-handoff.example"
            description: "Dry run did not change the canonical operator"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_handoff"
            description: "Dry run did not change the canonical operator unit"
          - check: field_value
            path: "accounts[0].billing_entity.legal_name"
            value: "Pinnacle Handoff Services LLC"
            description: "Dry run did not replace the canonical billing entity"
          - check: field_absent
            path: "accounts[0].destination_billing_entity"
            description: "Readback does not expose the staged destination billing entity"
          - check: field_absent
            path: "accounts[0].billing_entity.bank"
            description: "Readback omits current billing bank data"
          - check: field_absent
            path: "accounts[0].identity_change"
            description: "Dry run did not persist a pending identity change"

  - id: operator_domain_transition
    title: "Place an operator-domain handoff into approval"
    depends_on: ["operator_domain_dry_run"]
    requires_capability:
      path: "account.identity_updates.supported_changes"
      contains: "operator"
    narrative: |
      Request a complete transition from the agency operator to the brand's own
      domain, removing the operator unit. Because the account is billed to the
      operator, the buyer also supplies the destination operator's complete
      billing identity. An operator-domain handoff crosses an authority boundary:
      the seller must retain the old canonical operator and unit and return
      identity_change.status pending_approval. The request stages destination
      billing identity, but neither the response nor persisted account exposes
      it; both continue returning Pinnacle's current canonical billing entity
      without bank data. The seller must not apply or reject the transition in
      this initial response.
    steps:
      - id: request_direct_brand_operator
        title: "Request an operator-domain transition"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        context_outputs:
          - name: pending_revision
            path: "accounts[0].revision"
        sample_request:
          accounts:
            - account:
                account_id: "$context.handoff_account_id"
              revision: "$context.handoff_revision"
              operator_identity:
                operator: "nova-handoff.example"
              destination_billing_entity:
                legal_name: "Nova Handoff Industries LLC"
                tax_id: "98-7654321"
                registration_number: "NT-2026-0042"
                address:
                  street: "42 Summit Way"
                  city: "Boulder"
                  region: "CO"
                  postal_code: "80302"
                  country: "US"
                contacts:
                  - role: "billing"
                    name: "Nova Handoff accounts payable"
                    email: "billing@nova-handoff.example"
                bank:
                  account_holder: "Nova Handoff Industries LLC"
                  routing_number: "021000021"
                  account_number: "987654321"
          idempotency_key: "$generate:uuid_v4#account_identity_reconciliation_operator_domain"
          context:
            correlation_id: "account_identity_reconciliation--operator_domain"
        validations:
          - check: response_schema
            description: "Pending operator-domain handoff matches sync-accounts-response.json"
          - check: field_equals_context
            path: "accounts[0].account_id"
            context_key: "handoff_account_id"
            description: "Pending operator-domain handoff preserves account_id"
          - check: field_value
            path: "accounts[0].action"
            value: "updated"
            description: "Persisting the approval request updates the existing account"
          - check: field_value
            path: "accounts[0].revision"
            value: 21
            description: "Identity request advances revision from 20 to 21"
          - check: field_value
            path: "accounts[0].operator"
            value: "pinnacle-handoff.example"
            description: "Canonical operator remains unchanged while approval is pending"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_handoff"
            description: "Canonical operator unit remains unchanged while approval is pending"
          - check: field_value
            path: "accounts[0].identity_change.status"
            value: "pending_approval"
            description: "Initial operator-domain handoff always enters pending approval"
          - check: field_value
            path: "accounts[0].identity_change.requested_operator_identity.operator"
            value: "nova-handoff.example"
            description: "Pending transition carries the requested destination operator"
          - check: field_value
            path: "accounts[0].billing_entity.legal_name"
            value: "Pinnacle Handoff Services LLC"
            description: "Pending response retains the current canonical billing entity"
          - check: field_absent
            path: "accounts[0].destination_billing_entity"
            description: "Pending response does not echo the staged destination billing entity"
          - check: field_absent
            path: "accounts[0].billing_entity.bank"
            description: "Pending response omits current billing bank data"
          - check: field_value
            path: "context.correlation_id"
            value: "account_identity_reconciliation--operator_domain"
            description: "Context correlation_id returned unchanged"

      - id: read_pending_operator_domain_transition
        title: "Verify pending state retains current billing identity"
        task: list_accounts
        schema_ref: "account/list-accounts-request.json"
        response_schema_ref: "account/list-accounts-response.json"
        doc_ref: "/accounts/task-reference/list_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        sample_request:
          account:
            account_id: "$context.handoff_account_id"
          context:
            correlation_id: "account_identity_reconciliation--read_pending_domain"
        validations:
          - check: response_schema
            description: "Pending readback matches list-accounts-response.json"
          - check: field_equals_context
            path: "accounts[0].revision"
            context_key: "pending_revision"
            description: "Pending state exposes the revision produced by the request"
          - check: field_value
            path: "accounts[0].operator"
            value: "pinnacle-handoff.example"
            description: "Pending state retains the canonical operator"
          - check: field_value
            path: "accounts[0].identity_change.status"
            value: "pending_approval"
            description: "Readback exposes the staged operator transition"
          - check: field_value
            path: "accounts[0].billing_entity.legal_name"
            value: "Pinnacle Handoff Services LLC"
            description: "Pending state retains the current canonical billing entity"
          - check: field_absent
            path: "accounts[0].destination_billing_entity"
            description: "Pending readback does not expose the staged destination billing entity"
          - check: field_absent
            path: "accounts[0].billing_entity.bank"
            description: "Pending state omits current billing bank data"

  - id: cancel_pending_operator_domain_transition
    title: "Cancel the pending handoff with canonical identity"
    depends_on: ["operator_domain_transition"]
    requires_capability:
      path: "account.identity_updates.supported_changes"
      contains: "operator"
    narrative: |
      The same compliance principal cancels the pending request by submitting
      the current canonical operator identity at the current revision returned
      by the pending response. The seller must clear identity_change, preserve
      the canonical account and billing identity, discard the staged destination
      billing identity, and increment revision exactly once.
    steps:
      - id: cancel_pending_operator_domain_request
        title: "Replace pending request with canonical identity"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        sample_request:
          accounts:
            - account:
                account_id: "$context.handoff_account_id"
              revision: "$context.pending_revision"
              operator_identity:
                operator: "pinnacle-handoff.example"
                operator_unit:
                  id: "seat_handoff"
                  name: "Handoff buying unit"
          idempotency_key: "$generate:uuid_v4#account_identity_reconciliation_cancel_pending_domain"
          context:
            correlation_id: "account_identity_reconciliation--cancel_pending_domain"
        validations:
          - check: response_schema
            description: "Cancellation response matches sync-accounts-response.json"
          - check: field_equals_context
            path: "accounts[0].account_id"
            context_key: "handoff_account_id"
            description: "Cancellation preserves the seller account_id"
          - check: field_value
            path: "accounts[0].action"
            value: "updated"
            description: "Clearing the pending request updates the existing account"
          - check: field_value
            path: "accounts[0].revision"
            value: 22
            description: "Canceling the revision-21 pending request advances revision to 22"
          - check: field_value
            path: "accounts[0].operator"
            value: "pinnacle-handoff.example"
            description: "Cancellation preserves the canonical operator"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_handoff"
            description: "Cancellation preserves the canonical operator unit"
          - check: field_value
            path: "accounts[0].billing_entity.legal_name"
            value: "Pinnacle Handoff Services LLC"
            description: "Cancellation preserves the current canonical billing entity"
          - check: field_absent
            path: "accounts[0].destination_billing_entity"
            description: "Cancellation response does not expose discarded destination billing"
          - check: field_absent
            path: "accounts[0].billing_entity.bank"
            description: "Cancellation response omits current billing bank data"
          - check: field_absent
            path: "accounts[0].identity_change"
            description: "Canonical identity replacement clears the pending request"
          - check: field_value
            path: "context.correlation_id"
            value: "account_identity_reconciliation--cancel_pending_domain"
            description: "Context correlation_id returned unchanged"

      - id: read_after_pending_cancellation
        title: "Verify cancellation persisted"
        task: list_accounts
        schema_ref: "account/list-accounts-request.json"
        response_schema_ref: "account/list-accounts-response.json"
        doc_ref: "/accounts/task-reference/list_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        sample_request:
          account:
            account_id: "$context.handoff_account_id"
          context:
            correlation_id: "account_identity_reconciliation--after_pending_cancellation"
        validations:
          - check: response_schema
            description: "Cancellation readback matches list-accounts-response.json"
          - check: field_equals_context
            path: "accounts[0].account_id"
            context_key: "handoff_account_id"
            description: "Readback returns the same account after cancellation"
          - check: field_value
            path: "accounts[0].revision"
            value: 22
            description: "Readback confirms the cancellation revision"
          - check: field_value
            path: "accounts[0].operator"
            value: "pinnacle-handoff.example"
            description: "Readback confirms the canonical operator"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_handoff"
            description: "Readback confirms the canonical operator unit"
          - check: field_value
            path: "accounts[0].billing_entity.legal_name"
            value: "Pinnacle Handoff Services LLC"
            description: "Readback confirms the current canonical billing entity"
          - check: field_absent
            path: "accounts[0].destination_billing_entity"
            description: "Cancellation readback does not expose discarded destination billing"
          - check: field_absent
            path: "accounts[0].billing_entity.bank"
            description: "Cancellation readback omits current billing bank data"
          - check: field_absent
            path: "accounts[0].identity_change"
            description: "Readback confirms the pending request was cleared"
