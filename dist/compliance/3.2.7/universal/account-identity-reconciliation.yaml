  - id: operator_domain_dry_run
    title: "Preview an operator-domain handoff without mutation"
    depends_on: ["operator_domain_billing_required"]
    requires_capability:
      path: "account.identity_updates.supported_changes"
      contains: "operator"
    narrative: |
      The same authorized compliance principal previews a handoff from the
      agency operator to the brand's own domain at revision 20. The seller must
      return would_require_approval with billing and grant transition impacts,
      but dry_run must not persist identity_change or increment revision. The
      response and list_accounts readback retain Pinnacle's current canonical
      billing entity and omit both staged destination identity and bank data.
    steps:
      - id: preview_direct_brand_operator
        title: "Dry-run the operator-domain handoff"
