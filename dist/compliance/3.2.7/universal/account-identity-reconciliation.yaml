  - id: target_key_collision
    title: "Reject a target-key collision without merging"
    depends_on: ["successful_operator_unit_rekey"]
    requires_capability:
      path: "account.identity_updates.supported_changes"
      contains: "operator_unit"
    narrative: |
      Attempt to move the primary account onto seat_reserved, which the second
      seeded account already owns for the same complete natural-key qualifiers.
      A dry run must return ACCOUNT_IDENTITY_CONFLICT with a blocked resource
      impact and no mutation. The live request must reject with the same code.
      Exact account_id readbacks after each attempt prove that neither account
      was merged or mutated.
    steps:
      - id: preview_operator_unit_collision
        title: "Preview the blocked rekey onto seat_reserved"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        sample_request:
          accounts:
            - account:
                account_id: "$context.primary_account_id"
              revision: "$context.updated_revision"
              operator_identity:
                operator: "pinnacle-identity.example"
                operator_unit:
                  id: "seat_reserved"
                  name: "Reserved buying unit"
          dry_run: true
          idempotency_key: "$generate:uuid_v4#account_identity_reconciliation_target_collision_preview"
          context:
            correlation_id: "account_identity_reconciliation--target_collision_preview"
        validations:
          - check: response_schema
            description: "Blocked collision preview matches sync-accounts-response.json"
          - check: error_code
            value: "ACCOUNT_IDENTITY_CONFLICT"
            description: "Dry-run collision returns the dedicated identity conflict code"
          - check: field_value
            path: "dry_run"
            value: true
            description: "Collision evaluation is explicitly non-mutating"
          - check: field_value
            path: "accounts[0].action"
            value: "failed"
            description: "Blocked collision cannot describe a persisted update"
          - check: field_equals_context
            path: "accounts[0].revision"
            context_key: "updated_revision"
            description: "Blocked preview retains the current revision"
          - check: field_value
            path: "accounts[0].operator"
            value: "pinnacle-identity.example"
            description: "Blocked preview retains the current canonical operator"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_reconciled"
            description: "Blocked preview retains the current canonical unit"
          - check: field_value
            path: "accounts[0].identity_change_preview.outcome"
            value: "blocked"
            description: "Collision preview is explicitly blocked"
          - check: field_value
            path: "accounts[0].identity_change_preview.requested_operator_identity.operator_unit.id"
            value: "seat_reserved"
            description: "Preview identifies the occupied requested unit"
          - check: field_contains
            path: "accounts[0].identity_change_preview.impacts"
            value:
              area: "account_id"
              effect: "blocked"
            description: "Preview identifies blocked account identity continuity"
          - check: field_present
            path: "accounts[0].identity_change_preview.blockers[0]"
            description: "Preview explains the collision blocker"
          - check: field_absent
            path: "accounts[0].identity_change"
            description: "Dry-run collision does not persist an identity request"

      - id: read_primary_after_collision_preview
        title: "Verify the dry run left the source unchanged"
        task: list_accounts
        schema_ref: "account/list-accounts-request.json"
        response_schema_ref: "account/list-accounts-response.json"
        doc_ref: "/accounts/task-reference/list_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        sample_request:
          account:
            account_id: "$context.primary_account_id"
          context:
            correlation_id: "account_identity_reconciliation--source_after_collision_preview"
        validations:
          - check: response_schema
            description: "Source readback matches list-accounts-response.json"
          - check: field_equals_context
            path: "accounts[0].revision"
            context_key: "updated_revision"
            description: "Dry-run collision does not increment source revision"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_reconciled"
            description: "Source retains its canonical unit after the dry run"

      - id: read_target_after_collision_preview
        title: "Verify the dry run left the target unchanged"
        task: list_accounts
        schema_ref: "account/list-accounts-request.json"
        response_schema_ref: "account/list-accounts-response.json"
        doc_ref: "/accounts/task-reference/list_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        sample_request:
          account:
            account_id: "acct_identity_reconciliation_collision"
          context:
            correlation_id: "account_identity_reconciliation--target_after_collision_preview"
        validations:
          - check: response_schema
            description: "Target readback matches list-accounts-response.json"
          - check: field_value
            path: "accounts[0].revision"
            value: 3
            description: "Dry-run collision does not increment target revision"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_reserved"
            description: "Target retains the occupied unit after the dry run"

      - id: reject_operator_unit_collision
        title: "Reject rekey onto seat_reserved"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        expect_error: true
        negative_path: payload_well_formed
        sample_request:
          accounts:
            - account:
                account_id: "$context.primary_account_id"
              revision: "$context.updated_revision"
              operator_identity:
                operator: "pinnacle-identity.example"
                operator_unit:
                  id: "seat_reserved"
                  name: "Reserved buying unit"
          idempotency_key: "$generate:uuid_v4#account_identity_reconciliation_target_collision"
          context:
            correlation_id: "account_identity_reconciliation--target_collision"
        validations:
          - check: response_schema
            description: "Collision rejection matches a sync_accounts response arm"
          - check: error_code
            value: "ACCOUNT_IDENTITY_CONFLICT"
            description: "Occupied target natural key is rejected with the dedicated code"

      - id: read_primary_after_collision
        title: "Verify the source account remains unchanged"
        task: list_accounts
        schema_ref: "account/list-accounts-request.json"
        response_schema_ref: "account/list-accounts-response.json"
        doc_ref: "/accounts/task-reference/list_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        sample_request:
          account:
            account_id: "$context.primary_account_id"
          context:
            correlation_id: "account_identity_reconciliation--source_after_collision"
        validations:
          - check: response_schema
            description: "Source readback matches list-accounts-response.json"
          - check: field_equals_context
            path: "accounts[0].account_id"
            context_key: "primary_account_id"
            description: "Source account_id remains present"
          - check: field_equals_context
            path: "accounts[0].revision"
            context_key: "updated_revision"
            description: "Collision rejection does not increment source revision"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_reconciled"
            description: "Source account retains its prior canonical unit"

      - id: read_target_after_collision
        title: "Verify the target account remains separate"
        task: list_accounts
        schema_ref: "account/list-accounts-request.json"
        response_schema_ref: "account/list-accounts-response.json"
        doc_ref: "/accounts/task-reference/list_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        sample_request:
          account:
            account_id: "acct_identity_reconciliation_collision"
          context:
            correlation_id: "account_identity_reconciliation--target_after_collision"
        validations:
          - check: response_schema
            description: "Target readback matches list-accounts-response.json"
          - check: field_value
            path: "accounts[0].account_id"
            value: "acct_identity_reconciliation_collision"
            description: "Target account_id remains independently addressable"
          - check: field_value
            path: "accounts[0].revision"
            value: 3
            description: "Collision rejection does not increment target revision"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_reserved"
            description: "Target account retains the occupied natural key"

  - id: former_key_redirect
    title: "Redirect an authorized caller from the former key"
