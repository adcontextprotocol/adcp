    requires_capability:
      path: "account.identity_updates.supported_changes"
      contains: "operator"
    narrative: |
      An operator-billed account cannot stage an operator-domain handoff without
      the destination party's complete billing identity. The well-formed request
      omits destination_billing_entity; the seller must apply the state-dependent
      business rule, reject it, and leave revision, identity, and current billing
      unchanged.
