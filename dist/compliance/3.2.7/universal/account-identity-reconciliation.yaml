    requires_capability:
      path: "account.identity_updates.supported_changes"
      contains: "operator_unit"
    narrative: |
      The same compliance principal that read and updated the account now uses
      its tombstoned seat_legacy natural key. Because this caller can resolve
      the current account, the seller must return ACCOUNT_MOVED rather than
      creating a second account or masking the redirect as not found.
