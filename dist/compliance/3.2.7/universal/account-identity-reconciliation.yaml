            description: "Preview identifies required destination billing revalidation"
          - check: field_contains
            path: "accounts[0].identity_change_preview.impacts"
            value:
              area: "grants"
              effect: "revoke_and_regrant"
            description: "Preview identifies the operator-scoped grant transition"
          - check: field_value
            path: "accounts[0].billing_entity.legal_name"
            value: "Pinnacle Handoff Services LLC"
            description: "Preview returns only the current canonical billing entity"
          - check: field_absent
            path: "accounts[0].destination_billing_entity"
            description: "Preview does not echo the staged destination billing entity"
          - check: field_absent
            path: "accounts[0].billing_entity.bank"
            description: "Preview omits current billing bank data"
          - check: field_absent
            path: "accounts[0].identity_change"
            description: "Dry run does not return or persist identity_change"
          - check: field_value
            path: "context.correlation_id"
            value: "account_identity_reconciliation--operator_domain_preview"
            description: "Context correlation_id returned unchanged"

      - id: read_after_operator_domain_preview
        title: "Verify dry-run preview changed nothing"
        task: list_accounts
        schema_ref: "account/list-accounts-request.json"
        response_schema_ref: "account/list-accounts-response.json"
        doc_ref: "/accounts/task-reference/list_accounts"
        comply_scenario: account_identity_reconciliation
        stateful: true
        sample_request:
