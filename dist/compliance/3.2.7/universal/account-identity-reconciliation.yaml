        expect_error: true
        negative_path: payload_well_formed
        sample_request:
          accounts:
            - account:
                account_id: "$context.handoff_account_id"
              revision: "$context.handoff_revision"
              operator_identity:
                operator: "nova-handoff.example"
          idempotency_key: "$generate:uuid_v4#account_identity_reconciliation_missing_destination_billing"
          context:
            correlation_id: "account_identity_reconciliation--missing_destination_billing"
        validations:
          - check: response_schema
            description: "Missing destination billing rejection matches a sync_accounts response arm"
          - check: error_code
            allowed_values: ["INVALID_REQUEST", "VALIDATION_ERROR"]
            description: "Operator-billed handoff without destination billing is invalid"

