          context:
            correlation_id: "account_identity_reconciliation--after_missing_destination_billing"
        validations:
          - check: response_schema
            description: "Readback matches list-accounts-response.json"
          - check: field_equals_context
            path: "accounts[0].revision"
            context_key: "handoff_revision"
            description: "Rejected handoff does not increment revision"
          - check: field_value
            path: "accounts[0].operator"
            value: "pinnacle-handoff.example"
            description: "Rejected handoff preserves the canonical operator"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_handoff"
            description: "Rejected handoff preserves the canonical operator unit"
          - check: field_value
            path: "accounts[0].billing_entity.legal_name"
