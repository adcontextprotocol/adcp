              revision: "$context.handoff_revision"
              operator_identity:
                operator: "nova-handoff.example"
              destination_billing_entity:
                legal_name: "Nova Handoff Industries LLC"
                tax_id: "98-7654321"
                registration_number: "NT-2026-0042"
                address:
                  street: "42 Summit Way"
                  city: "Boulder"
                  region: "CO"
                  postal_code: "80302"
                  country: "US"
                contacts:
                  - role: "billing"
                    name: "Nova Handoff accounts payable"
                    email: "billing@nova-handoff.example"
                bank:
                  account_holder: "Nova Handoff Industries LLC"
                  routing_number: "021000021"
                  account_number: "987654321"
          dry_run: true
          idempotency_key: "$generate:uuid_v4#account_identity_reconciliation_operator_domain_preview"
          context:
            correlation_id: "account_identity_reconciliation--operator_domain_preview"
        validations:
          - check: response_schema
            description: "Dry-run preview matches sync-accounts-response.json"
          - check: field_value
            path: "dry_run"
            value: true
            description: "Response identifies the operation as a dry run"
          - check: field_equals_context
            path: "accounts[0].account_id"
            context_key: "handoff_account_id"
            description: "Preview targets the existing account"
          - check: field_value
            path: "accounts[0].action"
            value: "updated"
            description: "Preview describes the update that would be persisted"
          - check: field_equals_context
            path: "accounts[0].revision"
            context_key: "handoff_revision"
            description: "Dry run leaves revision at the current value"
          - check: field_value
            path: "accounts[0].operator"
            value: "pinnacle-handoff.example"
            description: "Preview returns the unchanged canonical operator"
          - check: field_value
            path: "accounts[0].operator_unit.id"
            value: "seat_handoff"
            description: "Preview returns the unchanged canonical operator unit"
          - check: field_value
            path: "accounts[0].identity_change_preview.outcome"
            value: "would_require_approval"
            description: "Operator-domain handoff preview requires approval"
          - check: field_value
            path: "accounts[0].identity_change_preview.requested_operator_identity.operator"
            value: "nova-handoff.example"
            description: "Preview carries the requested destination operator"
          - check: field_contains
            path: "accounts[0].identity_change_preview.impacts"
            value:
              area: "approval"
              effect: "revalidation_required"
            description: "Preview identifies the approval transition"
          - check: field_contains
            path: "accounts[0].identity_change_preview.impacts"
            value:
              area: "billing"
