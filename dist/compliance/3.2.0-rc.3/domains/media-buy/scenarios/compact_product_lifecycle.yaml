id: media_buy_seller/compact_product_lifecycle
version: "1.2.0"
title: "Seller completes the compact product lifecycle"
category: media_buy_seller
summary: "Verifies product discovery, proposal creation, finalization, acceptance, operational control, and readback through the AdCP 3.2 compact lifecycle."
track: media_buy
introduced_in: "3.2"

requires:
  - controller

requires_capability:
  path: compliance_testing.scenarios
  contains: compact_product_lifecycle_probe

required_tools:
  - list_products
  - request_proposals
  - refine_proposals
  - accept_proposal
  - control_media_buy
  - get_media_buys
  - comply_test_controller

narrative: |
  The buyer discovers a published offer, asks the seller to plan against that
  exact product, finalizes the returned draft into an inventory-backed
  committed proposal, accepts the committed snapshot, applies a legal
  decrease-only delivery control, and reads the resulting MediaBuy back. Every
  boundary uses the seller-issued identifiers and revision captured from the
  previous response. The advertised compact_product_lifecycle_probe controller
  scenario makes each positive response arm deterministic for the seeded
  product.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - generates_proposals
  examples:
    - "Publisher with a compact product catalog and proposal workflow"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: "The seller advertises compact_product_lifecycle_probe and exposes the complete compact proposal lifecycle."
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "compact_lifecycle_video"
      delivery_type: "non_guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "compact_video_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
      allowed_actions:
        - action: "decrease_budget"
          modes: ["self_serve"]
          allowed_statuses: ["pending_creatives", "pending_start", "active", "paused"]
          constraints:
            kind: "budget"
            max_delta_percent: 50
        - action: "increase_budget"
          modes: ["seller_managed"]
          allowed_statuses: ["active"]
          sla:
            response_max: "PT30M"
            completion_max: "PT24H"
          constraints:
            kind: "budget"
            max_delta_percent: 20
          terms_ref: "https://seller.example/terms/budget-increase"
        - action: "extend_flight"
          modes: ["seller_managed"]
          allowed_statuses: ["active", "paused"]
          constraints:
            kind: "flight"
            max_change:
              interval: 7
              unit: "days"
        - action: "resume"
          modes: ["self_serve"]
          allowed_statuses: ["paused"]
  pricing_options:
    - product_id: "compact_lifecycle_video"
      pricing_option_id: "compact_video_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 18

phases:
  - id: prepare_lifecycle
    title: "Prepare deterministic compact lifecycle behavior"
    steps:
      - id: prepare_compact_product
        title: "Prepare the seeded product"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          scenario: "compact_product_lifecycle_probe"
          params:
            operation: "prepare"
            product_id: "compact_lifecycle_video"
        validations:
          - check: response_schema
            description: "Controller response matches the canonical schema"
          - check: field_value
            path: "success"
            value: true
            description: "The controller prepares deterministic behavior"
          - check: field_value
            path: "simulated.prepared"
            value: true
            description: "The product is prepared for lifecycle testing"
          - check: field_value
            path: "simulated.product_id"
            value: "compact_lifecycle_video"
            description: "The controller prepared the seeded product"

  - id: discover_product
    title: "Discover a published product"
    depends_on: [prepare_lifecycle]
    steps:
      - id: list_seeded_product
        title: "List the seeded video offer"
        task: list_products
        schema_ref: "media-buy/list-products-request.json"
        response_schema_ref: "media-buy/list-products-response.json"
        doc_ref: "/media-buy/task-reference/list_products"
        stateful: false
        sample_request:
          idempotency_key: "$generate:uuid_v4#compact_product_lifecycle_list"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          criteria:
            product_ids: ["compact_lifecycle_video"]
          fields: ["product_id", "name", "pricing_options", "allowed_actions"]
          max_results: 1
        context_outputs:
          - name: listed_product_id
            path: "products[0].product_id"
        validations:
          - check: response_schema
            description: "Response matches list-products-response.json"
          - check: field_value
            path: "outcome"
            value: "listed"
            description: "The response contains a product page"
          - check: field_value
            path: "products[0].product_id"
            value: "compact_lifecycle_video"
            description: "The requested published product is discoverable"
          - check: field_contains
            path: "products[0].allowed_actions[*]"
            value:
              action: "increase_budget"
              modes: ["seller_managed"]
              allowed_statuses: ["active"]
              constraints:
                kind: "budget"
                max_delta_percent: 20
            description: "Product discovery exposes an advisory status-scoped budget bound"

  - id: request_draft
    title: "Request a proposal for the discovered product"
    depends_on: [discover_product]
    steps:
      - id: request_product_proposal
        title: "Create a draft proposal"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#compact_product_lifecycle_request"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          brief: "Plan a USD 1,000 online-video campaign using the selected published offer."
          criteria:
            product_ids: ["$context.listed_product_id"]
        context_outputs:
          - name: draft_proposal_id
            path: "proposals[0].proposal_id"
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json"
          - check: field_value
            path: "outcome"
            value: "proposed"
            description: "The seller returns at least one proposal"
          - check: field_value
            path: "proposals[0].proposal_status"
            value: "draft"
            description: "Proposal requests produce immutable drafts"
          - check: field_present
            path: "proposals[0].proposal_id"
            description: "The draft has a seller-issued proposal ID"
          - check: field_equals_context
            path: "proposals[0].commercial_terms.purchases[0].product_id"
            context_key: "listed_product_id"
            description: "The proposal uses the exact discovered product"
          - check: field_contains
            path: "proposals[0].commercial_terms.change_terms[*]"
            value:
              term_id: "change_decrease_budget"
              action: "decrease_budget"
              service_mode: "self_serve"
              constraints:
                kind: "budget"
                max_delta_percent: 50
            description: "The proposal materializes the product template as a binding decrease right"
          - check: field_contains
            path: "proposals[0].commercial_terms.change_terms[*]"
            value:
              term_id: "change_increase_budget"
              action: "increase_budget"
              service_mode: "seller_managed"
              allowed_statuses: ["active"]
              processing_sla:
                response_max: "PT30M"
                completion_max: "PT24H"
              constraints:
                kind: "budget"
                max_delta_percent: 20
              terms_ref: "https://seller.example/terms/budget-increase"
            description: "The proposal binds mode, status, SLA, portable bounds, and the contract reference"
          - check: field_contains
            path: "proposals[0].commercial_terms.change_terms[*]"
            value:
              term_id: "change_extend_flight"
              action: "extend_flight"
              service_mode: "seller_managed"
              constraints:
                kind: "flight"
                max_change:
                  interval: 7
                  unit: "days"
            description: "The proposal carries a machine-readable flight-extension bound"

  - id: finalize_draft
    title: "Finalize the draft into an inventory hold"
    depends_on: [request_draft]
    steps:
      - id: finalize_product_proposal
        title: "Create a committed proposal"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#compact_product_lifecycle_finalize"
          refinements:
            - proposal_id: "$context.draft_proposal_id"
              action: "finalize"
        context_outputs:
          - name: committed_proposal_id
            path: "results[0].proposal.proposal_id"
          - name: committed_terms_digest
            path: "results[0].proposal.terms_digest"
        validations:
          - check: response_schema
            description: "Response matches refine-proposals-response.json"
          - check: field_value
            path: "results[0].outcome"
            value: "finalized"
            description: "The draft is finalized"
          - check: field_value
            path: "results[0].proposal.proposal_status"
            value: "committed"
            description: "Finalization creates a committed snapshot"
          - check: field_present
            path: "results[0].proposal.expires_at"
            description: "The committed proposal exposes its hold deadline"
          - check: field_equals_context
            path: "results[0].proposal.parent_proposal_id"
            context_key: "draft_proposal_id"
            description: "The committed snapshot preserves proposal lineage"
          - check: field_contains
            path: "results[0].proposal.commercial_terms.change_terms[*]"
            value:
              term_id: "change_increase_budget"
              action: "increase_budget"
              service_mode: "seller_managed"
              allowed_statuses: ["active"]
            description: "Finalization preserves the exact proposal-bound change right"

  - id: accept_commitment
    title: "Accept the committed proposal"
    depends_on: [finalize_draft]
    steps:
      - id: accept_product_proposal
        title: "Create the MediaBuy"
        task: accept_proposal
        schema_ref: "media-buy/accept-proposal-request.json"
        response_schema_ref: "media-buy/accept-proposal-response.json"
        doc_ref: "/media-buy/task-reference/accept_proposal"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#compact_product_lifecycle_accept"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          proposal_id: "$context.committed_proposal_id"
          proposal_terms_digest: "$context.committed_terms_digest"
        context_outputs:
          - name: accepted_media_buy_id
            path: "media_buy_id"
          - name: accepted_media_buy_revision
            path: "revision"
          - name: accepted_media_buy_status
            path: "media_buy_status"
        validations:
          - check: response_schema
            description: "Response matches accept-proposal-response.json"
          - check: field_value
            path: "status"
            value: "completed"
            description: "Acceptance completes synchronously for the seeded fixture"
          - check: field_present
            path: "media_buy_id"
            description: "The accepted proposal creates a MediaBuy"
          - check: field_present
            path: "revision"
            description: "Acceptance returns the initial optimistic-concurrency revision"
          - check: field_present
            path: "media_buy_status"
            description: "Acceptance reports the initial MediaBuy lifecycle state"
          - check: field_equals_context
            path: "accepted_proposal.proposal_id"
            context_key: "committed_proposal_id"
            description: "The MediaBuy binds the exact committed snapshot"
          - check: field_equals_context
            path: "accepted_proposal.terms_digest"
            context_key: "committed_terms_digest"
            description: "The accepted snapshot preserves the finalized terms digest"
          - check: field_contains
            path: "available_actions[*]"
            value:
              task: "control_media_buy"
              action: "decrease_budget"
              mode: "self_serve"
              change_term_id: "change_decrease_budget"
            description: "The accepted MediaBuy links its legal current control to the negotiated term"
          - check: field_contains
            path: "accepted_proposal.commercial_terms.change_terms[*]"
            value:
              term_id: "change_increase_budget"
              action: "increase_budget"
              service_mode: "seller_managed"
              allowed_statuses: ["active"]
              constraints:
                kind: "budget"
                max_delta_percent: 20
            description: "Acceptance preserves status-scoped rights even when they are not currently available"

  - id: control_accepted_buy
    title: "Apply a revision-checked operational control"
    depends_on: [accept_commitment]
    steps:
      - id: decrease_accepted_proposal_total_budget
        title: "Apply a bounded total-budget decrease"
        task: control_media_buy
        schema_ref: "media-buy/control-media-buy-request.json"
        response_schema_ref: "media-buy/control-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/control_media_buy"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#compact_product_lifecycle_control"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          media_buy_id: "$context.accepted_media_buy_id"
          revision: "$context.accepted_media_buy_revision"
          total_budget:
            amount: 750
            currency: "USD"
        context_outputs:
          - name: proposal_controlled_media_buy_id
            path: "media_buy_id"
          - name: proposal_controlled_revision
            path: "revision"
          - name: proposal_controlled_status
            path: "media_buy_status"
        validations:
          - check: response_schema
            description: "Response matches control-media-buy-response.json"
          - check: field_value
            path: "status"
            value: "completed"
            description: "The negotiated decrease within the 50% bound completes synchronously"
          - check: field_equals_context
            path: "media_buy_id"
            context_key: "accepted_media_buy_id"
            description: "The control updates the MediaBuy created by proposal acceptance"
          - check: field_present
            path: "revision"
            description: "The control returns the post-mutation revision"
          - check: field_equals_context
            path: "media_buy_status"
            context_key: "accepted_media_buy_status"
            description: "The decrease-only control preserves the lifecycle state"

  - id: read_accepted_buy
    title: "Read back the controlled MediaBuy"
    depends_on: [control_accepted_buy]
    steps:
      - id: read_controlled_proposal_buy
        title: "Verify the accepted proposal through MediaBuy readback"
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: false
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          media_buy_ids: ["$context.proposal_controlled_media_buy_id"]
          include_history: 2
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json"
          - check: field_equals_context
            path: "media_buys[0].media_buy_id"
            context_key: "accepted_media_buy_id"
            description: "Readback returns the MediaBuy created by acceptance"
          - check: field_equals_context
            path: "media_buys[0].status"
            context_key: "proposal_controlled_status"
            description: "Readback preserves the post-control lifecycle state"
          - check: field_equals_context
            path: "media_buys[0].revision"
            context_key: "proposal_controlled_revision"
            description: "Readback returns the post-control revision"
          - check: field_equals_context
            path: "media_buys[0].history[0].revision"
            context_key: "proposal_controlled_revision"
            description: "The latest history entry records the control revision"
          - check: field_equals_context
            path: "media_buys[0].history[1].revision"
            context_key: "accepted_media_buy_revision"
            description: "The preceding history entry records the acceptance revision"
          - check: field_less_than
            path: "media_buys[0].history[1].revision"
            context_key: "proposal_controlled_revision"
            description: "The control incremented the MediaBuy revision"
          - check: field_value
            path: "media_buys[0].total_budget"
            value: 750
            description: "Readback persists the bounded total-budget decrease"
          - check: field_equals_context
            path: "media_buys[0].accepted_proposal_id"
            context_key: "committed_proposal_id"
            description: "Readback links the MediaBuy to the accepted proposal"
          - check: field_equals_context
            path: "media_buys[0].accepted_proposal_terms_digest"
            context_key: "committed_terms_digest"
            description: "Readback preserves the accepted proposal terms digest"
          - check: field_equals_context
            path: "media_buys[0].accepted_proposal.proposal_id"
            context_key: "committed_proposal_id"
            description: "Readback includes the exact accepted proposal snapshot"
          - check: field_equals_context
            path: "media_buys[0].accepted_proposal.terms_digest"
            context_key: "committed_terms_digest"
            description: "The nested accepted snapshot preserves the finalized terms digest"
          - check: field_contains
            path: "media_buys[0].available_actions[*]"
            value:
              action: "decrease_budget"
              mode: "self_serve"
              change_term_id: "change_decrease_budget"
            description: "Readback keeps the authoritative current action linked to its accepted right"
          - check: field_contains
            path: "media_buys[0].accepted_proposal.commercial_terms.change_terms[*]"
            value:
              term_id: "change_resume"
              action: "resume"
              allowed_statuses: ["paused"]
            description: "Readback retains negotiated rights that are latent in the current status"
