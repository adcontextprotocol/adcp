id: media_buy_seller/installment_property_delivery_reporting
version: "1.0.0"
introduced_in: "3.3"
title: "Seller reports delivery by installment and property from injected rows"
category: media_buy_seller
summary: "Verifies reporting_dimensions.installment_property returns only controller-injected installment-by-property rows, keeps collection-owner and host-property domains distinct, and echoes truncation, suppression, and applied-sort companions; gated on the seller-wide supports_installment_property_breakdown rollup."
track: reporting

requires_capability:
  path: media_buy.features.supports_installment_property_breakdown
  equals: true

requires:
  - controller

required_tools:
  - create_media_buy
  - get_media_buy_delivery
  - comply_test_controller

narrative: |
  A buyer that needs proof a specific airing, episode, or issue ran on a
  particular host service asks for reporting_dimensions.installment_property.
  Independent installment and property marginals cannot prove that, so the
  seller returns intersection rows. The per-product flag
  reporting_capabilities.supports_installment_property_breakdown is the
  product's promise; the seller-wide rollup
  media_buy.features.supports_installment_property_breakdown is the grading
  gate, so a seller that does not declare it grades not_applicable.

  The test controller injects explicit installment_property_delivery rows with
  simulate_delivery and the seller must echo exactly those rows, never inferring
  them from collection carriage or catalog eligibility. Two domains matter and
  must stay distinct: installment_ref.collection_ref.publisher_domain names the
  collection owner, while the row's publisher_domain namespaces the host
  property that carried it. The scenario also proves the truncation,
  suppression, and applied-sort companions. Injected rows carry no suppression
  control, so the suppression flag is asserted false.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - reports_delivery
  examples:
    - "A broadcaster proving which episode aired on which streaming host"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The controller seeds a product whose reporting_capabilities declare
    supports_installment_property_breakdown. The scenario creates a buy, injects explicit
    installment_property_delivery rows, and requests the dimension twice
    with different limits and orderings. The rows are injected out of impressions order so a seller that truncates before sorting fails. No delivery is inferred by the seller.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "installment_property_reporting_ctv"
      delivery_type: "non_guaranteed"
      channels: ["ctv"]
      format_options:
        - format_option_id: "installment_property_reporting_ctv_15s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 15000
      reporting_capabilities:
        available_reporting_frequencies: ["daily"]
        expected_delay_minutes: 0
        timezone: "UTC"
        supports_webhooks: false
        available_metrics: ["impressions", "spend"]
        supports_installment_property_breakdown: true
        date_range_support: "date_range"
  pricing_options:
    - product_id: "installment_property_reporting_ctv"
      pricing_option_id: "installment_property_reporting_ctv_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 10.0

phases:
  - id: setup
    title: "Create a buy on a property-reportable product"
    steps:
      - id: sync_account
        title: "Establish the buyer account"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
              payment_terms: "net_30"
          idempotency_key: "$generate:uuid_v4#installment_property_delivery_reporting_sync_account"
        validations:
          - check: response_schema
            description: "Account response matches the protocol schema"
          - check: field_present
            path: "accounts[0].account_id"
            description: "The seller assigns an account identity"

      - id: create_buy
        title: "Create the buy"
        task: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        stateful: true
        sample_request:
          brand:
            domain: "acmeoutdoor.example"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          start_time: "asap"
          end_time: "2099-06-30T23:59:59Z"
          packages:
            - product_id: "installment_property_reporting_ctv"
              pricing_option_id: "installment_property_reporting_ctv_cpm"
              budget: 1000
          idempotency_key: "$generate:uuid_v4#installment_property_delivery_reporting_create_buy"
        context_outputs:
          - name: media_buy_id
            path: "media_buy_id"
        validations:
          - check: response_schema
            description: "Create response matches the protocol schema"
          - check: field_present
            path: "media_buy_id"
            description: "The seller assigns a media-buy identity"

  - id: report
    title: "Inject and retrieve installment-by-property delivery"
    steps:
      - id: simulate_delivery
        title: "Inject deterministic installment-by-property rows"
        task: comply_test_controller
        requires_tool: comply_test_controller
        stateful: true
        sample_request:
          account:
            sandbox: true
          scenario: "simulate_delivery"
          params:
            media_buy_id: "$context.media_buy_id"
            impressions: 10000
            installment_property_delivery:
              - installment_ref:
                  collection_ref: { publisher_domain: "studio-network.example", collection_id: "nightly_news" }
                  installment_id: "ep_102"
                publisher_domain: "streamhaus.example"
                identifier: { type: "domain", value: "streamhaus.example" }
                impressions: 800
                spend: 8
              - installment_ref:
                  collection_ref: { publisher_domain: "studio-network.example", collection_id: "nightly_news" }
                  installment_id: "ep_101"
                publisher_domain: "othercast.example"
                identifier: { type: "domain", value: "othercast.example" }
                impressions: 1500
                spend: 60
              - installment_ref:
                  collection_ref: { publisher_domain: "studio-network.example", collection_id: "nightly_news" }
                  installment_id: "ep_101"
                publisher_domain: "streamhaus.example"
                identifier: { type: "domain", value: "streamhaus.example" }
                impressions: 4000
                spend: 40
        validations:
          - check: field_value
            path: "success"
            allowed_values: [true]
            description: "The controller accepts the deterministic rows"

      - id: get_truncated_by_impressions
        title: "Request the top two rows by impressions"
        task: get_media_buy_delivery
        schema_ref: "media-buy/get-media-buy-delivery-request.json"
        response_schema_ref: "media-buy/get-media-buy-delivery-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buy_delivery"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids: ["$context.media_buy_id"]
          reporting_dimensions:
            installment_property:
              limit: 2
              sort_by: "impressions"
              sort_direction: "desc"
        validations:
          - check: response_schema
            description: "Delivery response matches the protocol schema"
          - check: field_equals_context
            path: "media_buy_deliveries[0].media_buy_id"
            context_key: "media_buy_id"
            description: "The response belongs to the requested media buy"
          - check: field_present
            path: "media_buy_deliveries[0].by_package[0].by_installment_property"
            description: "The seller returns the requested installment-by-property breakdown"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property[0].installment_ref.installment_id"
            allowed_values: ["ep_101"]
            description: "Highest-impression installment row orders first"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property[0].installment_ref.collection_ref.publisher_domain"
            allowed_values: ["studio-network.example"]
            description: "The collection owner is carried in installment_ref"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property[0].publisher_domain"
            allowed_values: ["streamhaus.example"]
            description: "The host property domain is carried separately from the collection owner"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property[1].publisher_domain"
            allowed_values: ["othercast.example"]
            description: "The same installment on a second host property is a distinct row"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property_truncated"
            allowed_values: [true]
            description: "The two-row limit truncated the three injected rows"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property_suppressed"
            allowed_values: [false]
            description: "No row is threshold-suppressed"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property_sorted_by"
            allowed_values: ["impressions"]
            description: "The response echoes the metric actually used for sorting"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property_sort_direction"
            allowed_values: ["desc"]
            description: "The response echoes the applied descending direction"

      - id: get_complete_by_spend
        title: "Request every row ordered by ascending spend"
        task: get_media_buy_delivery
        schema_ref: "media-buy/get-media-buy-delivery-request.json"
        response_schema_ref: "media-buy/get-media-buy-delivery-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buy_delivery"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
          media_buy_ids: ["$context.media_buy_id"]
          reporting_dimensions:
            installment_property:
              limit: 3
              sort_by: "spend"
              sort_direction: "asc"
        validations:
          - check: response_schema
            description: "Delivery response matches the protocol schema"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property_truncated"
            allowed_values: [false]
            description: "A limit equal to the injected row count discloses no truncation"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property_suppressed"
            allowed_values: [false]
            description: "No row is threshold-suppressed"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property_sorted_by"
            allowed_values: ["spend"]
            description: "The response echoes the metric actually used for sorting"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property_sort_direction"
            allowed_values: ["asc"]
            description: "The response echoes the applied ascending direction"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property[0].installment_ref.installment_id"
            allowed_values: ["ep_102"]
            description: "Ascending spend returns the cheapest row first"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property[2].publisher_domain"
            allowed_values: ["othercast.example"]
            description: "Ascending spend orders the most expensive row last"
          - check: field_value
            path: "media_buy_deliveries[0].by_package[0].by_installment_property[2].installment_ref.collection_ref.publisher_domain"
            allowed_values: ["studio-network.example"]
            description: "Collection owner stays distinct from the host property on every row"
