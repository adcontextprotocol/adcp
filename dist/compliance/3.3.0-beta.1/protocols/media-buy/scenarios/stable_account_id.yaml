id: media_buy_seller/stable_account_id
version: "1.0.1"
introduced_in: "3.3"
title: "Seller-assigned account_id is a durable AccountRef for a buyer-declared account"
category: media_buy_seller
summary: "Provisions a fresh buyer-declared account, then verifies the returned account_id resolves the same account as its natural key is accepted as an AccountRef on an account-scoped task, and, as a SHOULD, comes back when the provisioning entry is sent again."
track: media_buy

# Gate: sellers that declare account.stable_account_id: true for buyer-declared
# accounts. `require_operator_auth` defaults to false; the runner applies the
# schema default when the seller declares `account` without the field. Explicit
# account sellers (require_operator_auth: true) already address accounts by
# account_id and need not accept natural-key provisioning, so this scenario
# does not grade them.
#
# `required_tools` is a lenient any-of, so it lists only sync_accounts to make
# provisioning a strict gate. list_accounts steps skip with missing_tool when
# the agent does not advertise it.
requires_all_capabilities:
  - path: account.stable_account_id
    equals: true
  - path: account.require_operator_auth
    equals: false

required_tools:
  - sync_accounts

narrative: |
  Every seller returns account_id on every resolved sync_accounts provisioning
  result. A seller never issues an account_id it might later change, so a
  pending_approval row that may still resolve to a different account carries
  an experimental request_id instead. The seller accepts { "account_id": ... }
  wherever an AccountRef is accepted, including for buyer-declared accounts,
  and never changes an account's account_id for the life of the account. The
  natural key keeps working throughout 3.x.

  The buyer provisions a fresh natural key, qualified by a per-run
  operator_unit so no earlier run or fixture can have created it. It captures
  the returned account_id and checks that the id and the natural key
  resolve the same account on list_accounts. An account-scoped task that names
  the account only by account_id must succeed instead of returning
  ACCOUNT_NOT_FOUND.

  Sending the same provisioning entry again with a new idempotency_key
  SHOULD return the same account_id, because the entry matches exactly one
  account in the seller's account scope. That check is advisory. A retry with
  the same idempotency_key returns the original result.

  The stable_account_id flag is deprecated in 3.3, because the guarantee it
  declared now holds for every seller. Until it is removed, this scenario runs
  only for sellers that declare it.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - buyer_declared_accounts
    - stable_account_id
  examples:
    - "Sellers that provision buyer-declared accounts and accept their account_id"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The seller declares account.stable_account_id: true with buyer-declared
    accounts and exposes sync_accounts. The provisioned key uses a per-run
    operator_unit id; do not seed it.
  test_kit: "test-kits/acme-outdoor.yaml"

phases:
  - id: discover_and_provision
    title: "Provision a fresh buyer-declared account"
    steps:
      - id: discover_stable_account_id
        title: "Read the account capability"
        task: get_adcp_capabilities
        schema_ref: "protocol/get-adcp-capabilities-request.json"
        response_schema_ref: "protocol/get-adcp-capabilities-response.json"
        doc_ref: "/protocol/get_adcp_capabilities"
        stateful: false
        sample_request: {}
        context_outputs:
          - name: stable_account_billing
            path: "account.supported_billing[0]"
          - name: stable_account_operator_unit_id
            generate: uuid_v4
        validations:
          - check: response_schema
            description: "Capability response matches the canonical schema"
          - check: field_value
            path: "account.stable_account_id"
            value: true
            description: "Seller declares account_id a durable AccountRef"
          - check: field_present
            path: "account.supported_billing[0]"
            description: "Seller advertises at least one billing model to provision with"

      - id: provision_account
        title: "Open an account for this run"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              operator_unit:
                id: "$context.stable_account_operator_unit_id"
                name: "Stable account_id test"
              billing: "$context.stable_account_billing"
              sandbox: true
          idempotency_key: "$generate:uuid_v4#stable_account_id_provision"
        context_outputs:
          - name: stable_account_id
            path: "accounts[0].account_id"
        validations:
          - check: response_schema
            description: "Provisioning response matches the canonical schema"
          - check: field_value
            path: "accounts[0].action"
            value: "created"
            description: "Provisioning opens a fresh account for this run"
          - check: field_present
            path: "accounts[0].account_id"
            description: "A resolved provisioning result carries account_id (a sandbox account is expected to resolve without review)"

  - id: resolve_by_account_id
    title: "The account_id and the natural key name the same account"
    depends_on: [discover_and_provision]
    steps:
      - id: list_by_account_id
        title: "Resolve the account by account_id"
        task: list_accounts
        schema_ref: "account/list-accounts-request.json"
        response_schema_ref: "account/list-accounts-response.json"
        doc_ref: "/accounts/tasks/list_accounts"
        stateful: false
        sample_request:
          account:
            account_id: "$context.stable_account_id"
        validations:
          - check: response_schema
            description: "account_id read matches the canonical schema"
          - check: array_length
            path: "accounts"
            value: 1
            description: "The account_id filter returns exactly the provisioned account"
          - check: field_equals_context
            path: "accounts[0].account_id"
            context_key: "stable_account_id"
            description: "The returned account carries the same account_id"
          - check: field_value
            path: "accounts[0].brand.domain"
            value: "acmeoutdoor.example"
            description: "The account_id resolves the provisioned brand"
          - check: field_value
            path: "accounts[0].operator"
            value: "pinnacle-agency.example"
            description: "The account_id resolves the provisioned operator"
          - check: field_equals_context
            path: "accounts[0].operator_unit.id"
            context_key: "stable_account_operator_unit_id"
            description: "The account_id resolves the per-run operator unit"

      - id: list_by_natural_key
        title: "Resolve the account by its natural key"
        task: list_accounts
        schema_ref: "account/list-accounts-request.json"
        response_schema_ref: "account/list-accounts-response.json"
        doc_ref: "/accounts/tasks/list_accounts"
        stateful: false
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "$context.stable_account_operator_unit_id"
            sandbox: true
        validations:
          - check: response_schema
            description: "Natural-key read matches the canonical schema"
          - check: array_length
            path: "accounts"
            value: 1
            description: "The natural key returns exactly the provisioned account"
          - check: field_equals_context
            path: "accounts[0].account_id"
            context_key: "stable_account_id"
            description: "The natural key resolves the same account_id"

  - id: account_scoped_read_by_account_id
    title: "An account-scoped read addressed only by account_id"
    depends_on: [discover_and_provision]
    steps:
      - id: get_media_buys_by_account_id
        title: "Read the account's media buys by account_id"
        task: get_media_buys
        schema_ref: "media-buy/get-media-buys-request.json"
        response_schema_ref: "media-buy/get-media-buys-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buys"
        stateful: false
        expected: |
          Resolve the account from its account_id and return its media buys,
          which is an empty list for this fresh account. Do not return
          ACCOUNT_NOT_FOUND for an account_id this seller returned from
          sync_accounts.
        sample_request:
          account:
            account_id: "$context.stable_account_id"
        validations:
          - check: response_schema
            description: "Response matches get-media-buys-response.json schema"
          - check: field_present
            path: "media_buys"
            description: "The seller answered for the account_id instead of rejecting it"

  - id: account_id_survives_resync
    title: "Sending the provisioning entry again returns the same account"
    depends_on: [resolve_by_account_id]
    steps:
      - id: resync_natural_key
        title: "Send the same provisioning entry with a new idempotency key"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: |
          The entry matches exactly one account in the seller's account scope,
          the one this run opened. The seller SHOULD return its account_id
          instead of opening another, so a buyer that lost its idempotency
          state does not open a duplicate.
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              operator_unit:
                id: "$context.stable_account_operator_unit_id"
                name: "Stable account_id test"
              billing: "$context.stable_account_billing"
              sandbox: true
          idempotency_key: "$generate:uuid_v4#stable_account_id_resync"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json schema"
          - check: field_equals_context
            path: "accounts[0].account_id"
            context_key: "stable_account_id"
            severity: advisory
            permanent_advisory:
              reason: "Returning the matched account for a provisioning entry is a normative SHOULD in 3.3."
            description: "Sending the provisioning entry again returns the existing account_id"
