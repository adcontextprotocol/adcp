id: governance_aware_seller/governance_multi_agent_rejected
version: "1.0.1"
title: "Seller registers one governance agent and rejects multiple agents"
category: governance_aware_seller
summary: "Verifies valid single-agent registration and rejection of a governance_agents payload that violates the maxItems: 1 constraint."
track: media_buy
required_tools:
  - sync_governance

narrative: |
  PR #3015 constrained governance_agents to maxItems: 1 — one governance agent
  per account, mirroring the singular governance_context on the protocol envelope.
  This scenario first proves the valid registration path, then verifies that
  sellers reject registrations carrying more than one agent entry and surface a
  clear error pointing at the one-agent-per-account invariant.

  A seller that silently accepts a two-agent payload (persisting only the first
  entry, or all entries) passes every happy-path governance scenario without ever
  enforcing this constraint. This scenario closes that gap: it submits a
  sync_governance request with two governance_agents entries and expects the seller
  to respond with INVALID_REQUEST.

  No live governance-agent call is needed: the seller persists the configured
  endpoint, and the schema-invalid replacement must be rejected before it can
  alter that binding.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
  examples:
    - "Any media buy seller that validates sync_governance request schema"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    A seller that supports sync_governance, persists a single configured endpoint,
    and validates the governance_agents maxItems: 1 constraint on receipt. The
    scenario does not require a live governance agent — only the seller is under test.
  test_kit: "test-kits/acme-outdoor.yaml"

phases:
  - id: account_setup
    title: "Establish account with seller"
    steps:
      - id: sync_accounts
        title: "Create account"
        task: sync_accounts
        schema_ref: "account/sync-accounts-request.json"
        response_schema_ref: "account/sync-accounts-response.json"
        doc_ref: "/accounts/tasks/sync_accounts"
        stateful: true
        expected: |
          Seller returns the account with account_id and status active.
        sample_request:
          accounts:
            - brand:
                domain: "acmeoutdoor.example"
              operator: "pinnacle-agency.example"
              billing: "operator"
              payment_terms: "net_30"
          idempotency_key: "$generate:uuid_v4#governance_aware_seller_multi_agent_rejected_account_setup_sync_accounts"
        validations:
          - check: response_schema
            description: "Response matches sync-accounts-response.json schema"
          - check: field_present
            path: "accounts[0].account_id"
            description: "Account has a platform-assigned ID"

  - id: single_agent_registered
    title: "Register one governance agent"
    steps:
      - id: sync_governance_one_agent
        title: "Register the account's governance agent"
        task: sync_governance
        schema_ref: "account/sync-governance-request.json"
        response_schema_ref: "account/sync-governance-response.json"
        doc_ref: "/accounts/tasks/sync_governance"
        stateful: true
        expected: |
          Seller persists the single governance endpoint and reports the account
          registration as synced.
        sample_request:
          accounts:
            - account:
                brand:
                  domain: "acmeoutdoor.example"
                operator: "pinnacle-agency.example"
              governance_agents:
                - url: "https://test-agent.adcontextprotocol.org"
                  authentication:
                    schemes: ["Bearer"]
                    credentials: "gov-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          idempotency_key: "$generate:uuid_v4#governance_aware_seller_single_agent_registered"
          context:
            correlation_id: "governance_aware_seller--single_agent_registered--sync_governance"
        validations:
          - check: response_schema
            description: "Response matches sync-governance-response.json schema"
          - check: field_value
            path: "accounts[0].status"
            value: "synced"
            description: "Seller accepts the valid single-agent registration"
          - check: field_value
            path: "accounts[0].governance_agents[0].url"
            value: "https://test-agent.adcontextprotocol.org"
            description: "Seller echoes the persisted governance endpoint"
          - check: field_value
            path: "context.correlation_id"
            value: "governance_aware_seller--single_agent_registered--sync_governance"
            description: "Context correlation_id echoed verbatim"

  - id: multi_agent_rejected
    title: "sync_governance with two agents — rejected"
    steps:
      - id: sync_governance_two_agents
        title: "Submit two governance_agents entries (violates maxItems: 1)"
        task: sync_governance
        schema_ref: "account/sync-governance-request.json"
        response_schema_ref: "account/sync-governance-response.json"
        doc_ref: "/accounts/tasks/sync_governance"
        expect_error: true
        negative_path: schema_invalid
        stateful: true
        expected: |
          Seller rejects the request because governance_agents contains two entries,
          violating the maxItems: 1 constraint. Returns INVALID_REQUEST with a
          message indicating the one-agent-per-account invariant was violated.
        sample_request:
          accounts:
            - account:
                brand:
                  domain: "acmeoutdoor.example"
                operator: "pinnacle-agency.example"
              governance_agents:
                - url: "https://governance.pinnacle-agency.example"
                  authentication:
                    schemes: ["Bearer"]
                    credentials: "gov-token-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
                - url: "https://secondary-governance.pinnacle-agency.example"
                  authentication:
                    schemes: ["Bearer"]
                    credentials: "gov-token-yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"
          idempotency_key: "$generate:uuid_v4#governance_aware_seller_multi_agent_rejected_sync_governance_two_agents"
          context:
            correlation_id: "governance_aware_seller--multi_agent_rejected--sync_governance"
        validations:
          - check: error_code
            allowed_values: ["INVALID_REQUEST", "VALIDATION_ERROR"]
            description: "Seller rejects two-agent payload at the request-shape layer — governance_agents maxItems: 1 violated. Returns a top-level error envelope (errors[]) rather than per-account failure status; schema-shape violations are not per-account business failures. INVALID_REQUEST or VALIDATION_ERROR are both compliant."
          - check: field_present
            path: "context"
            description: "Response echoes back the context object on errors"
          - check: field_value
            path: "context.correlation_id"
            value: "governance_aware_seller--multi_agent_rejected--sync_governance"
            description: "Context correlation_id echoed verbatim on error response"
