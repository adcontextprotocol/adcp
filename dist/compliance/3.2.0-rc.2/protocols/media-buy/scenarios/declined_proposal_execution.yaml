id: media_buy_seller/declined_proposal_execution
version: "1.0.0"
title: "Seller rejects execution of a declined committed proposal"
category: media_buy_seller
summary: "Verifies decline terminality at both canonical and compatibility proposal-execution boundaries."
track: media_buy
introduced_in: "3.2"

requires:
  - controller

requires_capability:
  path: compliance_testing.scenarios
  contains: compact_product_lifecycle_probe

required_tools:
  - request_proposals
  - refine_proposals
  - decline_proposals
  - accept_proposal
  - comply_test_controller

narrative: |
  The buyer finalizes a draft into a committed inventory hold, then declines
  that exact committed snapshot. Both the canonical accept_proposal call and
  the optional 3.x create_media_buy compatibility facade must reject later
  execution with INVALID_STATE. The advertised controller probe makes the
  positive setup responses deterministic for the seeded product.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - generates_proposals

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: "The seller advertises compact_product_lifecycle_probe and supports compact proposals; create_media_buy is probed only when exposed."
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  products:
    - product_id: "decline_execution_video"
      delivery_type: "non_guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "decline_execution_video_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
  pricing_options:
    - product_id: "decline_execution_video"
      pricing_option_id: "decline_execution_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 20

phases:
  - id: prepare_lifecycle
    title: "Prepare deterministic compact lifecycle behavior"
    steps:
      - id: prepare_decline_execution_product
        title: "Prepare the seeded product"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          scenario: "compact_product_lifecycle_probe"
          params:
            operation: "prepare"
            product_id: "decline_execution_video"
        validations:
          - check: response_schema
            description: "Controller response matches the canonical schema"
          - check: field_value
            path: "success"
            value: true
            description: "The controller prepares deterministic behavior"
          - check: field_value
            path: "simulated.prepared"
            value: true
            description: "The product is prepared for lifecycle testing"
          - check: field_value
            path: "simulated.product_id"
            value: "decline_execution_video"
            description: "The controller prepared the seeded product"

  - id: create_committed_proposal
    title: "Create a committed proposal"
    depends_on: [prepare_lifecycle]
    steps:
      - id: request_execution_candidate
        title: "Request a draft proposal"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#declined_proposal_execution_request"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          brief: "Plan a $50,000 premium video campaign from January 1 through March 31, 2099."
          criteria:
            product_ids: ["decline_execution_video"]
        context_outputs:
          - name: execution_draft_id
            path: "proposals[0].proposal_id"
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json"
          - check: field_value
            path: "outcome"
            value: "proposed"
            description: "The seller creates a draft"

      - id: finalize_execution_candidate
        title: "Finalize the draft"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#declined_proposal_execution_finalize"
          refinements:
            - proposal_id: "$context.execution_draft_id"
              action: "finalize"
        context_outputs:
          - name: declined_committed_id
            path: "results[0].proposal.proposal_id"
          - name: declined_committed_digest
            path: "results[0].proposal.terms_digest"
          - name: declined_budget_amount
            path: "results[0].proposal.commercial_terms.total_budget.amount"
          - name: declined_budget_currency
            path: "results[0].proposal.commercial_terms.total_budget.currency"
          - name: declined_start_time
            path: "results[0].proposal.commercial_terms.start_time"
          - name: declined_end_time
            path: "results[0].proposal.commercial_terms.end_time"
        validations:
          - check: response_schema
            description: "Response matches refine-proposals-response.json"
          - check: field_value
            path: "results[0].outcome"
            value: "finalized"
            description: "The seller creates a committed hold"

  - id: decline_commitment
    title: "Decline the committed snapshot"
    depends_on: [create_committed_proposal]
    steps:
      - id: decline_execution_candidate
        title: "Record the decline"
        task: decline_proposals
        schema_ref: "media-buy/decline-proposals-request.json"
        response_schema_ref: "media-buy/decline-proposals-response.json"
        doc_ref: "/media-buy/task-reference/decline_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#declined_proposal_execution_decline"
          declines:
            - proposal_id: "$context.declined_committed_id"
              reason: "budget_changed"
              detail: "The campaign budget is no longer available."
        validations:
          - check: response_schema
            description: "Response matches decline-proposals-response.json"
          - check: field_value
            path: "results[0].outcome"
            value: "declined"
            description: "The committed snapshot becomes terminally declined"

  - id: reject_execution
    title: "Reject later execution attempts"
    depends_on: [decline_commitment]
    steps:
      - id: accept_declined_proposal
        title: "Reject canonical proposal acceptance"
        task: accept_proposal
        schema_ref: "media-buy/accept-proposal-request.json"
        response_schema_ref: "media-buy/accept-proposal-response.json"
        doc_ref: "/media-buy/task-reference/accept_proposal"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#declined_proposal_execution_accept"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          proposal_id: "$context.declined_committed_id"
          proposal_terms_digest: "$context.declined_committed_digest"
        validations:
          - check: error_code
            value: "INVALID_STATE"
            description: "accept_proposal rejects the declined snapshot"

      - id: create_buy_from_declined_proposal
        title: "Reject compatibility-facade execution"
        task: create_media_buy
        requires_tool: create_media_buy
        schema_ref: "media-buy/create-media-buy-request.json"
        response_schema_ref: "media-buy/create-media-buy-response.json"
        doc_ref: "/media-buy/task-reference/create_media_buy"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#declined_proposal_execution_create"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            sandbox: true
          brand:
            domain: "acmeoutdoor.example"
          proposal_id: "$context.declined_committed_id"
          total_budget:
            amount: "$context.declined_budget_amount"
            currency: "$context.declined_budget_currency"
          start_time: "$context.declined_start_time"
          end_time: "$context.declined_end_time"
        validations:
          - check: error_code
            value: "INVALID_STATE"
            description: "create_media_buy rejects the declined snapshot"
