id: media_buy_seller/hold_extension
version: "1.0.0"
introduced_in: "3.3"
title: "extend_hold within and past the hold policy's limits"
category: media_buy_seller
summary: "Extends a hold within max_total_duration and checks the successor and the superseded source; checks that a hold already at its ceiling and a hold whose policy is not extendable return hold_unavailable, that an all-or-none extension batch aborts its sibling, and that extending a commitment with no hold fails with INVALID_STATE."
track: media_buy

requires_all_capabilities:
  - path: "experimental_features"
    contains: "media_buy.hold_policy"
  - path: "experimental_features"
    contains: "media_buy.hold_extension"
  - path: "media_buy.proposal_refinement.hold_extension"
    equals: true
  - path: "compliance_testing.scenarios"
    contains: "compact_product_lifecycle_probe"

requires:
  - controller

required_tools:
  - request_proposals
  - refine_proposals
  - accept_proposal
  - comply_test_controller

narrative: |
  Experimental (`media_buy.hold_extension`). `action: "extend_hold"` lengthens
  an unexpired hold without lapsing it. A successful extension returns a new
  committed proposal whose `parent_proposal_id` is the source, with the same
  `commercial_terms` and `terms_digest`, the source's `hold_policy` and
  `hold_placed_at` carried forward unchanged, and a later `expires_at` that
  does not pass `hold_placed_at` plus `max_total_duration`. The source is
  superseded: accepting it, or extending it again, fails with
  `INVALID_STATE`.

  A hold whose policy is not extendable, or that no later `expires_at` fits
  under its ceiling, returns `unable` with `hold_unavailable`; an extension
  batch is all-or-none, so its siblings return `batch_aborted`. A committed
  proposal with no hold has nothing to extend, and an entry targeting it fails
  the whole request with `INVALID_STATE`.

  The storyboard seeds four products: an extendable one (one to three days,
  ten days in total), one whose minimum, maximum, and total are all two days
  (so its first hold is already at its ceiling), one that is not extendable,
  and one that is not holdable. Comparing instants is duration arithmetic,
  graded by the advisory `instant_offset_within` check. For a seller that
  offers the `reporting_subscription_probe` sandbox clock, the holds are
  placed at a pinned instant and the extended hold has lapsed once the clock
  passes the ten-day ceiling.

  The @adcp/sdk storyboard runner cannot send `extend_hold` yet: its
  refine_proposals request validation accepts only revise and finalize
  (adcontextprotocol/adcp-client#3601). Until it can, the steps that send
  `extend_hold` fail before reaching the seller, and the steps that depend on
  them are skipped.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - generates_proposals
  examples:
    - "Influencer seller whose holds wait on talent approval"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The seller lists media_buy.hold_policy and media_buy.hold_extension,
    declares media_buy.proposal_refinement.hold_extension, advertises
    compact_product_lifecycle_probe, and honors the hold_policy of seeded
    products. The pinned-clock phases also need reporting_subscription_probe
    and a sandbox clock that starts before 2031-05-04T09:00:00Z.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  accounts:
    - account_id: "acct_acmeoutdoor_example_sandbox_993cfe0ef595"
      fixture:
        brand:
          domain: "acmeoutdoor.example"
        operator: "pinnacle-agency.example"
        operator_unit:
          id: "compliance-media_buy_seller_hold_extension-62eca041"
        billing: "operator"
        status: "active"
        sandbox: true
  products:
    - product_id: "hold_ext_extendable"
      delivery_type: "guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "hold_ext_extendable_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
      hold_policy:
        available: true
        min_duration: "P1D"
        max_duration: "P3D"
        extendable: true
        max_total_duration: "P10D"
    - product_id: "hold_ext_capped"
      delivery_type: "guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "hold_ext_capped_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
      hold_policy:
        available: true
        min_duration: "P2D"
        max_duration: "P2D"
        extendable: true
        max_total_duration: "P2D"
    - product_id: "hold_ext_fixed"
      delivery_type: "guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "hold_ext_fixed_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
      hold_policy:
        available: true
        min_duration: "P1D"
        max_duration: "P3D"
    - product_id: "hold_ext_search"
      delivery_type: "non_guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "hold_ext_search_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
      hold_policy:
        available: false
  pricing_options:
    - product_id: "hold_ext_extendable"
      pricing_option_id: "hold_ext_extendable_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 24
    - product_id: "hold_ext_capped"
      pricing_option_id: "hold_ext_capped_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 24
    - product_id: "hold_ext_fixed"
      pricing_option_id: "hold_ext_fixed_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 24
    - product_id: "hold_ext_search"
      pricing_option_id: "hold_ext_search_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 24

phases:
  - id: prepare_products
    title: "Prepare the seeded products"
    steps:
      - id: prepare_extendable_product
        title: "Prepare the extendable product"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          scenario: "compact_product_lifecycle_probe"
          params:
            operation: "prepare"
            product_id: "hold_ext_extendable"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The controller prepares the seeded product"
      - id: prepare_capped_product
        title: "Prepare the product whose hold starts at its ceiling"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          scenario: "compact_product_lifecycle_probe"
          params:
            operation: "prepare"
            product_id: "hold_ext_capped"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The controller prepares the seeded product"
      - id: prepare_fixed_product
        title: "Prepare the product that is not extendable"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          scenario: "compact_product_lifecycle_probe"
          params:
            operation: "prepare"
            product_id: "hold_ext_fixed"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The controller prepares the seeded product"
      - id: prepare_search_product
        title: "Prepare the product that is not holdable"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          scenario: "compact_product_lifecycle_probe"
          params:
            operation: "prepare"
            product_id: "hold_ext_search"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The controller prepares the seeded product"

  - id: pin_clock
    title: "Pin the sandbox clock"
    depends_on: [prepare_products]
    requires_capability:
      path: "compliance_testing.scenarios"
      contains: "reporting_subscription_probe"
    steps:
      - id: pin_clock_for_extension
        title: "Pin the sandbox clock at 2031-05-04T09:00:00Z"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          scenario: "reporting_subscription_probe"
          params:
            operation: "advance_time"
            target_time: "2031-05-04T09:00:00Z"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The sandbox clock advances"

  - id: hold_extendable
    title: "Hold the extendable product"
    depends_on: [prepare_products]
    steps:
      - id: request_extendable_draft
        title: "Request a draft for the extendable product"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_request_extendable"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          brief: "Hold an influencer package while the talent approves the brief."
          criteria:
            product_ids: ["hold_ext_extendable"]
        context_outputs:
          - name: extendable_draft_id
            path: "proposals[0].proposal_id"
          - name: extendable_draft_policy
            path: "proposals[0].hold_policy"
        validations:
          - check: field_value
            path: "proposals[0].hold_policy.extendable"
            value: true
            description: "The draft allocates only extendable inventory, so its policy is extendable"

      - id: finalize_extendable_draft
        title: "Finalize it"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_finalize_extendable"
          refinements:
            - proposal_id: "$context.extendable_draft_id"
              action: "finalize"
        context_outputs:
          - name: extendable_committed_id
            path: "results[0].proposal.proposal_id"
          - name: extendable_terms_digest
            path: "results[0].proposal.terms_digest"
          - name: extendable_hold_placed_at
            path: "results[0].proposal.hold_placed_at"
          - name: extendable_expires_at
            path: "results[0].proposal.expires_at"
        validations:
          - check: field_value
            path: "results[0].outcome"
            value: "finalized"
            description: "The draft is finalized"
          - check: field_present
            path: "results[0].proposal.hold_placed_at"
            description: "The hold is placed"

  - id: extend_within_limits
    title: "Extend a hold within max_total_duration"
    depends_on: [hold_extendable]
    steps:
      - id: extend_extendable_hold
        title: "Extend the hold"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_extend_extendable"
          refinements:
            - proposal_id: "$context.extendable_committed_id"
              action: "extend_hold"
        context_outputs:
          - name: extended_successor_id
            path: "results[0].proposal.proposal_id"
        validations:
          - check: response_schema
            description: "Response matches refine-proposals-response.json"
          - check: field_value
            path: "results[0].outcome"
            value: "finalized"
            description: "The extension succeeds"
          - check: field_value
            path: "results[0].proposal.proposal_status"
            value: "committed"
            description: "The successor is a committed proposal"
          - check: field_equals_context
            path: "results[0].proposal.parent_proposal_id"
            context_key: "extendable_committed_id"
            description: "The successor's parent is the source"
          - check: field_equals_context
            path: "results[0].proposal.terms_digest"
            context_key: "extendable_terms_digest"
            description: "The successor carries the same terms"
          - check: field_equals_context
            path: "results[0].proposal.hold_policy"
            context_key: "extendable_draft_policy"
            description: "The successor carries hold_policy forward unchanged"
          - check: field_equals_context
            path: "results[0].proposal.hold_placed_at"
            context_key: "extendable_hold_placed_at"
            description: "The successor carries hold_placed_at forward, so the total ceiling is not reset"
          - check: instant_offset_within
            path: "results[0].proposal.expires_at"
            base_context_key: "extendable_expires_at"
            min_offset: "PT0S"
            exclusive_min: true
            severity: advisory
            expires_after_version: "17.0.0"
            description: "The successor's expires_at is later than the source's"
          - check: instant_offset_within
            path: "results[0].proposal.expires_at"
            base_path: "results[0].proposal.hold_placed_at"
            max_offset_path: "results[0].proposal.hold_policy.max_total_duration"
            severity: advisory
            expires_after_version: "17.0.0"
            description: "expires_at does not pass hold_placed_at + max_total_duration"

      - id: accept_superseded_source
        title: "Accepting the extended source fails"
        task: accept_proposal
        schema_ref: "media-buy/accept-proposal-request.json"
        response_schema_ref: "media-buy/accept-proposal-response.json"
        doc_ref: "/media-buy/task-reference/accept_proposal"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_accept_source"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          proposal_id: "$context.extendable_committed_id"
          proposal_terms_digest: "$context.extendable_terms_digest"
        validations:
          - check: error_code
            value: "INVALID_STATE"
            description: "The source is superseded by its successor"

      - id: extend_superseded_source
        title: "Extending the source again fails"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_extend_source_again"
          refinements:
            - proposal_id: "$context.extendable_committed_id"
              action: "extend_hold"
        validations:
          - check: error_code
            value: "INVALID_STATE"
            description: "An already-extended source cannot be extended again"

  - id: hold_at_ceiling
    title: "Hold a proposal whose first hold is already at its ceiling"
    depends_on: [prepare_products]
    steps:
      - id: request_capped_draft
        title: "Request a draft for the two-day-total product"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_request_capped"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          brief: "Hold a two-day sponsorship window."
          criteria:
            product_ids: ["hold_ext_capped"]
        context_outputs:
          - name: capped_draft_id
            path: "proposals[0].proposal_id"
          - name: capped_draft_policy
            path: "proposals[0].hold_policy"
        validations:
          - check: field_value
            path: "proposals[0].hold_policy.available"
            value: true
            description: "The draft places a hold"
      - id: finalize_capped_draft
        title: "Finalize it"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_finalize_capped"
          refinements:
            - proposal_id: "$context.capped_draft_id"
              action: "finalize"
        context_outputs:
          - name: capped_committed_id
            path: "results[0].proposal.proposal_id"
        validations:
          - check: field_value
            path: "results[0].outcome"
            value: "finalized"
            description: "The draft is finalized"

  - id: extend_past_ceiling
    title: "Extending past max_total_duration is declined"
    depends_on: [hold_at_ceiling]
    skip_if: "context.capped_draft_policy.min_duration != 'P2D' || context.capped_draft_policy.max_total_duration != 'P2D'"
    narrative: |
      Runs when the draft's policy is the product's: a two-day minimum equal to
      the two-day total, so expires_at is already hold_placed_at plus
      max_total_duration and no later expiry fits.
    steps:
      - id: extend_capped_hold
        title: "Extend the hold at its ceiling"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_extend_capped"
          refinements:
            - proposal_id: "$context.capped_committed_id"
              action: "extend_hold"
        validations:
          - check: response_schema
            description: "Response matches refine-proposals-response.json"
          - check: field_value
            path: "results[0].outcome"
            value: "unable"
            description: "No later expires_at fits under the ceiling"
          - check: field_value
            path: "results[0].reason_code"
            value: "hold_unavailable"
            description: "The extension is declined with hold_unavailable"
          - check: field_absent
            path: "results[0].proposal"
            description: "No successor is created"

  - id: not_extendable
    title: "Hold a product that is not extendable"
    depends_on: [prepare_products]
    steps:
      - id: request_fixed_draft
        title: "Request a draft for the product that is not extendable"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_request_fixed"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          brief: "Hold a radio sponsorship for the weekend."
          criteria:
            product_ids: ["hold_ext_fixed"]
        context_outputs:
          - name: fixed_draft_id
            path: "proposals[0].proposal_id"
        validations:
          - check: field_value_or_absent
            path: "proposals[0].hold_policy.extendable"
            value: false
            description: "A draft over a product that is not extendable is not extendable"
      - id: finalize_fixed_draft
        title: "Finalize it"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_finalize_fixed"
          refinements:
            - proposal_id: "$context.fixed_draft_id"
              action: "finalize"
        context_outputs:
          - name: fixed_committed_id
            path: "results[0].proposal.proposal_id"
        validations:
          - check: field_value
            path: "results[0].outcome"
            value: "finalized"
            description: "The draft is finalized"

  - id: decline_not_extendable
    title: "Extending it is declined"
    depends_on: [not_extendable]
    steps:
      - id: extend_fixed_hold
        title: "Extend the hold that is not extendable"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_extend_fixed"
          refinements:
            - proposal_id: "$context.fixed_committed_id"
              action: "extend_hold"
        validations:
          - check: field_value
            path: "results[0].outcome"
            value: "unable"
            description: "The extension is declined"
          - check: field_value
            path: "results[0].reason_code"
            value: "hold_unavailable"
            description: "A policy that is not extendable is declined with hold_unavailable"

  - id: extension_batch
    title: "An extension batch is all-or-none"
    depends_on: [extend_within_limits, decline_not_extendable]
    steps:
      - id: extend_mixed_batch
        title: "Extend an extendable hold together with one that is not"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_extend_batch"
          refinements:
            - proposal_id: "$context.extended_successor_id"
              action: "extend_hold"
            - proposal_id: "$context.fixed_committed_id"
              action: "extend_hold"
        validations:
          - check: response_schema
            description: "Response matches refine-proposals-response.json"
          - check: field_value
            path: "results[0].reason_code"
            value: "batch_aborted"
            description: "The extendable sibling is aborted"
          - check: field_absent
            path: "results[0].proposal"
            description: "No successor is created for the aborted sibling"
          - check: field_value
            path: "results[1].reason_code"
            value: "hold_unavailable"
            description: "The entry that is not extendable is declined"

  - id: no_hold_to_extend
    title: "Commit terms with no hold"
    depends_on: [not_extendable]
    steps:
      - id: request_search_draft
        title: "Request a draft for the product that is not holdable"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_request_search"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          brief: "Auction video for the launch."
          criteria:
            product_ids: ["hold_ext_search"]
        context_outputs:
          - name: search_draft_id
            path: "proposals[0].proposal_id"
        validations:
          - check: field_value
            path: "proposals[0].hold_policy.available"
            value: false
            description: "The draft is terms-only"
      - id: finalize_search_draft
        title: "Commit its terms"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_finalize_search"
          refinements:
            - proposal_id: "$context.search_draft_id"
              action: "finalize"
        context_outputs:
          - name: search_committed_id
            path: "results[0].proposal.proposal_id"
        validations:
          - check: field_value
            path: "results[0].outcome"
            value: "finalized"
            description: "The terms are committed"

  - id: extend_without_hold
    title: "Extending a commitment with no hold fails"
    depends_on: [extend_within_limits, no_hold_to_extend]
    narrative: |
      Depends on a working extension, so a runner that cannot send
      extend_hold skips these error checks instead of passing them without
      reaching the seller.
    steps:
      - id: extend_terms_only
        title: "Extend the terms-only commitment"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_extend_terms_only"
          refinements:
            - proposal_id: "$context.search_committed_id"
              action: "extend_hold"
        validations:
          - check: error_code
            value: "INVALID_STATE"
            description: "A commitment with no hold has nothing to extend"
      - id: extend_terms_only_with_holdable_sibling
        title: "Extend it together with a holdable sibling"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_extend_terms_only_batch"
          refinements:
            - proposal_id: "$context.fixed_committed_id"
              action: "extend_hold"
            - proposal_id: "$context.search_committed_id"
              action: "extend_hold"
        validations:
          - check: error_code
            value: "INVALID_STATE"
            description: "The whole request fails even though a sibling holds inventory"

  - id: lapse_after_ceiling
    title: "The extended hold has lapsed past its ceiling"
    depends_on: [pin_clock, extend_within_limits]
    requires_capability:
      path: "compliance_testing.scenarios"
      contains: "reporting_subscription_probe"
    skip_if: "context.extendable_draft_policy.max_total_duration != 'P10D'"
    narrative: |
      The hold was placed at the pinned 2031-05-04T09:00:00Z under a ten-day
      total ceiling, so by 2031-05-14T10:00:00Z every hold in its extension
      chain has lapsed.
    steps:
      - id: advance_past_ceiling
        title: "Advance the sandbox clock past the ten-day ceiling"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          scenario: "reporting_subscription_probe"
          params:
            operation: "advance_time"
            target_time: "2031-05-14T10:00:00Z"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The sandbox clock advances"
      - id: accept_lapsed_successor
        title: "Accepting the extended hold fails"
        task: accept_proposal
        schema_ref: "media-buy/accept-proposal-request.json"
        response_schema_ref: "media-buy/accept-proposal-response.json"
        doc_ref: "/media-buy/task-reference/accept_proposal"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_extension_accept_lapsed"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_extension-62eca041"
            sandbox: true
          proposal_id: "$context.extended_successor_id"
          proposal_terms_digest: "$context.extendable_terms_digest"
        validations:
          - check: error_code
            value: "PROPOSAL_EXPIRED"
            description: "No extension outlives hold_placed_at + max_total_duration"
