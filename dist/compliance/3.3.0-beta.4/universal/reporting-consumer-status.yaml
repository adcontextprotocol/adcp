              delivery_config_id: "$context.consumer_silence_config_id"
              delivery_config_version: "$context.consumer_silence_config_version"
              report_definition_id: "$context.consumer_silence_definition_id"
              period:
                start: "$context.consumer_silence_period_start"
                end: "$context.consumer_silence_period_end"
                source_timezone: "UTC"
              reporting_obligation_id: "$context.consumer_silence_obligation_id"
              consumer_status: "revision_missing"
              status_as_of: "2026-08-01T04:00:01.000Z"
        validations:
          - check: response_schema
            description: "The still-retrying buyer's negative status is schema-valid"
          - check: field_value
            path: "results[0].result"
            value: "recorded"
            description: "A buyer meets its deadline with a negative status, not with silence"

      - id: read_silence_cleared
        title: "Clear the count without moving health"
        task: get_reporting_status
        schema_ref: "media-buy/get-reporting-status-request.json"
        response_schema_ref: "media-buy/get-reporting-status-response.json"
        doc_ref: "/media-buy/task-reference/get_reporting_status"
        stateful: true
        sample_request:
          account:
            account_id: "$context.consumer_silence_account_id"
          view: "summary"
          period:
            start: "$context.consumer_silence_period_start"
            end: "$context.consumer_silence_period_end"
        validations:
          - check: response_schema
            description: "Summary readback is schema-valid"
          - check: field_value
            path: "obligation_counts.consumer_status_pending"
            value: 0
            description: "Any unsuperseded leaf clears the count, whatever that leaf says"
          - check: field_equals_context
            path: "issues"
            context_key: "consumer_silence_issues"
            description: "A negative status that corroborates an overdue seller adds and removes no issue"
          - check: field_equals_context
            path: "health"
            context_key: "consumer_silence_health"
            description: "Consumer status that agrees with the seller projection changes no health"
          - check: field_equals_context
            path: "obligation_counts.action_required"
            context_key: "consumer_silence_action_required_count"
            description: "The pending count overlaps the health counts rather than partitioning them"

  - id: content_mismatch
    title: "Dispute a contract fact the accepted generation already fixed"
