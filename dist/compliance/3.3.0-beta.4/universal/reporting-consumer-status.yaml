      - id: read_content_mismatch
        title: "Degrade only this caller's view"
        task: get_reporting_status
        schema_ref: "media-buy/get-reporting-status-request.json"
        response_schema_ref: "media-buy/get-reporting-status-response.json"
        doc_ref: "/media-buy/task-reference/get_reporting_status"
        stateful: true
        sample_request:
          account:
            account_id: "$context.consumer_content_account_id"
          view: "periods"
          period:
            start: "$context.consumer_content_period_start"
            end: "$context.consumer_content_period_end"
        validations:
          - check: response_schema
            description: "Periods readback is schema-valid"
          - check: field_value
            path: "periods[0].health"
            value: "action_required"
            description: "A consumed revision that contradicts the generation is immediately action_required"
          - check: field_contains
            path: "issues[*].code"
            value: "CONSUMER_STATUS_MISMATCH"
            description: "The contract-fact disagreement is typed"
          - check: field_present
            path: "issues[0].opened_at"
            description: "CONSUMER_STATUS_MISMATCH always carries opened_at"
          - check: field_contains
            path: "issues[*].reporting_status_id"
            value: "consumer-status.content-mismatch.0006"
            description: "The issue names the current leaf that caused it"
          - check: field_value
            path: "periods[0].consumer_status_count"
            value: 6
            description: "Every accepted statement stays in append-only history"
          - check: field_value
            path: "periods[0].current_consumer_status_id"
            value: "consumer-status.content-mismatch.0006"
            description: "The rejected no-code statement never became a leaf"
          - check: field_value
            path: "periods[0].production_status"
            value: "published"
            description: "Buyer disagreement never rewrites the seller's own production evidence"

      - id: read_content_mismatch_revision_view
        title: "Read the same chain through the exact-revision view"
        task: get_reporting_status
        schema_ref: "media-buy/get-reporting-status-request.json"
        response_schema_ref: "media-buy/get-reporting-status-response.json"
        doc_ref: "/media-buy/task-reference/get_reporting_status"
        stateful: true
        sample_request:
          account:
            account_id: "$context.consumer_content_account_id"
          view: "revision"
          reporting_revision_id: "$context.consumer_content_revision_id"
        validations:
          - check: response_schema
            description: "Revision readback is schema-valid"
          - check: field_equals_context
            path: "revision.reporting_revision_id"
            context_key: "consumer_content_revision_id"
            description: "The exact-revision view resolves the requested revision"
          - check: field_contains
            path: "consumer_statuses[*].reporting_revision_id"
            value: "$context.consumer_content_revision_id"
            description: "Consumer status is required in both views, and every entry names the requested revision"
          - check: field_contains
            path: "consumer_statuses[*].reporting_status_id"
            value: "consumer-status.content-mismatch.0006"
            description: "The caller's current leaf is readable alongside the exact content it describes"
