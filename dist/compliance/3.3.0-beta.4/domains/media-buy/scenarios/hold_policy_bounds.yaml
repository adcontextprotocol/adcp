id: media_buy_seller/hold_policy_bounds
version: "1.0.0"
introduced_in: "3.3"
title: "Hold bounds are measured from hold_placed_at"
category: media_buy_seller
summary: "Finalizes drafts under a declared hold_policy and checks that the committed proposal carries the draft's policy forward with hold_placed_at, that expires_at lies within min_duration and max_duration of it, that an exact retry returns the original hold_placed_at and expires_at, and, on the sandbox clock, the exact hold window and its lapse."
track: media_buy

requires_all_capabilities:
  - path: "experimental_features"
    contains: "media_buy.hold_policy"
  - path: "compliance_testing.scenarios"
    contains: "compact_product_lifecycle_probe"

requires:
  - controller

required_tools:
  - list_products
  - request_proposals
  - refine_proposals
  - accept_proposal
  - comply_test_controller

narrative: |
  Experimental (`media_buy.hold_policy`). A draft's `hold_policy` is binding:
  a successful finalize carries it forward unchanged onto the committed
  proposal, with `hold_placed_at`, and must satisfy
  `hold_placed_at` + `min_duration` ≤ `expires_at` ≤ `hold_placed_at` +
  `max_duration`. An exact retry returns the original `hold_placed_at` and
  `expires_at`; it never restarts the clock.

  The storyboard seeds two products whose planning hints differ: one with a
  one-to-three-day window, one whose minimum equals its maximum (two days).
  The first is finalized and replayed. The bounds are duration arithmetic over
  instants, which the `instant_offset_within` check grades; it is advisory
  until a released runner implements it.

  A seller that also offers the `reporting_subscription_probe` sandbox clock
  places and expires holds on that clock. For it, the storyboard pins the
  clock, finalizes the second product, and checks the exact window: when the
  draft's policy is the product's (minimum equal to maximum), `expires_at` is
  exactly two days after `hold_placed_at`, which is the pinned instant. A
  retry a day later returns the same instants, and an acceptance after
  `expires_at` fails with `PROPOSAL_EXPIRED` because the hold lapsed. A seller
  that derives a different draft policy skips that phase.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - generates_proposals
  examples:
    - "Publisher that declares how long it holds inventory after finalize"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The seller lists media_buy.hold_policy, advertises
    compact_product_lifecycle_probe, and honors the hold_policy of seeded
    products. The pinned-clock phase also needs reporting_subscription_probe,
    and a sandbox clock that starts before 2031-03-02T09:00:00Z.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  accounts:
    - account_id: "acct_acmeoutdoor_example_sandbox_e529953fb079"
      fixture:
        brand:
          domain: "acmeoutdoor.example"
        operator: "pinnacle-agency.example"
        operator_unit:
          id: "compliance-media_buy_seller_hold_policy_bounds-61ed0125"
        billing: "operator"
        status: "active"
        sandbox: true
  products:
    - product_id: "hold_bounds_window"
      delivery_type: "guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "hold_bounds_window_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
      hold_policy:
        available: true
        min_duration: "P1D"
        max_duration: "P3D"
    - product_id: "hold_bounds_fixed"
      delivery_type: "guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "hold_bounds_fixed_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
      hold_policy:
        available: true
        min_duration: "P2D"
        max_duration: "P2D"
  pricing_options:
    - product_id: "hold_bounds_window"
      pricing_option_id: "hold_bounds_window_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 22
    - product_id: "hold_bounds_fixed"
      pricing_option_id: "hold_bounds_fixed_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 22

phases:
  - id: prepare_products
    title: "Prepare the seeded products"
    steps:
      - id: prepare_window_product
        title: "Prepare the one-to-three-day product"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_bounds-61ed0125"
            sandbox: true
          scenario: "compact_product_lifecycle_probe"
          params:
            operation: "prepare"
            product_id: "hold_bounds_window"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The controller prepares the seeded product"
      - id: prepare_fixed_product
        title: "Prepare the two-day product"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_bounds-61ed0125"
            sandbox: true
          scenario: "compact_product_lifecycle_probe"
          params:
            operation: "prepare"
            product_id: "hold_bounds_fixed"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The controller prepares the seeded product"

  - id: discover_policies
    title: "Read the products' planning hints"
    depends_on: [prepare_products]
    steps:
      - id: list_hold_products
        title: "List both products"
        task: list_products
        schema_ref: "media-buy/list-products-request.json"
        response_schema_ref: "media-buy/list-products-response.json"
        doc_ref: "/media-buy/task-reference/list_products"
        stateful: false
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_policy_bounds_list"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_bounds-61ed0125"
            sandbox: true
          criteria:
            product_ids: ["hold_bounds_window", "hold_bounds_fixed"]
        validations:
          - check: response_schema
            description: "Response matches list-products-response.json"
          - check: field_contains
            path: "products[*]"
            value:
              product_id: "hold_bounds_window"
              hold_policy:
                available: true
                min_duration: "P1D"
                max_duration: "P3D"
            description: "The product carries its hold_policy planning hint"
          - check: field_contains
            path: "products[*]"
            value:
              product_id: "hold_bounds_fixed"
              hold_policy:
                available: true
                min_duration: "P2D"
                max_duration: "P2D"
            description: "The product carries its hold_policy planning hint"

  - id: finalize_window
    title: "Finalize a draft under a one-to-three-day policy"
    depends_on: [prepare_products]
    steps:
      - id: request_window_draft
        title: "Request a draft for the one-to-three-day product"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_policy_bounds_request_window"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_bounds-61ed0125"
            sandbox: true
          brief: "Hold premium online video for a spring launch while the client approves."
          criteria:
            product_ids: ["hold_bounds_window"]
        context_outputs:
          - name: window_draft_id
            path: "proposals[0].proposal_id"
          - name: window_draft_policy
            path: "proposals[0].hold_policy"
          - name: window_finalize_key
            generate: uuid_v4
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json"
          - check: field_value
            path: "proposals[0].proposal_status"
            value: "draft"
            description: "Proposal requests produce drafts"
          - check: field_value
            path: "proposals[0].hold_policy.available"
            value: true
            description: "The draft allocates only holdable inventory, so its binding policy places a hold"
          - check: field_value_or_absent
            path: "proposals[0].hold_policy.rankable"
            value: false
            description: "No allocated product is rankable, so the draft promises an exclusive hold"
          - check: field_absent
            path: "proposals[0].hold_placed_at"
            description: "Drafts never carry hold_placed_at"

      - id: finalize_window_draft
        title: "Finalize the draft"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$context.window_finalize_key"
          refinements:
            - proposal_id: "$context.window_draft_id"
              action: "finalize"
        context_outputs:
          - name: window_committed_id
            path: "results[0].proposal.proposal_id"
          - name: window_hold_placed_at
            path: "results[0].proposal.hold_placed_at"
          - name: window_expires_at
            path: "results[0].proposal.expires_at"
        validations:
          - check: response_schema
            description: "Response matches refine-proposals-response.json"
          - check: field_value
            path: "results[0].outcome"
            value: "finalized"
            description: "The draft is finalized"
          - check: field_value
            path: "results[0].proposal.proposal_status"
            value: "committed"
            description: "Finalize creates a committed proposal"
          - check: field_equals_context
            path: "results[0].proposal.hold_policy"
            context_key: "window_draft_policy"
            description: "The committed proposal carries the draft's hold_policy forward unchanged"
          - check: field_present
            path: "results[0].proposal.hold_placed_at"
            description: "A committed proposal whose policy places a hold says when the hold was placed"
          - check: field_present
            path: "results[0].proposal.expires_at"
            description: "The committed proposal carries the hold deadline"
          - check: field_absent
            path: "results[0].proposal.hold_rank"
            description: "An exclusive hold carries no hold_rank"
          - check: instant_offset_within
            path: "results[0].proposal.expires_at"
            base_path: "results[0].proposal.hold_placed_at"
            min_offset_path: "results[0].proposal.hold_policy.min_duration"
            max_offset_path: "results[0].proposal.hold_policy.max_duration"
            severity: advisory
            expires_after_version: "17.0.0"
            description: "hold_placed_at + min_duration <= expires_at <= hold_placed_at + max_duration"

      - id: replay_window_finalize
        title: "Retry the finalize exactly"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$context.window_finalize_key"
          refinements:
            - proposal_id: "$context.window_draft_id"
              action: "finalize"
        validations:
          - check: field_value
            path: "replayed"
            value: true
            description: "The retry replays the original response"
          - check: field_equals_context
            path: "results[0].proposal.proposal_id"
            context_key: "window_committed_id"
            description: "The retry returns the original committed proposal"
          - check: field_equals_context
            path: "results[0].proposal.hold_placed_at"
            context_key: "window_hold_placed_at"
            description: "A retry never restarts the clock: hold_placed_at is the original"
          - check: field_equals_context
            path: "results[0].proposal.expires_at"
            context_key: "window_expires_at"
            description: "A retry never restarts the clock: expires_at is the original"

  - id: request_fixed
    title: "Request a draft for the two-day product"
    depends_on: [prepare_products]
    steps:
      - id: request_fixed_draft
        title: "Request a draft whose product's minimum equals its maximum"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_policy_bounds_request_fixed"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_bounds-61ed0125"
            sandbox: true
          brief: "Hold premium online video for two days while legal reviews."
          criteria:
            product_ids: ["hold_bounds_fixed"]
        context_outputs:
          - name: fixed_draft_id
            path: "proposals[0].proposal_id"
          - name: fixed_draft_policy
            path: "proposals[0].hold_policy"
          - name: fixed_finalize_key
            generate: uuid_v4
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json"
          - check: field_value
            path: "proposals[0].hold_policy.available"
            value: true
            description: "The draft's binding policy places a hold"

  - id: pinned_window
    title: "Check the exact hold window on the sandbox clock"
    depends_on: [request_fixed]
    requires_capability:
      path: "compliance_testing.scenarios"
      contains: "reporting_subscription_probe"
    skip_if: "context.fixed_draft_policy.min_duration != 'P2D' || context.fixed_draft_policy.max_duration != 'P2D'"
    narrative: |
      Runs when the seller offers the sandbox clock and the draft's policy is
      the product's: a two-day minimum equal to its maximum, so expires_at is
      exactly two days after hold_placed_at.
    steps:
      - id: pin_clock
        title: "Pin the sandbox clock at 2031-03-02T09:00:00Z"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_bounds-61ed0125"
            sandbox: true
          scenario: "reporting_subscription_probe"
          params:
            operation: "advance_time"
            target_time: "2031-03-02T09:00:00Z"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The sandbox clock advances"

      - id: finalize_fixed_draft
        title: "Finalize the two-day draft at the pinned instant"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$context.fixed_finalize_key"
          refinements:
            - proposal_id: "$context.fixed_draft_id"
              action: "finalize"
        context_outputs:
          - name: fixed_committed_id
            path: "results[0].proposal.proposal_id"
          - name: fixed_terms_digest
            path: "results[0].proposal.terms_digest"
        validations:
          - check: field_value
            path: "results[0].outcome"
            value: "finalized"
            description: "The draft is finalized"
          - check: field_pattern
            path: "results[0].proposal.hold_placed_at"
            pattern: "^2031-03-02T09:00:00(\\.0+)?(Z|\\+00:00)$"
            description: "The hold is placed at the sandbox clock's instant"
          - check: field_pattern
            path: "results[0].proposal.expires_at"
            pattern: "^2031-03-04T09:00:00(\\.0+)?(Z|\\+00:00)$"
            description: "A two-day minimum equal to the maximum fixes expires_at at hold_placed_at plus two days"

      - id: advance_one_day
        title: "Advance the sandbox clock one day"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_bounds-61ed0125"
            sandbox: true
          scenario: "reporting_subscription_probe"
          params:
            operation: "advance_time"
            target_time: "2031-03-03T09:00:00Z"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The sandbox clock advances"

      - id: replay_fixed_finalize
        title: "Retry the finalize a day later"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$context.fixed_finalize_key"
          refinements:
            - proposal_id: "$context.fixed_draft_id"
              action: "finalize"
        validations:
          - check: field_equals_context
            path: "results[0].proposal.proposal_id"
            context_key: "fixed_committed_id"
            description: "The retry returns the original committed proposal"
          - check: field_pattern
            path: "results[0].proposal.hold_placed_at"
            pattern: "^2031-03-02T09:00:00(\\.0+)?(Z|\\+00:00)$"
            description: "The retry keeps the original hold_placed_at though the clock moved"
          - check: field_pattern
            path: "results[0].proposal.expires_at"
            pattern: "^2031-03-04T09:00:00(\\.0+)?(Z|\\+00:00)$"
            description: "The retry keeps the original expires_at though the clock moved"

      - id: advance_past_expiry
        title: "Advance the sandbox clock past expires_at"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_bounds-61ed0125"
            sandbox: true
          scenario: "reporting_subscription_probe"
          params:
            operation: "advance_time"
            target_time: "2031-03-04T10:00:00Z"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The sandbox clock advances"

      - id: accept_lapsed_hold
        title: "Accepting after expires_at fails"
        task: accept_proposal
        schema_ref: "media-buy/accept-proposal-request.json"
        response_schema_ref: "media-buy/accept-proposal-response.json"
        doc_ref: "/media-buy/task-reference/accept_proposal"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_policy_bounds_accept_lapsed"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_bounds-61ed0125"
            sandbox: true
          proposal_id: "$context.fixed_committed_id"
          proposal_terms_digest: "$context.fixed_terms_digest"
        validations:
          - check: error_code
            value: "PROPOSAL_EXPIRED"
            description: "The hold lapsed at expires_at, so the committed proposal can no longer be accepted"
