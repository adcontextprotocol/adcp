id: media_buy_seller/hold_policy_version_gate
version: "1.0.0"
introduced_in: "3.3"
title: "Callers below 3.3 never see hold fields"
category: media_buy_seller
summary: "Pins a caller to AdCP 3.2 and checks that products, drafts, and committed proposals carry no hold_policy, hold_placed_at, hold_rank, or holds, and that a terms-only draft served at 3.3 cannot be finalized by a 3.2 caller (UNSUPPORTED_FEATURE)."
track: media_buy

requires_all_capabilities:
  - path: "experimental_features"
    contains: "media_buy.hold_policy"
  - path: "compliance_testing.scenarios"
    contains: "compact_product_lifecycle_probe"
  - path: "adcp.supported_versions"
    contains: "3.2"

requires:
  - controller

required_tools:
  - request_proposals
  - refine_proposals
  - comply_test_controller

narrative: |
  Experimental (`media_buy.hold_policy`). `hold_policy`, `hold_placed_at`,
  `hold_rank`, and `holds` are 3.3 fields, and 3.2 canonical products and
  proposals reject unknown properties. A seller omits all of them from every
  product and proposal it returns to a caller whose `adcp_version` is below
  3.3, and otherwise applies the hold rules unchanged.

  Because `committed` meant "inventory reserved" before 3.3, a caller below
  3.3 never receives a committed proposal whose effective policy is
  terms-only: the seller fails such a finalize at task level with
  `UNSUPPORTED_FEATURE`.

  The storyboard applies to a seller that lists the feature and also serves
  AdCP 3.2. It seeds one holdable and one non-holdable product, requests and
  finalizes a draft of the holdable one as a 3.2 caller (the draft response
  lists the product too), then asks for a draft of the non-holdable one at
  3.3 and finalizes it as a 3.2 caller.

agent:
  interaction_model: media_buy_seller
  capabilities:
    - sells_media
    - generates_proposals
  examples:
    - "Seller serving 3.2 and 3.3 buyers from one catalog"

caller:
  role: buyer_agent
  example: "Pinnacle Agency (buyer)"

prerequisites:
  description: |
    The seller lists media_buy.hold_policy, serves AdCP 3.2, advertises
    compact_product_lifecycle_probe, and honors the hold_policy of seeded
    products.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

fixtures:
  accounts:
    - account_id: "acct_acmeoutdoor_example_sandbox_9eb5f86212c9"
      fixture:
        brand:
          domain: "acmeoutdoor.example"
        operator: "pinnacle-agency.example"
        operator_unit:
          id: "compliance-media_buy_seller_hold_policy_version-afc0d4d1"
        billing: "operator"
        status: "active"
        sandbox: true
  products:
    - product_id: "hold_gate_display"
      delivery_type: "guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "hold_gate_display_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
      hold_policy:
        available: true
        min_duration: "P1D"
        max_duration: "P3D"
    - product_id: "hold_gate_search"
      delivery_type: "non_guaranteed"
      channels: ["olv"]
      format_options:
        - format_option_id: "hold_gate_search_30s"
          format_kind: "video_hosted"
          params:
            duration_ms_exact: 30000
      hold_policy:
        available: false
  pricing_options:
    - product_id: "hold_gate_display"
      pricing_option_id: "hold_gate_display_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 19
    - product_id: "hold_gate_search"
      pricing_option_id: "hold_gate_search_cpm"
      pricing_model: "cpm"
      currency: "USD"
      fixed_price: 19

phases:
  - id: prepare_products
    title: "Prepare the seeded products"
    steps:
      - id: prepare_gate_display
        title: "Prepare the holdable product"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_version-afc0d4d1"
            sandbox: true
          scenario: "compact_product_lifecycle_probe"
          params:
            operation: "prepare"
            product_id: "hold_gate_display"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The controller prepares the seeded product"
      - id: prepare_gate_search
        title: "Prepare the non-holdable product"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        doc_ref: "/building/by-layer/L3/comply-test-controller"
        stateful: true
        sample_request:
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_version-afc0d4d1"
            sandbox: true
          scenario: "compact_product_lifecycle_probe"
          params:
            operation: "prepare"
            product_id: "hold_gate_search"
        validations:
          - check: field_value
            path: "success"
            value: true
            description: "The controller prepares the seeded product"

  - id: read_and_finalize_at_3_2
    title: "Request and finalize as a 3.2 caller"
    depends_on: [prepare_products]
    steps:
      - id: request_display_draft_at_3_2
        title: "Request a draft for the holdable product at 3.2"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        sample_request:
          adcp_version: "3.2"
          adcp_major_version: 3
          idempotency_key: "$generate:uuid_v4#hold_policy_version_gate_request_display"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_version-afc0d4d1"
            sandbox: true
          brief: "Reserve online video for a regional launch."
          criteria:
            product_ids: ["hold_gate_display"]
        context_outputs:
          - name: gate_display_draft_id
            path: "proposals[0].proposal_id"
        validations:
          - check: response_schema
            description: "Response matches request-proposals-response.json"
          - check: envelope_field_pattern
            path: "adcp_version"
            pattern: "^3\\.2$"
            description: "The seller serves the release the caller pinned"
          - check: field_value
            path: "proposals[0].proposal_status"
            value: "draft"
            description: "Proposal requests produce drafts"
          - check: field_absent
            path: "proposals[0].hold_policy"
            description: "A 3.2 draft carries no hold_policy"
          - check: field_present
            path: "products[0].product_id"
            description: "The response lists the allocated product"
          - check: field_absent
            path: "products[0].hold_policy"
            description: "Products returned alongside a 3.2 draft carry no hold_policy"

      - id: finalize_display_draft_at_3_2
        title: "Finalize it at 3.2"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        stateful: true
        sample_request:
          adcp_version: "3.2"
          adcp_major_version: 3
          idempotency_key: "$generate:uuid_v4#hold_policy_version_gate_finalize_display"
          refinements:
            - proposal_id: "$context.gate_display_draft_id"
              action: "finalize"
        validations:
          - check: response_schema
            description: "Response matches refine-proposals-response.json"
          - check: field_value
            path: "results[0].outcome"
            value: "finalized"
            description: "The hold rules apply unchanged: the holdable draft is finalized"
          - check: field_value
            path: "results[0].proposal.proposal_status"
            value: "committed"
            description: "Finalize creates a committed proposal"
          - check: field_absent
            path: "results[0].proposal.hold_policy"
            description: "A 3.2 committed proposal carries no hold_policy"
          - check: field_absent
            path: "results[0].proposal.hold_placed_at"
            description: "A 3.2 committed proposal carries no hold_placed_at"
          - check: field_absent
            path: "results[0].proposal.hold_rank"
            description: "A 3.2 committed proposal carries no hold_rank"
          - check: field_absent
            path: "results[0].proposal.holds"
            description: "A 3.2 committed proposal carries no holds"

  - id: terms_only_finalize_below_3_3
    title: "A 3.2 caller cannot receive a terms-only commitment"
    depends_on: [prepare_products]
    steps:
      - id: request_search_draft_at_3_3
        title: "Request a draft for the non-holdable product at 3.3"
        task: request_proposals
        schema_ref: "media-buy/request-proposals-request.json"
        response_schema_ref: "media-buy/request-proposals-response.json"
        doc_ref: "/media-buy/task-reference/request_proposals"
        stateful: true
        sample_request:
          idempotency_key: "$generate:uuid_v4#hold_policy_version_gate_request_search"
          account:
            brand:
              domain: "acmeoutdoor.example"
            operator: "pinnacle-agency.example"
            operator_unit:
              id: "compliance-media_buy_seller_hold_policy_version-afc0d4d1"
            sandbox: true
          brief: "Auction video for a regional launch."
          criteria:
            product_ids: ["hold_gate_search"]
        context_outputs:
          - name: gate_search_draft_id
            path: "proposals[0].proposal_id"
        validations:
          - check: field_value
            path: "proposals[0].hold_policy.available"
            value: false
            description: "The draft served at 3.3 is terms-only"

      - id: finalize_search_draft_at_3_2
        title: "Finalize the terms-only draft as a 3.2 caller"
        task: refine_proposals
        schema_ref: "media-buy/refine-proposals-request.json"
        response_schema_ref: "media-buy/refine-proposals-response.json"
        doc_ref: "/media-buy/task-reference/refine_proposals"
        expect_error: true
        negative_path: payload_well_formed
        stateful: true
        sample_request:
          adcp_version: "3.2"
          adcp_major_version: 3
          idempotency_key: "$generate:uuid_v4#hold_policy_version_gate_finalize_search"
          refinements:
            - proposal_id: "$context.gate_search_draft_id"
              action: "finalize"
        validations:
          - check: error_code
            value: "UNSUPPORTED_FEATURE"
            description: "A terms-only commitment requires AdCP 3.3, so the finalize fails at task level"
