id: reporting_core
version: "1.0.0"
introduced_in: "3.2"
title: "Reliable Reporting: Core lifecycle"
category: schema_validation
summary: "Validates reporting.core obligation-before-report behavior, clock-derived health, and explicit zero-row reporting."
track: core
required_tools:
  - get_reporting_status
  - get_media_buy_delivery

requires:
  - controller

requires_all_capabilities:
  - path: "media_buy.reporting_delivery.supported"
    equals: true
  - path: "media_buy.reporting_delivery.reliable_reporting_version"
    equals: "1.0"

narrative: |
  Core is the only required reporting tier: obligations, revisions, the five
  health states, and `get_reporting_status`, delivered over transports sellers
  already have. Materializations begin at managed_delivery; both it and
  reconciled_billing are separately advertised capabilities. Push is optional
  in every tier, so a polling-only seller is fully Core-conformant;
  `reporting.delivery_ready` is available only for managed delivery.

  A deterministic controller fixture also proves the Core behavior that makes
  the declaration useful: an elapsed obligation is queryable before its first
  revision, lateness derives from the schedule rather than media-buy
  acceptance, and a zero-row revision satisfies the obligation without being
  confused with missing reporting.

  For exact revision reads, the fixture uses a one-row page size. The two
  returned pages are the complete ordered row sequence; concatenate them in
  cursor order, then recompute the RFC 8785/JCS SHA-256 over
  `{reporting_revision_id,row_count,control_totals,reporting_rows}` and compare
  it with both the status revision and `reporting_revision_binding`.

agent:
  interaction_model: any
  capabilities:
    - "media_buy.reporting_delivery"
  examples:
    - "Any seller agent that advertises media_buy.reporting_delivery"

caller:
  role: buyer_agent
  example: "Compliance test harness acting as an authorized buyer"

prerequisites:
  description: |
    The agent under test advertises `media_buy.reporting_delivery.supported:
    true` plus the matching experimental feature.
  test_kit: "test-kits/acme-outdoor.yaml"
  controller_seeding: true

phases:
  - id: obligation_lifecycle
    title: "Observe an obligation before its first report"
    narrative: |
      The controller installs a Core-only hourly reporting configuration and
      advances a virtual clock just beyond its first period boundary. The
      seller must expose the obligation immediately even though no source data
      or revision exists. Advancing beyond expected_at changes health; it does
      not create the obligation.

    steps:
      - id: prepare_waiting_obligation
        title: "Prepare the deterministic Core fixture"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        context_outputs:
          - name: reporting_core_obligation_id
            path: "simulated.reporting_obligation_id"
          - name: reporting_core_period_end
            path: "simulated.period.end"
          - name: reporting_core_expected_at
            path: "simulated.expected_at"
          - name: reporting_core_recovery_deadline
            path: "simulated.recovery_deadline"
        sample_request:
          account:
            account_id: "reporting_core_lab"
            sandbox: true
          scenario: "reporting_core_lifecycle_probe"
          params:
            operation: "prepare"
          context:
            correlation_id: "reporting_core--prepare"
        validations:
          - check: response_schema
            description: "Controller response is schema-valid"
          - check: field_value
            path: "success"
            value: true
            description: "Fixture was prepared"
          - check: field_present
            path: "simulated.reporting_obligation_id"
            description: "Controller returns the stable obligation identity"

      - id: read_waiting_obligation
        title: "Read the obligation before a revision exists"
        task: get_reporting_status
        schema_ref: "media-buy/get-reporting-status-request.json"
        response_schema_ref: "media-buy/get-reporting-status-response.json"
        doc_ref: "/media-buy/task-reference/get_reporting_status"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_lab"
          view: "periods"
          context:
            correlation_id: "reporting_core--waiting"
        validations:
          - check: response_schema
            description: "Periods response is schema-valid"
          - check: field_value
            path: "periods[0].health"
            value: "waiting"
            description: "The elapsed obligation exists before its SLA"
          - check: field_value
            path: "periods[0].revision_count"
            value: 0
            description: "No revision has been produced yet"
          - check: field_equals_context
            path: "periods[0].reporting_obligation_id"
            context_key: "reporting_core_obligation_id"
            description: "The status read returns the exact obligation prepared by the controller"
          - check: field_equals_context
            path: "periods[0].period.end"
            context_key: "reporting_core_period_end"
            description: "The obligation retains the returned period boundary"
          - check: field_equals_context
            path: "periods[0].expected_at"
            context_key: "reporting_core_expected_at"
            description: "The deadline is the one derived from the returned schedule"
          - check: array_length
            path: "revisions"
            value: 0
            description: "Missing first reporting is explicit, not a zero-row report"
          - check: field_present
            path: "changes_checkpoint"
            description: "Reliable Reporting 1.0 exposes a durable repair checkpoint"
          - check: field_present
            path: "adjustments"
            description: "Reliable Reporting 1.0 exposes the post-official correction ledger"

      - id: advance_beyond_sla
        title: "Advance the same obligation beyond expected_at"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_lab"
            sandbox: true
          scenario: "reporting_core_lifecycle_probe"
          params:
            operation: "advance_time"
            target_health: "delayed"
          context:
            correlation_id: "reporting_core--advance-delayed"
        validations:
          - check: response_schema
            description: "Controller response is schema-valid"
          - check: field_value
            path: "success"
            value: true
            description: "Virtual clock advanced"
          - check: field_equals_context
            path: "simulated.expected_at"
            context_key: "reporting_core_expected_at"
            description: "The controller advances relative to the deadline returned by prepare"
          - check: field_value
            path: "simulated.simulated_now"
            value: "2026-08-01T02:05:00.000Z"
            description: "The standardized virtual time is strictly after expected_at"

      - id: read_delayed_summary
        title: "Observe clock-derived delayed health"
        task: get_reporting_status
        schema_ref: "media-buy/get-reporting-status-request.json"
        response_schema_ref: "media-buy/get-reporting-status-response.json"
        doc_ref: "/media-buy/task-reference/get_reporting_status"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_lab"
          view: "summary"
          context:
            correlation_id: "reporting_core--delayed"
        validations:
          - check: response_schema
            description: "Summary response is schema-valid"
          - check: field_value
            path: "health"
            value: "delayed"
            description: "The missing revision becomes late only after expected_at"
          - check: field_value
            path: "obligation_counts.delayed"
            value: 1
            description: "The existing obligation moved to delayed"
          - check: field_present
            path: "issues[0].issue_id"
            description: "Delayed health has a durable operational issue"
          - check: field_equals_context
            path: "issues[0].reporting_obligation_id"
            context_key: "reporting_core_obligation_id"
            description: "Delayed health belongs to the same obligation prepared earlier"

      - id: advance_beyond_recovery
        title: "Advance the same obligation beyond its recovery deadline"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_lab"
            sandbox: true
          scenario: "reporting_core_lifecycle_probe"
          params:
            operation: "advance_time"
            target_health: "action_required"
          context:
            correlation_id: "reporting_core--advance-action-required"
        validations:
          - check: response_schema
            description: "Controller response is schema-valid"
          - check: field_equals_context
            path: "simulated.reporting_obligation_id"
            context_key: "reporting_core_obligation_id"
            description: "The clock advances the original obligation, not a replacement"
          - check: field_equals_context
            path: "simulated.recovery_deadline"
            context_key: "reporting_core_recovery_deadline"
            description: "The transition consumes the recovery deadline returned by prepare"
          - check: field_value
            path: "simulated.simulated_now"
            value: "2026-08-01T04:05:00.000Z"
            description: "The standardized virtual time is strictly after the recovery deadline"

      - id: read_action_required
        title: "Observe escalation after automated recovery closes"
        task: get_reporting_status
        schema_ref: "media-buy/get-reporting-status-request.json"
        response_schema_ref: "media-buy/get-reporting-status-response.json"
        doc_ref: "/media-buy/task-reference/get_reporting_status"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_lab"
          view: "summary"
          context:
            correlation_id: "reporting_core--action-required"
        validations:
          - check: response_schema
            description: "Summary response is schema-valid"
          - check: field_value
            path: "health"
            value: "action_required"
            description: "Health escalates after the returned recovery deadline"
          - check: field_equals_context
            path: "issues[0].reporting_obligation_id"
            context_key: "reporting_core_obligation_id"
            description: "Escalation remains attached to the original obligation"

  - id: explicit_empty_reporting
    title: "Distinguish zero rows from no report"
    narrative: |
      Publishing an empty but valid period creates an immutable revision whose
      row_count is zero. The obligation is now satisfied because reporting was
      produced, not because the seller removed the expectation.

    steps:
      - id: publish_zero_row
        title: "Publish an explicit zero-row revision"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        context_outputs:
          - name: reporting_core_revision_id
            path: "simulated.reporting_revision_id"
        sample_request:
          account:
            account_id: "reporting_core_lab"
            sandbox: true
          scenario: "reporting_core_lifecycle_probe"
          params:
            operation: "publish_zero_row"
          context:
            correlation_id: "reporting_core--publish-zero-row"
        validations:
          - check: response_schema
            description: "Controller response is schema-valid"
          - check: field_present
            path: "simulated.reporting_revision_id"
            description: "Publication created an immutable revision"
          - check: field_equals_context
            path: "simulated.reporting_obligation_id"
            context_key: "reporting_core_obligation_id"
            description: "The revision satisfies the exact obligation prepared earlier"

      - id: read_zero_row_revision
        title: "Read the satisfied zero-row obligation"
        task: get_reporting_status
        schema_ref: "media-buy/get-reporting-status-request.json"
        response_schema_ref: "media-buy/get-reporting-status-response.json"
        doc_ref: "/media-buy/task-reference/get_reporting_status"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_lab"
          view: "periods"
          context:
            correlation_id: "reporting_core--zero-row"
        validations:
          - check: response_schema
            description: "Periods response is schema-valid"
          - check: field_value
            path: "periods[0].health"
            value: "complete"
            description: "The fixed elapsed scope is closed and its obligation is satisfied"
          - check: field_value
            path: "periods[0].revision_count"
            value: 1
            description: "Exactly one revision exists"
          - check: field_value
            path: "revisions[0].row_count"
            value: 0
            description: "Zero rows is explicit reporting, not missing reporting"
          - check: field_equals_context
            path: "periods[0].reporting_obligation_id"
            context_key: "reporting_core_obligation_id"
            description: "The satisfied record is the original prepared obligation"
          - check: field_equals_context
            path: "revisions[0].reporting_revision_id"
            context_key: "reporting_core_revision_id"
            description: "The status read returns the exact immutable revision just published"
          - check: field_present
            path: "changes_checkpoint"
            description: "The terminal page carries the checkpoint to persist"
          - check: field_present
            path: "adjustments"
            description: "Core returns the adjustment collection even when it is empty"

      - id: read_zero_row_content_exactly
        title: "Read the immutable zero-row revision through the Core transport"
        task: get_media_buy_delivery
        schema_ref: "media-buy/get-media-buy-delivery-request.json"
        response_schema_ref: "media-buy/get-media-buy-delivery-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buy_delivery"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_lab"
          reporting_revision_id: "$context.reporting_core_revision_id"
          pagination:
            max_results: 1
          context:
            correlation_id: "reporting_core--exact-zero"
        validations:
          - check: response_schema
            description: "Exact Core content response is schema-valid"
          - check: field_equals_context
            path: "reporting_revision.reporting_revision_id"
            context_key: "reporting_core_revision_id"
            description: "Exact response echoes the requested immutable revision"
          - check: field_value
            path: "reporting_revision.row_count"
            value: 0
            description: "The retained zero-row publication remains an empty logical row set"
          - check: field_value
            path: "pagination.total_count"
            value: 0
            description: "Zero rows still return one schema-valid empty page"

  - id: exact_nonempty_revision_content
    title: "Traverse a frozen non-empty Core revision"
    narrative: |
      The controller publishes two deterministic logical rows. The caller walks
      every exact-read cursor page, preserves row order for JCS binding-digest
      recomputation, and verifies every row against the fixed, independently
      generated RFC 8785/JCS vector below. The literal vector binds the exact
      ID, totals, periods, dimensions, and metrics, so a seller/controller
      cannot make a shared digest implementation conceal an altered row. Exact
      Core reads contain no Managed materialization or receipt machinery. A
      mixed selector and an RC0 exact-read request are rejected.

    steps:
      - id: prepare_nonempty_core
        title: "Prepare a separate deterministic Core account"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_nonempty_lab"
            sandbox: true
          scenario: "reporting_core_lifecycle_probe"
          params:
            operation: "prepare"
          context:
            correlation_id: "reporting_core--prepare-nonempty"
        validations:
          - check: response_schema
            description: "Controller response is schema-valid"

      - id: publish_nonempty_core
        title: "Commit the deterministic two-row revision"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        context_outputs:
          - name: reporting_core_nonempty_revision_id
            path: "simulated.reporting_revision_id"
        sample_request:
          account:
            account_id: "reporting_core_nonempty_lab"
            sandbox: true
          scenario: "reporting_core_lifecycle_probe"
          params:
            operation: "publish_nonempty"
          context:
            correlation_id: "reporting_core--publish-nonempty"
        validations:
          - check: response_schema
            description: "Controller response is schema-valid"
          - check: field_value
            path: "simulated.row_count"
            value: 2
            description: "The fixture commits two authoritative logical rows"
          - check: field_value
            path: "simulated.reporting_revision_id"
            value: "reporting-revision.ecc62efa00946aa1e2788ad9"
            description: "The fixed vector pins the immutable revision identity"
          - check: field_value
            path: "simulated.revision_content_sha256"
            value: "5199a776b3a99915f084e16c921b2e501fcedd949017236d51a2303c5c2f5cd1"
            description: "The independently generated RFC 8785/JCS two-row binding vector fixes the expected digest"

      - id: read_nonempty_revision_status
        title: "Read the revision metadata from the status ledger"
        task: get_reporting_status
        schema_ref: "media-buy/get-reporting-status-request.json"
        response_schema_ref: "media-buy/get-reporting-status-response.json"
        doc_ref: "/media-buy/task-reference/get_reporting_status"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        context_outputs:
          - name: reporting_core_nonempty_status_metadata
            path: "revision"
        sample_request:
          account:
            account_id: "reporting_core_nonempty_lab"
          view: "revision"
          reporting_revision_id: "$context.reporting_core_nonempty_revision_id"
        validations:
          - check: response_schema
            description: "Status ledger revision is schema-valid"
          - check: field_value
            path: "revision.reporting_revision_id"
            value: "reporting-revision.ecc62efa00946aa1e2788ad9"
            description: "Status returns the vector's immutable revision ID"
          - check: field_value
            path: "revision.row_count"
            value: 2
            description: "Status binds exactly two complete logical rows"
          - check: field_value
            path: "revision.control_totals"
            value: [{ name: "impressions", value: "5", value_type: "integer", unit: "impressions" }]
            description: "Status returns the vector's fixed control totals"
          - check: field_value
            path: "revision.revision_content_sha256"
            value: "5199a776b3a99915f084e16c921b2e501fcedd949017236d51a2303c5c2f5cd1"
            description: "Status exposes the fixed independently generated revision-binding digest"

      - id: exact_nonempty_page_one
        title: "Read first immutable row page"
        task: get_media_buy_delivery
        schema_ref: "media-buy/get-media-buy-delivery-request.json"
        response_schema_ref: "media-buy/get-media-buy-delivery-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buy_delivery"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        context_outputs:
          - name: reporting_core_nonempty_cursor
            path: "pagination.cursor"
          - name: reporting_core_nonempty_metadata
            path: "reporting_revision"
          - name: reporting_core_nonempty_binding
            path: "reporting_revision_binding"
          - name: reporting_core_nonempty_first_rows
            path: "reporting_rows"
        sample_request:
          account:
            account_id: "reporting_core_nonempty_lab"
          reporting_revision_id: "$context.reporting_core_nonempty_revision_id"
          pagination:
            max_results: 1
          context:
            correlation_id: "reporting_core--exact-page-one"
        validations:
          - check: response_schema
            description: "First exact page is schema-valid"
          - check: field_present
            path: "reporting_revision"
            description: "A reporting_revision_id request returns the complete exact-response quartet"
          - check: field_present
            path: "reporting_revision_binding"
            description: "Exact response includes its immutable full-walk binding"
          - check: field_present
            path: "reporting_rows"
            description: "Exact response includes this page of authoritative rows"
          - check: field_present
            path: "pagination"
            description: "Exact response includes frozen cursor pagination"
          - check: field_equals_context
            path: "reporting_revision.reporting_revision_id"
            context_key: "reporting_core_nonempty_revision_id"
            description: "Exact response echoes requested revision identity"
          - check: field_value
            path: "reporting_revision.reporting_revision_id"
            value: "reporting-revision.ecc62efa00946aa1e2788ad9"
            description: "Exact response cannot substitute a controller-supplied revision ID"
          - check: field_value
            path: "reporting_revision.row_count"
            value: 2
            description: "Exact metadata binds the complete two-row sequence"
          - check: field_value
            path: "reporting_revision.control_totals"
            value: [{ name: "impressions", value: "5", value_type: "integer", unit: "impressions" }]
            description: "Exact metadata contains the independently fixed totals"
          - check: field_value
            path: "reporting_revision.revision_content_sha256"
            value: "5199a776b3a99915f084e16c921b2e501fcedd949017236d51a2303c5c2f5cd1"
            description: "Exact metadata carries the fixed full-walk digest"
          - check: field_equals_context
            path: "reporting_revision"
            context_key: "reporting_core_nonempty_status_metadata"
            description: "Exact metadata is identical to the authoritative status revision"
          - check: field_value
            path: "reporting_revision_binding.content_sha256"
            value: "5199a776b3a99915f084e16c921b2e501fcedd949017236d51a2303c5c2f5cd1"
            description: "Binding digest is independently fixed rather than copied from the controller"
          - check: field_value
            path: "reporting_revision_binding.reporting_revision_id"
            value: "reporting-revision.ecc62efa00946aa1e2788ad9"
            description: "Binding ID is the literal test-vector identity"
          - check: field_value
            path: "reporting_revision_binding.row_count"
            value: 2
            description: "Binding count covers the complete cursor traversal"
          - check: field_value
            path: "reporting_revision_binding.control_totals"
            value: [{ name: "impressions", value: "5", value_type: "integer", unit: "impressions" }]
            description: "Binding totals are fixed independently of controller output"
          - check: field_value
            path: "pagination.total_count"
            value: 2
            description: "Pagination total equals the immutable revision row count"
          - check: field_value
            path: "reporting_rows[0]"
            value: { period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-08-01T01:00:00.000Z", impressions: 2, dimensions: { media_buy_id: "media-buy-core-001", package_id: "package-core-001", country: "US" }, metrics: { impressions: 2, clicks: 1 } }
            description: "The first complete row, including its periods, dimensions, and metrics, matches the independent vector"
          - check: array_length
            path: "reporting_rows"
            value: 1
            description: "The cursor starts with exactly one row from the immutable sequence"
          - check: field_absent
            path: "reporting_materializations"
            description: "Core exact reads expose no Managed Delivery materializations"
          - check: field_absent
            path: "receipts"
            description: "Core exact reads expose no receipt machinery"
          - check: field_absent
            path: "reporting_materialization_id"
            description: "Core exact reads do not expose a Managed Delivery materialization identifier"

      - id: exact_nonempty_page_two
        title: "Exhaust the frozen cursor walk"
        task: get_media_buy_delivery
        schema_ref: "media-buy/get-media-buy-delivery-request.json"
        response_schema_ref: "media-buy/get-media-buy-delivery-response.json"
        doc_ref: "/media-buy/task-reference/get_media_buy_delivery"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        context_outputs:
          - name: reporting_core_nonempty_second_rows
            path: "reporting_rows"
        sample_request:
          account:
            account_id: "reporting_core_nonempty_lab"
          reporting_revision_id: "$context.reporting_core_nonempty_revision_id"
          pagination:
            max_results: 1
            cursor: "$context.reporting_core_nonempty_cursor"
          context:
            correlation_id: "reporting_core--exact-page-two"
        validations:
          - check: response_schema
            description: "Final exact page is schema-valid"
          - check: field_equals_context
            path: "reporting_revision"
            context_key: "reporting_core_nonempty_metadata"
            description: "Revision metadata is byte-stable across pages"
          - check: field_equals_context
            path: "reporting_revision_binding"
            context_key: "reporting_core_nonempty_binding"
            description: "Binding is stable while rows are concatenated in cursor order for JCS verification"
          - check: field_value
            path: "reporting_revision.revision_content_sha256"
            value: "5199a776b3a99915f084e16c921b2e501fcedd949017236d51a2303c5c2f5cd1"
            description: "The final page repeats the fixed full-walk revision digest"
          - check: field_value
            path: "reporting_revision_binding.content_sha256"
            value: "5199a776b3a99915f084e16c921b2e501fcedd949017236d51a2303c5c2f5cd1"
            description: "The final page repeats the independent complete-sequence digest"
          - check: field_value
            path: "pagination.has_more"
            value: false
            description: "The second page exhausts the two-row immutable set"
          - check: field_value
            path: "pagination.total_count"
            value: 2
            description: "Every exact page repeats the committed total row count"
          - check: field_value
            path: "reporting_rows[0]"
            value: { period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-08-01T01:00:00.000Z", impressions: 3, dimensions: { media_buy_id: "media-buy-core-002", package_id: "package-core-002", country: "CA" }, metrics: { impressions: 3, clicks: 0 } }
            description: "The final complete row, including its periods, dimensions, and metrics, completes the independent vector"
          - check: array_length
            path: "reporting_rows"
            value: 1
            description: "Each cursor page contains exactly one row, so no row can be skipped or duplicated"

      - id: exact_nonempty_repeat
        title: "Repeat the first page without changing the revision"
        task: get_media_buy_delivery
        schema_ref: "media-buy/get-media-buy-delivery-request.json"
        response_schema_ref: "media-buy/get-media-buy-delivery-response.json"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_nonempty_lab"
          reporting_revision_id: "$context.reporting_core_nonempty_revision_id"
          pagination:
            max_results: 1
        validations:
          - check: response_schema
            description: "Repeat exact page is schema-valid"
          - check: field_equals_context
            path: "reporting_revision"
            context_key: "reporting_core_nonempty_metadata"
            description: "A repeated exact read returns identical immutable metadata"
          - check: field_equals_context
            path: "reporting_revision_binding"
            context_key: "reporting_core_nonempty_binding"
            description: "A repeated exact read returns the committed binding"
          - check: field_equals_context
            path: "reporting_rows"
            context_key: "reporting_core_nonempty_first_rows"
            description: "A repeated first page returns the same ordered row for stable concatenation"

      - id: exact_nonempty_reject_mixed_selector
        title: "Reject mixed delivery selectors"
        task: get_media_buy_delivery
        schema_ref: "media-buy/get-media-buy-delivery-request.json"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_nonempty_lab"
          reporting_revision_id: "$context.reporting_core_nonempty_revision_id"
          include_package_daily_breakdown: false
        validations:
          - check: error_code
            value: "VALIDATION_ERROR"
            description: "Exact revision selection excludes every delivery filter"

      - id: exact_nonempty_reject_rc0
        title: "Reject exact reads on the frozen RC0 wire"
        task: get_media_buy_delivery
        schema_ref: "media-buy/get-media-buy-delivery-request.json"
        comply_scenario: reporting_core_lifecycle_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_nonempty_lab"
          reporting_revision_id: "$context.reporting_core_nonempty_revision_id"
          adcp_version: "3.2-rc.0"
        validations:
          - check: error_code
            value: "VERSION_UNSUPPORTED"
            description: "RC0 cannot execute the unreleased RC1 exact-read surface"

  - id: official_source_calendar_and_checkpoint_repair
    title: "Close a source-timezone day and repair an out-of-order correction"
    narrative: |
      The integrity probe installs a Core-only daily official feed aligned to
      America/New_York across the fall DST boundary. The buyer saves the empty
      obligation checkpoint; the controller then publishes the official close
      and a later Core adjustment while simulating duplicate and out-of-order
      ledger doorbells. A single changes_after read must converge on both
      immutable records without rewriting the invoice anchor.

    steps:
      - id: run_real_source_calendar_dst_scheduler
        title: "Run the installed source-calendar scheduler through DST"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        comply_scenario: reliable_reporting_core_integrity_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_lab"
            sandbox: true
          scenario: "reliable_reporting_core_integrity_probe"
          params:
            operation: "probe_scheduler_dst"
        validations:
          - check: response_schema
            description: "Scheduler probe response is schema-valid"
          - check: field_value
            path: "simulated.fall_back.start"
            value: "2026-11-01T04:00:00.000Z"
            description: "The real scheduler starts the New York fall-back day at local midnight"
          - check: field_value
            path: "simulated.fall_back.end"
            value: "2026-11-02T05:00:00.000Z"
            description: "Fall-back produces a 25-hour civil day, not a fixed UTC day"
          - check: field_value
            path: "simulated.fall_back.expected_at"
            value: "2026-11-02T09:00:00.000Z"
            description: "The four-hour local SLA is applied after the fall-back boundary"
          - check: field_value
            path: "simulated.spring_forward.start"
            value: "2026-03-08T05:00:00.000Z"
            description: "The real scheduler starts the New York spring-forward day at local midnight"
          - check: field_value
            path: "simulated.spring_forward.end"
            value: "2026-03-09T04:00:00.000Z"
            description: "Spring-forward produces a 23-hour civil day"
          - check: field_value
            path: "simulated.spring_forward.expected_at"
            value: "2026-03-09T08:00:00.000Z"
            description: "The local four-hour SLA remains calendar-correct after spring-forward"

      - id: prepare_core_integrity
        title: "Prepare the non-UTC official Core period"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        comply_scenario: reliable_reporting_core_integrity_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_lab"
            sandbox: true
          scenario: "reliable_reporting_core_integrity_probe"
          params:
            operation: "prepare"
          context:
            correlation_id: "reliable_reporting_core--prepare-integrity"
        validations:
          - check: response_schema
            description: "Controller response is schema-valid"
          - check: field_value
            path: "success"
            value: true
            description: "Daily source-calendar fixture was prepared"
          - check: field_value
            path: "simulated.period_timezone"
            value: "America/New_York"
            description: "Fixture uses the upstream reporting calendar"
          - check: field_value
            path: "simulated.period_duration"
            value: "P1D"
            description: "Fixture represents a source-calendar day"

      - id: read_core_integrity_baseline
        title: "Persist the pre-publication checkpoint"
        task: get_reporting_status
        schema_ref: "media-buy/get-reporting-status-request.json"
        response_schema_ref: "media-buy/get-reporting-status-response.json"
        doc_ref: "/media-buy/task-reference/get_reporting_status"
        comply_scenario: reliable_reporting_core_integrity_probe
        stateful: true
        context_outputs:
          - name: reliable_reporting_core_checkpoint
            path: "changes_checkpoint"
          - name: reliable_reporting_core_obligation_id
            path: "periods[0].reporting_obligation_id"
        sample_request:
          account:
            account_id: "reporting_core_lab"
          view: "periods"
          context:
            correlation_id: "reliable_reporting_core--baseline"
        validations:
          - check: response_schema
            description: "Baseline periods response is schema-valid"
          - check: field_present
            path: "changes_checkpoint"
            description: "Buyer can persist an incremental-repair boundary"
          - check: field_present
            path: "adjustments"
            description: "Core exposes an empty correction ledger before publication"
          - check: field_value
            path: "periods[0].schedule.alignment"
            value: "source_timezone"
            description: "The installed clock follows the upstream source"
          - check: field_value
            path: "periods[0].period.source_timezone"
            value: "America/New_York"
            description: "Resolved source timezone is echoed on the obligation"
          - check: field_value
            path: "periods[0].revision_count"
            value: 0
            description: "The checkpoint precedes the official close"

      - id: publish_official_and_adjustment_out_of_order
        title: "Publish an official close and later adjustment"
        task: comply_test_controller
        schema_ref: "compliance/comply-test-controller-request.json"
        response_schema_ref: "compliance/comply-test-controller-response.json"
        comply_scenario: reliable_reporting_core_integrity_probe
        stateful: true
        context_outputs:
          - name: reliable_reporting_core_official_revision_id
            path: "simulated.reporting_revision_id"
        sample_request:
          account:
            account_id: "reporting_core_lab"
            sandbox: true
          scenario: "reliable_reporting_core_integrity_probe"
          params:
            operation: "publish_official_adjustment"
          context:
            correlation_id: "reliable_reporting_core--publish-correction"
        validations:
          - check: response_schema
            description: "Controller publication response is schema-valid"
          - check: field_value
            path: "success"
            value: true
            description: "Official revision and later adjustment were committed"
          - check: field_value
            path: "simulated.notification_order[0]"
            value: "adjustment"
            description: "Fixture deliberately delivers the correction doorbell first"
          - check: field_value
            path: "simulated.notification_order[2]"
            value: "adjustment"
            description: "Fixture deliberately duplicates one doorbell"

      - id: repair_core_integrity_from_checkpoint
        title: "Converge from the saved checkpoint"
        task: get_reporting_status
        schema_ref: "media-buy/get-reporting-status-request.json"
        response_schema_ref: "media-buy/get-reporting-status-response.json"
        doc_ref: "/media-buy/task-reference/get_reporting_status"
        comply_scenario: reliable_reporting_core_integrity_probe
        stateful: true
        sample_request:
          account:
            account_id: "reporting_core_lab"
          view: "periods"
          changes_after: "$context.reliable_reporting_core_checkpoint"
          context:
            correlation_id: "reliable_reporting_core--repair"
        validations:
          - check: response_schema
            description: "Incremental repair response is schema-valid"
          - check: field_equals_context
            path: "periods[0].reporting_obligation_id"
            context_key: "reliable_reporting_core_obligation_id"
            description: "Repair returns the current projection of the affected obligation"
          - check: field_value
            path: "revisions[0].finality"
            value: "official"
            description: "The invoice anchor is an immutable official revision"
          - check: field_value
            path: "periods[0].adjustment_count"
            value: 1
            description: "The later correction is counted separately"
          - check: field_present
            path: "adjustments[0].reporting_adjustment_id"
            description: "Checkpoint repair discovers the health-neutral correction"
          - check: field_equals_context
            path: "adjustments[0].adjusts_reporting_revision_id"
            context_key: "reliable_reporting_core_official_revision_id"
            description: "The adjustment targets the exact official invoice anchor"
          - check: field_present
            path: "changes_checkpoint"
            description: "Buyer receives the next durable checkpoint after convergence"
