name: CodeQL

on:
  push:
    branches: [main, '3.2.x', '3.1.x', '3.0.x']
  pull_request:
    branches: [main, '3.2.x', '3.1.x', '3.0.x']
  schedule:
    - cron: "0 0 * * 0"

# Cancel a PR's superseded analysis when a newer commit is pushed. Push and
# schedule runs each get their own group (run_id), so main-branch analyses are
# never cancelled or evicted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: .github/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
