name: Build Check

on:
  pull_request:
    branches: [main, develop, '3.1.x', '3.0.x']
  push:
    branches: [main, develop, '3.1.x', '3.0.x']

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-worker:
    name: Build and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Audit production dependencies
        # Keep newly published advisories visible without making the live
        # advisory service an availability dependency for emergency deploys.
        # Dependency Review separately reports dependency changes on PRs.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Check hosted compliance publication manifest
        # The checker retries transient npm registry failures with bounded
        # timeouts; cap the whole network-backed drift check as a final guard.
        timeout-minutes: 2
        run: npm run check:published-compliance

      - name: Check immutable release artifacts
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="${{ github.event.before }}"
            if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
              BASE_REF="HEAD^"
            fi
          fi
          node scripts/check-immutable-release-artifacts.cjs "${BASE_REF}"

      - name: Build
        run: npm run build

      - name: Assert dist/ contains every server/src runtime asset
        run: node scripts/copy-server-assets.cjs --check

      - name: Routed tenant smoke tests
        run: npm run test:tenant-routing

      - name: Schema link plugin tests
        run: npm run test:schema-links

      - name: Fetch 3.0.x for error-code drift comparison
        if: github.ref != 'refs/heads/3.0.x' && github.base_ref != '3.0.x'
        run: git fetch --depth=1 origin +3.0.x:refs/remotes/origin/3.0.x

      - name: Error-code drift vs 3.0.x
        if: github.ref != 'refs/heads/3.0.x' && github.base_ref != '3.0.x'
        run: npm run test:error-code-drift

      - name: Check docs against compliance error codes
        run: npm run test:doc-compliance-drift

      - name: Check policy registry publication completeness
        run: npm run check:registry

  canonical-tests:
    name: Canonical tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run canonical test stages
        env:
          # generate-openapi.ts constructs these clients at module load but
          # does not make network calls during its freshness check.
          WORKOS_API_KEY: sk_dummy_ci_only
          WORKOS_CLIENT_ID: client_dummy_ci_only
          STRIPE_SECRET_KEY: sk_dummy_ci_only
          RESEND_API_KEY: re_dummy_ci_only
        run: >-
          node scripts/run-test-stage-shard.mjs
          --shard ${{ matrix.shard }}/4
          --exclude test:server-unit

  server-unit-worker:
    name: Server unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run server unit test shard
        run: npm run test:server-unit -- --shard=${{ matrix.shard }}/4

  # Keep the existing required-check context stable while worker jobs fan out.
  build:
    name: TypeScript Build
    if: always()
    needs: [build-worker, canonical-tests, server-unit-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every build and test shard
        env:
          BUILD_RESULT: ${{ needs.build-worker.result }}
          CANONICAL_RESULT: ${{ needs.canonical-tests.result }}
          SERVER_UNIT_RESULT: ${{ needs.server-unit-worker.result }}
        run: |
          if [ "${BUILD_RESULT}" != "success" ] || \
             [ "${CANONICAL_RESULT}" != "success" ] || \
             [ "${SERVER_UNIT_RESULT}" != "success" ]; then
            echo "Build worker: ${BUILD_RESULT}"
            echo "Canonical test shards: ${CANONICAL_RESULT}"
            echo "Server unit shards: ${SERVER_UNIT_RESULT}"
            exit 1
          fi

  server-integration-worker:
    name: Server integration tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        # Each matrix job gets its own isolated service container.
        image: postgres:16
        env:
          POSTGRES_USER: ci_runner
          POSTGRES_PASSWORD: ci_runner_throwaway_no_secret_value
          POSTGRES_DB: adcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_runner -d adcp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci_runner:ci_runner_throwaway_no_secret_value@127.0.0.1:5432/adcp_test
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Apply migrations to test database
        run: npx tsx server/src/db/migrate.ts

      - name: Run server integration test shard
        run: npm run test:server-integration -- --shard=${{ matrix.shard }}/4

  # Keep the existing required-check context stable while worker jobs fan out.
  server-integration:
    name: Server integration tests
    if: always()
    needs: server-integration-worker
    runs-on: ubuntu-latest
    steps:
      - name: Require every integration shard
        env:
          INTEGRATION_RESULT: ${{ needs.server-integration-worker.result }}
        run: |
          if [ "${INTEGRATION_RESULT}" != "success" ]; then
            echo "Server integration test shards: ${INTEGRATION_RESULT}"
            exit 1
          fi
