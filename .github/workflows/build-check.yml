name: Build Check

on:
  pull_request:
    branches: [main, develop, "3.1.x", "3.0.x"]
  push:
    branches: [main, develop, "3.1.x", "3.0.x"]

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-worker:
    name: Build and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Audit production dependencies
        # Keep newly published advisories visible without making the live
        # advisory service an availability dependency for emergency deploys.
        # Dependency Review separately reports dependency changes on PRs.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Check hosted compliance publication manifest
        # The checker retries transient npm registry failures with bounded
        # timeouts; cap the whole network-backed drift check as a final guard.
        timeout-minutes: 2
        run: npm run check:published-compliance

      - name: Check immutable release artifacts
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="${{ github.event.before }}"
            if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
              BASE_REF="HEAD^"
            fi
          fi
          node scripts/check-immutable-release-artifacts.cjs "${BASE_REF}"

      - name: Build
        run: npm run build

      - name: Assert dist/ contains every server/src runtime asset
        run: node scripts/copy-server-assets.cjs --check

      - name: Routed tenant smoke tests
        run: npm run test:tenant-routing

      - name: Schema link plugin tests
        run: npm run test:schema-links

      - name: Language-tag schema reference guard
        run: npm run test:language-tag-refs

      - name: Fetch 3.0.x for error-code drift comparison
        if: github.ref != 'refs/heads/3.0.x' && github.base_ref != '3.0.x'
        run: git fetch --depth=1 origin +3.0.x:refs/remotes/origin/3.0.x

      - name: Error-code drift vs 3.0.x
        if: github.ref != 'refs/heads/3.0.x' && github.base_ref != '3.0.x'
        run: npm run test:error-code-drift

      - name: Check docs against compliance error codes
        run: npm run test:doc-compliance-drift

      - name: Check policy registry publication completeness
        run: npm run check:registry

  canonical-tests:
    name: Canonical tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Run canonical test stages
        env:
          # generate-openapi.ts constructs these clients at module load but
          # does not make network calls during its freshness check.
          WORKOS_API_KEY: sk_dummy_ci_only
          WORKOS_CLIENT_ID: client_dummy_ci_only
          STRIPE_SECRET_KEY: sk_dummy_ci_only
          RESEND_API_KEY: re_dummy_ci_only
        run: >-
          node scripts/run-test-stage-shard.mjs
          --shard ${{ matrix.shard }}/4
          --exclude test:server-unit

  server-unit-worker:
    name: Server unit tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Run server unit test shard
        run: npm run test:server-unit -- --shard=${{ matrix.shard }}/4

  # Keep the existing required-check context stable while worker jobs fan out.
  build:
    name: TypeScript Build
    if: always()
    needs: [build-worker, canonical-tests, server-unit-worker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every build and test shard
        env:
          BUILD_RESULT: ${{ needs.build-worker.result }}
          CANONICAL_RESULT: ${{ needs.canonical-tests.result }}
          SERVER_UNIT_RESULT: ${{ needs.server-unit-worker.result }}
        run: |
          if [ "${BUILD_RESULT}" != "success" ] || \
             [ "${CANONICAL_RESULT}" != "success" ] || \
             [ "${SERVER_UNIT_RESULT}" != "success" ]; then
            echo "Build worker: ${BUILD_RESULT}"
            echo "Canonical test shards: ${CANONICAL_RESULT}"
            echo "Server unit shards: ${SERVER_UNIT_RESULT}"
            exit 1
          fi

  server-integration-worker:
    name: Server integration tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        # Each matrix job gets its own isolated service container.
        image: postgres:16
        env:
          POSTGRES_USER: ci_runner
          # Each matrix job owns this loopback-only service; database roles,
          # rather than a fixture secret, enforce the authority boundary.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: adcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_runner -d adcp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci_runner@127.0.0.1:5432/adcp_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Generate masked evaluator runtime password
        id: runtime_password
        run: |
          value="$(openssl rand -base64 36 | tr -d '\n' | tr '/+' '_-')"
          echo "::add-mask::$value"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Provision matched-v4 evaluator roles outside the application migration
        env:
          RUNTIME_PASSWORD: ${{ steps.runtime_password.outputs.value }}
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U ci_runner -d adcp_test -v ON_ERROR_STOP=1 \
            <<'SQL'
          \getenv runtime_password RUNTIME_PASSWORD
          -- The DBA prerequisite, rather than the migration principal,
          -- creates both static roles and their two bridges. PostgreSQL 16
          -- would otherwise give a CREATEROLE creator an implicit ADMIN edge.
          CREATE ROLE addie_matched_v4_operator NOLOGIN NOINHERIT;
          CREATE ROLE addie_matched_v4_runtime NOLOGIN NOINHERIT;
          CREATE ROLE addie_matched_v4_provisioner_ci LOGIN NOINHERIT NOCREATEROLE;
          GRANT CREATE ON DATABASE adcp_test TO addie_matched_v4_provisioner_ci;
          GRANT USAGE, CREATE ON SCHEMA public TO addie_matched_v4_provisioner_ci WITH GRANT OPTION;
          CREATE ROLE addie_matched_v4_runtime_ci LOGIN INHERIT PASSWORD :'runtime_password';
          GRANT CONNECT, TEMPORARY ON DATABASE adcp_test TO addie_matched_v4_runtime_ci;
          GRANT USAGE ON SCHEMA public TO addie_matched_v4_runtime;
          GRANT addie_matched_v4_runtime TO addie_matched_v4_runtime_ci WITH INHERIT TRUE, SET FALSE, ADMIN FALSE;
          GRANT addie_matched_v4_operator TO addie_matched_v4_provisioner_ci WITH INHERIT FALSE, SET TRUE, ADMIN FALSE;
          GRANT USAGE, CREATE ON SCHEMA public TO addie_matched_v4_operator;
          CREATE TABLE public.schema_migrations (version INTEGER PRIMARY KEY, filename VARCHAR(255) NOT NULL, applied_at TIMESTAMPTZ DEFAULT now());
          GRANT SELECT, INSERT ON public.schema_migrations TO addie_matched_v4_runtime_ci;
          SQL
          psql -h 127.0.0.1 -U addie_matched_v4_provisioner_ci -d adcp_test --single-transaction -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm' \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto' \
            -v runtime_principal=addie_matched_v4_runtime_ci \
            -v migration_principal=addie_matched_v4_provisioner_ci \
            -f server/scripts/addie-matched-v4-role-bootstrap.sql

      # Historical application migrations need schema CREATE on their first
      # pristine run. Remove that temporary setup grant before any evaluator
      # attestation: the protected runtime boundary intentionally has USAGE
      # only, and the DBA-created ledger remains available via SELECT/INSERT.
      - name: Apply ordinary schema before external evaluator boundary
        env:
          DATABASE_URL: postgresql://addie_matched_v4_runtime_ci:${{ steps.runtime_password.outputs.value }}@127.0.0.1:5432/adcp_test
          ADDIE_MATCHED_V4_EVALUATOR_SCHEMA_REQUIRED: "false"
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U ci_runner -d adcp_test -v ON_ERROR_STOP=1 \
            -c 'GRANT CREATE ON SCHEMA public TO addie_matched_v4_runtime_ci'
          npx tsx server/src/db/migrate.ts
          psql -h 127.0.0.1 -U ci_runner -d adcp_test -v ON_ERROR_STOP=1 \
            -c 'REVOKE CREATE ON SCHEMA public FROM addie_matched_v4_runtime_ci'

      - name: Apply evaluator schema from the external operator boundary
        env:
          PGOPTIONS: -c role=addie_matched_v4_operator
        run: |
          psql -h 127.0.0.1 -U addie_matched_v4_provisioner_ci -d adcp_test --single-transaction -v ON_ERROR_STOP=1 -f server/src/db/migrations/584_addie_matched_v4_private_authority.sql
          psql -h 127.0.0.1 -U addie_matched_v4_provisioner_ci -d adcp_test --single-transaction -v ON_ERROR_STOP=1 -f server/src/db/migrations/585_addie_matched_v4_record_estimated_cost.sql

      - name: Reject direct evaluator-table access for the actual app login
        env:
          DATABASE_URL: postgresql://addie_matched_v4_runtime_ci:${{ steps.runtime_password.outputs.value }}@127.0.0.1:5432/adcp_test
          ADDIE_MATCHED_V4_EVALUATOR_SCHEMA_REQUIRED: "true"
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U ci_runner -d adcp_test -v ON_ERROR_STOP=1 \
            -c 'GRANT SELECT ON public.addie_matched_v4_private_runs TO addie_matched_v4_runtime_ci'
          if npx tsx server/src/db/migrate.ts; then
            echo 'Ordinary migrator accepted direct evaluator-table access for the app login.' >&2
            exit 1
          fi
          psql -h 127.0.0.1 -U ci_runner -d adcp_test -v ON_ERROR_STOP=1 \
            -c 'REVOKE SELECT ON public.addie_matched_v4_private_runs FROM addie_matched_v4_runtime_ci'

      - name: Apply ordinary migrations and record evaluator schema
        env:
          DATABASE_URL: postgresql://addie_matched_v4_runtime_ci:${{ steps.runtime_password.outputs.value }}@127.0.0.1:5432/adcp_test
          ADDIE_MATCHED_V4_EVALUATOR_SCHEMA_REQUIRED: "true"
        run: npx tsx server/src/db/migrate.ts

      - name: Assert app login has only scoped evaluator functions
        env:
          PGPASSWORD: ${{ steps.runtime_password.outputs.value }}
        run: |
          set -euo pipefail
          RUNTIME=(psql -h 127.0.0.1 -U addie_matched_v4_runtime_ci -d adcp_test -v ON_ERROR_STOP=1)
          "${RUNTIME[@]}" -c "SELECT public.addie_matched_v4_private_reserve('mv4_55555555555555555555555555555555','screening',repeat('a',64),1) AS runtime_can_reserve"
          "${RUNTIME[@]}" -c "SELECT public.addie_matched_v4_private_intent('mv4_55555555555555555555555555555555','mv4_attempt_55555555555555555555555555555555','ci-runtime',1,repeat('b',64),clock_timestamp(),'standard','ci',repeat('c',64)) AS runtime_can_intent"
          "${RUNTIME[@]}" -c "SELECT public.addie_matched_v4_private_record_response_usage('mv4_55555555555555555555555555555555','mv4_attempt_55555555555555555555555555555555','response_usage_recorded',repeat('d',64),1) AS runtime_can_record_response_usage"
          "${RUNTIME[@]}" -c "SELECT public.addie_matched_v4_private_reconcile('mv4_00000000000000000000000000000000') AS runtime_can_execute_scoped_function"
          "${RUNTIME[@]}" -c "SELECT public.addie_matched_v4_private_halt('mv4_55555555555555555555555555555555','ci') AS runtime_can_halt"
          "${RUNTIME[@]}" -c "SELECT public.addie_matched_v4_private_claim_admission(repeat('0',40),repeat('0',64),'not-authorized') AS runtime_can_execute_claim_function"
          if "${RUNTIME[@]}" -c 'SET ROLE addie_matched_v4_operator'; then exit 1; fi
          if "${RUNTIME[@]}" -c "INSERT INTO public.addie_matched_v4_private_admissions (admission_id,merge_sha,authority_manifest_sha256,operator_gate_id,status) VALUES ('mv4_admission_00000000000000000000000000000000',repeat('0',40),repeat('0',64),'ci-denied','operator_authorized')"; then exit 1; fi

      - name: Assert app deployment configuration has no evaluator credential path
        run: |
          set -euo pipefail
          if rg -n 'DATABASE_MIGRATION_URL|MATCHED_V4_EVALUATOR_(ADMIN|OPERATOR)_DATABASE_URL' \
            fly.toml server/src Dockerfile; then
            echo 'Privileged evaluator credentials must stay in the protected control-plane workflow.' >&2
            exit 1
          fi

      - name: Run server integration test shard
        run: npm run test:server-integration -- --shard=${{ matrix.shard }}/4

  # Keep the existing required-check context stable while worker jobs fan out.
  server-integration:
    name: Server integration tests
    if: always()
    needs: server-integration-worker
    runs-on: ubuntu-latest
    steps:
      - name: Require every integration shard
        env:
          INTEGRATION_RESULT: ${{ needs.server-integration-worker.result }}
        run: |
          if [ "${INTEGRATION_RESULT}" != "success" ]; then
            echo "Server integration test shards: ${INTEGRATION_RESULT}"
            exit 1
          fi
