name: Release

on:
  push:
    branches:
      - main
      - '3.1.x'
      - '3.0.x'
      - '2.6.x'
      # '2.5-maintenance' is security-only until 2026-08-01; remove after that
      # date unless we extend the v2 support window.
      - '2.5-maintenance'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  TESTED_SHA: ${{ github.sha }}
  PUBLICATION_BRANCH: ${{ github.ref_name }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # id-token: write lets cosign request a Sigstore OIDC token from the
    # Actions runner during `npm run version` — this is what binds the
    # detached signature to the workflow identity that produced it.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # Mint a GitHub App installation token so events triggered by this
      # workflow (push to changeset-release/<branch>, release: published)
      # FIRE downstream workflows. GITHUB_TOKEN-triggered events are
      # silently dropped by GitHub's recursion-blocking rule, which used to
      # leave the Version Packages PR with stuck-pending CI and skip the
      # release-docs snapshot. Closes #3417.
      - name: Mint AAO Release Bot installation token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: adcontextprotocol
          repositories: adcp

      - name: Checkout Repo
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Require current release branch
        run: node scripts/check-release-state.cjs current

      - name: Detect release-relevant push
        id: release-relevance
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          changed_files="$(git show --first-parent --format= --name-only --no-renames "${GITHUB_SHA}")"
          if grep -Eq '^(\.changeset/|package(-lock)?[.]json$|dist/(schemas|compliance|protocol)/|static/(schemas|compliance)/source/|server/src/training-agent/|scripts/(build-schemas[.]cjs|build-compliance[.]cjs|build-protocol-tarball[.]cjs|sign-protocol-tarball[.]sh|run-storyboards-[^/]+[.]sh|run-storyboards-matrix[.]sh|stage-sdk-schema-bundle[.]sh|overlay-compliance-cache[.]sh)|[.]github/workflows/(release|training-agent-storyboards)[.]yml$)' <<< "${changed_files}"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Release-relevant files changed."
            exit 0
          fi

          echo "relevant=false" >> "$GITHUB_OUTPUT"
          echo "No release-relevant changes detected; skipping release job body."

      - name: Detect stranded committed release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          changed_files="$(git show --first-parent --format= --name-only --no-renames "$GITHUB_SHA")"
          VERSION=$(node -p "require('./package.json').version")
          if ! grep -Eq "^dist/(schemas|compliance)/${VERSION}/|^dist/protocol/${VERSION}[.]" <<< "${changed_files}"; then
            node scripts/check-release-state.cjs pending
          fi

      - name: Install cosign
        if: steps.release-relevance.outputs.relevant == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Install Dependencies
        if: steps.release-relevance.outputs.relevant == 'true'
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Recheck current release branch after installation
        if: steps.release-relevance.outputs.relevant == 'true'
        run: node scripts/check-release-state.cjs current

      - name: Verify current storyboard coverage
        if: steps.release-relevance.outputs.relevant == 'true' && github.ref_name == 'main'
        run: npm run test:storyboards

      - name: Verify 3.0 storyboard compatibility
        if: steps.release-relevance.outputs.relevant == 'true' && (github.ref_name == 'main' || github.ref_name == '3.0.x')
        run: npm run test:storyboards:3.0-compat
        env:
          ADCP_RELEASE_BASE_REF: 3.0.x

      - name: Detect committed release artifacts
        if: steps.release-relevance.outputs.relevant == 'true'
        id: release-artifacts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          changed_files="$(git show --first-parent --format= --name-only --no-renames "${GITHUB_SHA}")"
          if grep -Eq "^dist/(schemas|compliance)/${VERSION}/|^dist/protocol/${VERSION}[.]" <<< "${changed_files}"; then
            echo "has_release_artifacts=true" >> "$GITHUB_OUTPUT"
            echo "Detected committed release artifact changes for ${VERSION}."
          else
            echo "has_release_artifacts=false" >> "$GITHUB_OUTPUT"
            echo "No committed release artifacts detected for ${VERSION}."
          fi

      - name: Require current branch before Changesets generation
        if: steps.release-relevance.outputs.relevant == 'true' && steps.release-artifacts.outputs.has_release_artifacts != 'true'
        run: node scripts/check-release-state.cjs current

      - name: Create Release Pull Request
        if: steps.release-relevance.outputs.relevant == 'true' && steps.release-artifacts.outputs.has_release_artifacts != 'true'
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          commit: 'Version Packages'
          title: 'Version Packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Recheck current branch after Changesets generation
        if: steps.release-relevance.outputs.relevant == 'true' && steps.release-artifacts.outputs.has_release_artifacts != 'true'
        run: node scripts/check-release-state.cjs current

      - name: Require human approval for committed release artifacts
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          node scripts/check-release-state.cjs committed "${{ steps.release-artifacts.outputs.version }}"
          node scripts/check-release-state.cjs approval

      - name: Require committed signed protocol tarball
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.release-artifacts.outputs.version }}"
          TARBALL="dist/protocol/${VERSION}.tgz"
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Tarball not found at ${TARBALL}. Did npm run version fail upstream?"
            exit 1
          fi
          test -f "${TARBALL}.sig"
          test -f "${TARBALL}.crt"
          test -f "${TARBALL}.sha256"

      - name: Verify local protocol tarball before publication
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.release-artifacts.outputs.version }}"
          PRODUCER_SHA="$(git rev-parse "${RELEASE_SHA}^1")"
          cd dist/protocol
          TARBALL="${VERSION}.tgz"
          shasum -a 256 -c "${TARBALL}.sha256"
          cosign verify-blob \
            --signature "${TARBALL}.sig" \
            --certificate "${TARBALL}.crt" \
            --certificate-identity "https://github.com/adcontextprotocol/adcp/.github/workflows/release.yml@refs/heads/${PUBLICATION_BRANCH}" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-sha "${PRODUCER_SHA}" \
            --certificate-github-workflow-ref "refs/heads/${PUBLICATION_BRANCH}" \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-trigger push \
            "${TARBALL}"

      # Stage all four committed assets in a draft, then publish the release
      # before R2. Failed staging stays a draft for explicit recovery.
      - name: Upload protocol tarball to GitHub Release
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release-artifacts.outputs.version }}"
          TAG="v${VERSION}"
          TARBALL="dist/protocol/${VERSION}.tgz"
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Tarball not found at ${TARBALL}. Did npm run version fail upstream?"
            exit 1
          fi
          node scripts/check-release-state.cjs current
          remote_tag="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -1 | cut -f1)"
          if [ -n "$remote_tag" ] && [ "$remote_tag" != "$RELEASE_SHA" ]; then
            echo '::error::Existing release tag targets a different commit.'
            exit 1
          fi
          # Only a successful complete inventory can establish absence.
          # Transport, permissions, malformed responses and duplicate drafts refuse.
          release_inventory="$(mktemp)"
          trap 'rm -f "$release_inventory"' EXIT
          timeout 60s gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$release_inventory"
          if [ "$(wc -c < "$release_inventory")" -gt 16777216 ]; then
            echo '::error::Release inventory exceeds the bounded read budget.'
            exit 1
          fi
          jq -e 'type == "array" and all(.[]; type == "array") and
            ([.[][]] | all(.[]; type == "object" and (.id | type) == "number" and .id > 0 and .id == (.id | floor) and (.tag_name | type) == "string" and (.tag_name | length) > 0)) and
            (([.[][].id] | length) == ([.[][].id] | unique | length))' "$release_inventory" >/dev/null
          release_count="$(jq -er --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length' "$release_inventory")"
          rm -f "$release_inventory"
          if [ "$release_count" -gt 1 ]; then
            echo '::error::Ambiguous releases share the requested version tag.'
            exit 1
          fi
          if [ "$release_count" -eq 0 ]; then
            release_args=()
            if [[ "${VERSION}" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            node scripts/check-release-state.cjs current
            gh release create "${TAG}" --draft --latest=false \
              --target "${RELEASE_SHA}" \
              --title "${TAG}" \
              --notes "AdCP ${VERSION}" \
              "${release_args[@]}"
          fi

          release_state="$(gh release view "$TAG" --json isDraft,isPrerelease,targetCommitish)"
          jq -e '(.isDraft | type) == "boolean"' <<< "$release_state" >/dev/null
          if [ "$(jq -r '.isDraft' <<< "$release_state")" = false ]; then
            # Published releases are immutable: a retry only verifies authority
            # and bytes. Missing assets require a separate recovery plan.
            node scripts/check-release-state.cjs published "$VERSION"
            exit 0
          fi
          if [ "$(jq -r '.isDraft' <<< "$release_state")" = true ] && [ "$(jq -r '.targetCommitish' <<< "$release_state")" != "$RELEASE_SHA" ]; then
            echo '::error::Existing draft targets a different release commit.'
            exit 1
          fi

          expected_prerelease=false
          if [[ "$VERSION" == *-* ]]; then expected_prerelease=true; fi
          if [ "$(jq -r '.isPrerelease' <<< "$release_state")" != "$expected_prerelease" ]; then
            echo '::error::Existing release prerelease status conflicts with the version.'
            exit 1
          fi

          upload_asset_if_missing() {
            local path="$1"
            local name
            name="$(basename "${path}")"
            local remote_name
            remote_name="$(gh release view "${TAG}" --json assets --jq ".assets[] | select(.name == \"${name}\") | .name")"
            if [ -n "${remote_name}" ]; then
              local existing
              existing="$(mktemp -d)"
              gh release download "$TAG" --pattern "$name" --dir "$existing"
              if ! cmp -s "$path" "$existing/$name"; then
                echo "::error::Release asset $name differs; refusing immutable overwrite."
                rm -rf "$existing"
                exit 1
              fi
              rm -rf "$existing"
              echo "Release asset ${name} already exists on ${TAG}; leaving it untouched."
              return 0
            fi

            node scripts/check-release-state.cjs current
            gh release upload "${TAG}" "${path}"
            node scripts/check-release-state.cjs current
          }

          upload_asset_if_missing "${TARBALL}"
          upload_asset_if_missing "${TARBALL}.sha256"
          upload_asset_if_missing "${TARBALL}.sig"
          upload_asset_if_missing "${TARBALL}.crt"
          gh release view "$TAG" --json assets | jq -e --arg v "$VERSION" \
            '([.assets[].name] | sort) == (["", ".sha256", ".sig", ".crt"] | map($v + ".tgz" + .) | sort)' >/dev/null
          # Names are insufficient: verify every newly staged byte before making
          # the draft public, including signature and certificate assets.
          staged_tuple="$(mktemp -d)"
          trap 'rm -rf "$staged_tuple"' EXIT
          for suffix in "" ".sha256" ".sig" ".crt"; do
            name="${VERSION}.tgz${suffix}"
            node scripts/check-release-state.cjs current
            gh release download "$TAG" --pattern "$name" --dir "$staged_tuple"
            if ! cmp -s "dist/protocol/$name" "$staged_tuple/$name"; then
              echo "::error::Staged release asset $name differs; keeping the release draft."
              exit 1
            fi
            node scripts/check-release-state.cjs current
          done
          node scripts/check-release-state.cjs current
          node scripts/check-release-state.cjs committed "$VERSION"
          # Revalidate review state and current maintainer permission after
          # all four staged assets have been read back, before publication.
          node scripts/check-release-state.cjs approval
          gh release edit "$TAG" --draft=false --latest=false
          node scripts/check-release-state.cjs published "$VERSION"

      # Immutable R2 publication checks the maintained branch before and after every object.
      # Refresh the persisted Git credential with the job-scoped token so a
      # large release cannot exhaust the one-hour App token after the GitHub
      # Release has already been published. This phase performs GitHub reads
      # only; the App token above remains the authority for release mutations
      # whose downstream events must escape GITHUB_TOKEN recursion blocking.
      - name: Refresh credentials for artifact publication
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Publish release artifacts to R2
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADCP_ARTIFACT_R2_BUCKET: ${{ vars.ADCP_ARTIFACT_R2_BUCKET || 'adcp-artifacts' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Missing R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, or R2_SECRET_ACCESS_KEY secret."
            exit 1
          fi
          npm run backfill:cdn-artifacts -- --bucket "${ADCP_ARTIFACT_R2_BUCKET}" --quiet --version "${{ steps.release-artifacts.outputs.version }}" --skip-latest

      - name: Verify published protocol tarball from CDN
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.release-artifacts.outputs.version }}"
          PRODUCER_SHA="$(git rev-parse "${RELEASE_SHA}^1")"
          BASE_URL="https://adcontextprotocol.org/protocol"
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          cd "${workdir}"

          verify_once() {
            local attempt="$1"
            local bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            rm -f "${VERSION}.tgz" "${VERSION}.tgz.sha256" "${VERSION}.tgz.sig" "${VERSION}.tgz.crt"
            curl -fsSLo "${VERSION}.tgz" "${BASE_URL}/${VERSION}.tgz?cache_bust=${bust}" || return 1
            curl -fsSLo "${VERSION}.tgz.sha256" "${BASE_URL}/${VERSION}.tgz.sha256?cache_bust=${bust}" || return 1
            curl -fsSLo "${VERSION}.tgz.sig" "${BASE_URL}/${VERSION}.tgz.sig?cache_bust=${bust}" || return 1
            curl -fsSLo "${VERSION}.tgz.crt" "${BASE_URL}/${VERSION}.tgz.crt?cache_bust=${bust}" || return 1
            shasum -a 256 -c "${VERSION}.tgz.sha256" || return 1
            cosign verify-blob \
              --signature "${VERSION}.tgz.sig" \
              --certificate "${VERSION}.tgz.crt" \
              --certificate-identity "https://github.com/adcontextprotocol/adcp/.github/workflows/release.yml@refs/heads/${PUBLICATION_BRANCH}" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-sha "${PRODUCER_SHA}" \
              --certificate-github-workflow-ref "refs/heads/${PUBLICATION_BRANCH}" \
              --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
              --certificate-github-workflow-trigger push \
              "${VERSION}.tgz"
          }

          for attempt in 1 2 3 4 5; do
            if verify_once "${attempt}"; then
              echo "Verified published protocol tarball ${VERSION} on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" != "5" ]; then
              echo "Protocol tarball verification failed on attempt ${attempt}; retrying full tuple."
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Published protocol tarball ${VERSION} failed checksum/cosign verification after retries."
          exit 1
