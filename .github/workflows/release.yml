name: Release

on:
  push:
    branches:
      - main
      - '3.1.x'
      - '3.0.x'
  workflow_dispatch:
    inputs:
      release_commit:
        description: Approved release merge SHA to recover, or exact current branch SHA when preparing a reviewed supersession
        required: true
        type: string
      prepare_next:
        description: Generate the next candidate from a reviewed unpublished-release supersession marker
        required: false
        default: false
        type: boolean

# Keep pending release commits; freshness fences still reject obsolete runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  TESTED_SHA: ${{ github.sha }}
  PUBLICATION_BRANCH: ${{ github.ref_name }}
  RELEASE_SHA: ${{ inputs.release_commit || github.sha }}

jobs:
  verify-release:
    name: Verify release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.release-relevance.outputs.relevant }}
      target_commit: ${{ steps.release-target.outputs.commit }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}
          fetch-depth: 0

      - name: Resolve release target
        id: release-target
        env:
          REQUESTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}
        run: |
          set -euo pipefail

          if [[ ! "${REQUESTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Release recovery requires a full lowercase 40-character commit SHA."
            exit 1
          fi

          target_commit="$(git rev-parse HEAD)"
          if [ "${target_commit}" != "${REQUESTED_COMMIT}" ]; then
            echo "::error::Checked out ${target_commit}, expected ${REQUESTED_COMMIT}."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${GITHUB_REF_NAME}" in
              main|3.1.x|3.0.x) ;;
              *)
                echo "::error::Release recovery must run from a supported release branch."
                exit 1
                ;;
            esac

            git fetch --no-tags origin "+${GITHUB_REF}:refs/remotes/origin/${GITHUB_REF_NAME}"
            if ! git merge-base --is-ancestor "${target_commit}" "refs/remotes/origin/${GITHUB_REF_NAME}"; then
              echo "::error::Release recovery target ${target_commit} is not on ${GITHUB_REF_NAME}."
              exit 1
            fi
          fi

          echo "commit=${target_commit}" >> "$GITHUB_OUTPUT"

      - name: Require current release branch
        run: node scripts/check-release-state.cjs current

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Detect release-relevant push
        id: release-relevance
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_NEXT: ${{ inputs.prepare_next }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${PREPARE_NEXT}" = "true" ]; then
              if [ "$RELEASE_SHA" != "$TESTED_SHA" ]; then
                echo '::error::Supersession preparation must target the exact current release branch head.'
                exit 1
              fi
              node scripts/check-release-supersession.cjs verify
            else
              node scripts/check-release-state.cjs recovery "$RELEASE_SHA"
            fi
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git show --first-parent --format= --name-only --no-renames "${{ steps.release-target.outputs.commit }}")"
          if grep -Eq '^(\.changeset/|package(-lock)?[.]json$|dist/(schemas|compliance|protocol)/|static/(schemas|compliance)/source/|server/src/training-agent/|scripts/(build-schemas[.]cjs|build-compliance[.]cjs|build-protocol-tarball[.]cjs|sign-protocol-tarball[.]sh|run-storyboards-([^/]+[.]sh|isolated[.]mjs))|[.]github/workflows/(release|training-agent-storyboards|validate-schema-bundle)[.]yml$)' <<< "${changed_files}"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Release-relevant files changed."
            exit 0
          fi

          echo "relevant=false" >> "$GITHUB_OUTPUT"
          echo "No release-relevant changes detected; skipping release job body."

      - name: Detect stranded committed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed_files="$(git show --first-parent --format= --name-only --no-renames "$GITHUB_SHA")"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && ! grep -Eq "^dist/(schemas|compliance)/${VERSION}/|^dist/protocol/${VERSION}[.]" <<< "$changed_files"; then
            node scripts/check-release-state.cjs pending
          fi

      - name: Install Dependencies
        if: steps.release-relevance.outputs.relevant == 'true'
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Verify current storyboard coverage
        if: steps.release-relevance.outputs.relevant == 'true' && (github.ref_name == 'main' || github.ref_name == '3.1.x')
        run: npm run test:storyboards
        env:
          # A committed Version Packages bundle can lead the training agent's
          # published SDK by one candidate. The runner keeps this relaxation
          # scoped to a generated bundle matching package.json.
          ADCP_STORYBOARD_CANDIDATE_VERSION_MODE: '1'

      - name: Verify 3.0 storyboard compatibility
        if: steps.release-relevance.outputs.relevant == 'true' && (github.ref_name == 'main' || github.ref_name == '3.1.x' || github.ref_name == '3.0.x')
        run: npm run test:storyboards:3.0-compat
        env:
          ADCP_RELEASE_BASE_REF: 3.0.x

  release:
    name: Release
    needs: verify-release
    if: needs.verify-release.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # id-token: write lets cosign request a Sigstore OIDC token from the
    # Actions runner during `npm run version` — this is what binds the
    # detached signature to the workflow identity that produced it.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    env:
      RELEASE_COMMIT: ${{ needs.verify-release.outputs.target_commit }}
    steps:
      # Mint the GitHub App installation token only after the long-running
      # verification job succeeds. Installation tokens expire after one hour;
      # keeping verification in this job previously let the token expire
      # before Changesets could update the Version Packages PR.
      #
      # The App token also ensures events triggered by this workflow (push to
      # changeset-release/<branch>, release: published) FIRE downstream
      # workflows. GITHUB_TOKEN-triggered events are silently dropped by
      # GitHub's recursion-blocking rule. Closes #3417.
      - name: Mint AAO Release Bot installation token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: adcontextprotocol
          repositories: adcp

      - name: Checkout Repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.target_commit }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Require current release branch
        run: node scripts/check-release-state.cjs current

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Install Dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Detect committed release artifacts
        id: release-artifacts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PREPARE_NEXT: ${{ inputs.prepare_next }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$PREPARE_NEXT" = true ]; then
              node scripts/check-release-supersession.cjs verify
            else
              node scripts/check-release-state.cjs recovery "$RELEASE_SHA"
            fi
          fi
          node scripts/check-release-state.cjs current
          changed_files="$(git show --first-parent --format= --name-only --no-renames "${RELEASE_SHA}")"
          if grep -Eq "^dist/(schemas|compliance)/${VERSION}/|^dist/protocol/${VERSION}[.]" <<< "${changed_files}"; then
            echo "has_release_artifacts=true" >> "$GITHUB_OUTPUT"
            echo "Detected committed release artifact changes for ${VERSION}."
          else
            echo "has_release_artifacts=false" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$PREPARE_NEXT" != true ]; then
              echo "::error::Release recovery target ${RELEASE_COMMIT} does not commit artifacts for ${VERSION}."
              exit 1
            fi
            echo "No committed release artifacts detected for ${VERSION}."
          fi

      # Public human reviews are not publication authority. Recheck current
      # collaborator access and the reviewed head's exact merge provenance,
      # independently of branch-rule bypass or non-strict required checks.
      - name: Require human approval for committed release artifacts
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/check-release-state.cjs approval

      - name: Mint Changesets mutation token
        id: changesets-token
        timeout-minutes: 2
        if: steps.release-artifacts.outputs.has_release_artifacts == 'false'
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: adcontextprotocol
          repositories: adcp

      - name: Fence Changesets mutations
        if: steps.release-artifacts.outputs.has_release_artifacts != 'true'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ steps.changesets-token.outputs.token }}
        run: |
          set -euo pipefail
          # Changesets builds for minutes before pushing. Its pinned git-CLI
          # path honors pre-push and propagates a failed push before PR writes.
          mkdir -p "$RUNNER_TEMP/release-hooks"
          cp scripts/check-release-state.cjs "$RUNNER_TEMP/release-hooks/check.cjs"
          cp scripts/fence-changesets.cjs "$RUNNER_TEMP/release-hooks/fence.cjs"
          command -v git > "$RUNNER_TEMP/release-hooks/git-path"
          node "$RUNNER_TEMP/release-hooks/fence.cjs" prepare
          # shellcheck disable=SC2016
          printf '#!/bin/sh\nnode "$RUNNER_TEMP/release-hooks/check.cjs" current\n' > "$RUNNER_TEMP/release-hooks/pre-push"
          chmod +x "$RUNNER_TEMP/release-hooks/pre-push"
          git config core.hooksPath "$RUNNER_TEMP/release-hooks"
          # Only the pinned action's push shape may mutate the captured ref.
          # The helper leases it, then restores/quarantines on drift or error.
          cat > "$RUNNER_TEMP/release-hooks/git" <<'SH'
          #!/bin/sh
          real_git=$(cat "$RUNNER_TEMP/release-hooks/git-path")
          # Permit only the pinned producer's two read-only identity probes.
          # Other global options must not route around the leased push path.
          if [ "$#" -eq 4 ] && [ "$1" = -c ] && [ "$2" = user.useConfigOnly=true ] && [ "$3" = var ]; then
            case "$4" in GIT_AUTHOR_IDENT|GIT_COMMITTER_IDENT) exec "$real_git" "$@";; esac
          fi
          case "$1" in -*) echo 'Unsupported Git global options in release action' >&2; exit 1;; esac
          if [ "$1" = push ]; then
            exec node "$RUNNER_TEMP/release-hooks/fence.cjs" push "$@"
          else
            exec "$real_git" "$@"
          fi
          SH
          chmod +x "$RUNNER_TEMP/release-hooks/git"
          echo "$RUNNER_TEMP/release-hooks" >> "$GITHUB_PATH"

      - name: Create Release Pull Request or Tag Release
        if: steps.release-artifacts.outputs.has_release_artifacts != 'true'
        id: changesets
        timeout-minutes: 40
        # v2 understands the Changesets v3 `.changeset/pre/` archive. This is
        # v2.1.2, pinned to the contract verified at:
        # https://github.com/changesets/action/blob/ae32849d5ba541f9ae29e40e22a623bc13562f51/action.yml
        # Its implementation reads push-with-git-cli at src/index.ts:43.
        # Keep git CLI pushing enabled because beta-scale generated schema and
        # compliance artifacts exceed GitHub's API payload limit.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.changesets-token.outputs.token }}
          version-script: npm run version
          commit-message: 'Version Packages'
          pr-title: 'Version Packages'
          pr-draft: always
          create-github-releases: false
          push-with-git-cli: true
        env:
          HUSKY: '0'
          GH_TOKEN: ${{ steps.changesets-token.outputs.token }}

      - name: Mint Changesets reconciliation token
        id: reconciliation-token
        timeout-minutes: 2
        if: always() && steps.release-artifacts.outputs.has_release_artifacts == 'false' && steps.changesets-token.outcome == 'success'
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: adcontextprotocol
          repositories: adcp

      - name: Reconcile Changesets transaction
        if: always() && steps.release-artifacts.outputs.has_release_artifacts == 'false'
        env:
          GH_TOKEN: ${{ steps.reconciliation-token.outputs.token }}
          CHANGESETS_OUTCOME: ${{ steps.changesets.outcome }}
        run: |
          if [ -f "$RUNNER_TEMP/release-hooks/state.json" ]; then
            node "$RUNNER_TEMP/release-hooks/fence.cjs" finalize
          fi

      - name: Retain Changesets reconciliation evidence
        if: always() && steps.release-artifacts.outputs.has_release_artifacts == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: changesets-transaction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-hooks/state.json
          if-no-files-found: ignore

      - name: Require committed signed protocol tarball
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.release-artifacts.outputs.version }}"
          TARBALL="dist/protocol/${VERSION}.tgz"
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Tarball not found at ${TARBALL}. Did npm run version fail upstream?"
            exit 1
          fi
          test -f "${TARBALL}.sig"
          test -f "${TARBALL}.crt"

      - name: Verify local protocol tarball before publication
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.release-artifacts.outputs.version }}"
          cd dist/protocol
          TARBALL="${VERSION}.tgz"
          shasum -a 256 -c "${TARBALL}.sha256"
          cosign verify-blob \
            --signature "${TARBALL}.sig" \
            --certificate "${TARBALL}.crt" \
            --certificate-identity-regexp '^https://github\.com/adcontextprotocol/adcp/\.github/workflows/release\.yml@refs/heads/.*$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${TARBALL}"

      # Stage all four committed assets in a draft, then publish the release
      # before R2. Failed staging stays a draft for explicit recovery.
      - name: Upload protocol tarball to GitHub Release
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release-artifacts.outputs.version }}"
          TAG="v${VERSION}"
          TARBALL="dist/protocol/${VERSION}.tgz"
          if [ ! -f "${TARBALL}" ]; then
            echo "::error::Tarball not found at ${TARBALL}. Did npm run version fail upstream?"
            exit 1
          fi
          node scripts/check-release-state.cjs current
          remote_tag="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -1 | cut -f1)"
          if [ -n "$remote_tag" ] && [ "$remote_tag" != "$RELEASE_SHA" ]; then
            echo '::error::Existing release tag targets a different commit.'
            exit 1
          fi
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            release_args=()
            if [[ "${VERSION}" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            node scripts/check-release-state.cjs current
            gh release create "${TAG}" --draft \
              --target "${RELEASE_SHA}" \
              --title "${TAG}" \
              --notes "AdCP ${VERSION}" \
              "${release_args[@]}"
          fi

          release_state="$(gh release view "$TAG" --json isDraft,isPrerelease,targetCommitish)"
          jq -e '(.isDraft | type) == "boolean"' <<< "$release_state" >/dev/null
          if [ "$(jq -r '.isDraft' <<< "$release_state")" = false ]; then
            # Published releases are immutable: a retry only verifies authority
            # and bytes. Missing assets require a separate recovery plan.
            node scripts/check-release-state.cjs published "$VERSION"
            exit 0
          fi
          if [ "$(jq -r '.isDraft' <<< "$release_state")" = true ] && [ "$(jq -r '.targetCommitish' <<< "$release_state")" != "$RELEASE_SHA" ]; then
            echo '::error::Existing draft targets a different release commit.'
            exit 1
          fi

          expected_prerelease=false
          if [[ "$VERSION" == *-* ]]; then expected_prerelease=true; fi
          if [ "$(jq -r '.isPrerelease' <<< "$release_state")" != "$expected_prerelease" ]; then
            echo '::error::Existing release prerelease status conflicts with the version.'
            exit 1
          fi

          upload_asset_if_missing() {
            local path="$1"
            local name
            name="$(basename "${path}")"
            local remote_name
            remote_name="$(gh release view "${TAG}" --json assets --jq ".assets[] | select(.name == \"${name}\") | .name")"
            if [ -n "${remote_name}" ]; then
              local existing
              existing="$(mktemp -d)"
              gh release download "$TAG" --pattern "$name" --dir "$existing"
              if ! cmp -s "$path" "$existing/$name"; then
                echo "::error::Release asset $name differs; refusing immutable overwrite."
                rm -rf "$existing"
                exit 1
              fi
              rm -rf "$existing"
              echo "Release asset ${name} already exists on ${TAG}; leaving it untouched."
              return 0
            fi

            node scripts/check-release-state.cjs current
            gh release upload "${TAG}" "${path}"
            node scripts/check-release-state.cjs current
          }

          upload_asset_if_missing "${TARBALL}"
          upload_asset_if_missing "${TARBALL}.sha256"
          upload_asset_if_missing "${TARBALL}.sig"
          upload_asset_if_missing "${TARBALL}.crt"
          gh release view "$TAG" --json assets | jq -e --arg v "$VERSION" \
            '([.assets[].name] | sort) == (["", ".sha256", ".sig", ".crt"] | map($v + ".tgz" + .) | sort)' >/dev/null
          node scripts/check-release-state.cjs current
          gh release edit "$TAG" --draft=false
          node scripts/check-release-state.cjs published "$VERSION"

      # Immutable R2 publication checks main before and after every object.
      # Refresh the persisted Git credential with the job-scoped token so a
      # large release cannot exhaust the one-hour App token after the GitHub
      # Release has already been published. This phase performs GitHub reads
      # only; the App token above remains the authority for release mutations
      # whose downstream events must escape GITHUB_TOKEN recursion blocking.
      - name: Refresh credentials for artifact publication
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.target_commit }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Publish release artifacts to R2
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADCP_ARTIFACT_R2_BUCKET: ${{ vars.ADCP_ARTIFACT_R2_BUCKET || 'adcp-artifacts' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::Missing R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, or R2_SECRET_ACCESS_KEY secret."
            exit 1
          fi
          npm run backfill:cdn-artifacts -- --bucket "${ADCP_ARTIFACT_R2_BUCKET}" --quiet --version "${{ steps.release-artifacts.outputs.version }}" --skip-latest

      - name: Verify published protocol tarball from CDN
        if: steps.release-artifacts.outputs.has_release_artifacts == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.release-artifacts.outputs.version }}"
          BASE_URL="https://adcontextprotocol.org/protocol"
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          cd "${workdir}"

          verify_once() {
            local attempt="$1"
            local bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            rm -f "${VERSION}.tgz" "${VERSION}.tgz.sha256" "${VERSION}.tgz.sig" "${VERSION}.tgz.crt"
            curl -fsSLo "${VERSION}.tgz" "${BASE_URL}/${VERSION}.tgz?cache_bust=${bust}"
            curl -fsSLo "${VERSION}.tgz.sha256" "${BASE_URL}/${VERSION}.tgz.sha256?cache_bust=${bust}"
            curl -fsSLo "${VERSION}.tgz.sig" "${BASE_URL}/${VERSION}.tgz.sig?cache_bust=${bust}"
            curl -fsSLo "${VERSION}.tgz.crt" "${BASE_URL}/${VERSION}.tgz.crt?cache_bust=${bust}"
            shasum -a 256 -c "${VERSION}.tgz.sha256"
            cosign verify-blob \
              --signature "${VERSION}.tgz.sig" \
              --certificate "${VERSION}.tgz.crt" \
              --certificate-identity-regexp '^https://github\.com/adcontextprotocol/adcp/\.github/workflows/release\.yml@refs/heads/.*$' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "${VERSION}.tgz"
          }

          for attempt in 1 2 3 4 5; do
            if verify_once "${attempt}"; then
              echo "Verified published protocol tarball ${VERSION} on attempt ${attempt}."
              exit 0
            fi
            if [ "${attempt}" != "5" ]; then
              echo "Protocol tarball verification failed on attempt ${attempt}; retrying full tuple."
              sleep $((attempt * 10))
            fi
          done

          echo "::error::Published protocol tarball ${VERSION} failed checksum/cosign verification after retries."
          exit 1
