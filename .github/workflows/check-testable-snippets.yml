name: Check Testable Snippets

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'docs/**/*.mdx'
      - 'scripts/check-testable-snippets.cjs'
      - 'scripts/docs-example-coverage.cjs'
      - 'scripts/docs-json-field-audit.cjs'
      - 'scripts/fetch-merge-base.sh'
      - '.github/workflows/check-testable-snippets.yml'

jobs:
  check-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The snippet check diffs against the merge base with the target branch;
      # only that much history is fetched (#8559).
      - name: Fetch merge base with the target branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/fetch-merge-base.sh "${BASE_REF}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check for untested code snippets
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          printf '%s\n' "${changed}" | grep -E '\.(md|mdx)$' > changed_files.txt || true

          if [ -s changed_files.txt ]; then
            # The clone is blobless below HEAD and the checker diffs one file at
            # a time; one diff first fetches every missing blob in a single batch.
            xargs -d '\n' git diff "origin/${BASE_REF}...HEAD" -- < changed_files.txt > /dev/null
            echo "📋 Checking documentation changes for testable snippets..."
            node scripts/check-testable-snippets.cjs
          else
            echo "✓ No documentation files changed"
          fi

      - name: Publish docs example coverage
        run: |
          node scripts/docs-example-coverage.cjs --markdown >> "$GITHUB_STEP_SUMMARY"
          node scripts/docs-example-coverage.cjs --json > docs-example-coverage.json
          node scripts/docs-json-field-audit.cjs --markdown >> "$GITHUB_STEP_SUMMARY"
          node scripts/docs-json-field-audit.cjs --json > docs-json-field-audit.json
          node scripts/docs-json-field-audit.cjs --check --top 1

      - name: Upload docs example coverage artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-example-coverage
          path: |
            docs-example-coverage.json
            docs-json-field-audit.json
