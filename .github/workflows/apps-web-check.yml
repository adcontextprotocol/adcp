name: apps/web check

on:
  pull_request:
    branches: [main, develop, "3.2.x", "3.1.x", "3.0.x"]
  push:
    branches: [main, develop, "3.2.x", "3.1.x", "3.0.x"]

permissions:
  contents: read

concurrency:
  group: apps-web-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # This job always reports its stable context, even when web files did not
    # change. That makes it safe to configure as a required ruleset check.
    name: Typecheck + Lint + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      # The change detector compares two snapshots, so only the tested commit
      # is checked out and the compared commit is fetched below. Fetching every
      # branch and tag in full exhausted this job's budget before any check
      # ran (#8559).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            apps/web
          sparse-checkout-cone-mode: true

      - name: Detect web changes
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF_NAME: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          # actions/checkout retries its fetches; this one replaces part of it.
          FETCH_ATTEMPTS: "3"
          FETCH_RETRY_DELAY_SECONDS: "5"
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            compare_ref="refs/remotes/origin/${BASE_REF_NAME}"
            fetch_refspec="+refs/heads/${BASE_REF_NAME}:${compare_ref}"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            compare_ref="${BEFORE_SHA}"
            fetch_refspec="${BEFORE_SHA}"
          else
            echo "web=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # A tree diff needs the compared commit, not its history. When that
          # commit or the diff is unavailable, every web check runs.
          fetched=false
          for attempt in $(seq "${FETCH_ATTEMPTS}"); do
            if git fetch --no-tags --no-recurse-submodules --depth=1 origin "${fetch_refspec}"; then
              fetched=true
              break
            fi
            if [ "${attempt}" -lt "${FETCH_ATTEMPTS}" ]; then
              echo "::warning::Fetching ${compare_ref} failed (attempt ${attempt} of ${FETCH_ATTEMPTS}); retrying."
              sleep "${FETCH_RETRY_DELAY_SECONDS}"
            fi
          done
          if [ "${fetched}" != true ]; then
            echo "::warning::Could not fetch ${compare_ref} after ${FETCH_ATTEMPTS} attempts; running every web check."
            echo "web=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git count-objects -v

          diff_status=0
          git diff --quiet "${compare_ref}" HEAD -- apps/web .github/workflows/apps-web-check.yml || diff_status=$?
          if [ "${diff_status}" -eq 0 ]; then
            echo "web=false" >> "${GITHUB_OUTPUT}"
          else
            if [ "${diff_status}" -ne 1 ]; then
              echo "::warning::Could not diff against ${compare_ref}; running every web check."
            fi
            echo "web=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.web == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        if: steps.changes.outputs.web == 'true'
        run: npm ci

      - name: Generate route tree
        if: steps.changes.outputs.web == 'true'
        run: npm run router:generate

      - name: Typecheck
        if: steps.changes.outputs.web == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.web == 'true'
        run: npm run lint

      - name: Test
        if: steps.changes.outputs.web == 'true'
        run: npm run test

      - name: Build
        if: steps.changes.outputs.web == 'true'
        run: npm run build

      - name: No web changes
        if: steps.changes.outputs.web != 'true'
        working-directory: ${{ github.workspace }}
        run: echo "No apps/web changes; web checks are not needed."
