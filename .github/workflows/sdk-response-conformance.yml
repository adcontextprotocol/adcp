name: SDK response evidence

on:
  pull_request:
    paths:
      - 'scripts/probe-sdk-response-conformance.cjs'
      - 'scripts/sdk-response-conformance/**'
      - 'tests/sdk-response-conformance.test.cjs'
      - 'package-lock.json'
      - '.github/workflows/sdk-response-conformance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: SDK response regression (known findings retained)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: scripts/sdk-response-conformance/go/go.mod
          cache-dependency-path: scripts/sdk-response-conformance/go/go.sum
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install -r scripts/sdk-response-conformance/requirements.txt
      - run: npm run test:sdk-response-conformance
      - name: Capture and validate real SDK responses
        id: probe
        run: |
          set +e
          bash scripts/sdk-response-conformance/run.sh .context/sdk-response-conformance
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          test -s .context/sdk-response-conformance/report.json
      - name: Check reviewed findings and publish summary
        run: |
          node scripts/sdk-response-conformance/check-baseline.cjs .context/sdk-response-conformance/report.json scripts/sdk-response-conformance/known-findings.json
          node scripts/sdk-response-conformance/summary.cjs .context/sdk-response-conformance/report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain wire observations and validation details
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-response-evidence
          path: .context/sdk-response-conformance/
          retention-days: 14
