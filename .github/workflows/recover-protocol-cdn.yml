name: Recover release artifacts on CDN

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact published semver to recover (for example, 3.0.22 or 3.3.0-beta.0)
        required: true
        type: string
      surfaces:
        description: >-
          protocol = the four signed tuple files only. all = also the immutable
          schemas/<version>/ and compliance/<version>/ trees.
        required: false
        default: protocol
        type: choice
        options:
          - protocol
          - all

# One recovery per version at a time, whatever the requested surfaces, so two
# dispatches cannot interleave reads and conditional writes on the same objects.
concurrency:
  group: recover-protocol-cdn-${{ inputs.version }}
  cancel-in-progress: false

env:
  TESTED_SHA: ${{ github.sha }}
  PUBLICATION_BRANCH: main

permissions:
  contents: read

jobs:
  recover:
    name: Recover immutable release artifacts
    # Recovery authority is current main only; other dispatch refs never run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The tag checked out below carries its own copies of these scripts, and
      # an old release predates them entirely. Recovery logic must come from
      # the current reviewed branch, never from the artifact being recovered.
      - name: Preserve current workflow publication fence
        run: |
          node scripts/check-release-state.cjs current
          cp scripts/check-release-state.cjs "$RUNNER_TEMP/check-release-state.cjs"
          cp scripts/check-protocol-bundle-parity.cjs "$RUNNER_TEMP/check-protocol-bundle-parity.cjs"
          cp scripts/recover-cdn-version-trees.sh "$RUNNER_TEMP/recover-cdn-version-trees.sh"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Validate release input and checkout tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Prereleases are accepted only as exact beta/rc versions; the
          # published-release check below still refuses any version without a
          # published GitHub Release carrying the complete signed tuple.
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::version must be an exact semver, optionally -beta.N or -rc.N (for example, 3.0.22 or 3.3.0-beta.0)"
            exit 1
          fi

          git checkout --detach "v${VERSION}"
          ACTUAL_VERSION="$(node -p "require('./package.json').version || ''")"
          if [[ "${ACTUAL_VERSION}" != "${VERSION}" ]]; then
            echo "::error::tag v${VERSION} contains package version ${ACTUAL_VERSION}"
            exit 1
          fi

          for suffix in tgz tgz.sha256 tgz.sig tgz.crt; do
            test -f "dist/protocol/${VERSION}.${suffix}" || {
              echo "::error::missing dist/protocol/${VERSION}.${suffix} in tag v${VERSION}"
              exit 1
            }
          done

      - name: Verify signed local release tuple
        env:
          VERSION: ${{ inputs.version }}
        working-directory: dist/protocol
        run: |
          set -euo pipefail
          shasum -a 256 -c "${VERSION}.tgz.sha256"
          cosign verify-blob \
            --signature "${VERSION}.tgz.sig" \
            --certificate "${VERSION}.tgz.crt" \
            --certificate-identity-regexp '^https://github\.com/adcontextprotocol/adcp/\.github/workflows/release\.yml@refs/heads/.*$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${VERSION}.tgz"

      - name: Upload only missing immutable R2 objects
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          BUCKET: ${{ vars.ADCP_ARTIFACT_R2_BUCKET || 'adcp-artifacts' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          if [[ -z "${R2_ACCOUNT_ID:-}" || -z "${AWS_ACCESS_KEY_ID:-}" || -z "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "::error::Missing R2 publication credentials"
            exit 1
          fi

          node "$RUNNER_TEMP/check-release-state.cjs" published "$VERSION"
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          upload_immutable() {
            local source="$1"
            local key="$2"
            local content_type="$3"
            local existing head_error
            existing="$(mktemp)"
            head_error="$(mktemp)"

            if aws s3api head-object \
              --bucket "${BUCKET}" \
              --key "${key}" \
              --endpoint-url "${endpoint}" \
              --region auto \
              --no-cli-pager >/dev/null 2>"${head_error}"; then
              aws s3 cp "s3://${BUCKET}/${key}" "${existing}" \
                --endpoint-url "${endpoint}" \
                --region auto \
                --no-progress \
                --only-show-errors
              if ! cmp -s "${source}" "${existing}"; then
                echo "::error::R2 object ${key} exists with different bytes; refusing overwrite"
                exit 1
              fi
              echo "Verified existing immutable object ${key}"
              return 0
            fi

            if ! grep -Eq '(404|Not Found)' "${head_error}"; then
              cat "${head_error}" >&2
              echo "::error::Could not safely determine whether R2 object ${key} exists"
              exit 1
            fi

            node "$RUNNER_TEMP/check-release-state.cjs" publication-current "$VERSION"
            aws s3api put-object --bucket "$BUCKET" --key "$key" --body "$source" \
              --if-none-match '*' --endpoint-url "$endpoint" --region auto --no-cli-pager \
              --cache-control 'public, max-age=31536000, immutable' --content-type "$content_type"
            node "$RUNNER_TEMP/check-release-state.cjs" publication-current "$VERSION"
            echo "Uploaded missing immutable object ${key}"
          }

          upload_immutable "dist/protocol/${VERSION}.tgz" "protocol/${VERSION}.tgz" 'application/gzip'
          upload_immutable "dist/protocol/${VERSION}.tgz.sha256" "protocol/${VERSION}.tgz.sha256" 'text/plain; charset=utf-8'
          upload_immutable "dist/protocol/${VERSION}.tgz.sig" "protocol/${VERSION}.tgz.sig" 'application/octet-stream'
          upload_immutable "dist/protocol/${VERSION}.tgz.crt" "protocol/${VERSION}.tgz.crt" 'application/x-pem-file'

      - name: Verify recovered public CDN tuple
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          cd "${workdir}"

          bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          base_url="https://adcontextprotocol.org/protocol"
          curl -fsSLo "${VERSION}.tgz" "${base_url}/${VERSION}.tgz?cache_bust=${bust}"
          curl -fsSLo "${VERSION}.tgz.sha256" "${base_url}/${VERSION}.tgz.sha256?cache_bust=${bust}"
          curl -fsSLo "${VERSION}.tgz.sig" "${base_url}/${VERSION}.tgz.sig?cache_bust=${bust}"
          curl -fsSLo "${VERSION}.tgz.crt" "${base_url}/${VERSION}.tgz.crt?cache_bust=${bust}"
          shasum -a 256 -c "${VERSION}.tgz.sha256"
          cosign verify-blob \
            --signature "${VERSION}.tgz.sig" \
            --certificate "${VERSION}.tgz.crt" \
            --certificate-identity-regexp '^https://github\.com/adcontextprotocol/adcp/\.github/workflows/release\.yml@refs/heads/.*$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "${VERSION}.tgz"

      # The signed tuple above is the only cryptographic authority available
      # for a historical version; R2 objects are unsigned. The script below
      # proves the trees it publishes are byte-for-byte the trees inside that
      # tarball before it writes anything, so one cosign verification covers
      # every object. See RELEASING.md "Recovering a release's CDN artifacts".
      - name: Upload only missing immutable schema and compliance objects
        if: inputs.surfaces == 'all'
        env:
          VERSION: ${{ inputs.version }}
          FENCE_SCRIPT: ${{ runner.temp }}/check-release-state.cjs
          PARITY_SCRIPT: ${{ runner.temp }}/check-protocol-bundle-parity.cjs
          BUCKET: ${{ vars.ADCP_ARTIFACT_R2_BUCKET || 'adcp-artifacts' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: bash "$RUNNER_TEMP/recover-cdn-version-trees.sh" upload

      - name: Verify recovered public CDN trees
        if: inputs.surfaces == 'all'
        env:
          VERSION: ${{ inputs.version }}
          FENCE_SCRIPT: ${{ runner.temp }}/check-release-state.cjs
          PARITY_SCRIPT: ${{ runner.temp }}/check-protocol-bundle-parity.cjs
        run: bash "$RUNNER_TEMP/recover-cdn-version-trees.sh" verify
