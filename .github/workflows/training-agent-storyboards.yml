name: Training Agent Storyboards

on:
  pull_request:
    branches: [main, '3.1.x', '3.0.x']
    paths:
      - 'server/src/training-agent/**'
      - 'server/src/services/hosted-compliance-version.ts'
      - 'server/tests/manual/run-storyboards.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-schemas.cjs'
      - 'scripts/build-compliance.cjs'
      - 'scripts/run-storyboards-isolated.mjs'
      - 'scripts/run-storyboards-isolated-shards.sh'
      - 'scripts/run-storyboards-matrix.sh'
      - 'scripts/run-storyboards-sharded.sh'
      - 'scripts/run-storyboards-3-0-compat.sh'
      - 'static/schemas/source/**'
      - 'static/compliance/source/**'
      - 'dist/compliance/**'
      - 'dist/schemas/**'
      - '.github/workflows/training-agent-storyboards.yml'
  push:
    branches: [main, '3.1.x', '3.0.x']
    paths:
      - 'server/src/training-agent/**'
      - 'server/src/services/hosted-compliance-version.ts'
      - 'server/tests/manual/run-storyboards.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-schemas.cjs'
      - 'scripts/build-compliance.cjs'
      - 'scripts/run-storyboards-isolated.mjs'
      - 'scripts/run-storyboards-isolated-shards.sh'
      - 'scripts/run-storyboards-matrix.sh'
      - 'scripts/run-storyboards-sharded.sh'
      - 'scripts/run-storyboards-3-0-compat.sh'
      - 'static/schemas/source/**'
      - 'static/compliance/source/**'
      - 'dist/compliance/**'
      - 'dist/schemas/**'
      - '.github/workflows/training-agent-storyboards.yml'

concurrency:
  group: training-agent-storyboards-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  storyboards:
    name: Storyboards (${{ matrix.surface }} /${{ matrix.tenant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        surface: [current, 3.0-compat]
        # The training agent is split into seven per-specialism tenants; each
        # tenant runs the full conformance suite and is graded against its
        # own floors per compliance surface. Current-source floors are the
        # post-migration baseline (PR #3713, SDK 6.0.0); 3.0-compat floors
        # are the frozen latest dist/compliance/3.0.x bundle baseline.
        # Rising is fine; regressing fails CI.
        tenant: [signals, sales, governance, creative, creative-builder, brand, si]
        # Current /sales uses the isolated orchestrators below so each
        # storyboard gets a fresh process while one aggregate required check
        # preserves the established branch-protection contract.
        exclude:
          - surface: current
            tenant: sales
        include:
          # Floors are ratcheted from the first capability-resolved replay.
          # Selection comes from each tenant's live get_adcp_capabilities
          # declaration; out-of-scope and quarantined storyboards are reported
          # separately from the result rows graded by these floors.
          - surface: current
            tenant: signals
            min_clean_storyboards: 45
            min_passing_steps: 80
          - surface: current
            tenant: governance
            min_clean_storyboards: 47
            min_passing_steps: 161
          - surface: current
            tenant: creative
            min_clean_storyboards: 49
            min_passing_steps: 209
          - surface: current
            tenant: creative-builder
            min_clean_storyboards: 50
            min_passing_steps: 184
          - surface: current
            tenant: brand
            min_clean_storyboards: 45
            min_passing_steps: 116
          - surface: current
            tenant: si
            min_clean_storyboards: 42
            min_passing_steps: 50
          - surface: 3.0-compat
            tenant: signals
            min_clean_storyboards: 24
            min_passing_steps: 98
          # SDK 14 beta.12 makes unsigned signing-required functional steps
          # explicitly out of scope for immutable bundles that predate the
          # functional_dispatch signing contract. The remaining 39 rows are
          # still required to be clean, including the released identity
          # lifecycle assertion below.
          - surface: 3.0-compat
            tenant: sales
            min_clean_storyboards: 39
            min_passing_steps: 219
          - surface: 3.0-compat
            tenant: governance
            min_clean_storyboards: 27
            min_passing_steps: 147
          - surface: 3.0-compat
            tenant: creative
            min_clean_storyboards: 22
            min_passing_steps: 109
          - surface: 3.0-compat
            tenant: creative-builder
            min_clean_storyboards: 24
            min_passing_steps: 112
          - surface: 3.0-compat
            tenant: brand
            min_clean_storyboards: 23
            min_passing_steps: 76
          # 3.0 predates the sponsored-intelligence specialism enum and its
          # response projection therefore omits that newer claim. Keep the
          # frozen surface as a non-regression floor, not a claim of current
          # SI specialism conformance.
          - surface: 3.0-compat
            tenant: si
            min_clean_storyboards: 21
            min_passing_steps: 72
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build current compliance and schema bundles
        if: matrix.surface == 'current'
        run: |
          node scripts/build-schemas.cjs
          node scripts/build-compliance.cjs

      - name: Select latest released 3.0.x compliance bundle
        if: matrix.surface == '3.0-compat'
        id: compat-bundle
        env:
          RELEASE_BASE_REF: 3.0.x
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/remotes/origin/${RELEASE_BASE_REF}"; then
            git fetch --no-tags --depth=1 origin "${RELEASE_BASE_REF}:refs/remotes/origin/${RELEASE_BASE_REF}"
          fi
          VERSION=$(node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const baseRef = process.env.RELEASE_BASE_REF || 'main';
          const gitRef = baseRef.includes('/') ? baseRef : `origin/${baseRef}`;
          function listFromGit(ref) {
            try {
              const output = execFileSync('git', ['ls-tree', '-d', '--name-only', `${ref}:dist/compliance`], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore'],
              });
              return output.split(/\r?\n/).filter((name) => /^3\.0\.\d+$/.test(name));
            } catch {
              return [];
            }
          }
          function listFromWorkingTree() {
            const dir = path.join(process.cwd(), 'dist', 'compliance');
            return fs.existsSync(dir)
              ? fs.readdirSync(dir).filter((name) => /^3\.0\.\d+$/.test(name))
              : [];
          }
          const versions = listFromGit(gitRef);
          if (versions.length === 0) {
            versions.push(...listFromWorkingTree());
          }
          versions.sort((a, b) => {
            const pa = a.split('.').map(Number);
            const pb = b.split('.').map(Number);
            for (let i = 0; i < 3; i += 1) {
              if (pa[i] !== pb[i]) return pa[i] - pb[i];
            }
            return 0;
          });
          const latest = versions.at(-1);
          if (!latest) process.exit(2);
          process.stdout.write(latest);
          NODE
          )
          TMP_DIR="$(mktemp -d)"
          git archive "origin/${RELEASE_BASE_REF}" "dist/compliance/${VERSION}" | tar -x -C "${TMP_DIR}"
          git archive "origin/${RELEASE_BASE_REF}" "dist/schemas/${VERSION}" | tar -x -C "${TMP_DIR}"
          mkdir -p "${TMP_DIR}/schemas/cache"
          cp -R "${TMP_DIR}/dist/schemas/${VERSION}" "${TMP_DIR}/schemas/cache/${VERSION}"
          DIR="${TMP_DIR}/dist/compliance/${VERSION}"
          if [ ! -f "${DIR}/index.json" ]; then
            echo "::error::Compliance bundle not found at ${DIR}"
            exit 1
          fi
          node scripts/patch-3-0-compat-bundle.cjs "${DIR}"
          git archive "origin/${RELEASE_BASE_REF}" "dist/schemas/${VERSION}" | tar -x -C "${TMP_DIR}"
          SCHEMA_DIR="${TMP_DIR}/dist/schemas/${VERSION}"
          if [ ! -f "${SCHEMA_DIR}/index.json" ]; then
            echo "::error::Schema bundle not found at ${SCHEMA_DIR}"
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "dir=${DIR}"
            echo "schema_dir=${SCHEMA_DIR}"
          } >> "$GITHUB_OUTPUT"
          echo "Using ${DIR}"

      - name: Run storyboards against /${{ matrix.tenant }}
        id: run
        env:
          TENANT_PATH: ${{ matrix.tenant }}
          PUBLIC_TEST_AGENT_TOKEN: storyboard-ci-token
          ADCP_COMPLIANCE_DIR: ${{ matrix.surface == 'current' && 'dist/compliance/latest' || steps.compat-bundle.outputs.dir }}
          ADCP_SCHEMA_ROOT: ${{ matrix.surface == 'current' && 'dist/schemas/latest' || steps.compat-bundle.outputs.schema_dir }}
          ADCP_STORYBOARD_CANDIDATE_VERSION_MODE: ${{ matrix.surface == 'current' && github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main' && '1' || '0' }}
        run: |
          set -uo pipefail
          # Creative-builder retains a large generated-schema graph after its
          # result is complete on some Node/V8 builds. Run each storyboard in
          # a bounded child so teardown cannot retain the whole job. Other
          # matrix tenants remain monolithic; current /sales has its separate
          # isolated aggregate jobs below.
          isolated_orchestrator_failure=0
          if [ "${{ matrix.tenant }}" = "creative-builder" ]; then
            bash scripts/run-storyboards-isolated-shards.sh \
              --shard-count 8 --max-parallel 4 2>&1 \
              | tee /tmp/storyboards.log || isolated_orchestrator_failure=1
          else
            # The runner exits 1 when any storyboard step fails (intentional —
            # dev ergonomics). CI grades pass/fail via the floor check below,
            # not the runner's exit code. `|| true` keeps the step alive past
            # the runner so the parse + regression-check stages can run.
            npx tsx server/tests/manual/run-storyboards.ts 2>&1 | tee /tmp/storyboards.log || true
          fi
          # `grep` returning empty is not a fatal error here — we want to
          # detect that explicitly below.
          storyboard_totals=$(sed -nE 's/^[[:space:]]*storyboards: ([0-9]+)\/([0-9]+) clean$/\1 \2/p' /tmp/storyboards.log | tail -1)
          selection_totals=$(sed -nE 's/^[[:space:]]*selection: ([0-9]+) applicable \| ([0-9]+) not applicable \| ([0-9]+) quarantined \| ([0-9]+) corpus$/\1 \2 \3 \4/p' /tmp/storyboards.log | tail -1)
          step_totals=$(sed -nE 's/^[[:space:]]*steps: ([0-9]+) passed \| ([0-9]+) failed \| ([0-9]+) skipped \| ([0-9]+) not applicable$/\1 \2 \3 \4/p' /tmp/storyboards.log | tail -1)
          set -e
          if [ -z "${storyboard_totals}" ] || [ -z "${selection_totals}" ] || [ -z "${step_totals}" ]; then
            echo "::error::Failed to parse storyboard count from log — the runner's output format may have changed. Download the storyboards-log-${{ matrix.surface }}-${{ matrix.tenant }} artifact from this run to inspect the raw output and update the grep patterns in this workflow."
            exit 1
          fi
          read -r clean total <<< "${storyboard_totals}"
          read -r applicable scope_not_applicable quarantined corpus <<< "${selection_totals}"
          read -r passed failed skipped not_applicable <<< "${step_totals}"
          {
            echo "clean=${clean}"
            echo "total=${total}"
            echo "applicable=${applicable}"
            echo "scope_not_applicable=${scope_not_applicable}"
            echo "quarantined=${quarantined}"
            echo "corpus=${corpus}"
            echo "passed=${passed}"
            echo "failed=${failed}"
            echo "skipped=${skipped}"
            echo "not_applicable=${not_applicable}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Training agent · ${{ matrix.surface }} /${{ matrix.tenant }}"
            echo
            echo '| Clean result rows | Result rows | Applicable storyboards | Out of scope | Quarantined | Passed steps | Failed steps | Skipped steps | N/A steps |'
            echo '|---:|---:|---:|---:|---:|---:|---:|---:|---:|'
            echo "| ${clean} | ${total} | ${applicable} | ${scope_not_applicable} | ${quarantined} | ${passed} | ${failed} | ${skipped} | ${not_applicable} |"
            echo
            echo '> Capability-resolved regression evidence; whole-storyboard quarantines and step-level runner skips remain visible and prevent this from being a badge verdict.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${isolated_orchestrator_failure}" -ne 0 ]; then
            echo "::error::One or more isolated creative-builder orchestrators failed. Counts above are diagnostic only."
            exit 1
          fi

      - name: Upload storyboards log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storyboards-log-${{ matrix.surface }}-${{ matrix.tenant }}
          path: /tmp/storyboards.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Enforce non-regression (/${{ matrix.tenant }})
        env:
          CLEAN: ${{ steps.run.outputs.clean }}
          PASSED: ${{ steps.run.outputs.passed }}
          MIN_CLEAN: ${{ matrix.min_clean_storyboards }}
          MIN_PASSED: ${{ matrix.min_passing_steps }}
        run: |
          set -euo pipefail
          echo "Tenant: /${{ matrix.tenant }}"
          echo "Surface: ${{ matrix.surface }}"
          if [ "${{ matrix.surface }}" = "3.0-compat" ]; then
            echo "Compliance bundle: ${{ steps.compat-bundle.outputs.version }}"
          fi
          echo "Clean storyboards: ${CLEAN} (floor: ${MIN_CLEAN})"
          echo "Passing steps: ${PASSED} (floor: ${MIN_PASSED})"
          regression_help() {
            local metric="$1"
            local observed="$2"
            local floor="$3"
            cat <<HELP
          ::error::Regression: ${observed} ${metric} is below the ${floor} floor (tenant: /${{ matrix.tenant }}).

          Next steps:
            • If this drop is intentional (removed deprecated invariant, retired
              storyboard, etc.): edit .github/workflows/training-agent-storyboards.yml,
              find the matrix entry where surface == ${{ matrix.surface }} and tenant == ${{ matrix.tenant }}, and update
              the floor to ${observed}.
            • If unintentional: download the storyboards-log-${{ matrix.surface }}-${{ matrix.tenant }} artifact
              from this run to see which storyboards regressed and why.
          HELP
          }
          if [ "${CLEAN}" -lt "${MIN_CLEAN}" ]; then
            regression_help "clean storyboards" "${CLEAN}" "${MIN_CLEAN}"
            exit 1
          fi
          if [ "${PASSED}" -lt "${MIN_PASSED}" ]; then
            regression_help "passing steps" "${PASSED}" "${MIN_PASSED}"
            exit 1
          fi

      - name: Enforce signals required-clean storyboards
        if: matrix.surface == 'current' && matrix.tenant == 'signals'
        run: |
          set -euo pipefail
          required_clean=(
            "wholesale_feed_signals"
            "wholesale_feed_signal_webhooks"
            "wholesale_feed_bulk_webhooks"
          )
          for storyboard_id in "${required_clean[@]}"; do
            if grep -E "^[[:space:]]+${storyboard_id}[[:space:]]+✓" /tmp/storyboards.log >/dev/null; then
              echo "Required-clean storyboard passed: ${storyboard_id}"
            else
              echo "::error::Required-clean storyboard did not pass on /signals current surface: ${storyboard_id}"
              echo "Last matching log lines:"
              grep -F "${storyboard_id}" /tmp/storyboards.log || true
              exit 1
            fi
          done

      - name: Enforce governance seller-disposition evidence
        if: matrix.surface == 'current' && matrix.tenant == 'governance'
        run: |
          set -euo pipefail
          requirement="governance/failed_outcome_audit_persistence:4:0"
          storyboard_id="${requirement%%:*}"
          counts="${requirement#*:}"
          expected_passed="${counts%%:*}"
          expected_skipped="${counts##*:}"
          if grep -E "^[[:space:]]+${storyboard_id}[[:space:]]+✓[[:space:]]+${expected_passed}P / ${expected_skipped}S" /tmp/storyboards.log >/dev/null; then
            echo "Required-exact storyboard passed: ${storyboard_id} (${expected_passed}P / ${expected_skipped}S)"
          else
            echo "::error::Required-exact storyboard counts changed on /governance current surface: ${storyboard_id}"
            grep -F "${storyboard_id}" /tmp/storyboards.log || true
            exit 1
          fi

      - name: Enforce creative required-clean storyboards
        if: matrix.surface == 'current' && matrix.tenant == 'creative'
        run: |
          set -euo pipefail
          required_clean=(
            "canonical_format_validate_input"
            "creative/billing_out_of_band"
          )
          for storyboard_id in "${required_clean[@]}"; do
            if grep -E "^[[:space:]]+${storyboard_id}[[:space:]]+✓" /tmp/storyboards.log >/dev/null; then
              echo "Required-clean storyboard passed: ${storyboard_id}"
            else
              echo "::error::Required-clean storyboard did not pass on /creative current surface: ${storyboard_id}"
              echo "Last matching log lines:"
              grep -F "${storyboard_id}" /tmp/storyboards.log || true
              exit 1
            fi
          done

      - name: Enforce creative-builder required-clean storyboards
        if: matrix.surface == 'current' && matrix.tenant == 'creative-builder'
        run: |
          set -euo pipefail
          required_clean=(
            "canonical_format_validate_input"
          )
          for storyboard_id in "${required_clean[@]}"; do
            if grep -E "^[[:space:]]+${storyboard_id}[[:space:]]+✓" /tmp/storyboards.log >/dev/null; then
              echo "Required-clean storyboard passed: ${storyboard_id}"
            else
              echo "::error::Required-clean storyboard did not pass on /creative-builder current surface: ${storyboard_id}"
              echo "Last matching log lines:"
              grep -F "${storyboard_id}" /tmp/storyboards.log || true
              exit 1
            fi
          done

      - name: Enforce released 3.0 sales identity lifecycle
        if: matrix.surface == '3.0-compat' && matrix.tenant == 'sales'
        run: |
          set -euo pipefail
          if ! grep -E '^[[:space:]]+media_buy_seller[[:space:]]+✓' /tmp/storyboards.log >/dev/null; then
            echo "::error::Required-clean storyboard did not pass on /sales 3.0 surface: media_buy_seller"
            grep -F 'media_buy_seller' /tmp/storyboards.log || true
            exit 1
          fi

      - name: Enforce released 3.0 creative identity lifecycle
        if: matrix.surface == '3.0-compat' && matrix.tenant == 'creative'
        run: |
          set -euo pipefail
          if ! grep -E '^[[:space:]]+creative_lifecycle[[:space:]]+✓' /tmp/storyboards.log >/dev/null; then
            echo "::error::Required-clean storyboard did not pass on /creative 3.0 surface: creative_lifecycle"
            grep -F 'creative_lifecycle' /tmp/storyboards.log || true
            exit 1
          fi

      - name: Enforce sponsored-intelligence required-clean storyboards
        if: matrix.surface == 'current' && matrix.tenant == 'si'
        run: |
          set -euo pipefail
          required_clean=(
            "si_baseline"
            "si_sponsored_context_accountability"
          )
          for storyboard_id in "${required_clean[@]}"; do
            if grep -E "^[[:space:]]+${storyboard_id}[[:space:]]+✓" /tmp/storyboards.log >/dev/null; then
              echo "Required-clean storyboard passed: ${storyboard_id}"
            else
              echo "::error::Required-clean storyboard did not pass on /si current surface: ${storyboard_id}"
              echo "Last matching log lines:"
              grep -F "${storyboard_id}" /tmp/storyboards.log || true
              exit 1
            fi
          done

  sales_storyboard_orchestrators:
    name: Sales storyboard orchestrator (${{ matrix.orchestrator }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        orchestrator: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SALES_ORCHESTRATOR_COUNT: 8
      ADCP_COMPLIANCE_DIR: dist/compliance/latest
      ADCP_SCHEMA_ROOT: dist/schemas/latest
      ADCP_STORYBOARD_CANDIDATE_VERSION_MODE: ${{ github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main' && '1' || '0' }}
      # SDK beta.11 keeps each storyboard inside the 4 GiB RSS envelope, but
      # the heaviest lifecycle flows can approach two minutes on a loaded
      # runner. Preserve the hard memory bound and allow teardown headroom.
      STORYBOARD_RSS_LIMIT_MB: 4096
      STORYBOARD_TIMEOUT_MS: 180000
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build current compliance and schema bundles
        run: |
          node scripts/build-schemas.cjs
          node scripts/build-compliance.cjs

      - name: Run isolated /sales storyboards
        env:
          TENANT_PATH: sales
          PUBLIC_TEST_AGENT_TOKEN: storyboard-ci-token
        run: |
          set -euo pipefail
          log="/tmp/storyboards-sales-${{ matrix.orchestrator }}.log"
          node scripts/run-storyboards-isolated.mjs \
            --shard-index "${{ matrix.orchestrator }}" \
            --shard-count "${SALES_ORCHESTRATOR_COUNT}" \
            --telemetry-file "/tmp/storyboards-sales-${{ matrix.orchestrator }}.telemetry.jsonl" \
            --results-file "/tmp/storyboards-sales-${{ matrix.orchestrator }}.results.jsonl" \
            2>&1 | tee "${log}"
          if ! grep -Eq '^[[:space:]]*storyboards: [0-9]+/[0-9]+ clean$' "${log}" ||
             ! grep -Eq '^[[:space:]]*selection: [0-9]+ applicable \| [0-9]+ not applicable \| [0-9]+ quarantined \| [0-9]+ corpus$' "${log}" ||
             ! grep -Eq '^[[:space:]]*steps: [0-9]+ passed \| [0-9]+ failed \| [0-9]+ skipped \| [0-9]+ not applicable$' "${log}"; then
            echo "::error::Storyboard orchestrator ${{ matrix.orchestrator }}/${SALES_ORCHESTRATOR_COUNT} did not emit a complete totals block"
            exit 1
          fi

      - name: Upload /sales orchestrator artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storyboards-current-sales-orchestrator-${{ matrix.orchestrator }}
          path: |
            /tmp/storyboards-sales-${{ matrix.orchestrator }}.log
            /tmp/storyboards-sales-${{ matrix.orchestrator }}.telemetry.jsonl
            /tmp/storyboards-sales-${{ matrix.orchestrator }}.results.jsonl
          retention-days: 14
          if-no-files-found: error

  sales_storyboards:
    name: Storyboards (current /sales)
    if: always()
    needs: sales_storyboard_orchestrators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download /sales orchestrator artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: storyboards-current-sales-orchestrator-*
          path: /tmp/storyboards-sales-orchestrators
          merge-multiple: true

      - name: Aggregate /sales storyboard results
        id: aggregate
        env:
          ORCHESTRATOR_RESULT: ${{ needs.sales_storyboard_orchestrators.result }}
          SALES_ORCHESTRATOR_COUNT: 8
        run: |
          set -euo pipefail
          if [ "${ORCHESTRATOR_RESULT}" != "success" ]; then
            echo "::error::At least one /sales storyboard orchestrator failed: ${ORCHESTRATOR_RESULT}"
            exit 1
          fi

          shopt -s nullglob
          logs=(/tmp/storyboards-sales-orchestrators/storyboards-sales-*.log)
          if [ "${#logs[@]}" -ne "${SALES_ORCHESTRATOR_COUNT}" ]; then
            echo "::error::Expected ${SALES_ORCHESTRATOR_COUNT} /sales orchestrator logs, found ${#logs[@]}"
            exit 1
          fi

          : > /tmp/storyboards.log
          clean_sum=0
          total_sum=0
          passed_sum=0
          failed_sum=0
          skipped_sum=0
          not_applicable_sum=0
          selection_expected=""
          for log in "${logs[@]}"; do
            cat "${log}" >> /tmp/storyboards.log
            echo >> /tmp/storyboards.log
            storyboard_totals=$(sed -nE 's/^[[:space:]]*storyboards: ([0-9]+)\/([0-9]+) clean$/\1 \2/p' "${log}" | tail -1)
            selection_totals=$(sed -nE 's/^[[:space:]]*selection: ([0-9]+) applicable \| ([0-9]+) not applicable \| ([0-9]+) quarantined \| ([0-9]+) corpus$/\1 \2 \3 \4/p' "${log}" | tail -1)
            step_totals=$(sed -nE 's/^[[:space:]]*steps: ([0-9]+) passed \| ([0-9]+) failed \| ([0-9]+) skipped \| ([0-9]+) not applicable$/\1 \2 \3 \4/p' "${log}" | tail -1)
            if [ -z "${storyboard_totals}" ] || [ -z "${selection_totals}" ] || [ -z "${step_totals}" ]; then
              echo "::error::Incomplete totals in ${log}"
              exit 1
            fi
            if [ -z "${selection_expected}" ]; then
              selection_expected="${selection_totals}"
            elif [ "${selection_totals}" != "${selection_expected}" ]; then
              echo "::error::Inconsistent capability selection in ${log}"
              exit 1
            fi
            read -r shard_clean shard_total <<< "${storyboard_totals}"
            read -r shard_passed shard_failed shard_skipped shard_not_applicable <<< "${step_totals}"
            clean_sum=$((clean_sum + shard_clean))
            total_sum=$((total_sum + shard_total))
            passed_sum=$((passed_sum + shard_passed))
            failed_sum=$((failed_sum + shard_failed))
            skipped_sum=$((skipped_sum + shard_skipped))
            not_applicable_sum=$((not_applicable_sum + shard_not_applicable))
          done
          read -r applicable scope_not_applicable quarantined corpus <<< "${selection_expected}"

          {
            echo "--- Aggregate totals ---"
            echo "  storyboards: ${clean_sum}/${total_sum} clean"
            echo "  selection: ${applicable} applicable | ${scope_not_applicable} not applicable | ${quarantined} quarantined | ${corpus} corpus"
            echo "  steps: ${passed_sum} passed | ${failed_sum} failed | ${skipped_sum} skipped | ${not_applicable_sum} not applicable"
          } | tee -a /tmp/storyboards.log
          {
            echo "clean=${clean_sum}"
            echo "total=${total_sum}"
            echo "applicable=${applicable}"
            echo "scope_not_applicable=${scope_not_applicable}"
            echo "quarantined=${quarantined}"
            echo "corpus=${corpus}"
            echo "passed=${passed_sum}"
            echo "failed=${failed_sum}"
            echo "skipped=${skipped_sum}"
            echo "not_applicable=${not_applicable_sum}"
          } >> "$GITHUB_OUTPUT"

          {
            echo '### Training agent · current /sales'
            echo
            echo '| Clean result rows | Result rows | Applicable storyboards | Out of scope | Quarantined | Passed steps | Failed steps | Skipped steps | N/A steps |'
            echo '|---:|---:|---:|---:|---:|---:|---:|---:|---:|'
            echo "| ${clean_sum} | ${total_sum} | ${applicable} | ${scope_not_applicable} | ${quarantined} | ${passed_sum} | ${failed_sum} | ${skipped_sum} | ${not_applicable_sum} |"
            echo
            echo '> Capability-resolved regression evidence; quarantines and runner coverage skips remain visible and prevent this from being a badge verdict.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate /sales log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storyboards-log-current-sales
          path: /tmp/storyboards.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Enforce /sales non-regression
        env:
          CLEAN: ${{ steps.aggregate.outputs.clean }}
          PASSED: ${{ steps.aggregate.outputs.passed }}
          # Beta.12 capability-resolved replay. Result-row totals include the
          # three signed-request route profiles; storyboard applicability is
          # reported separately in the aggregate summary.
          MIN_CLEAN: 133
          MIN_PASSED: 632
        run: |
          set -euo pipefail
          echo "Clean storyboards: ${CLEAN} (floor: ${MIN_CLEAN})"
          echo "Passing steps: ${PASSED} (floor: ${MIN_PASSED})"
          if [ "${CLEAN}" -lt "${MIN_CLEAN}" ]; then
            echo "::error::Regression: ${CLEAN} clean storyboards is below the ${MIN_CLEAN} floor (tenant: /sales)."
            exit 1
          fi
          if [ "${PASSED}" -lt "${MIN_PASSED}" ]; then
            echo "::error::Regression: ${PASSED} passing steps is below the ${MIN_PASSED} floor (tenant: /sales)."
            exit 1
          fi

      - name: Enforce /sales required-clean storyboards
        run: |
          set -euo pipefail
          required_clean=(
            "sales_non_guaranteed"
            "sales_guaranteed"
            "media_buy_seller/billing_finality_delivery"
            "media_buy_seller/canonical_formats"
            "media_buy_seller/external_audience_source_binding"
            "media_buy_seller/vendor_metric_catalog_precondition"
            "canonical_format_validate_input"
            "notification_config_event_scope"
            "notification_config_lifecycle"
            "notification_config_rejections"
            "wholesale_feed_products"
            "wholesale_feed_products_scope_isolation"
            "wholesale_feed_product_webhooks"
            "wholesale_feed_bulk_webhooks"
          )
          for storyboard_id in "${required_clean[@]}"; do
            if grep -E "^[[:space:]]+${storyboard_id}[[:space:]]+✓" /tmp/storyboards.log >/dev/null; then
              echo "Required-clean storyboard passed: ${storyboard_id}"
            else
              echo "::error::Required-clean storyboard did not pass on /sales current surface: ${storyboard_id}"
              grep -F "${storyboard_id}" /tmp/storyboards.log || true
              exit 1
            fi
          done

          required_exact=(
            "media_buy_seller/compact_direct_buy_lifecycle:7:0"
            "media_buy_seller/compact_product_lifecycle:9:0"
            "media_buy_seller/declined_proposal_refinement:6:0"
            "media_buy_seller/declined_proposal_execution:8:0"
            "media_buy_seller/expired_proposal_execution:8:0"
            "media_buy_seller/change_rights_state_projection:8:0"
            "media_buy_seller/acceptance_policy_discovery:3:0"
            "media_buy_seller/governance_agent_binding_acceptance:5:0"
            "media_buy_seller/external_audience_source_binding:8:0"
            "media_buy_seller/get_products_async:10:0"
          )
          for requirement in "${required_exact[@]}"; do
            storyboard_id="${requirement%%:*}"
            counts="${requirement#*:}"
            expected_passed="${counts%%:*}"
            expected_skipped="${counts##*:}"
            if grep -E "^[[:space:]]+${storyboard_id}[[:space:]]+✓[[:space:]]+${expected_passed}P / ${expected_skipped}S" /tmp/storyboards.log >/dev/null; then
              echo "Required-exact storyboard passed: ${storyboard_id} (${expected_passed}P / ${expected_skipped}S)"
            else
              echo "::error::Required-exact storyboard counts changed on /sales current surface: ${storyboard_id}"
              grep -F "${storyboard_id}" /tmp/storyboards.log || true
              exit 1
            fi
          done
