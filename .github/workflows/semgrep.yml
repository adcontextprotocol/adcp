name: Semgrep Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel a PR's superseded scan when a newer commit is pushed. Push runs each
# get their own group (run_id), so main-branch scans are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Semgrep
        run: pip install semgrep==1.67.0

      - name: Run Semgrep
        run: semgrep scan --config .semgrep/ --error
