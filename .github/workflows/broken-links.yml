name: Check for Broken Links

on:
  push:
    branches: [ main, develop, '2.6.x' ]
    paths:
      - 'docs/**'
      - 'dist/docs/**'
      - 'mintlify-docs/**'
      - 'docs.json'
      - 'mint.json'
      - 'README.md'
      - 'server/src/addie/rules/**'
      - 'scripts/check-owned-links.js'
      - '.markdown-link-check.json'
      - '.github/workflows/broken-links.yml'
  pull_request:
    branches: [ main, develop, '2.6.x' ]
    paths:
      - 'docs/**'
      - 'dist/docs/**'
      - 'mintlify-docs/**'
      - 'docs.json'
      - 'mint.json'
      - 'README.md'
      - 'server/src/addie/rules/**'
      - 'scripts/check-owned-links.js'
      - '.markdown-link-check.json'
      - '.github/workflows/broken-links.yml'
  workflow_run:
    workflows: ["Sync Versioned Docs"]
    types:
      - completed

jobs:
  broken-links:
    runs-on: ubuntu-latest
    # Skip if triggered by sync workflow that failed
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.0
      with:
        # Ensure we get latest changes including synced docs
        ref: ${{ github.event.workflow_run.head_branch || github.ref }}
        # Pull-request owned-link checks compare only URLs in changed files.
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true'

    - name: Schema link convention (autofix with `npm run fix:schema-links`)
      run: npm run lint:schema-links

    - name: Mintlify broken links (fix any links printed below)
      run: npx --no-install mintlify broken-links

    - name: Check browser-facing Agentic Advertising links
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          npm run check:owned-links -- --changed-since "origin/${{ github.base_ref }}"
        else
          npm run check:owned-links
        fi
      timeout-minutes: 10

    - name: Check README links
      run: npx markdown-link-check README.md --config .markdown-link-check.json
