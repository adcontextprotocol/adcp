name: Optional product feature applicability evidence

on:
  pull_request:
    paths:
      - 'specs/optional-product-feature-applicability.md'
      - 'specs/optional-product-feature-applicability/**'
      - '.github/workflows/optional-product-feature-applicability.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  contract-probes:
    name: Product feature applicability contract probes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: node --test --test-timeout=30000 specs/optional-product-feature-applicability/probes.test.cjs specs/optional-product-feature-applicability/collection-prerequisite.test.cjs specs/optional-product-feature-applicability/context-write-boundaries.test.cjs specs/optional-product-feature-applicability/format-sort-authorability.test.cjs specs/optional-product-feature-applicability/time-accountability-authorability.test.cjs
