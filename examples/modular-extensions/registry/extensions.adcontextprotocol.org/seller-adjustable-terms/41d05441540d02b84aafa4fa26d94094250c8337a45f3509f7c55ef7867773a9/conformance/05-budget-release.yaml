id: seller_adjustable_terms/budget_release
version: "1.0.0"
title: "A budget release never covers the seller's own shortfall"
category: extension_conformance
extension: seller-adjustable-terms
summary: "Video 2 cannot be made. The seller remedies it with a make-good unit, not a budget release. The buyer SDK cannot see who caused a shortfall, so this storyboard tests the rule."
narrative: |
  SAT-R17 is a conformance-only rule: a budget release that covers a shortfall the seller
  caused is schema-valid and inside its allowance, so check() accepts it. The storyboard
  runs the real seller through a missed deliverable and asserts that it remedies the
  shortfall with a make-good unit. It then shows a non-conformant readback that the buyer
  SDK accepts and the conformance check flags.

fixture: creator_network
buyer:
  extensions: [seller-adjustable-terms, makegood-units]

phases:
  - id: buy
    title: "Buy the two videos"
    steps:
      - { id: request_proposals, title: "Request a draft proposal", task: request_proposals, expect: { ok: true } }
      - { id: finalize, title: "Finalize", task: refine_proposals, expect: { ok: true } }
      - { id: accept, title: "Accept", task: accept_proposal, expect: { ok: true } }

  - id: shortfall
    title: "The seller misses a deliverable"
    steps:
      - id: deliverable_missed
        title: "Video 2 cannot be made"
        task: seller_op
        with: { op: deliverableMissed, args: [{ $from: media_buy_id }, 1] }
        expect: { ok: true }
      - { id: read_back, title: "Read the media buy back", task: get_media_buys, expect: { ok: true, violations: 0 } }
      - id: remedied_with_makegood
        title: "The seller remedies the shortfall with a make-good unit, not a budget release"
        task: assert
        covers: [SAT-R17]
        expect:
          checks:
            - path: media_buy.extensions_state.@makegood-units.data.issued
              some: { reason: deliverable_missed }
            - path: media_buy.extensions_state.@seller-adjustable-terms.data.applied
              none: { path: { in: [/budget, /impressions] }, reason: { in: [deliverable_missed, under_delivery] } }
            - path: media_buy.packages.1.budget
              equals: 12000

  - id: nonconformant_seller
    title: "A seller that releases budget for its own miss"
    steps:
      - id: sdk_accepts_release
        title: "The buyer SDK accepts the release; the conformance check flags it"
        task: validate
        with:
          schema: media_buys
          subject: media_buys_response
          mutate:
            - op: append
              path: /media_buys/0/accepted_proposal/commercial_terms/extensions/@seller-adjustable-terms/data/allowances
              value: { allowance_id: zz_release_v2, purchase_index: 1, path: /budget, constraint: { kind: decrease, max_change_fraction: 1 } }
            - op: append
              path: /media_buys/0/extensions_state
              value:
                uri: { $uri: seller-adjustable-terms }
                digest: { $digest: seller-adjustable-terms }
                data:
                  applied:
                    - { adjustment_id: adj_release, allowance_id: zz_release_v2, revision: 2, applied_at: "2027-03-01T09:00:00Z", reason: deliverable_missed, purchase_index: 1, path: /budget, previous_value: 12000, value: 0 }
        covers: [SAT-R17]
        expect:
          ok: true
          violations: 0
          status: { ext: seller-adjustable-terms, point: media_buy_state, status: understood }
          nonconformant:
            - path: subject.media_buys.0.extensions_state.@seller-adjustable-terms.data.applied
              none: { path: { in: [/budget, /impressions] }, reason: { in: [deliverable_missed, under_delivery] } }
