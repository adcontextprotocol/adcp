version: 2

# GitGuardian configuration for AdCP repository
# This file configures what GitGuardian should scan and what to ignore

# Paths to ignore - scripts with CLI argument documentation
paths-ignore:
  - scripts/migrate-csv-via-api.ts
  # Generated public compact-JWS conformance fixtures. The generator and
  # byte-exact test prove their provenance; none is a production credential.
  - static/compliance/source/test-vectors/governance-authorization.json

# Ignore test tokens that are documented and meant to be public
matches-ignore:
  - name: Test Agent Authentication Token
    match: 1v8tAhASaUYYp4odoQ1PnMpdqNaMiTrCRqYo9OJp6IQ
    comment: |
      This is a documented test token for the public test agent at
      https://test-agent.adcontextprotocol.org/mcp. It's intentionally
      included in documentation examples and has no production access.
  - name: Documentation API Key Placeholder
    match: aao_xxx
    comment: |
      This is a placeholder API key used in documentation examples.
      It's not a real credential.
  - name: Webhook HMAC-SHA256 Test Vector Secret
    match: cc237f7fe354609bb41360c6530a2deb7926f3cc55e91df3ff90e37202950b6c
    comment: |
      High-entropy test secret for the HMAC-SHA256 webhook test vectors
      at static/test-vectors/webhook-hmac-sha256.json. Derived
      deterministically from a documented preimage (SHA-256 of
      "adcp-webhook-hmac-test-vector-v1-DO-NOT-USE-IN-PRODUCTION") so
      cross-language test runs are reproducible. The file carries an
      explicit WARNING field and secret_provenance field documenting
      non-production status; negative vectors verify the WARNING remains
      present and that weak-secret configurations are rejected.
  - name: Governance Ed25519 Conformance Test Key
    match: bag_KLehHhOb-giX2u8kEfm9Djo6Fldl6_dFoRiC_eE
    comment: |
      Public test-only Ed25519 private component for deterministic governance
      compact-JWS conformance vectors. The same key already ships as
      test-gov-2026 in the request-signing fixture to prove cross-purpose
      rejection. It has no production authority; the governance fixture and
      catalog explicitly forbid installing it as a production trust anchor.
