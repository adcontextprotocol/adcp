title: State anyOf in account-ref, as canonical-account-ref does (#8906)
changes:
  - location: core/account-ref.json#
    keyword: anyOf
    new:
      - required:
          - account_id
        not:
          anyOf:
            - required:
                - brand
            - required:
                - currency
            - required:
                - operator
            - required:
                - operator_unit
            - required:
                - sandbox
            - required:
                - timezone
        properties:
          account_id:
            type:
              - string
      - required:
          - brand
          - operator
        not:
          required:
            - account_id
        properties:
          brand:
            required:
              - domain
            type:
              - object
            properties:
              brand_id:
                pattern: ^[a-z0-9_]+$
                type:
                  - string
              brand_kit_override:
                type:
                  - object
                properties:
                  colors:
                    $at: core/brand-ref.json#/properties/brand_kit_override/properties/colors
                  logo:
                    $at: core/assets/image-asset.json#
                  tagline:
                    $at: core/brand-ref.json#/properties/brand_kit_override/properties/tagline
                  voice:
                    $at: core/brand-ref.json#/properties/brand_kit_override/properties/voice
              countries:
                minItems: 1
                type:
                  - array
                uniqueItems: true
                items:
                  $at: core/brand-ref.json#/properties/countries/items
              data_subject_contestation:
                type:
                  - object
                anyOf:
                  - $at: core/brand-ref.json#/properties/data_subject_contestation/anyOf/0
                  - $at: core/brand-ref.json#/properties/data_subject_contestation/anyOf/1
                properties:
                  email:
                    $at: core/brand-ref.json#/properties/data_subject_contestation/properties/email
                  languages:
                    $at: core/brand-ref.json#/properties/data_subject_contestation/properties/languages
                  url:
                    $at: core/brand-ref.json#/properties/data_subject_contestation/properties/url
              domain:
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$
                type:
                  - string
              industries:
                type:
                  - array
                items:
                  $at: core/brand-ref.json#/properties/industries/items
          currency:
            pattern: ^[A-Z]{3}$
            type:
              - string
          operator:
            pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$
            type:
              - string
          operator_unit:
            required:
              - id
            type:
              - object
            properties:
              id:
                maxLength: 255
                minLength: 1
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]*$
                type:
                  - string
              name:
                maxLength: 200
                minLength: 1
                type:
                  - string
          sandbox:
            type:
              - boolean
          timezone:
            minLength: 1
            type:
              - string
    direction: none
    side: both
    note: >-
      anyOf replaces oneOf over the two account reference forms. The branches exclude each other (the account_id form forbids brand and the other natural-key fields; the natural-key form forbids account_id), so no payload satisfies both. Independent containment oracle on the bundled root, both directions: unsat (equivalent).
