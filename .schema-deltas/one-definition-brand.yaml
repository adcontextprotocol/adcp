# Delta manifest (format: scripts/schema-equivalence/README.md, "Delta manifest").
title: >-
  One definition per object: brand. The corrections the review chose; every other change is a $ref to an identical
  definition.
changes:
  - location: core/email-address.json#
    keyword: maxLength
    old: 255
    new: 254
    direction: tighten
    side: none
    note: >-
      adagents.json#/oneOf/1/properties/contact -> new:core/contact.json. Verdict delta:
      email:maxLength:tighten:correction. The tool's witness search found none (no tighten witness attributed to this
      line in 2 root(s)).
  - location: core/email-address.json#
    keyword: minLength
    old: 1
    direction: none
    side: none
    note: >-
      adagents.json#/oneOf/1/properties/contact -> new:core/contact.json. Masked by the format:
      core/email-address.json states format email, which rejects the empty string, so removing minLength 1 changes no
      payload's verdict (checked with Ajv and ajv-formats: "" is invalid with and without the bound).
  - location: core/voice-synthesis.json#
    keyword: properties
    new:
      type:
        - string
    direction: tighten
    side: none
    note: >-
      brand.json#/definitions/brand/properties/voice_synthesis -> new:core/voice-synthesis.json. Verdict delta:
      rights_offering_id:property:tighten:correction. The tool's witness search found none (no tighten witness
      attributed to this line in 1 root(s)).
  - location: core/contact.json#
    keyword: properties
    new:
      format: uri
      type:
        - string
    direction: tighten
    side: none
    note: >-
      brand.json#/definitions/contact -> new:core/contact.json. Verdict delta: seller_id:property:tighten:correction;
      tag_id:property:tighten:correction; privacy_policy_url:property:tighten:correction. Witness: brand.json
      /contact/privacy_policy_url = null (tighten).
  - location: core/contact.json#
    keyword: properties
    new:
      maxLength: 255
      minLength: 1
      type:
        - string
    direction: tighten
    side: none
    note: >-
      brand.json#/definitions/contact -> new:core/contact.json. Verdict delta: seller_id:property:tighten:correction;
      tag_id:property:tighten:correction; privacy_policy_url:property:tighten:correction. Witness: brand.json
      /contact/seller_id = null (tighten).
  - location: core/contact.json#
    keyword: properties
    new:
      maxLength: 100
      minLength: 1
      type:
        - string
    direction: tighten
    side: none
    note: >-
      brand.json#/definitions/contact -> new:core/contact.json. Verdict delta: seller_id:property:tighten:correction;
      tag_id:property:tighten:correction; privacy_policy_url:property:tighten:correction. Witness: brand.json
      /contact/tag_id = null (tighten).
  - location: core/rights-disclosure.json#/allOf/0
    keyword: if
    new:
      required:
        - required
      properties:
        required:
          const: true
    direction: tighten
    side: response
    note: >-
      brand/acquire-rights-response.json#/oneOf/0/properties/disclosure -> new:core/rights-disclosure.json. The tool's
      witness search found none (no tighten witness attributed to this line in 1 root(s)).
  - location: core/rights-disclosure.json#/properties/text
    keyword: minLength
    new: 1
    direction: tighten
    side: response
    note: >-
      brand/acquire-rights-response.json#/oneOf/0/properties/disclosure -> new:core/rights-disclosure.json. Verdict
      delta: text:minLength:tighten:correction. The tool's witness search found none (no tighten witness attributed to
      this line in 1 root(s)).
  - location: core/rights-disclosure.json#/allOf/0
    keyword: then
    new:
      required:
        - text
    direction: tighten
    side: response
    note: >-
      brand/acquire-rights-response.json#/oneOf/0/properties/disclosure -> new:core/rights-disclosure.json. The tool's
      witness search found none (no tighten witness attributed to this line in 1 root(s)).
  - location: core/brand-localized-scalar.json#
    keyword: type
    old:
      - string
    direction: loosen
    side: response
    note: >-
      brand/get-brand-identity-response.json#/oneOf/0/properties/assets/items -> core/brand-asset.json#. Verdict
      delta: name:type:loosen:correction; description:type:loosen:correction. Witness, checked by hand: a
      get_brand_identity asset
      {"asset_id":"a1","asset_type":"image","url":"https://cdn.example.com/a.png","name":[{"en":"Acme"}]} is invalid
      at the base (name must be a string) and valid at the head (the localized-array branch of the oneOf), and
      restoring type string alone makes it invalid again.
  - location: core/brand-localized-scalar.json#
    keyword: oneOf
    new:
      - type:
          - string
      - minItems: 1
        type:
          - array
        items:
          maxProperties: 1
          minProperties: 1
          type:
            - object
          additionalProperties:
            minLength: 1
            type:
              - string
    direction: none
    side: response
    note: >-
      brand/get-brand-identity-response.json#/oneOf/0/properties/assets/items -> core/brand-asset.json#. Masked by the
      type line: the string branch is the removed type string, and the array branch admits only what the type removal
      (the line above) admits. Every payload the base accepts is a string, which the head accepts; checked by hand
      with "Acme", [{"en":"Acme"}], [], 5, and a two-key map.
  - location: core/brand-asset.json#
    keyword: properties
    new:
      type:
        - object
    direction: tighten
    side: response
    note: >-
      brand/get-brand-identity-response.json#/oneOf/0/properties/assets/items -> core/brand-asset.json#. Verdict
      delta: metadata:property:tighten:correction. Witness: brand/get-brand-identity-response.json /assets/0/metadata =
      null (tighten).
  - location: core/domain-name.json#
