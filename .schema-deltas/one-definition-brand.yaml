      brand/get-brand-identity-response.json /house/domain =
      "aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.aaa.... (tighten).
  - location: core/domain-name.json#
    keyword: pattern
    new: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$
    direction: tighten
    side: response
