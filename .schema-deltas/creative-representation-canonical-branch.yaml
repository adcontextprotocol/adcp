    direction: none
    side: both
    note: >-
      creative-manifest's fields and rules moved into definitions/creative-manifest-base, referenced from the root next to the unchanged oneOf: the same keywords, now split across two allOf members. Each dependent keyword group (properties with additionalProperties, if with then and else) stays in one member. Independent containment oracle on the base and head documents with each reference to another file replaced by the same opaque constraint on both sides: unsat in both directions (a control that drops required assets from the head is sat). The full bundled root times out.
