# Delta manifest (format: scripts/schema-equivalence/README.md, "Delta manifest").
title: >-
  One definition per object: content standards alignment. The content standards scope and the content standards feature check
  result each have one definition, the creative evaluator's exemplars compose the calibration exemplars, and the artifact
  transcript source has one vocabulary; the corrections below follow published 3.2.12 text, and every other change is a $ref
  to an identical definition.
changes:
- location: content-standards/artifact.json#/$defs/transcript_source
  keyword: enum
  old:
  - closed_captions
  - generated
  - original_script
  new:
  - closed_captions
  - dub
  - generated
  - original_script
  - subtitles
  direction: loosen
  side: both
  note: >-
    content-standards/artifact.json video and audio asset branches, transcript_source -> #/$defs/transcript_source, one vocabulary
    for how a transcript was generated. The audio branch had 3 of the video branch's 5 values and now takes all 5. Loosening.
    Witness: content-standards/artifact.json /assets/0/transcript_source = "dub" on an audio asset (loosen).
- location: core/package-id.json#
  keyword: minLength
  new: 1
  direction: tighten
  side: response
  note: >-
    content-standards/artifact-webhook-payload.json#/properties/artifacts/items/properties/package_id and content-standards/get-media-buy-artifacts-response.json#/oneOf/0/properties/artifacts/items/properties/package_id
    -> core/package-id.json. Correction under DR-0036: 3.2.12 defines the package ID with minLength 1 in media-buy/package-control.json
    ("package_id": { "type": "string", "minLength": 1, "x-entity": "package" }, https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/media-buy/package-control.json#L8-L12).
    Both fields name the package within the media buy. Register entries for both sites. Witness: content-standards/artifact-webhook-payload.json
    /artifacts/0/package_id = "" (tighten).
- location: >-
    content-standards/artifact-webhook-payload.json#/properties/pagination/properties/batch_number
  keyword: minimum
  new: 1
  direction: tighten
  side: none
  note: >-
    content-standards/artifact-webhook-payload.json#/properties/pagination/properties/batch_number gets minimum 1. Correction
    under DR-0036: 3.2.12 numbers the batches from 1 ("description": "Current batch number (1-indexed)", https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/content-standards/artifact-webhook-payload.json#L68).
    Register entry. Witness: content-standards/artifact-webhook-payload.json /pagination/batch_number = 0 (tighten).
- location: core/country-code.json#
  keyword: pattern
  new: ^[A-Z]{2}$
  direction: tighten
  side: both
  note: >-
    content-standards/content-standards.json#/properties/countries_all/items, the create request's scope (now core/content-standards-scope.json)
    and the update request's scope countries_all items -> core/country-code.json. Correction under DR-0036 through a named
    external standard: 3.2.12 describes each field as "ISO 3166-1 alpha-2 country codes. Standards apply in ALL listed countries
    (AND logic)." (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/content-standards/content-standards.json#L22,
    https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/content-standards/create-content-standards-request.json#L24,
    https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/content-standards/update-content-standards-request.json#L28),
    and ISO 3166-1 alpha-2 codes are two upper-case letters, ^[A-Z]{2}$. The lint does not see pattern, so no register entry.
    Witness: content-standards/content-standards.json /countries_all/0 = "a" (tighten).
- location: core/locale-tag.json#
  keyword: maxLength
  new: 63
  direction: tighten
  side: both
  note: >-
    content-standards/content-standards.json#/properties/languages_any/items, the create request's scope (now core/content-standards-scope.json)
    and the update request's scope languages_any items -> core/locale-tag.json. Correction under DR-0036: 3.2.12 describes
    each field as "BCP 47 language tags (e.g., 'en', 'de', 'fr')" (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/content-standards/content-standards.json#L38),
    and 3.2.12 publishes core/locale-tag.json, "A well-formed BCP 47 language tag", with "maxLength": 63 (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/core/locale-tag.json#L17-L19).
    Register entries for the three sites. Witness: content-standards/content-standards.json /languages_any/0 = "aa-Aaaa-AA-aaaaa-..."
    (64 characters) (tighten).
- location: core/locale-tag.json#
  keyword: minLength
  new: 2
  direction: none
  side: both
  note: >-
    Same sites -> core/locale-tag.json, which 3.2.12 publishes with "minLength": 2 (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/core/locale-tag.json#L17-L19);
    register entries for the three sites. Masked by the pattern: every string core/locale-tag.json's pattern accepts has at
    least 2 characters, so minLength 2 changes no payload's verdict.
- location: core/locale-tag.json#
  keyword: pattern
  new: >-
    ^(?:[a-z]{2,8}(?:-[A-Z][a-z]{3})?(?:-(?:[A-Z]{2}|[0-9]{3}))?(?:-(?:[a-z0-9]{5,8}|[0-9][a-z0-9]{3}))*(?:-[0-9a-wy-z](?:-[a-z0-9]{2,8})+)*(?:-x(?:-[a-z0-9]{1,8})+)?|x(?:-[a-z0-9]{1,8})+)$
  direction: tighten
  side: both
  note: >-
    Same sites -> core/locale-tag.json. Correction under DR-0036: the fields are BCP 47 language tags in 3.2.12 (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/content-standards/content-standards.json#L38),
    and 3.2.12 publishes core/locale-tag.json with this pattern (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/core/locale-tag.json#L19).
    The lint does not see pattern. Witness: content-standards/content-standards.json /languages_any/0 = "-a" (tighten).
