  direction: loosen
  side: request
  note: >-
    The fail items union moves into core/calibration-exemplar.json, which the items reference: the same oneOf of a URL reference
    and an artifact, so no payload changes verdict. core/evaluator-spec.json's exemplars compose core/calibration-exemplars.json
    and keep their own artifact items, which mask the URL branch for them. The tool reads the moved union as a loosening at
    the evaluator's composed items, where its own artifact items still apply. Checked by hand with Ajv: a URL-reference exemplar
    in pass or fail is invalid for core/evaluator-spec.json#/oneOf/0/properties/exemplars at the base and at the head, and
    valid for core/calibration-exemplars.json at both, so no payload changes verdict.
