            $at: core/canonical-format-kind.json#
          identifiers:
            $at: content-standards/artifact.json#/properties/identifiers
          last_update_time:
            $at: content-standards/artifact.json#/properties/last_update_time
          metadata:
            $at: content-standards/artifact.json#/properties/metadata
          property_rid:
            $at: content-standards/artifact.json#/properties/property_rid
          provenance:
            $at: core/provenance.json#
          published_time:
            $at: content-standards/artifact.json#/properties/published_time
          url:
            $at: content-standards/artifact.json#/properties/url
          variant_id:
            $at: content-standards/artifact.json#/properties/variant_id
  direction: none
  side: request
  note: >-
    core/evaluator-spec.json#/oneOf/0/properties/exemplars now composes core/calibration-exemplars.json (allOf), whose pass
    and fail items are core/calibration-exemplar.json, and keeps its own pass and fail items, {$ref: content-standards/artifact.json}.
    Masked by those items: an artifact fails the composed URL branch, whose not excludes every artifact, and passes the artifact
    branch, so the conjunction accepts exactly the artifacts the base accepts. This line changes no payload's verdict.
