# Delta manifest (format: scripts/schema-equivalence/README.md, "Delta manifest").
title: >-
  One definition per object: pricing option alignment. The pricing option branches stay parallel members of the
  core/pricing-option.json union, and their shared fields reference one definition each; the corrections below
  follow published 3.2.12 text, and every other change is a $ref to an identical definition.
changes:
  - location: core/pricing-option-id.json#
    keyword: minLength
    new: 1
    direction: tighten
    side: both
    note: >-
      pricing_option_id in the cpm, vcpm, cpc, cpcv, cpv, cpp, cpa, flat_rate, and time branches
      (pricing-options/*-option.json, was type string) -> core/pricing-option-id.json, as the revenue_share branch and
      core/canonical-pricing-option.json already reference. Correction under DR-0036: 3.2.12 publishes the same product
      pricing option ID, with the same description, with minLength 1 in the revenue_share branch ("pricing_option_id": {
      "type": "string", "minLength": 1, "description": "Unique identifier for this pricing option within the product" },
      https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/pricing-options/revenue-share-option.json#L8-L11)
      and in the compact projection core/canonical-pricing-option.json. Register entries for the nine branch sites.
  - location: core/custom-event-name.json#
    keyword: minLength
    new: 1
    direction: tighten
    side: both
    note: >-
      pricing-options/cpa-option.json#/properties/custom_event_name (was type string) -> core/custom-event-name.json, as
      the revenue_share branch already references. Correction under DR-0036: 3.2.12 publishes the custom event name of a
      conversion-billed pricing option with minLength 1 in the revenue_share branch ("custom_event_name": { "type":
      "string", "minLength": 1, "description": "Name of the custom event when event_type is custom. Required for custom
      events and absent otherwise." },
      https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/pricing-options/revenue-share-option.json#L26-L29)
      and in core/canonical-pricing-option.json, which covers cpa options. Register entry
      pricing-options/cpa-option.json /properties/custom_event_name.
  - location: core/event-source-id.json#
    keyword: minLength
    new: 1
    direction: tighten
    side: both
    note: >-
      pricing-options/cpa-option.json#/properties/event_source_id (was type string) -> core/event-source-id.json, as the
      revenue_share branch already references. Correction under DR-0036: 3.2.12 publishes the billing event source of a
      conversion-billed pricing option with minLength 1 in the revenue_share branch ("event_source_id": { "type":
      "string", "minLength": 1, "description": "Event source whose attribution is authoritative for billing. Must match
      an event source configured through sync_event_sources." },
      https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/pricing-options/revenue-share-option.json#L31-L34)
      and in core/canonical-pricing-option.json. Register entry pricing-options/cpa-option.json
      /properties/event_source_id.
  - location: pricing-options/cpm-option.json#/allOf/0
    keyword: not
    new:
      required:
        - fixed_price
        - floor_price
    direction: tighten
    side: both
    note: >-
      pricing-options/cpm-option.json: an option that carries both fixed_price and floor_price is rejected. Correction
      under DR-0036: the 3.2.12 floor_price of this branch reads "Minimum acceptable bid for auction pricing (mutually
      exclusive with fixed_price)."
      (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/pricing-options/cpm-option.json#L35),
      and the 3.2.12 compact projection of every pricing option states the same guard ("not": { "required": [
      "fixed_price", "floor_price" ] },
      https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/core/canonical-pricing-option.json#L91-L96).
      The lint does not read not; the quote is here.
