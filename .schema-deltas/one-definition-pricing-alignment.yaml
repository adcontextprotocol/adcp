  - location: pricing-options/cpa-option.json#/allOf/0
    keyword: if
    new:
      required:
        - event_type
      properties:
        event_type:
          const: custom
    direction: tighten
    side: both
    note: >-
      The condition of the cpa custom_event_name rule on the next line; the two keywords add one rule, so the same
      payload witnesses both (an option with event_type custom and no custom_event_name). Basis on the next line.
  - location: pricing-options/cpa-option.json#/allOf/0
    keyword: then
    new:
      required:
        - custom_event_name
    direction: tighten
    side: both
    note: >-
      pricing-options/cpa-option.json: a cpa option with event_type custom must carry custom_event_name. No else: the
      cpa text says the name is "ignored otherwise", so it stays allowed. Correction under DR-0036: the 3.2.12 cpa
      custom_event_name reads "Required when event_type is 'custom', ignored otherwise."
      (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/pricing-options/cpa-option.json#L25-L28),
      and the 3.2.12 compact projection states the rule for every pricing option ("if": { "properties": { "event_type":
      { "const": "custom" } }, "required": [ "event_type" ] }, "then": { "required": [ "custom_event_name" ] },
      https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/core/canonical-pricing-option.json#L157-L173).
      The lint does not read if/then; the quote is here.
  - location: core/canonical-pricing-option.json#/allOf/1/then
    keyword: properties
    new:
      fixed_price:
        exclusiveMinimum: 0
    direction: tighten
    side: both
    note: >-
      core/canonical-pricing-option.json: the compact form of a cpa option takes the cpa branch's fixed_price bound, so
      a cpa fixed_price of 0 is rejected. Correction under DR-0036: 3.2.12 defines the cpa fixed price with
      exclusiveMinimum 0 ("fixed_price": { "type": "number", "description": "Fixed price per acquisition in the
      specified currency", "exclusiveMinimum": 0 },
      https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/pricing-options/cpa-option.json#L44-L48).
      The lint does not read bounds inside then; the quote is here. Hand-checked with Ajv and ajv-formats (repo options)
      against core/canonical-pricing-option.json, the compact form that core/canonical-product.json,
      media-buy/product-purchase.json, and core/wholesale-feed-event.json reference: {pricing_option_id: po_1,
      pricing_model: cpa, currency: USD, event_type: purchase, fixed_price: 0} is valid at the base, invalid at the
      head, and valid again with the then properties removed. The tool's search finds no witness through the
      conditional.
    witness:
      root: /schemas/core/canonical-pricing-option.json
      instance:
        pricing_option_id: po_1
        pricing_model: cpa
        currency: USD
        event_type: purchase
        fixed_price: 0
  - location: core/canonical-pricing-option.json#/allOf/2/then/allOf/0
    keyword: if
    new:
      required:
        - event_type
      properties:
        event_type:
          const: custom
    direction: tighten
    side: both
    note: >-
      The condition of the revenue_share custom_event_name rule on the next line; the two keywords add one rule. Basis
      on the next line. Hand-checked with Ajv and ajv-formats (repo options) against core/canonical-pricing-option.json:
      the revenue_share object of the next line (event_type purchase, with custom_event_name) is valid at the base,
      invalid at the head, and valid again with the if removed, since an else without its if has no effect. The tool's
      search finds no witness through the nested conditional.
    witness:
      root: /schemas/core/canonical-pricing-option.json
      instance:
        pricing_option_id: po_1
        pricing_model: revenue_share
        currency: USD
        event_type: purchase
        event_source_id: es_1
        commission_rate: 0.04
        commission_basis_description: Settled order value net of returns.
        custom_event_name: loyalty_signup
  - location: core/canonical-pricing-option.json#/allOf/2/then/allOf/0
    keyword: else
    new:
      not:
        required:
          - custom_event_name
    direction: tighten
    side: both
    note: >-
      core/canonical-pricing-option.json: the compact form of a revenue_share option whose event_type is not custom must
      omit custom_event_name, as the revenue_share branch requires. Scoped to revenue_share; the cpa text keeps "ignored
      otherwise". Correction under DR-0036: the 3.2.12 revenue_share branch states "else": { "not": { "required": [
      "custom_event_name" ] } }
      (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/pricing-options/revenue-share-option.json#L69-L93)
      and describes the name as "Required for custom events and absent otherwise."
      (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/pricing-options/revenue-share-option.json#L29).
      The lint does not read if/else; the quote is here. Hand-checked with Ajv and ajv-formats (repo options) against
      core/canonical-pricing-option.json, the compact form that core/canonical-product.json,
      media-buy/product-purchase.json, and core/wholesale-feed-event.json reference: {pricing_option_id: po_1,
      pricing_model: revenue_share, currency: USD, event_type: purchase, event_source_id: es_1, commission_rate: 0.04,
      commission_basis_description: "Settled order value net of returns.", custom_event_name: loyalty_signup} is valid
      at the base, invalid at the head, and valid again with the else removed. The same object with pricing_model cpa,
      event_type purchase, fixed_price 5, and custom_event_name stays valid at the head. The tool's search finds no
      witness through the nested conditional.
    witness:
      root: /schemas/core/canonical-pricing-option.json
      instance:
        pricing_option_id: po_1
        pricing_model: revenue_share
        currency: USD
        event_type: purchase
        event_source_id: es_1
        commission_rate: 0.04
        commission_basis_description: Settled order value net of returns.
        custom_event_name: loyalty_signup
  - location: core/canonical-pricing-option.json#/allOf/2/then/allOf/1
    keyword: not
    new:
      anyOf:
        - required:
            - fixed_price
        - required:
            - floor_price
        - required:
            - price_guidance
    direction: tighten
    side: both
    note: >-
      core/canonical-pricing-option.json: the compact form of a revenue_share option rejects fixed_price, floor_price,
      and price_guidance, as the revenue_share branch does (max_bid is not a property of the compact form, whose
      additionalProperties false already rejects it). Correction under DR-0036: the 3.2.12 revenue_share branch states
      "not": { "anyOf": [ { "required": [ "fixed_price" ] }, { "required": [ "floor_price" ] }, { "required": [
      "price_guidance" ] }, { "required": [ "max_bid" ] } ] }
      (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/pricing-options/revenue-share-option.json#L94-L118).
      The lint does not read not; the quote is here. Hand-checked with Ajv and ajv-formats (repo options) against
      core/canonical-pricing-option.json, the compact form that core/canonical-product.json,
      media-buy/product-purchase.json, and core/wholesale-feed-event.json reference: the revenue_share object above
      without custom_event_name and with price_guidance {p50: 1} is valid at the base, invalid at the head, and valid
      again with the not removed. The tool's search finds no witness through the conditional.
    witness:
      root: /schemas/core/canonical-pricing-option.json
      instance:
        pricing_option_id: po_1
        pricing_model: revenue_share
        currency: USD
        event_type: purchase
        event_source_id: es_1
        commission_rate: 0.04
        commission_basis_description: Settled order value net of returns.
        price_guidance:
