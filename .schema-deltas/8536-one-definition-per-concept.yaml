    direction: tighten
    side: both
    note: '(a) commits 12 and 17: 10 plain-string timezone sites gain minLength 1.'
  - location: core/account-request-id.json#
    keyword: pattern
    new: ^[A-Za-z0-9_.:-]{1,128}$
    direction: tighten
    side: both
    note: (a) The named schema takes the ID pattern from account-request-record request_id. All three roots are new in 3.3.
  - location: enums/asset-source.json#
