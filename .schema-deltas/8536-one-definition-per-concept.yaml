# Delta manifest for #8536 (format: scripts/schema-equivalence/README.md, "Delta manifest").
title: >-
  #8536 against its merge base with main: the drift corrections, the two drifted enums, the 63-character DNS label
  limit, the SLA duration pattern, the HTTPS origin trailing slash, and the experimental money constraints
changes:
  - location: core/domain-name.json#
    keyword: maxLength
    new: 253
    direction: tighten
    side: both
    note: >-
      (a) The named schema takes maxLength 253 (RFC 1035) at every domain site that lacked it. Register: "A domain name
      is at most 253 characters", 48 entries.
  - location: core/domain-name.json#
    keyword: pattern
    old: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$
    new: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*$
    direction: tighten
    side: both
    note: >-
      B1 fix: the domain pattern limits each label to 63 characters (RFC 1035), at every domain site that stated the
      unbounded-label pattern. Witness: a 64-character label plus .com. No DNS name has a longer label.
  - location: core/iana-timezone.json#
    keyword: maxLength
    new: 255
    direction: tighten
    side: both
    note: >-
