  - location: core/sla-duration.json#
    keyword: pattern
    old: ^P(?!$)(\d+Y)?(\d+M)?(\d+D)?(T(\d+H)?(\d+M)?(\d+S)?)?$
    new: ^P(?=\d|T)(?=.*\d)(?:\d+Y)?(?:\d+M)?(?:\d+D)?(?:T(?=\d)(?:\d+H)?(?:\d+M)?(?:\d+S)?)?$
    direction: tighten
    side: both
    note: >-
      B2 and #8905: SLA window and creative review SLA response_max and completion_max reject a value ending in a bare T
      (PT, P1DT), which is not an ISO 8601 duration. Zero (PT0S, P0D) stays valid. Witness "PT" as completion_max on
      core/sla-window.json and core/creative-review-sla.json: valid at the base, invalid at the head (plain Ajv, repo
      options). The tool finds no witness for this line because its regex sampler gives no strings for a pattern with a
      lookahead, and both sides use one.
