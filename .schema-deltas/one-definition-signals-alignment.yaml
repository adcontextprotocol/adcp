# Delta manifest (format: scripts/schema-equivalence/README.md, "Delta manifest").
title: >-
  One definition per object: signals and audiences alignment. Signal handles, listing names and descriptions, signal definition
  fields, categorical targeting values, activation methods, demographic executions, deployment targets, and the wholesale
  signal each have one definition; the corrections below follow published 3.2.12 text, and every other change is a $ref to
  an identical definition.
changes:
- location: core/signal-agent-segment-id.json#
  keyword: minLength
  new: 1
  direction: tighten
  side: both
  note: >-
    core/signal-agent-segment-id.json, new: the signal agent segment handle of the get_signals catalog entry, the four wholesale
    signal.* payloads, activate_signal, the product signal targeting option, and package signal targeting (was {type: string}
    at each). Correction under DR-0036: 3.2.12 core/wholesale-feed-event.json sets "signal_agent_segment_id": { "type": "string",
    "description": "Opaque activation handle returned by the signals agent.", "minLength": 1 } on the wholesale signal (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/core/wholesale-feed-event.json#L602-L606),
    which has "the same wire shape as an item in get_signals.signals[]" (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/core/wholesale-feed-event.json#L586);
    activate_signal passes that handle verbatim, and every other site carries the same handle (x-entity signal_activation_id).
    Register entries for each site that 3.2.12 published. Witness: activate_signal signal_agent_segment_id = "" (tighten).
- location: core/incomplete-scope-description.json#
  keyword: minLength
  new: 1
  direction: tighten
  side: both
  note: >-
    signals/get-signals-response.json#/properties/incomplete/items/properties/description -> core/incomplete-scope-description.json.
    Correction under DR-0036: 3.2.12 media-buy/list-products-response.json sets "description": { "type": "string", "minLength":
    1 } on the same incomplete-scope entry (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/media-buy/list-products-response.json#L61-L64),
    and get_products and get_signals describe it with the same words. Register entry. Hand-checked (the tool builds no get_signals
    witness): a completed get_signals response with incomplete [{scope: signals, description: ""}] is valid on base and invalid
    on head ("must NOT have fewer than 1 characters"); restoring {type: string} at the site makes it valid again, and a non-empty
    description is valid on head.
- location: core/signal-listing.json#/properties/categories
  keyword: items
  new:
    type:
    - string
  direction: none
  side: both
  note: >-
    The catalog entry inherits categories from core/signal-listing.json instead of restating it: the same string items, written
    once in the listing and no longer beside an allOf in the entry. Masked by the allOf line below; no payload changes verdict.
    Checked by hand with Ajv: a get_signals catalog entry with categories ["a"] and one deployment is valid at the base and
    at the head, and with categories [] invalid at both (the listing's minItems 1). The tool's witness for this site sends
    deployments [], which the deployments minItems line rejects, not this one.
- location: core/signal-listing.json#/properties/categories
  keyword: allOf
  old:
    items:
      type:
      - string
  direction: none
  side: both
  note: >-
    The other half of the categories restructure above: the items constraint the entry stated through allOf now comes from
    the listing. No payload changes verdict. Checked by hand with Ajv: a get_signals catalog entry with categories ["a"] and
    one deployment is valid at the base and at the head, and with categories [] invalid at both (the listing's minItems 1).
    The tool's witness for this site sends deployments [], which the deployments minItems line rejects, not this one.
- location: core/signal-catalog-entry.json#/properties/data_provider
  keyword: minLength
  new: 1
  direction: tighten
  side: both
  note: >-
    core/signal-listing.json#/properties/description and core/signal-catalog-entry.json#/properties/description -> core/signal-description.json
    (was {type: string}): the listing form of the signal definition, which product signal targeting options and the get_signals
