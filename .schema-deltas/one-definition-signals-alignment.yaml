    and 3.2.12 core/wholesale-feed-event.json, whose signal entry composes the listing, sets "description": { "type": "string",
    "description": "Detailed signal description", "minLength": 1 } (https://github.com/adcontextprotocol/adcp/blob/b3743fbb45931d78548614a9b5210016203f7f76/dist/schemas/3.2.12/core/wholesale-feed-event.json#L612-L616).
    Register entries for both sites. Witness: a product signal targeting option with description = "" (tighten).
