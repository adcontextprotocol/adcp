              minimum: 0
              type:
                - integer
            max_file_size_kb:
              minimum: 1
              type:
                - integer
            max_height:
              exclusiveMinimum: 0
              type:
                - number
            max_weight_grams:
              exclusiveMinimum: 0
              type:
                - integer
            max_width:
              exclusiveMinimum: 0
              type:
                - number
            min_dpi:
              minimum: 1
              type:
                - integer
            min_height:
              exclusiveMinimum: 0
              type:
                - number
            min_width:
              exclusiveMinimum: 0
              type:
                - number
            parameters_from_format_id:
              type:
                - boolean
            pixel_ratios:
              minItems: 1
              type:
                - array
              uniqueItems: true
              items:
                $at: core/requirements/image-asset-requirements.json#/properties/pixel_ratios/items
            transparency_required:
              type:
                - boolean
            unit:
              enum:
                - cm
                - dp
                - inches
                - mm
                - pt
                - px
          then:
            required:
              - unit
    direction: tighten
    side: response
    note: 'Witness verified with the repo Ajv: an asset_requirements object that violates the schema for its own asset_type, accepted at the base by another union branch.'
