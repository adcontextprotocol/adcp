# A small ad server season: one site, one display placement, two products.
# Point TRAINING_AGENT_INVENTORY_ADSERVER_SEASON_FILE at a copy of this file to run the tenant on it.

# Name of the season and the seed mixed into every random draw. Change rng_seed for a different season of the same shape.
seed_id: small-season
rng_seed: small-season-v1

# The simulated calendar: first day (UTC) and how many days it runs.
start_date: 2026-11-01
days: 365
currency: USD

# Where traffic comes from. Shares must sum to 1.
regions:
  - { region_id: us, country: US, name: United States, share: 1 }

# Audience groups the traffic splits into. Shares must sum to 1; multipliers adjust the placement's rates.
audience_profiles:
  - { profile_id: commuters, name: Commuters, share: 0.6, rate_multipliers: { click_rate: 1.2 } }
  - { profile_id: homebodies, name: Homebodies, share: 0.4 }

# Named audiences a product can target, as groups of profiles. None here.
segments: []

# The publisher's sites.
properties:
  - { property_id: harbor_daily, name: Harbor Daily, domain: harbor-daily.example }

# Ad slots: daily traffic, the lowest accepted CPM, and the rates impressions convert at.
placements:
  - placement_id: banner
    name: Banner
    channel: display
    property_ids: [harbor_daily]
    formats: [display_300x250]
    base_daily_impressions: 100000
    floor_cpm: 2
    rates: { viewability: 0.65, click_rate: 0.002, completion_rate: 0, conversion_rate: 0.02 }
    reporting_lag_days: 0

# What buyers can purchase: one guaranteed at a fixed CPM, one sold in an auction above the floor.
products:
  - product_id: banner_guaranteed
    name: Banner, guaranteed
    description: Guaranteed banner impressions at a fixed CPM
    delivery_type: guaranteed
    placement_ids: [banner]
    rate_cpm: 8
  - product_id: banner_auction
    name: Banner, auction
    description: Banner impressions won in a first-price auction
    delivery_type: non_guaranteed
    placement_ids: [banner]

# Traffic multipliers by weekday, Sunday first.
traffic:
  weekday_shape: [0.9, 1, 1, 1, 1, 1.05, 0.95]

# How wrong forecasts are versus delivery. The errors live in the traffic: each day's traffic deviates from the expected pattern, and a forecast
# knows the part of the deviation revealed before its day, so a forecast made far ahead is further off. The sizes in the shipped seasons are
# assumptions, easy to change and to be recalibrated from real publisher data.
# The error here is zero, so forecasts equal expected traffic. For a realistic starting point, use the shipped ad server's values: channel_sigma
# 0.06 for display and olv, ar1_phi 0.85, cell_kappa 3.08, and a publisher bias of -0.02.
forecast_error:
  # Spread, per channel, of the publisher's deviation on a day; revisions widen it with lead time. With cell_kappa 0, no bias and truth_daily_sigma 0, 0 means forecasts are exact.
  channel_sigma: { display: 0 }
  # How strongly one day's deviation carries into the next, from 0 (independent days) up to but below 1.
  ar1_phi: 0
  # How much the revisions weigh: each is scaled by 1 / sqrt(this), so the error's variance grows with min(lead time, horizon) / this.
  lead_time_tau_days: 14
  # How many days ahead of a day its revisions are revealed, so the lead time beyond which the revision part of the error stops widening.
  lead_time_horizon_days: 60
  # Limit, on a log scale, on the deviation and separately on the forecast's known part of it (0.69 is a factor of two). The error is within twice this.
  log_clip: 0.6931471805599453
  # Per-cell deviation that is small on busy cells and large on thin ones, and that no forecast knows. 0 turns it off.
  cell_kappa: 0
  # Impressions a cell is treated as having at least when sizing the per-cell deviation.
  cell_min_impressions: 100
